<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 나의 급여 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; color: #333; }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo { font-size: 24px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav { padding: 20px 0; }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { color: #3b82f6; border-left-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .nav-item.hidden { display: none !important; }

        .main-layout {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .topbar-title h1 { margin: 0; font-size: 24px; color: #333; }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: #333; font-size: 13px; }
        .user-role { font-size: 12px; color: #999; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3b82f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #FF3B30;
            color: white;
            border-color: #FF3B30;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .salary-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .salary-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;
        }

        .card-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 12px;
            color: #666;
        }

        .salary-detail {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .detail-header {
            padding: 20px 24px;
            background: #f9f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .month-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .month-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .month-btn:hover {
            border-color: #007AFF;
            color: #007AFF;
        }

        .month-btn.active {
            background: #007AFF;
            color: white;
            border-color: #007AFF;
        }

        .detail-content {
            padding: 24px;
        }

        .salary-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .breakdown-item {
            padding: 16px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #007AFF;
        }

        .breakdown-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .breakdown-value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .breakdown-item.positive { border-left-color: #28a745; }
        .breakdown-item.negative { border-left-color: #dc3545; }
        .breakdown-item.summary { background: #e8f4f8; border-left-color: #17a2b8; }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .history-table thead {
            background: #f9f9fa;
            border-bottom: 2px solid #e0e0e0;
        }

        .history-table th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            color: #333;
        }

        .history-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .history-table tbody tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-processing { background: #d1ecf1; color: #0c5460; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 20px; }
            .salary-overview { grid-template-columns: 1fr; }
            .detail-header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .month-selector { width: 100%; }
            .month-btn { flex: 1; }
        }
    </style>
    <script src="menu.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" id="menu-dashboard" onclick="navigateTo('./dashboard.html')"><span>📊</span> 대시보드</a>
            <a class="nav-item" id="menu-residents" onclick="navigateTo('./resident_management.html')"><span>👥</span> 이용자 관리</a>
            <a class="nav-item" id="menu-voice-records" onclick="navigateTo('./voice_record.html')"><span>🎤</span> 음성 기록</a>
            <a class="nav-item" id="menu-caregiver-billing" onclick="navigateTo('./caregiver_billing.html')"><span>💳</span> 나의 청부</a>
            <a class="nav-item active" id="menu-my-salary" onclick="navigateTo('./my_salary.html')"><span>💰</span> 나의 급여</a>
            <a class="nav-item" id="menu-logout" style="margin-top: 30px;" onclick="logout()"><span>🚪</span> 로그아웃</a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>나의 급여 정산</h1></div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">요양사</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Salary Overview -->
            <div class="salary-overview">
                <div class="salary-card">
                    <div class="card-label">이번 달 청부액</div>
                    <div class="card-value" id="monthlyBilling">₩0</div>
                    <div class="card-subtitle" id="billingCount">0건</div>
                </div>

                <div class="salary-card">
                    <div class="card-label">예상 공제액</div>
                    <div class="card-value" id="deductionAmount">₩0</div>
                    <div class="card-subtitle">세금/보험료</div>
                </div>

                <div class="salary-card">
                    <div class="card-label">예상 수령액</div>
                    <div class="card-value" id="expectedSalary" style="color: #28a745;">₩0</div>
                    <div class="card-subtitle">세금공제 후</div>
                </div>

                <div class="salary-card">
                    <div class="card-label">누적 정산</div>
                    <div class="card-value" id="cumulativeSalary">₩0</div>
                    <div class="card-subtitle">월별 누적</div>
                </div>
            </div>

            <!-- Salary Detail -->
            <div class="salary-detail">
                <div class="detail-header">
                    <div class="detail-title">월별 급여 상세</div>
                    <div class="month-selector">
                        <button class="month-btn active" onclick="selectMonth(new Date())">이달</button>
                        <button class="month-btn" onclick="selectMonth(new Date(new Date().setMonth(new Date().getMonth()-1)))">지난달</button>
                        <button class="month-btn" onclick="selectMonth(new Date(new Date().setMonth(new Date().getMonth()-2)))">2개월전</button>
                    </div>
                </div>

                <div class="detail-content">
                    <!-- Breakdown Section -->
                    <div id="breakdownSection" style="margin-bottom: 30px;">
                        <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">급여 구성</h3>
                        <div class="salary-breakdown">
                            <div class="breakdown-item positive">
                                <div class="breakdown-label">청부액 합계</div>
                                <div class="breakdown-value" id="breakdown-billing">₩0</div>
                            </div>
                            <div class="breakdown-item negative">
                                <div class="breakdown-label">소득세</div>
                                <div class="breakdown-value" id="breakdown-tax">₩0</div>
                            </div>
                            <div class="breakdown-item negative">
                                <div class="breakdown-label">보험료</div>
                                <div class="breakdown-value" id="breakdown-insurance">₩0</div>
                            </div>
                            <div class="breakdown-item summary">
                                <div class="breakdown-label">순 수령액</div>
                                <div class="breakdown-value" id="breakdown-net">₩0</div>
                            </div>
                        </div>
                    </div>

                    <!-- History Table -->
                    <div>
                        <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">정산 기록</h3>
                        <div class="table-wrapper">
                            <table class="history-table">
                                <thead>
                                    <tr>
                                        <th style="width: 100px;">연월</th>
                                        <th style="text-align: right;">청부액</th>
                                        <th style="text-align: right;">공제액</th>
                                        <th style="text-align: right;">실수령액</th>
                                        <th>상태</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                    <tr>
                                        <td colspan="5" style="text-align: center; padding: 40px; color: #999;">로드 중...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentUser = null;
        let selectedMonth = new Date();
        let allBillings = [];

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                localStorage.removeItem('user_role');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : user.role === 'center_manager' ? '센터장' : '사용자';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();

            filterMenuByRole();
            return true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOMContentLoaded: 급여 관리');
            checkAuth();
        });

        window.addEventListener('load', () => {
            console.log('🔍 Load 이벤트: 급여 관리');
            if (!currentUser) {
                checkAuth();
            }
            loadSalaryData();
        });

        async function loadSalaryData() {
            try {
                const url = `${API_URL}/billing/?caregiver_id=${currentUser.id}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error('데이터 조회 실패');

                const data = await response.json();
                allBillings = (data.records || []).filter(r =>
                    (r.approval_status === 'approved' || r.approval_status === 'submitted_to_nhis' || r.approval_status === 'reimbursed' || r.status === 'paid')
                );

                console.log('✅ 청부 데이터 로드:', allBillings.length + '건');

                updateSalaryDisplay();
                loadHistoryTable();
            } catch (error) {
                console.error('❌ 데이터 로드 실패:', error);
            }
        }

        function selectMonth(date) {
            selectedMonth = new Date(date);
            document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateSalaryDisplay();
        }

        function updateSalaryDisplay() {
            const monthYear = `${selectedMonth.getFullYear()}-${String(selectedMonth.getMonth() + 1).padStart(2, '0')}`;

            const monthlyRecords = allBillings.filter(record => {
                const recordDate = new Date(record.recorded_date);
                const recordMonth = `${recordDate.getFullYear()}-${String(recordDate.getMonth() + 1).padStart(2, '0')}`;
                return recordMonth === monthYear;
            });

            const totalBilling = monthlyRecords.reduce((sum, r) => sum + r.amount, 0);
            const taxAmount = Math.floor(totalBilling * 0.03); // 3% 소득세
            const insuranceAmount = Math.floor(totalBilling * 0.01); // 1% 보험료
            const netAmount = totalBilling - taxAmount - insuranceAmount;

            // 현재 월 표시
            const isCurrentMonth =
                selectedMonth.getFullYear() === new Date().getFullYear() &&
                selectedMonth.getMonth() === new Date().getMonth();

            document.getElementById('monthlyBilling').textContent = `₩${totalBilling.toLocaleString()}`;
            document.getElementById('billingCount').textContent = `${monthlyRecords.length}건`;
            document.getElementById('deductionAmount').textContent = `₩${(taxAmount + insuranceAmount).toLocaleString()}`;
            document.getElementById('expectedSalary').textContent = `₩${netAmount.toLocaleString()}`;

            // Breakdown
            document.getElementById('breakdown-billing').textContent = `₩${totalBilling.toLocaleString()}`;
            document.getElementById('breakdown-tax').textContent = `-₩${taxAmount.toLocaleString()}`;
            document.getElementById('breakdown-insurance').textContent = `-₩${insuranceAmount.toLocaleString()}`;
            document.getElementById('breakdown-net').textContent = `₩${netAmount.toLocaleString()}`;

            // 누적 정산 (현재달까지)
            const cumulativeRecords = allBillings.filter(record => {
                const recordDate = new Date(record.recorded_date);
                return recordDate <= selectedMonth;
            });
            const cumulativeTotal = cumulativeRecords.reduce((sum, r) => sum + r.amount, 0);
            document.getElementById('cumulativeSalary').textContent = `₩${cumulativeTotal.toLocaleString()}`;
        }

        function loadHistoryTable() {
            const tbody = document.getElementById('historyTableBody');

            if (allBillings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #999;">정산 기록이 없습니다</td></tr>';
                return;
            }

            // 월별로 그룹핑
            const monthlyData = {};
            allBillings.forEach(record => {
                const recordDate = new Date(record.recorded_date);
                const monthYear = `${recordDate.getFullYear()}-${String(recordDate.getMonth() + 1).padStart(2, '0')}`;

                if (!monthlyData[monthYear]) {
                    monthlyData[monthYear] = { total: 0, count: 0, status: 'completed' };
                }
                monthlyData[monthYear].total += record.amount;
                monthlyData[monthYear].count += 1;
            });

            // 최근순으로 정렬
            const sortedMonths = Object.keys(monthlyData).sort().reverse();

            let html = '';
            sortedMonths.forEach(month => {
                const data = monthlyData[month];
                const taxAmount = Math.floor(data.total * 0.03);
                const insuranceAmount = Math.floor(data.total * 0.01);
                const netAmount = data.total - taxAmount - insuranceAmount;

                const statusClass = data.status === 'completed' ? 'status-completed' :
                                   data.status === 'pending' ? 'status-pending' : 'status-processing';
                const statusLabel = data.status === 'completed' ? '✅ 완료' :
                                   data.status === 'pending' ? '🔍 대기' : '⏳ 진행중';

                html += `
                    <tr>
                        <td style="font-weight: 600;">${month}</td>
                        <td style="text-align: right; font-weight: 600;">₩${data.total.toLocaleString()}</td>
                        <td style="text-align: right;">₩${(taxAmount + insuranceAmount).toLocaleString()}</td>
                        <td style="text-align: right; font-weight: 700; color: #28a745;">₩${netAmount.toLocaleString()}</td>
                        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #333;
                color: white;
                padding: 12px 20px;
                border-radius: 6px;
                z-index: 1000;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
