<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #007AFF;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
        }

        .role-selector {
            margin-bottom: 28px;
        }

        .role-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .role-buttons {
            display: flex;
            gap: 12px;
        }

        .role-btn {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-btn:hover {
            border-color: #007AFF;
            color: #007AFF;
        }

        .role-btn.active {
            background: #007AFF;
            color: white;
            border-color: #007AFF;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .form-input:disabled {
            background: #f5f5f5;
            color: #999;
        }

        .error-message {
            background: #FFE5E5;
            border: 1px solid #FF6B6B;
            color: #C92A2A;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            animation: shake 0.3s ease-in-out;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .login-button:hover:not(:disabled) {
            background: #0051D5;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            height: 1px;
            background: #ddd;
            margin: 24px 0;
        }

        .test-accounts {
            background: #F0F8FF;
            border-left: 4px solid #007AFF;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
        }

        .test-accounts h3 {
            font-size: 13px;
            font-weight: 600;
            color: #007AFF;
            margin-bottom: 8px;
        }

        .test-account {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .test-account strong {
            color: #007AFF;
        }

        .api-info {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .success-message {
            background: #E5FFE5;
            border: 1px solid #4CAF50;
            color: #2E7D32;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">돌봄케어</div>
                <div class="subtitle">요양원 통합관리 플랫폼</div>
            </div>

            <div class="role-selector">
                <label class="role-label">역할 선택</label>
                <div class="role-buttons">
                    <button class="role-btn active" data-role="caregiver">요양사</button>
                    <button class="role-btn" data-role="center_manager">센터장</button>
                </div>
            </div>

            <div id="successMessage" class="success-message"></div>
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="example@dolbomcare.com"
                        value="caregiver@dolbomcare.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="비밀번호를 입력하세요"
                        value="password123"
                        required
                    >
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    로그인
                </button>
            </form>

            <div class="divider"></div>

            <div class="test-accounts">
                <h3>📝 테스트 계정</h3>
                <div class="test-account">
                    <strong>요양사:</strong> caregiver@test.com
                </div>
                <div class="test-account">
                    <strong>센터장:</strong> manager@test.com
                </div>
                <div class="test-account">
                    <strong>비밀번호:</strong> password123
                </div>
            </div>

            <div class="api-info">
                Backend: http://localhost:8000/api/v1
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let selectedRole = 'caregiver';

        // 역할 선택 버튼
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRole = btn.dataset.role;
            });
        });

        // 로그인 폼 제출
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            // 에러 메시지 숨기기
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            // 로딩 상태
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span>로그인 중...';

            try {
                console.log('🔍 로그인 시작:', email);
                console.log('📡 API URL:', `${API_URL}/auth/login`);

                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password,
                    }),
                });

                console.log('📊 응답 상태:', response.status);
                console.log('✅ 응답 받음');

                const data = await response.json();
                console.log('📦 응답 데이터:', data);

                if (!response.ok) {
                    throw new Error(data.detail || '로그인 실패');
                }

                console.log('✅ 로그인 성공!');

                // 성공 메시지
                successMsg.textContent = '✅ 로그인 성공! 대시보드로 이동 중...';
                successMsg.classList.add('show');

                // 토큰 저장
                console.log('💾 토큰 저장 중...');
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('user_role', selectedRole);
                console.log('✅ 토큰 저장 완료');
                console.log('📍 대시보드로 이동 중... ./dashboard.html');

                // 대시보드로 이동 (1초 후)
                setTimeout(() => {
                    console.log('🎯 window.location.href = ./dashboard.html');
                    window.location.href = './dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('❌ 로그인 오류:', error);
                console.error('📋 오류 상세:', error.message);
                errorMsg.textContent = `❌ ${error.message || '로그인 중 오류가 발생했습니다'}`;
                errorMsg.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '로그인';
            }
        });

        // 페이지 로드 시 토큰이 있으면 대시보드로 이동
        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                window.location.href = './dashboard.html';
            }
        });
    </script>
</body>
</html>
