<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 20px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 500;
        }

        .content {
            padding: 40px;
        }

        /* 테스트 계정 카드 */
        .test-accounts-section {
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f4ff 100%);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #e8ecff;
        }

        .test-accounts-title {
            font-size: 13px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .account-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .account-card {
            background: white;
            border: 2px solid #e0e5ff;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .account-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }

        .account-card.caregiver {
            border-color: #28a745;
        }

        .account-card.caregiver:hover {
            background: #f0fdf4;
            border-color: #28a745;
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.15);
        }

        .account-card.manager {
            border-color: #667eea;
        }

        .account-card.manager:hover {
            background: #f5f7ff;
            border-color: #667eea;
        }

        .account-role {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .account-card.caregiver .account-role {
            color: #28a745;
        }

        .account-card.manager .account-role {
            color: #667eea;
        }

        .account-email {
            font-size: 11px;
            color: #666;
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .account-password {
            font-size: 10px;
            color: #999;
            font-family: 'Courier New', monospace;
        }

        /* 폼 섹션 */
        .form-section-title {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: #f8faff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .role-selector {
            margin-bottom: 24px;
        }

        .role-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .role-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-btn {
            padding: 12px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .role-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .role-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.35);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message, .success-message {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            animation: slideDown 0.3s ease-out;
        }

        .error-message {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        .success-message.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .divider {
            height: 1px;
            background: #f0f0f0;
            margin: 24px 0;
        }

        .footer-info {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        @media (max-width: 500px) {
            .header {
                padding: 40px 20px;
            }

            .logo {
                font-size: 36px;
            }

            .content {
                padding: 30px 20px;
            }

            .account-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- 헤더 -->
            <div class="header">
                <div class="logo">돌봄케어</div>
                <div class="subtitle">요양원 통합관리 플랫폼</div>
            </div>

            <!-- 콘텐츠 -->
            <div class="content">
                <!-- 테스트 계정 -->
                <div class="test-accounts-section">
                    <div class="test-accounts-title">📋 테스트 계정 (클릭으로 자동입력)</div>
                    <div class="account-cards">
                        <button type="button" class="account-card caregiver"
                                onclick="selectTestAccount('caregiver@test.com', 'test123', 'caregiver')">
                            <div class="account-role">👤 요양사</div>
                            <div class="account-email">caregiver@test.com</div>
                            <div class="account-password">pw: test123</div>
                        </button>
                        <button type="button" class="account-card manager"
                                onclick="selectTestAccount('manager@test.com', 'test123', 'center_manager')">
                            <div class="account-role">👨‍💼 센터장</div>
                            <div class="account-email">manager@test.com</div>
                            <div class="account-password">pw: test123</div>
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <!-- 로그인 폼 -->
                <form id="loginForm">
                    <div class="role-selector">
                        <label class="role-label">역할 선택</label>
                        <div class="role-buttons">
                            <button type="button" class="role-btn active" data-role="caregiver">요양사</button>
                            <button type="button" class="role-btn" data-role="center_manager">센터장</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">📧 이메일</label>
                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="이메일을 입력하세요"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label">🔑 비밀번호</label>
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="비밀번호를 입력하세요"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button" id="loginBtn">로그인</button>
                </form>

                <div class="divider"></div>

                <div class="footer-info">
                    💡 테스트 계정의 비밀번호는 test123입니다
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let selectedRole = 'caregiver';

        // 테스트 계정 자동 선택
        function selectTestAccount(email, password, role) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            selectedRole = role;

            // 역할 버튼 업데이트
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.role === role) {
                    btn.classList.add('active');
                }
            });

            console.log('✅ 테스트 계정 선택:', email, 'Role:', role);
        }

        // 역할 선택 버튼
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRole = btn.dataset.role;
            });
        });

        // 로그인 폼 제출
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span>로그인 중...';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '로그인 실패');
                }

                successMsg.textContent = '✅ 로그인 성공! 대시보드로 이동 중...';
                successMsg.classList.add('show');

                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('user_role', selectedRole);

                setTimeout(() => {
                    window.location.href = './dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('❌ 로그인 오류:', error);
                errorMsg.textContent = `❌ ${error.message}`;
                errorMsg.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '로그인';
            }
        });

        // 페이지 로드 시
        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                window.location.href = './dashboard.html';
            }
        });
    </script>
</body>
</html>
