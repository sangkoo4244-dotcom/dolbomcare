<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 나의 청부 현황</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        main {
            padding: 20px;
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8e8e8;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            white-space: nowrap;
            border-right: 1px solid #eee;
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            border-right: 1px solid #eee;
            font-size: 14px;
        }

        td:last-child {
            border-right: none;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .rejection-reason {
            font-size: 12px;
            color: #721c24;
            margin-top: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-approve {
            padding: 6px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-approve:hover {
            background: #218838;
        }

        .btn-reject {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reject:hover {
            background: #c82333;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #ee5a52;
        }

        .btn-submit {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: #5568d3;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        @media (max-width: 768px) {
            main {
                margin-left: 0;
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
    <script src="./navbar.js"></script>
</head>
<body>
    <main>
        <div class="page-header">
            <h1 class="page-title">📊 나의 청부 현황</h1>
            <p class="page-subtitle">센터장 승인을 기다리는 청부 기록을 확인하세요</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">전체 기록</div>
                <div class="stat-value" id="totalRecords">0건</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">승인 대기</div>
                <div class="stat-value" id="pendingCount">0건</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">승인됨</div>
                <div class="stat-value" id="approvedCount">0건</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">거절</div>
                <div class="stat-value" id="rejectedCount">0건</div>
            </div>
        </div>

        <div class="table-container">
            <div id="billingTable" class="loading">
                <div>로드 중...</div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentUser = null;

        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return;
            }

            currentUser = user;
            loadBillingRecords();
        });

        async function loadBillingRecords() {
            try {
                const tableDiv = document.getElementById('billingTable');
                tableDiv.innerHTML = '<div class="loading">로드 중...</div>';

                // 주민 정보 로드
                const residentsRes = await fetch(`${API_URL}/residents/`);
                const residentsData = residentsRes.ok ? await residentsRes.json() : { residents: [] };
                const residents = residentsData.residents || [];
                const residentMap = {};
                residents.forEach(r => {
                    residentMap[r.id] = r.name;
                });

                // 센터장은 전체 청부, 요양사는 자신의 청부만 조회
                let url = `${API_URL}/billing/`;
                if (currentUser.role === 'caregiver') {
                    url += `?caregiver_id=${currentUser.id}`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error('기록 조회 실패');

                const data = await response.json();
                const records = data.records || [];

                // 통계 업데이트
                const pendingCount = records.filter(r => r.approval_status === 'pending').length;
                const approvedCount = records.filter(r => r.approval_status === 'approved').length;
                const rejectedCount = records.filter(r => r.approval_status === 'rejected').length;

                document.getElementById('totalRecords').textContent = `${records.length}건`;
                document.getElementById('pendingCount').textContent = `${pendingCount}건`;
                document.getElementById('approvedCount').textContent = `${approvedCount}건`;
                document.getElementById('rejectedCount').textContent = `${rejectedCount}건`;

                // 테이블 렌더링
                renderBillingTable(records, residentMap);

                console.log('✅ 청부 기록 로드 완료:', records.length + '건');
            } catch (error) {
                console.error('❌ 기록 로드 실패:', error);
                document.getElementById('billingTable').innerHTML =
                    '<div class="empty-state">청부 기록을 불러올 수 없습니다</div>';
            }
        }

        function renderBillingTable(records, residentMap = {}) {
            const tableDiv = document.getElementById('billingTable');
            const isManager = currentUser.role === 'center_manager';

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>기록일</th>
                            <th>이용자</th>
                            <th>서비스 유형</th>
                            <th style="text-align: right;">청부액</th>
                            <th>승인 상태</th>
                            <th>비고</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            if (records.length === 0) {
                html += `<tr><td colspan="7" style="text-align: center; padding: 40px;">기록이 없습니다</td></tr>`;
            } else {
                records.forEach(record => {
                    const statusClass = `status-${record.approval_status}`;
                    const statusLabel = {
                        'pending': '⏳ 승인 대기',
                        'approved': '✅ 승인됨',
                        'rejected': '❌ 거절됨'
                    }[record.approval_status] || record.approval_status;

                    const serviceLabel = {
                        'basic_care': '기본 요양',
                        'meal_service': '식사 서비스',
                        'medical_care': '의료 처치',
                        'emergency': '응급 대응'
                    }[record.service_type] || record.service_type;

                    const recordedDate = new Date(record.recorded_date).toLocaleDateString('ko-KR');
                    const residentName = residentMap[record.resident_id] || `ID: ${record.resident_id}`;

                    let noteHtml = '';
                    if (record.approval_status === 'rejected' && record.rejection_reason) {
                        noteHtml = `<div class="rejection-reason">사유: ${record.rejection_reason}</div>`;
                    }

                    let actionHtml = '';

                    if (isManager) {
                        // 센터장: 승인/거절
                        if (record.approval_status === 'pending') {
                            actionHtml = `
                                <div class="action-buttons">
                                    <button class="btn-approve" onclick="approveBilling(${record.id})">승인</button>
                                    <button class="btn-reject" onclick="showRejectModal(${record.id})">거절</button>
                                </div>
                            `;
                        }
                    } else {
                        // 요양사: 상태별 액션
                        if (record.status === 'draft' || record.approval_status === 'rejected') {
                            // draft 상태 또는 반려 상태: 제출 또는 삭제
                            actionHtml = `
                                <div class="action-buttons">
                                    <button class="btn-submit" onclick="submitBilling(${record.id})">제출</button>
                                    <button class="btn-delete" onclick="deleteBilling(${record.id}, 'caregiver')">삭제</button>
                                </div>
                            `;
                        }
                    }

                    html += `
                        <tr>
                            <td>${recordedDate}</td>
                            <td>${residentName}</td>
                            <td>${serviceLabel}</td>
                            <td style="text-align: right;">${record.amount.toLocaleString()}원</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td>${noteHtml}</td>
                            <td>${actionHtml || '-'}</td>
                        </tr>
                    `;
                });
            }

            html += `
                    </tbody>
                </table>
            `;

            tableDiv.innerHTML = html;
        }

        async function approveBilling(recordId) {
            if (!confirm('이 청부를 승인하시겠습니까?')) return;

            try {
                // 사용자 정보 확인
                if (!currentUser || !currentUser.id) {
                    throw new Error('사용자 정보가 없습니다. 다시 로그인하세요.');
                }

                console.log('승인 요청:', {recordId, userId: currentUser.id, role: currentUser.role});

                const response = await fetch(`${API_URL}/billing/${recordId}/approve`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                console.log('응답 상태:', response.status);

                if (!response.ok) {
                    let errorMsg = '승인 실패';
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.detail || errorMsg;
                    } catch (e) {
                        errorMsg = `HTTP ${response.status}: ${response.statusText}`;
                    }
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                console.log('승인 성공:', result);
                showToast('✅ 청부가 승인되었습니다');
                setTimeout(() => loadBillingRecords(), 500);
            } catch (error) {
                console.error('❌ 승인 오류:', error);
                alert('❌ 승인 중 오류: ' + error.message);
            }
        }

        async function rejectBilling(recordId) {
            const reason = prompt('거절 사유를 입력하세요:');
            if (reason === null) return;

            try {
                if (!currentUser || !currentUser.id) {
                    throw new Error('사용자 정보가 없습니다. 다시 로그인하세요.');
                }

                console.log('거절 요청:', {recordId, userId: currentUser.id, role: currentUser.role, reason});

                const response = await fetch(`${API_URL}/billing/${recordId}/reject`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role,
                        reason: reason
                    })
                });

                console.log('응답 상태:', response.status);

                if (!response.ok) {
                    let errorMsg = '거절 실패';
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.detail || errorMsg;
                    } catch (e) {
                        errorMsg = `HTTP ${response.status}: ${response.statusText}`;
                    }
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                console.log('거절 성공:', result);
                showToast('✅ 청부가 거절되었습니다');
                setTimeout(() => loadBillingRecords(), 500);
            } catch (error) {
                console.error('❌ 거절 오류:', error);
                alert('❌ 거절 중 오류: ' + error.message);
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #333;
                color: white;
                padding: 12px 20px;
                border-radius: 6px;
                z-index: 1000;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 거절 모달 표시
        function showRejectModal(recordId) {
            const reason = prompt('거절 사유를 입력하세요:');
            if (reason !== null) {
                rejectBilling(recordId, reason);
            }
        }

        // 청부 제출 (요양사)
        async function submitBilling(recordId) {
            if (!confirm('이 청부를 센터장 승인을 위해 제출하시겠습니까?')) {
                return;
            }

            try {
                if (!currentUser || !currentUser.id) {
                    throw new Error('사용자 정보가 없습니다. 다시 로그인하세요.');
                }

                console.log('제출 요청:', {recordId, userId: currentUser.id, role: currentUser.role});

                const response = await fetch(`${API_URL}/billing/${recordId}/submit`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                console.log('응답 상태:', response.status);

                if (!response.ok) {
                    let errorMsg = '제출 실패';
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.detail || errorMsg;
                    } catch (e) {
                        errorMsg = `HTTP ${response.status}: ${response.statusText}`;
                    }
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                console.log('제출 성공:', result);
                showToast('✅ 청부가 센터장 승인을 위해 제출되었습니다');
                setTimeout(() => loadBillingRecords(), 500);
            } catch (error) {
                console.error('❌ 제출 오류:', error);
                alert('❌ 제출 중 오류: ' + error.message);
            }
        }

        // 삭제 함수 (요양사/센터장)
        async function deleteBilling(recordId, userRole) {
            if (!confirm('이 청부를 삭제하시겠습니까?\n(삭제 후 복구할 수 없습니다)')) {
                return;
            }

            try {
                if (!currentUser || !currentUser.id) {
                    throw new Error('사용자 정보가 없습니다. 다시 로그인하세요.');
                }

                console.log('삭제 요청:', {recordId, userId: currentUser.id, role: userRole});

                const response = await fetch(`${API_URL}/billing/${recordId}?user_id=${currentUser.id}&user_role=${userRole}`, {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'}
                });

                console.log('응답 상태:', response.status);

                if (!response.ok) {
                    let errorMsg = '삭제 실패';
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.detail || errorMsg;
                    } catch (e) {
                        errorMsg = `HTTP ${response.status}: ${response.statusText}`;
                    }
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                console.log('삭제 성공:', result);
                showToast('✅ 청부가 삭제되었습니다');
                setTimeout(() => loadBillingRecords(), 500);
            } catch (error) {
                console.error('❌ 삭제 오류:', error);
                alert('❌ 삭제 중 오류: ' + error.message);
            }
        }
    </script>
</body>
</html>
