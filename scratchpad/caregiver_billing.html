<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 청부현황 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="dashboard-styles.css">
    <style>
        /* 공유 스타일은 dashboard-styles.css에서 */

        .filter-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Table Styles */
        .table-wrapper {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table thead {
            background: var(--bg-tertiary);
            border-bottom: 2px solid var(--border);
        }

        .table th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
        }

        .table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .table tbody tr:hover {
            background: var(--bg-secondary);
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
        }

        .status-approved {
            background: var(--secondary-light);
            color: #065f46;
        }

        .status-rejected {
            background: var(--danger-light);
            color: #991b1b;
        }

        .status-pending {
            background: var(--warning-light);
            color: #92400e;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .action-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn.danger:hover {
            background: var(--danger-light);
            border-color: var(--danger);
            color: var(--danger);
        }

        .action-btn.success:hover {
            background: var(--secondary-light);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-2xl);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-tertiary);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--text-tertiary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Sidebar (from dashboard) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>
            <a class="nav-item" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>
            <a class="nav-item active" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1>나의 청부현황</h1>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role">요양사</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">전체</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">대기 중</div>
                    <div class="stat-value" id="pendingCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">승인됨</div>
                    <div class="stat-value" id="approvedCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">거절됨</div>
                    <div class="stat-value" id="rejectedCount">0</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterByStatus('all')">전체</button>
                <button class="filter-btn" onclick="filterByStatus('pending')">대기 중</button>
                <button class="filter-btn" onclick="filterByStatus('approved')">승인됨</button>
                <button class="filter-btn" onclick="filterByStatus('rejected')">거절됨</button>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>기록일</th>
                            <th>이용자</th>
                            <th>서비스 유형</th>
                            <th style="text-align: right;">청부액</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="billingTableBody">
                        <tr>
                            <td colspan="6" class="empty-state" style="padding: 40px;">
                                <div style="color: var(--text-tertiary);">데이터를 로드 중입니다...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Rejection Reason Modal -->
    <div id="rejectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>거절 사유</h2>
                <button class="modal-close" onclick="closeRejectionModal()">✕</button>
            </div>
            <div class="modal-body">
                <p id="rejectionReason"></p>
            </div>
            <div class="modal-footer">
                <button class="filter-btn" onclick="closeRejectionModal()">닫기</button>
            </div>
        </div>
    </div>

    <!-- Shared styles for sidebar -->
    <style>
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo {
            font-size: 24px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 700;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #3b82f6;
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .main-layout {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-primary);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all var(--transition-base);
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let allBillings = [];
        let currentFilter = 'all';

        function navigateTo(url) {
            window.location.href = url;
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.clear();
                window.location.href = './login.html';
            }
        }

        function loadUserInfo() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = './login.html';
                return;
            }
            document.getElementById('userName').textContent = user.email.split('@')[0];
            document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
        }

        async function loadBillingRecords() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                const token = localStorage.getItem('access_token');

                if (token === 'offline-test-token') {
                    // Demo data
                    showDemoData();
                    return;
                }

                const response = await fetch(`${API_URL}/billing/?caregiver_id=${user.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('청부 조회 실패');

                const data = await response.json();
                allBillings = data.records || [];
                updateStats();
                renderTable();
            } catch (error) {
                console.error('청부 로드 실패:', error);
                showDemoData();
            }
        }

        function showDemoData() {
            allBillings = [
                {
                    id: 7,
                    recorded_date: '2026-10-01',
                    resident_id: 1,
                    service_type: '의료 처치',
                    amount: 48712,
                    approval_status: 'rejected',
                    rejection_reason: 'Test rejection for editing'
                },
                {
                    id: 6,
                    recorded_date: '2026-10-01',
                    resident_id: 1,
                    service_type: '기본 요양',
                    amount: 48712,
                    approval_status: 'approved'
                }
            ];
            updateStats();
            renderTable();
        }

        function updateStats() {
            const pending = allBillings.filter(b => b.approval_status === 'pending').length;
            const approved = allBillings.filter(b => b.approval_status === 'approved').length;
            const rejected = allBillings.filter(b => b.approval_status === 'rejected').length;

            document.getElementById('totalCount').textContent = allBillings.length;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('approvedCount').textContent = approved;
            document.getElementById('rejectedCount').textContent = rejected;
        }

        function filterByStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderTable();
        }

        function renderTable() {
            const filtered = currentFilter === 'all'
                ? allBillings
                : allBillings.filter(b => b.approval_status === currentFilter);

            const tbody = document.getElementById('billingTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center" style="padding: 40px; color: var(--text-tertiary);">청부 기록이 없습니다</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(b => `
                <tr>
                    <td>${new Date(b.recorded_date).toLocaleDateString('ko-KR')}</td>
                    <td>이용자 ${b.resident_id}</td>
                    <td>${b.service_type}</td>
                    <td style="text-align: right;">${b.amount?.toLocaleString()}원</td>
                    <td>
                        <span class="status-badge status-${b.approval_status}">
                            ${b.approval_status === 'pending' ? '⏳ 대기' :
                              b.approval_status === 'approved' ? '✅ 승인' : '❌ 거절'}
                        </span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            ${b.approval_status === 'rejected' ? `
                                <button class="action-btn" onclick="editVoiceRecord(${b.resident_id})">수정</button>
                            ` : ''}
                            ${b.approval_status === 'pending' ? `
                                <button class="action-btn success" onclick="submitBilling(${b.id})">제출</button>
                            ` : ''}
                            ${b.rejection_reason ? `
                                <button class="action-btn" onclick="showRejectionReason('${b.rejection_reason}')">사유</button>
                            ` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function editVoiceRecord(residentId) {
            window.location.href = `./voice_record.html?resident_id=${residentId}&source=billing`;
        }

        function showRejectionReason(reason) {
            document.getElementById('rejectionReason').textContent = reason;
            document.getElementById('rejectionModal').classList.add('show');
        }

        function closeRejectionModal() {
            document.getElementById('rejectionModal').classList.remove('show');
        }

        function submitBilling(recordId) {
            if (confirm('이 청부를 제출하시겠습니까?')) {
                alert('제출 완료!');
                loadBillingRecords();
            }
        }

        window.addEventListener('load', () => {
            loadUserInfo();
            loadBillingRecords();
        });
    </script>
</body>
</html>
