<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용자 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        .sidebar, .main-layout, .topbar, .content, .form-section, .modal {
            /* 기존 스타일 참조 */
        }

        body { margin: 0; padding: 0; }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo { font-size: 24px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #3b82f6;
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .main-layout {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            font-size: 13px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .page-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            margin: 0;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .add-btn:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow-md);
        }

        /* Resident Cards Grid */
        .residents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .resident-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            padding: 24px;
            transition: all var(--transition-base);
        }

        .resident-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .resident-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .resident-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .resident-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .resident-info-item {
            margin-bottom: 6px;
        }

        .resident-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
        }

        .resident-actions button {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .resident-actions button:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-2xl);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-tertiary);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-layout {
                margin-left: 0;
            }

            .residents-grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>
            <a class="nav-item active" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>
            <a class="nav-item" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1>이용자 관리</h1>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="page-header">
                <h1>등록된 이용자</h1>
                <button class="add-btn" onclick="openAddModal()">➕ 이용자 추가</button>
            </div>

            <!-- Residents Grid -->
            <div class="residents-grid" id="residentsGrid">
                <div style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                    이용자를 추가하세요
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="residentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">이용자 추가</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" placeholder="이용자 이름">
                </div>
                <div class="form-group">
                    <label for="phone">전화번호</label>
                    <input type="tel" id="phone" placeholder="010-1234-5678">
                </div>
                <div class="form-group">
                    <label for="careGrade">요양등급</label>
                    <select id="careGrade">
                        <option value="1">1등급</option>
                        <option value="2">2등급</option>
                        <option value="3">3등급</option>
                        <option value="4">4등급</option>
                        <option value="5">5등급</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="clientType">수급자 유형</label>
                    <select id="clientType">
                        <option value="일반">일반</option>
                        <option value="차상위계층">차상위계층</option>
                        <option value="기초생활보장">기초생활보장</option>
                        <option value="의료급여">의료급여</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn btn-primary" onclick="saveResident()">저장</button>
            </div>
        </div>
    </div>

    <script>
        function navigateTo(url) {
            window.location.href = url;
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.clear();
                window.location.href = './login.html';
            }
        }

        function loadUserInfo() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = './login.html';
                return;
            }
            document.getElementById('userName').textContent = user.email.split('@')[0];
            document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '이용자 추가';
            document.getElementById('residentModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('residentModal').classList.remove('show');
        }

        function saveResident() {
            alert('이용자가 저장되었습니다!');
            closeModal();
        }

        window.addEventListener('load', () => {
            loadUserInfo();
        });
    </script>
</body>
</html>
