<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 청부 관리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        main {
            padding: 20px;
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            align-items: center;
        }

        .month-select {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-blue {
            background: #667eea;
            color: white;
        }

        .btn-blue:hover {
            background: #5568d3;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8e8e8;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            white-space: nowrap;
            border-right: 1px solid #eee;
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            border-right: 1px solid #eee;
            font-size: 14px;
        }

        td:last-child {
            border-right: none;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-draft {
            background: #fff3cd;
            color: #856404;
        }

        .status-submitted {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-paid {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-btn.submit {
            background: #ffc107;
            color: #333;
        }

        .action-btn.submit:hover {
            background: #e0a800;
        }

        .action-btn.pay {
            background: #28a745;
            color: white;
        }

        .action-btn.pay:hover {
            background: #218838;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        @media (max-width: 768px) {
            main {
                margin-left: 0;
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            .action-btn {
                padding: 4px 8px;
                font-size: 11px;
            }
        }
    </style>
    <script src="./navbar.js"></script>
</head>
<body>
    <main>
        <div class="page-header">
            <h1 class="page-title">💳 청부 관리</h1>
            <p class="page-subtitle">청부 기록을 조회하고 관리하세요</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">이번달 청부액</div>
                <div class="stat-value" id="totalAmount">0원</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">기록된 건수</div>
                <div class="stat-value" id="totalRecords">0건</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">제출 완료</div>
                <div class="stat-value" id="submittedCount">0건</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">지급 완료</div>
                <div class="stat-value" id="paidCount">0건</div>
            </div>
        </div>

        <div class="controls">
            <input type="month" id="monthSelect" class="month-select">
            <button class="btn btn-blue" onclick="loadBillingRecords()">조회</button>
        </div>

        <div class="table-container">
            <div id="billingTable" class="loading">
                <div>로드 중...</div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentUser = null;
        let billingRecords = [];

        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            console.log('=== 센터장 청부관리 페이지 로드 ===');
            console.log('Token:', token ? '있음' : '없음');
            console.log('User 객체:', user);
            console.log('User ID:', user.id);
            console.log('User Center ID:', user.center_id);
            console.log('User Role:', user.role);

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return;
            }

            currentUser = user;

            console.log('CurrentUser 설정됨:', {
                id: currentUser.id,
                center_id: currentUser.center_id,
                role: currentUser.role
            });

            const today = new Date();
            const yearMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('monthSelect').value = yearMonth;

            loadBillingRecords();
        });

        async function loadBillingRecords() {
            const monthSelect = document.getElementById('monthSelect');
            const yearMonth = monthSelect.value;

            if (!yearMonth) {
                alert('월을 선택하세요');
                return;
            }

            try {
                const tableDiv = document.getElementById('billingTable');
                tableDiv.innerHTML = '<div class="loading">로드 중...</div>';

                // 주민 정보 로드
                const residentsRes = await fetch(`${API_URL}/residents/`);
                const residentsData = residentsRes.ok ? await residentsRes.json() : { residents: [] };
                const residents = residentsData.residents || [];
                const residentMap = {};
                residents.forEach(r => {
                    residentMap[r.id] = r.name;
                });

                // 월별 청부 정보 조회
                const monthlyRes = await fetch(`${API_URL}/billing/monthly/${yearMonth}`);
                if (!monthlyRes.ok) throw new Error('청부 정보 조회 실패');

                const monthlyData = await monthlyRes.json();

                // 통계 업데이트
                document.getElementById('totalAmount').textContent = `${(monthlyData.total_amount || 0).toLocaleString()}원`;
                document.getElementById('totalRecords').textContent = `${monthlyData.total_records || 0}건`;
                document.getElementById('submittedCount').textContent = `${monthlyData.submitted_count || 0}건`;
                document.getElementById('paidCount').textContent = `${monthlyData.paid_count || 0}건`;

                // 모든 청부 기록 조회
                const centerId = currentUser.center_id || 1;
                const billingUrl = `${API_URL}/billing/?center_id=${centerId}`;

                console.log('📡 청부 조회 API 호출:');
                console.log('   centerId:', centerId);
                console.log('   URL:', billingUrl);

                const recordsRes = await fetch(billingUrl);
                if (!recordsRes.ok) throw new Error('기록 조회 실패');

                const recordsData = await recordsRes.json();
                billingRecords = recordsData.records || [];

                // 선택한 월의 기록만 필터링
                const [year, month] = yearMonth.split('-');
                billingRecords = billingRecords.filter(r => {
                    const recordDate = new Date(r.recorded_date);
                    return recordDate.getFullYear() === parseInt(year) &&
                           recordDate.getMonth() + 1 === parseInt(month);
                });

                renderBillingTable(residentMap);

                console.log('✅ 청부 기록 로드 완료:', billingRecords.length + '건');
            } catch (error) {
                console.error('❌ 청부 기록 로드 실패:', error);
                document.getElementById('billingTable').innerHTML =
                    '<div class="empty-state">청부 기록을 불러올 수 없습니다</div>';
            }
        }

        function renderBillingTable(residentMap = {}) {
            const tableDiv = document.getElementById('billingTable');

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>기록일</th>
                            <th>이용자</th>
                            <th>서비스 유형</th>
                            <th style="text-align: right;">청부액</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            if (billingRecords.length === 0) {
                html += '<tr><td colspan="6" style="text-align: center; padding: 40px;">기록이 없습니다</td></tr>';
            } else {
                billingRecords.forEach(record => {
                    const statusClass = `status-${record.approval_status || record.status}`;
                    const statusLabel = {
                        'pending': '⏳ 승인 대기',
                        'approved': '✅ 승인됨',
                        'rejected': '❌ 거절됨',
                        'draft': '📝 미제출',
                        'submitted': '📤 제출 완료',
                        'paid': '💰 지급 완료'
                    }[record.approval_status] || {
                        'draft': '미제출',
                        'submitted': '제출 완료',
                        'paid': '지급 완료'
                    }[record.status] || record.status;

                    const serviceLabel = {
                        'basic_care': '기본 요양',
                        'meal_service': '식사 서비스',
                        'medical_care': '의료 처치',
                        'emergency': '응급 대응'
                    }[record.service_type] || record.service_type;

                    const recordedDate = new Date(record.recorded_date).toLocaleDateString('ko-KR');
                    const residentName = residentMap[record.resident_id] || `ID: ${record.resident_id}`;

                    html += `
                        <tr>
                            <td>${recordedDate}</td>
                            <td>${residentName}</td>
                            <td>${serviceLabel}</td>
                            <td style="text-align: right;">${record.amount.toLocaleString()}원</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td>
                                <div class="action-buttons">
                                    ${record.approval_status === 'pending' ?
                                        `<button class="action-btn submit" onclick="approveRecord(${record.id})">승인</button>
                                         <button class="action-btn" style="background: #dc3545; color: white;" onclick="rejectRecord(${record.id})">거절</button>` :
                                        ''}
                                    ${record.approval_status === 'approved' && record.status === 'draft' ?
                                        `<button class="action-btn submit" onclick="submitRecord(${record.id})">제출</button>` :
                                        ''}
                                    ${record.status === 'submitted' ?
                                        `<button class="action-btn pay" onclick="payRecord(${record.id})">지급</button>` :
                                        ''}
                                </div>
                            </td>
                        </tr>
                    `;
                });
            }

            html += `
                    </tbody>
                </table>
            `;

            tableDiv.innerHTML = html;
        }

        async function submitRecord(recordId) {
            if (!confirm('이 청부 기록을 제출하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/submit`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                    }
                });

                if (!response.ok) throw new Error('제출 실패');

                alert('청부 기록이 제출되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 제출 실패:', error);
                alert('제출 중 오류가 발생했습니다');
            }
        }

        async function approveRecord(recordId) {
            if (!confirm('이 청부 기록을 승인하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/approve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) throw new Error('승인 실패');

                alert('청부 기록이 승인되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 승인 실패:', error);
                alert('승인 중 오류가 발생했습니다');
            }
        }

        async function rejectRecord(recordId) {
            const reason = prompt('거절 사유를 입력하세요:', '');
            if (reason === null) return;

            if (!confirm('이 청부 기록을 거절하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/reject`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role,
                        reason: reason
                    })
                });

                if (!response.ok) throw new Error('거절 실패');

                alert('청부 기록이 거절되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 거절 실패:', error);
                alert('거절 중 오류가 발생했습니다');
            }
        }

        async function payRecord(recordId) {
            if (!confirm('이 청부 기록을 지급 완료하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/pay`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                    }
                });

                if (!response.ok) throw new Error('지급 실패');

                alert('청부 기록이 지급 완료되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 지급 실패:', error);
                alert('지급 중 오류가 발생했습니다');
            }
        }
    </script>
</body>
</html>
