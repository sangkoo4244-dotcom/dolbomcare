<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청부 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo { font-size: 24px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #3b82f6;
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .main-layout {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            font-size: 13px;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all var(--transition-base);
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .filter-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .table-wrapper {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table thead {
            background: var(--bg-tertiary);
            border-bottom: 2px solid var(--border);
        }

        .table th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
        }

        .table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
        }

        .status-approved {
            background: var(--secondary-light);
            color: #065f46;
        }

        .status-rejected {
            background: var(--danger-light);
            color: #991b1b;
        }

        .status-pending {
            background: var(--warning-light);
            color: #92400e;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .action-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn.success:hover {
            background: var(--secondary-light);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .action-btn.danger:hover {
            background: var(--danger-light);
            border-color: var(--danger);
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-layout {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>
            <a class="nav-item" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>
            <a class="nav-item" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item active" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1>청부 관리</h1>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">센터장</div>
                    <div class="user-role">관리자</div>
                </div>
                <div class="avatar" id="userAvatar">M</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">전체</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">대기 중</div>
                    <div class="stat-value" id="pendingCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">승인</div>
                    <div class="stat-value" id="approvedCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">거절</div>
                    <div class="stat-value" id="rejectedCount">0</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterByStatus('all')">전체</button>
                <button class="filter-btn" onclick="filterByStatus('pending')">대기 중</button>
                <button class="filter-btn" onclick="filterByStatus('approved')">승인</button>
                <button class="filter-btn" onclick="filterByStatus('submitted_to_nhis')">건보 청구</button>
                <button class="filter-btn" onclick="filterByStatus('reimbursed')">환급완료</button>
                <button class="filter-btn" onclick="filterByStatus('rejected')">거절</button>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>요양사</th>
                            <th>이용자</th>
                            <th>서비스</th>
                            <th style="text-align: right;">금액</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="billingTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                                청부 기록을 로드 중입니다...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';

        function navigateTo(url) {
            window.location.href = url;
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.clear();
                window.location.href = './login.html';
            }
        }

        let currentUser = null;
        let allBillings = [];
        let currentFilter = 'all';

        function loadUserInfo() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = './login.html';
                return;
            }

            // Only center_manager can access this page
            if (user.role !== 'center_manager') {
                alert('센터장만 접근 가능합니다');
                window.location.href = './caregiver_billing.html';
                return;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || user.email.split('@')[0];
            document.getElementById('userAvatar').textContent = (user.full_name || user.email).charAt(0).toUpperCase();
        }

        async function loadBillingRecords() {
            try {
                const response = await fetch(`${API_URL}/billing/`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error('청부 기록 조회 실패');
                }

                const data = await response.json();
                allBillings = data.records || [];

                // 통계 업데이트
                const totalCount = allBillings.length;
                const pendingCount = allBillings.filter(r => r.approval_status === 'pending').length;
                const approvedCount = allBillings.filter(r => r.approval_status === 'approved').length;
                const rejectedCount = allBillings.filter(r => r.approval_status === 'rejected').length;

                document.getElementById('totalCount').textContent = totalCount;
                document.getElementById('pendingCount').textContent = pendingCount;
                document.getElementById('approvedCount').textContent = approvedCount;
                document.getElementById('rejectedCount').textContent = rejectedCount;

                // 주민 정보 로드
                const residentsRes = await fetch(`${API_URL}/residents/`);
                const residentsData = residentsRes.ok ? await residentsRes.json() : { residents: [] };
                const residents = residentsData.residents || [];
                const residentMap = {};
                residents.forEach(r => {
                    residentMap[r.id] = r.name;
                });

                renderBillingTable(allBillings, residentMap);
                console.log('✅ 청부 기록 로드 완료:', allBillings.length + '건');
            } catch (error) {
                console.error('❌ 청부 기록 로드 실패:', error);
                document.getElementById('billingTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                            청부 기록을 불러올 수 없습니다: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        function renderBillingTable(records, residentMap = {}) {
            const tbody = document.getElementById('billingTableBody');
            let html = '';

            if (records.length === 0) {
                html = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                            청부 기록이 없습니다
                        </td>
                    </tr>
                `;
            } else {
                records.forEach(record => {
                    const statusClass = `status-${record.approval_status}`;
                    const statusLabel = {
                        'pending': '⏳ 승인 대기',
                        'approved': '✅ 승인됨',
                        'submitted_to_nhis': '📤 건보 청구됨',
                        'reimbursed': '💰 환급완료',
                        'rejected': '❌ 거절됨'
                    }[record.approval_status] || record.approval_status;

                    const serviceLabel = {
                        'basic_care': '기본 요양',
                        'meal_service': '식사 서비스',
                        'medical_care': '의료 처치',
                        'emergency': '응급 대응'
                    }[record.service_type] || record.service_type;

                    const recordedDate = new Date(record.recorded_date).toLocaleDateString('ko-KR');
                    const residentName = residentMap[record.resident_id] || `ID: ${record.resident_id}`;

                    let actionHtml = '';
                    if (record.approval_status === 'pending') {
                        actionHtml = `
                            <div class="action-buttons">
                                <button class="action-btn success" onclick="approveBilling(${record.id})">승인</button>
                                <button class="action-btn danger" onclick="rejectBilling(${record.id})">거절</button>
                            </div>
                        `;
                    } else if (record.approval_status === 'approved') {
                        actionHtml = `
                            <div class="action-buttons">
                                <button class="action-btn primary" onclick="submitToNHIS(${record.id})">건보 청구</button>
                            </div>
                        `;
                    } else if (record.approval_status === 'submitted_to_nhis') {
                        actionHtml = `
                            <div class="action-buttons">
                                <button class="action-btn success" onclick="confirmReimbursement(${record.id})">환급 확인</button>
                                <button class="action-btn warning" onclick="cancelNHISSubmission(${record.id})">취소</button>
                            </div>
                        `;
                    }

                    html += `
                        <tr>
                            <td>${recordedDate}</td>
                            <td>${record.caregiver_name || '미등록'}</td>
                            <td>${residentName}</td>
                            <td>${serviceLabel}</td>
                            <td style="text-align: right;">${record.amount?.toLocaleString() || '0'}원</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td>${actionHtml || '-'}</td>
                        </tr>
                    `;
                });
            }

            tbody.innerHTML = html;
        }

        function filterByStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const filtered = currentFilter === 'all'
                ? allBillings
                : allBillings.filter(b => b.approval_status === currentFilter);

            const residentsRes = fetch(`${API_URL}/residents/`);
            const residentMap = {};
            renderBillingTable(filtered, residentMap);
        }

        async function approveBilling(recordId) {
            if (!confirm('이 청부를 승인하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('승인 실패');
                }

                alert('청부가 승인되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 승인 오류:', error);
                alert('승인 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function rejectBilling(recordId) {
            const reason = prompt('거절 사유를 입력하세요:');
            if (reason === null) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role,
                        reason: reason
                    })
                });

                if (!response.ok) {
                    throw new Error('거절 실패');
                }

                alert('청부가 거절되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 거절 오류:', error);
                alert('거절 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function submitToNHIS(recordId) {
            if (!confirm('이 청부를 건강보험공단에 청구하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/submit-to-nhis`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('건보 청구 실패');
                }

                alert('청부가 건강보험공단에 청구되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 건보 청구 오류:', error);
                alert('건보 청구 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function confirmReimbursement(recordId) {
            if (!confirm('건보 환급을 확인하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/confirm-reimbursement`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('환급 확인 실패');
                }

                alert('환급이 확인되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 환급 확인 오류:', error);
                alert('환급 확인 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function cancelNHISSubmission(recordId) {
            if (!confirm('건보 청구를 취소하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/cancel-nhis-submission`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('건보 청구 취소 실패');
                }

                alert('건보 청구가 취소되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 건보 청구 취소 오류:', error);
                alert('건보 청구 취소 중 오류가 발생했습니다: ' + error.message);
            }
        }

        window.addEventListener('load', () => {
            loadUserInfo();
            loadBillingRecords();
        });
    </script>
</body>
</html>
