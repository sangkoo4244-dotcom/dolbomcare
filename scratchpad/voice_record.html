<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음성 기록 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        /* Shared styles */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo { font-size: 24px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #3b82f6;
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .main-layout {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-primary);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        /* Page specific styles */
        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px 0;
        }

        .page-header p {
            color: var(--text-secondary);
            margin: 0;
        }

        .form-section {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-section h3 {
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            transition: all var(--transition-fast);
        }

        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Records Section */
        .records-section {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            padding: 24px;
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .records-list {
            list-style: none;
        }

        .record-item {
            padding: 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition-fast);
        }

        .record-item:hover {
            background: var(--bg-secondary);
            border-color: var(--primary);
        }

        .record-info {
            flex: 1;
        }

        .record-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .record-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .record-actions {
            display: flex;
            gap: 8px;
        }

        .record-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .record-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-2xl);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-tertiary);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-layout {
                margin-left: 0;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>
            <a class="nav-item" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item active" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>
            <a class="nav-item" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1>음성 기록</h1>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role">요양사</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="page-header">
                <h1>새 기록 추가</h1>
                <p>요양 활동을 기록하세요</p>
            </div>

            <!-- Add Record Form -->
            <div class="form-section">
                <h3>기본 정보</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="resident">이용자</label>
                        <select id="residentSelect" onchange="onResidentChange()">
                            <option value="">선택하세요</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="serviceType">서비스 유형</label>
                        <select id="serviceType">
                            <option value="basic_care">🛏️ 기본 요양</option>
                            <option value="meal_service">🍽️ 식사 서비스</option>
                            <option value="medical_care">💊 의료 처치</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Care Details -->
            <div class="form-section">
                <h3>요양 내용</h3>
                <div class="form-row full">
                    <div class="form-group">
                        <label><input type="checkbox"> 아침 요양</label>
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox"> 끼니 제공</label>
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox"> 약물 투여</label>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="notes">메모</label>
                        <textarea id="notes" placeholder="특이사항이 있으면 작성하세요"></textarea>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="saveRecord()" style="width: 100%;">
                    💾 기록 저장
                </button>
            </div>

            <!-- Records List -->
            <div class="records-section">
                <div class="records-header">
                    <h3 style="margin: 0;">최근 기록</h3>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('today')">오늘</button>
                    <button class="tab-btn" onclick="switchTab('7days')">지난 7일</button>
                    <button class="tab-btn" onclick="switchTab('all')">전체</button>
                </div>

                <ul class="records-list" id="recordsList">
                    <li style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                        기록이 없습니다
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>기록 편집</h2>
                <button class="modal-close" onclick="closeEditModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editServiceType">서비스 유형</label>
                    <select id="editServiceType">
                        <option value="basic_care">🛏️ 기본 요양</option>
                        <option value="meal_service">🍽️ 식사 서비스</option>
                        <option value="medical_care">💊 의료 처치</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editNotes">메모</label>
                    <textarea id="editNotes"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="record-btn" onclick="closeEditModal()">취소</button>
                <button class="btn btn-primary" onclick="saveRecordEdit()">저장</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';

        function navigateTo(url) {
            window.location.href = url;
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.clear();
                window.location.href = './login.html';
            }
        }

        function loadUserInfo() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = './login.html';
                return;
            }
            document.getElementById('userName').textContent = user.email.split('@')[0];
            document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
        }

        function onResidentChange() {
            // Load resident records
        }

        function switchTab(tab) {
            // Switch tab
        }

        function saveRecord() {
            alert('기록이 저장되었습니다!');
        }

        function openEditModal(recordId, serviceType, notes) {
            document.getElementById('editServiceType').value = serviceType;
            document.getElementById('editNotes').value = notes;
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        function saveRecordEdit() {
            alert('기록이 수정되었습니다!');
            closeEditModal();
        }

        window.addEventListener('load', () => {
            loadUserInfo();
        });
    </script>
</body>
</html>
