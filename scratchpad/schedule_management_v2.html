<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 스케줄 관리</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { box-sizing: border-box; }

        body {
            background: var(--bg-secondary);
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo { font-size: 24px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav { padding: 20px 0; }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #10b981;
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .nav-item.hidden { display: none !important; }

        .main-layout {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-primary);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
        }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .page-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h2 {
            margin: 0;
            font-size: 28px;
            color: var(--text-primary);
        }

        .btn-primary {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all var(--transition-fast);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Filters */
        .filters {
            background: white;
            padding: 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .filter-input, .filter-select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-primary);
            background: white;
        }

        /* Schedule Table */
        .schedule-table {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
        }

        .table-header {
            background: var(--bg-tertiary);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1.5fr 1fr 1fr 1.2fr 0.8fr;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .table-row {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1.5fr 1fr 1fr 1.2fr 0.8fr;
            gap: 12px;
            align-items: center;
            transition: all var(--transition-fast);
        }

        .table-row:hover {
            background: var(--bg-secondary);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .schedule-date {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        .schedule-info {
            font-size: 13px;
            color: var(--text-primary);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
        }

        .status-scheduled {
            background: #e0e7ff;
            color: #3730a3;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-small {
            padding: 6px 10px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .btn-small:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .btn-delete {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-delete:hover {
            background: var(--danger-light);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 20px;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }

        .form-input, .form-select, .form-textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-primary);
            background: white;
            font-family: inherit;
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .repeat-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .repeat-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
        }

        .repeat-option input[type="radio"] {
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
        }

        .btn-cancel {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-cancel:hover {
            background: var(--bg-secondary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: var(--text-tertiary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-change {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                overflow: hidden;
                transition: width var(--transition-base);
            }

            .main-layout {
                margin-left: 0;
            }

            .content {
                padding: 20px;
            }

            .table-header, .table-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
        }
    </style>
    <script src="menu.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" id="menu-dashboard" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>
            <a class="nav-item" id="menu-residents" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item" id="menu-billing-management" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item" id="menu-staff" onclick="navigateTo('./staff_management.html')">
                <span>👔</span> 직원 관리
            </a>
            <a class="nav-item active" id="menu-schedule" onclick="navigateTo('./schedule_management_v2.html')">
                <span>📅</span> 스케줄 관리
            </a>
            <a class="nav-item" id="menu-guardian-comm" onclick="navigateTo('./guardian_communication.html')">
                <span>📢</span> 보호자 소통
            </a>
            <a class="nav-item" id="menu-profit" onclick="navigateTo('./profit_analysis.html')">
                <span>📈</span> 손익 분석
            </a>
            <a class="nav-item" id="menu-roadmap" onclick="navigateTo('./center-roadmap.html')">
                <span>📊</span> 성장 로드맵
            </a>
            <a class="nav-item" id="menu-settings" onclick="navigateTo('./settings.html')">
                <span>⚙️</span> 설정
            </a>
            <a class="nav-item" id="menu-logout" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1>스케줄 관리</h1>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role">센터장</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="page-header">
                <h2>📅 스케줄 관리</h2>
                <button class="btn-primary" onclick="openAddModal()">+ 새 스케줄</button>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">총 스케줄</div>
                    <div class="stat-value" id="totalSchedules">0</div>
                    <div class="stat-change">등록됨</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">예정중</div>
                    <div class="stat-value" id="scheduledCount">0</div>
                    <div class="stat-change">이번주</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">완료</div>
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-change">완료됨</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">미충원</div>
                    <div class="stat-value" id="unfilledCount">0</div>
                    <div class="stat-change">⚠️ 주의필요</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">요양사</label>
                    <select class="filter-select" id="filterCaregiverId" onchange="loadSchedules()">
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">이용자</label>
                    <select class="filter-select" id="filterResidentId" onchange="loadSchedules()">
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">상태</label>
                    <select class="filter-select" id="filterStatus" onchange="loadSchedules()">
                        <option value="">전체</option>
                        <option value="scheduled">예정</option>
                        <option value="completed">완료</option>
                        <option value="cancelled">취소</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">기간</label>
                    <input type="date" class="filter-input" id="filterDate" onchange="loadSchedules()">
                </div>
            </div>

            <!-- Schedule Table -->
            <div class="schedule-table">
                <div class="table-header">
                    <div>날짜</div>
                    <div>요양사</div>
                    <div>이용자</div>
                    <div>서비스</div>
                    <div>상태</div>
                    <div>반복설정</div>
                    <div>작업</div>
                </div>
                <div id="scheduleList"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="scheduleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">새 스케줄 추가</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>

            <form id="scheduleForm" onsubmit="submitSchedule(event)">
                <div class="form-group">
                    <label class="form-label">요양사 *</label>
                    <select class="form-select" id="caregiverId" required>
                        <option value="">선택하세요</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">이용자 *</label>
                    <select class="form-select" id="residentId" required>
                        <option value="">선택하세요</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">날짜 및 시간 *</label>
                    <input type="datetime-local" class="form-input" id="scheduledDate" required>
                </div>

                <div class="form-group">
                    <label class="form-label">서비스 유형</label>
                    <select class="form-select" id="serviceType">
                        <option value="basic_care">기본 돌봄</option>
                        <option value="meal_service">식사 지원</option>
                        <option value="medical_care">의료 돌봄</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">반복 설정</label>
                    <div class="repeat-options">
                        <label class="repeat-option">
                            <input type="radio" name="repeat" value="none" checked>
                            반복 안함
                        </label>
                        <label class="repeat-option">
                            <input type="radio" name="repeat" value="weekly">
                            매주
                        </label>
                        <label class="repeat-option">
                            <input type="radio" name="repeat" value="biweekly">
                            2주마다
                        </label>
                        <label class="repeat-option">
                            <input type="radio" name="repeat" value="monthly">
                            매월
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">특이사항</label>
                    <textarea class="form-textarea" id="notes" placeholder="혈압 체크 필요 등"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-submit">저장</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentUser = null;
        let schedules = [];

        function navigateTo(url) {
            window.location.href = url;
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.clear();
                window.location.href = './login.html';
            }
        }

        function loadUserInfo() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }

            const user = JSON.parse(userStr);
            currentUser = user;

            if (user.role !== 'center_manager') {
                alert('센터장만 접근 가능합니다');
                window.location.href = './dashboard.html';
                return;
            }

            document.getElementById('userName').textContent = user.email.split('@')[0];
            const initial = user.email.charAt(0).toUpperCase();
            document.getElementById('userAvatar').textContent = initial;

            if (typeof filterMenuByRole === 'function') {
                filterMenuByRole();
            }
        }

        async function loadSchedules() {
            try {
                const centerId = currentUser?.center_id || 1;
                const caregiverId = document.getElementById('filterCaregiverId').value;
                const residentId = document.getElementById('filterResidentId').value;
                const status = document.getElementById('filterStatus').value;

                const token = localStorage.getItem('access_token');
                let url = `${API_URL}/schedule/?center_id=${centerId}`;

                if (caregiverId) url += `&caregiver_id=${caregiverId}`;
                if (residentId) url += `&resident_id=${residentId}`;
                if (status) url += `&status=${status}`;

                const response = await fetch(url, {
                    headers: token ? {'Authorization': `Bearer ${token}`} : {}
                });

                if (!response.ok) throw new Error('스케줄 로드 실패');
                const data = await response.json();

                schedules = data.schedules || [];
                renderSchedules();
                updateStats();
            } catch (error) {
                console.error('Error loading schedules:', error);
                document.getElementById('scheduleList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>스케줄을 불러올 수 없습니다</p>
                    </div>
                `;
            }
        }

        function renderSchedules() {
            const container = document.getElementById('scheduleList');

            if (!schedules || schedules.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📅</div>
                        <p>등록된 스케줄이 없습니다</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = schedules.map(schedule => {
                const date = new Date(schedule.scheduled_date);
                const dateStr = date.toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const serviceTypeText = {
                    'basic_care': '기본 돌봄',
                    'meal_service': '식사 지원',
                    'medical_care': '의료 돌봄'
                }[schedule.service_type] || schedule.service_type;

                const statusText = {
                    'scheduled': '예정',
                    'completed': '완료',
                    'cancelled': '취소'
                }[schedule.status] || schedule.status;

                return `
                    <div class="table-row">
                        <div class="schedule-date">${dateStr}</div>
                        <div class="schedule-info">요양사 #${schedule.caregiver_id}</div>
                        <div class="schedule-info">이용자 #${schedule.resident_id}</div>
                        <div><span class="badge">${serviceTypeText}</span></div>
                        <div><span class="badge status-${schedule.status}">${statusText}</span></div>
                        <div style="font-size: 12px;">📅</div>
                        <div class="action-buttons">
                            <button class="btn-small" onclick="deleteSchedule(${schedule.id})">삭제</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const now = new Date();
            const weekLater = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

            const completed = schedules.filter(s => s.status === 'completed').length;
            const scheduled = schedules.filter(s => {
                const d = new Date(s.scheduled_date);
                return s.status === 'scheduled' && d >= now && d <= weekLater;
            }).length;

            document.getElementById('totalSchedules').textContent = schedules.length;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('scheduledCount').textContent = scheduled;
            document.getElementById('unfilledCount').textContent = Math.max(0, scheduled - scheduled);
        }

        async function loadCaregivers() {
            try {
                const centerId = currentUser?.center_id || 1;
                const token = localStorage.getItem('access_token');
                const response = await fetch(`${API_URL}/users/?center_id=${centerId}&role=caregiver`, {
                    headers: token ? {'Authorization': `Bearer ${token}`} : {}
                });

                if (!response.ok) throw new Error('요양사 로드 실패');
                const data = await response.json();

                const select = document.getElementById('caregiverId');
                const filterSelect = document.getElementById('filterCaregiverId');
                data.users?.forEach(user => {
                    const opt1 = document.createElement('option');
                    opt1.value = user.id;
                    opt1.textContent = user.full_name || user.email;
                    select.appendChild(opt1);

                    const opt2 = document.createElement('option');
                    opt2.value = user.id;
                    opt2.textContent = user.full_name || user.email;
                    filterSelect.appendChild(opt2);
                });
            } catch (error) {
                console.error('Error loading caregivers:', error);
            }
        }

        async function loadResidents() {
            try {
                const centerId = currentUser?.center_id || 1;
                const token = localStorage.getItem('access_token');
                const response = await fetch(`${API_URL}/residents/?center_id=${centerId}`, {
                    headers: token ? {'Authorization': `Bearer ${token}`} : {}
                });

                if (!response.ok) throw new Error('이용자 로드 실패');
                const data = await response.json();

                const select = document.getElementById('residentId');
                const filterSelect = document.getElementById('filterResidentId');
                data.residents?.forEach(resident => {
                    const opt1 = document.createElement('option');
                    opt1.value = resident.id;
                    opt1.textContent = resident.name;
                    select.appendChild(opt1);

                    const opt2 = document.createElement('option');
                    opt2.value = resident.id;
                    opt2.textContent = resident.name;
                    filterSelect.appendChild(opt2);
                });
            } catch (error) {
                console.error('Error loading residents:', error);
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '새 스케줄 추가';
            document.getElementById('scheduleForm').reset();
            document.getElementById('scheduleModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('scheduleModal').classList.remove('active');
        }

        async function submitSchedule(event) {
            event.preventDefault();

            const caregiverId = document.getElementById('caregiverId').value;
            const residentId = document.getElementById('residentId').value;
            const scheduledDate = document.getElementById('scheduledDate').value;
            const serviceType = document.getElementById('serviceType').value;
            const notes = document.getElementById('notes').value;
            const repeatType = document.querySelector('input[name="repeat"]:checked').value;

            if (!caregiverId || !residentId || !scheduledDate) {
                alert('필수 항목을 입력하세요');
                return;
            }

            try {
                const token = localStorage.getItem('access_token');
                const centerId = currentUser?.center_id || 1;

                const payload = {
                    caregiver_id: parseInt(caregiverId),
                    resident_id: parseInt(residentId),
                    center_id: centerId,
                    scheduled_date: scheduledDate.replace('T', 'T') + ':00',
                    service_type: serviceType,
                    notes: notes || null
                };

                const response = await fetch(`${API_URL}/schedule/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token && {'Authorization': `Bearer ${token}`})
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '저장 실패');
                }

                alert('스케줄이 저장되었습니다' + (repeatType !== 'none' ? ` (${repeatType} 반복)` : ''));
                closeModal();
                loadSchedules();
            } catch (error) {
                console.error('Error submitting schedule:', error);
                alert('저장 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function deleteSchedule(scheduleId) {
            if (!confirm('이 스케줄을 삭제하시겠습니까?')) return;

            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`${API_URL}/schedule/${scheduleId}`, {
                    method: 'DELETE',
                    headers: token ? {'Authorization': `Bearer ${token}`} : {}
                });

                if (!response.ok) throw new Error('삭제 실패');

                alert('스케줄이 삭제되었습니다');
                loadSchedules();
            } catch (error) {
                console.error('Error deleting schedule:', error);
                alert('삭제 중 오류가 발생했습니다');
            }
        }

        window.addEventListener('load', () => {
            loadUserInfo();
            loadCaregivers();
            loadResidents();
            loadSchedules();
        });
    </script>
</body>
</html>
