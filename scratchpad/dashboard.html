<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body {
            background: var(--bg-secondary);
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo {
            font-size: 24px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 700;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #3b82f6;
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        /* Main Content */
        .main-layout {
            margin-left: 250px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar */
        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-primary);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 30px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all var(--transition-base);
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-change {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all var(--transition-base);
        }

        .dashboard-card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header-title {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header-title h3 {
            margin: 0;
            font-size: 16px;
            color: var(--text-primary);
        }

        .card-body {
            padding: 20px;
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .action-btn {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: white;
            cursor: pointer;
            transition: all var(--transition-base);
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
        }

        .action-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .action-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 8px;
        }

        /* Recent Activity */
        .activity-list {
            list-style: none;
        }

        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .activity-content {
            flex: 1;
        }

        .activity-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .activity-time {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: var(--text-tertiary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform var(--transition-base);
                z-index: 1000;
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-layout {
                margin-left: 0;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .topbar {
                padding: 16px 20px;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item active" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>
            <a class="nav-item" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>
            <a class="nav-item" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1 id="pageTitle">대시보드</h1>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">역할</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">이용자 수</div>
                    <div class="stat-value" id="residentCount">0</div>
                    <div class="stat-change">활성 이용자</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">음성 기록</div>
                    <div class="stat-value" id="recordCount">0</div>
                    <div class="stat-change">이번 달</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">처리 대기</div>
                    <div class="stat-value" id="billingCount">0</div>
                    <div class="stat-change">대기+거절</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">전체 청부액</div>
                    <div class="stat-value" id="billingAmount">0</div>
                    <div class="stat-change">원</div>
                </div>
            </div>

            <!-- Quick Actions and Activity -->
            <div class="dashboard-grid">
                <!-- Quick Actions -->
                <div class="dashboard-card">
                    <div class="card-header-title">
                        <h3>빠른 시작</h3>
                    </div>
                    <div class="card-body">
                        <div class="quick-actions">
                            <a href="./resident_management.html" class="action-btn">
                                <span class="action-icon">➕</span>
                                이용자 추가
                            </a>
                            <a href="./voice_record.html" class="action-btn">
                                <span class="action-icon">🎤</span>
                                기록 추가
                            </a>
                            <a href="./caregiver_billing.html" class="action-btn">
                                <span class="action-icon">💳</span>
                                청부 조회
                            </a>
                            <a href="./billing_management.html" class="action-btn">
                                <span class="action-icon">📊</span>
                                관리
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="dashboard-card">
                    <div class="card-header-title">
                        <h3>최근 활동</h3>
                    </div>
                    <div class="card-body">
                        <ul class="activity-list" id="activityList">
                            <li class="activity-item">
                                <div class="activity-icon">📝</div>
                                <div class="activity-content">
                                    <div class="activity-title">시스템 준비 완료</div>
                                    <div class="activity-time">지금</div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';

        // Navigation
        function navigateTo(url) {
            window.location.href = url;
        }

        // Logout
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.clear();
                window.location.href = './login.html';
            }
        }

        // Load user info
        function loadUserInfo() {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }

            const user = JSON.parse(userStr);
            document.getElementById('userName').textContent = user.email.split('@')[0];
            document.getElementById('userRole').textContent =
                user.role === 'caregiver' ? '요양사' : '센터장';

            const initial = user.email.charAt(0).toUpperCase();
            document.getElementById('userAvatar').textContent = initial;
        }

        // Load dashboard data
        async function loadDashboardData() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                const token = localStorage.getItem('access_token');

                console.log('Dashboard load - Token:', token);
                // Always try to load real data from API, even with offline-test-token

                // Load residents count
                try {
                    console.log('Fetching residents...');
                    const resResponse = await fetch(`${API_URL}/residents/`, {
                        headers: token ? {'Authorization': `Bearer ${token}`} : {}
                    });
                    if (resResponse.ok) {
                        const resData = await resResponse.json();
                        const count = resData.residents?.length || resData.total_residents || 0;
                        console.log('Residents count:', count);
                        document.getElementById('residentCount').textContent = count;
                    } else {
                        console.error('Residents failed:', resResponse.status);
                    }
                } catch (e) { console.error('Residents error:', e); }

                // Load today's records count
                try {
                    console.log('Fetching records...');
                    const caregiverId = user?.id || '';
                    const recUrl = `${API_URL}/records/today${caregiverId ? '?caregiver_id=' + caregiverId : ''}`;
                    console.log('Records URL:', recUrl);
                    const recResponse = await fetch(recUrl, {
                        headers: token ? {'Authorization': `Bearer ${token}`} : {}
                    });
                    if (recResponse.ok) {
                        const recData = await recResponse.json();
                        // Handle both formats: {total_records: N} or {records: [...]}
                        const count = recData.total_records || recData.records?.length || 0;
                        console.log('Records count:', count, 'Data:', recData);
                        document.getElementById('recordCount').textContent = count;
                    } else {
                        console.error('Records failed:', recResponse.status);
                        // Fallback to 0
                        document.getElementById('recordCount').textContent = '0';
                    }
                } catch (e) {
                    console.error('Records error:', e);
                    document.getElementById('recordCount').textContent = '0';
                }

                // Load billing: count = action needed (pending+rejected), amount = all active billing (excluding archived)
                try {
                    console.log('Fetching billing...');
                    let actionCount = 0, totalAmount = 0;
                    const centerId = user?.center_id || 1;

                    // Fetch all active billings (include_archived=false) for the center
                    const billUrl = `${API_URL}/billing/?center_id=${centerId}&include_archived=false`;
                    console.log('Billing URL:', billUrl);

                    const billResp = await fetch(billUrl, {
                        headers: token ? {'Authorization': `Bearer ${token}`} : {}
                    });

                    if (billResp.ok) {
                        const billData = await billResp.json();
                        const records = billData.records || [];
                        console.log('Billing records:', records.length, records);

                        // Action needed: pending + rejected
                        actionCount = records.filter(r => r.approval_status === 'pending' || r.approval_status === 'rejected').length;

                        // Total amount: all active statuses (pending, approved, submitted_to_nhis, rejected)
                        totalAmount = records.reduce((sum, r) => sum + (r.total_amount || r.amount || 0), 0);
                    } else {
                        console.error('Billing fetch failed:', billResp.status);
                    }

                    console.log('Billing - Action needed:', actionCount, 'Total amount:', totalAmount);
                    document.getElementById('billingCount').textContent = actionCount;
                    document.getElementById('billingAmount').textContent =
                        new Intl.NumberFormat('ko-KR').format(totalAmount);
                } catch (e) {
                    console.error('Billing error:', e);
                    document.getElementById('billingCount').textContent = '0';
                    document.getElementById('billingAmount').textContent = '0';
                }

            } catch (error) {
                console.log('Dashboard data load error:', error);
                // Fallback to demo data
                document.getElementById('residentCount').textContent = '0';
                document.getElementById('recordCount').textContent = '0';
                document.getElementById('billingCount').textContent = '0';
                document.getElementById('billingAmount').textContent = '0';
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            loadUserInfo();
            loadDashboardData();
        });
    </script>
</body>
</html>
