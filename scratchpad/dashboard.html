<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
        }

        main {
            flex: 1;
            padding: 20px;
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8e8e8;
        }

        .card.main-card {
            grid-column: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }

        .main-card .card-title {
            color: white;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .main-card .card-stat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 0;
        }

        .main-card .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .main-card .stat-value {
            color: white;
            font-size: 24px;
        }

        .sub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-stat {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            margin-top: 12px;
            width: 100%;
            text-align: center;
        }

        .btn-blue {
            background: #667eea;
            color: white;
        }

        .btn-blue:hover {
            background: #5568d3;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            main {
                margin-left: 0;
                width: 100%;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="./navbar.js"></script>
</head>
<body>
    <main id="mainContent">
        <div style="text-align: center; padding: 40px;">
            <div class="spinner" style="display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="margin-top: 16px; color: #666;">대시보드 로딩 중...</p>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentUser = null;

        // 페이지 로드
        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return;
            }

            currentUser = user;
            renderDashboard(user);

            // 다른 탭에서 데이터 갱신 신호 감시
            window.addEventListener('storage', (e) => {
                if (e.key === 'dashboardRefresh') {
                    console.log('📊 대시보드 데이터 갱신 신호 감지');
                    if (currentUser.role === 'caregiver') {
                        loadCaregiverData();
                    } else {
                        loadManagerData();
                    }
                }
            });
        });

        function renderDashboard(user) {
            const mainContent = document.getElementById('mainContent');
            const isCaregiver = user.role === 'caregiver';

            let html = `
                <div class="page-header">
                    <h1 class="page-title">${isCaregiver ? '💚 나의 업무' : '📊 센터 현황'}</h1>
                    <p class="page-subtitle">${user.full_name}님, 환영합니다!</p>
                </div>
            `;

            if (isCaregiver) {
                // ========== 요양사 대시보드 ==========
                html += `
                    <!-- 메인 카드: 오늘의 주요 현황 -->
                    <div class="grid">
                        <div class="card main-card">
                            <div class="card-title">📋 오늘의 업무</div>
                            <div class="main-card card-stat">
                                <div>
                                    <div class="stat-label">완료된 기록</div>
                                    <div class="stat-value" id="caregiverCompleted">0건</div>
                                </div>
                                <div>
                                    <div class="stat-label">청구액</div>
                                    <div class="stat-value" id="caregiverTodayBilling">0원</div>
                                </div>
                                <div>
                                    <div class="stat-label">마감일</div>
                                    <div class="stat-value" style="font-size: 16px;" id="caregiverPayDay">-</div>
                                </div>
                            </div>
                            <button class="btn btn-blue" style="background: rgba(255,255,255,0.2); margin-top: 20px;" onclick="window.location.href='./voice_record.html'">+ 기록하기</button>
                        </div>
                    </div>

                    <!-- 서브 카드들 -->
                    <div class="sub-grid">
                        <!-- 청부 정보 -->
                        <div class="card">
                            <div class="card-title">💳 청부 현황</div>
                            <div class="card-stat">
                                <span class="stat-label">이번달 청부액</span>
                                <span class="stat-value" id="caregiverSalary">-</span>
                            </div>
                            <div class="card-stat">
                                <span class="stat-label">기록 건수</span>
                                <span class="stat-value" id="caregiverRecords">-</span>
                            </div>
                            <button class="btn btn-blue" onclick="window.location.href='./salary.html'">자세히 보기</button>
                        </div>

                        <!-- 공지사항 -->
                        <div class="card">
                            <div class="card-title">📢 최근 공지</div>
                            <div style="font-size: 13px; line-height: 1.6; color: #666; margin-bottom: 12px;">
                                <p>• 새로운 공지 없음</p>
                                <p style="margin-top: 8px; color: #999; font-size: 12px;">센터 공지사항이 표시됩니다</p>
                            </div>
                            <button class="btn btn-blue" onclick="alert('공지사항 페이지 (준비 중)')">공지 확인</button>
                        </div>
                    </div>
                `;

            } else {
                // ========== 센터장 대시보드 ==========
                html += `
                    <!-- 메인 카드: 실시간 운영 현황 -->
                    <div class="grid">
                        <div class="card main-card">
                            <div class="card-title">🏃 실시간 운영 현황</div>
                            <div class="main-card card-stat">
                                <div>
                                    <div class="stat-label">완료된 방문</div>
                                    <div class="stat-value" id="managerCompleted">0건</div>
                                </div>
                                <div>
                                    <div class="stat-label">등록 직원</div>
                                    <div class="stat-value" id="managerStaffCount">0명</div>
                                </div>
                                <div>
                                    <div class="stat-label">등록 이용자</div>
                                    <div class="stat-value" id="managerResidents">0명</div>
                                </div>
                            </div>
                            <button class="btn btn-blue" style="background: rgba(255,255,255,0.2); margin-top: 20px;" onclick="alert('상세 현황 보기 (준비 중)')">상세 보기</button>
                        </div>
                    </div>

                    <!-- 서브 카드들 -->
                    <div class="sub-grid">
                        <!-- 청부 현황 -->
                        <div class="card">
                            <div class="card-title">💳 청부 현황</div>
                            <div class="card-stat">
                                <span class="stat-label">이번달 청부액</span>
                                <span class="stat-value" id="managerBilling">-</span>
                            </div>
                            <div class="card-stat">
                                <span class="stat-label">제출 건수</span>
                                <span class="stat-value" id="managerBillingSubmit">-</span>
                            </div>
                            <button class="btn btn-blue" onclick="window.location.href='./billing_management.html'">청부 관리</button>
                        </div>

                        <!-- 직원 관리 -->
                        <div class="card">
                            <div class="card-title">👥 직원 관리</div>
                            <div class="card-stat">
                                <span class="stat-label">월 급여 지급액</span>
                                <span class="stat-value" style="font-size: 14px;" id="managerPayroll">-</span>
                            </div>
                            <div class="card-stat">
                                <span class="stat-label">오늘 근무 중</span>
                                <span class="stat-value" id="managerWorking">-</span>
                            </div>
                            <button class="btn btn-blue" onclick="window.location.href='./staff_management.html'">직원 관리</button>
                        </div>

                        <!-- 이용자 관리 -->
                        <div class="card">
                            <div class="card-title">👤 이용자 관리</div>
                            <div class="card-stat">
                                <span class="stat-label">건강 주의</span>
                                <span class="stat-value" id="managerWarning">-</span>
                            </div>
                            <div class="card-stat">
                                <span class="stat-label">건강 위험</span>
                                <span class="stat-value" style="color: #FF3B30;" id="managerCritical">-</span>
                            </div>
                            <button class="btn btn-blue" onclick="window.location.href='./resident_management.html'">이용자 관리</button>
                        </div>

                        <!-- 월별 리포트 -->
                        <div class="card">
                            <div class="card-title">📈 월별 리포트</div>
                            <div class="card-stat">
                                <span class="stat-label">이번달 기록</span>
                                <span class="stat-value" id="managerMonthlyRecords">-</span>
                            </div>
                            <div class="card-stat">
                                <span class="stat-label">월 평균 청부</span>
                                <span class="stat-value" style="font-size: 14px;" id="managerMonthlyBilling">-</span>
                            </div>
                            <button class="btn btn-blue" onclick="alert('리포트 페이지 (준비 중)')">리포트 보기</button>
                        </div>
                    </div>
                `;
            }

            mainContent.innerHTML = html;

            // 데이터 로드
            if (isCaregiver) {
                loadCaregiverData();
            } else {
                loadManagerData();
            }
        }

        async function loadCaregiverData() {
            try {
                // 오늘의 기록 및 청부액
                const todayRes = await fetch(`${API_URL}/records/today?caregiver_id=${currentUser.id}`);
                if (todayRes.ok) {
                    const data = await todayRes.json();
                    document.getElementById('caregiverCompleted').textContent = `${data.total_records || 0}건`;
                    document.getElementById('caregiverTodayBilling').textContent = `${(data.total_billing_amount || 0).toLocaleString()}원`;
                }

                // 이번달 전체 청부액
                const salaryRes = await fetch(`${API_URL}/salary/current?caregiver_id=${currentUser.id}`);
                if (salaryRes.ok) {
                    const data = await salaryRes.json();
                    document.getElementById('caregiverSalary').textContent = `${(data.total_amount || 0).toLocaleString()}원`;
                    document.getElementById('caregiverRecords').textContent = `${data.total_records || 0}건`;

                    // 청부 마감일: 매월 20일
                    const today = new Date();
                    const billingDeadline = new Date(today.getFullYear(), today.getMonth(), 20);
                    // 20일이 지났으면 다음달 20일
                    if (today.getDate() > 20) {
                        billingDeadline.setMonth(billingDeadline.getMonth() + 1);
                    }
                    const deadlineStr = `${billingDeadline.getMonth() + 1}월 ${billingDeadline.getDate()}일`;
                    document.getElementById('caregiverPayDay').textContent = deadlineStr;
                }
            } catch (error) {
                console.error('요양사 데이터 로드 실패:', error);
            }
        }

        async function loadManagerData() {
            try {
                // 센터 전체 기록 (현재 센터만)
                const centerId = currentUser.center_id || 1;
                const todayRes = await fetch(`${API_URL}/records/today/center?center_id=${centerId}`);
                if (todayRes.ok) {
                    const data = await todayRes.json();
                    document.getElementById('managerCompleted').textContent = `${data.total_records || 0}건`;
                }

                // 이용자 정보
                const resRes = await fetch(`${API_URL}/residents/`);
                if (resRes.ok) {
                    const data = await resRes.json();
                    const residents = data.residents || [];
                    document.getElementById('managerResidents').textContent = `${residents.length}명`;

                    const warning = residents.filter(r => r.health_status === 'warning').length;
                    const critical = residents.filter(r => r.health_status === 'critical').length;
                    document.getElementById('managerWarning').textContent = `${warning}명`;
                    document.getElementById('managerCritical').textContent = `${critical}명`;
                }

                // 직원 정보
                const staffRes = await fetch(`${API_URL}/users/?role=caregiver`);
                if (staffRes.ok) {
                    const data = await staffRes.json();
                    document.getElementById('managerStaffCount').textContent = `${data.total_users || 0}명`;
                }

                // 청구 정보
                const today = new Date();
                const yearMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                const billingRes = await fetch(`${API_URL}/billing/monthly/${yearMonth}`);
                if (billingRes.ok) {
                    const data = await billingRes.json();
                    document.getElementById('managerBilling').textContent = `${(data.total_amount || 0).toLocaleString()}원`;
                    document.getElementById('managerBillingSubmit').textContent = `${data.submitted_count || 0}건`;
                    document.getElementById('managerBillingPaid').textContent = `${data.paid_count || 0}건`;
                }
            } catch (error) {
                console.error('센터장 데이터 로드 실패:', error);
            }
        }
    </script>
</body>
</html>
