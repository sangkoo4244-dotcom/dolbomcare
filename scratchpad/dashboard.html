<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 700;
            color: #007AFF;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .user-role {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #FF3B30;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #E81828;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .header {
            margin-bottom: 32px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 16px;
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            border-left: 4px solid #007AFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card.blue { border-left-color: #007AFF; }
        .card.green { border-left-color: #34C759; }
        .card.orange { border-left-color: #FF9500; }
        .card.purple { border-left-color: #AF52DE; }
        .card.indigo { border-left-color: #5856D6; }
        .card.red { border-left-color: #FF3B30; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #34C759, #FFD60A, #FF9500);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .percentage {
            font-weight: 600;
            color: #333;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-emoji {
            font-size: 20px;
        }

        .card-content {
            color: #666;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .card-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-size: 13px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .stat-good { color: #34C759; }
        .stat-warning { color: #FF9500; }
        .stat-critical { color: #FF3B30; }

        .card-button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-blue {
            background: #007AFF;
            color: white;
        }

        .btn-blue:hover {
            background: #0051D5;
        }

        .btn-green {
            background: #34C759;
            color: white;
        }

        .btn-green:hover {
            background: #30B846;
        }

        .btn-purple {
            background: #AF52DE;
            color: white;
        }

        .btn-purple:hover {
            background: #9C3FD7;
        }

        .btn-indigo {
            background: #5856D6;
            color: white;
        }

        .btn-indigo:hover {
            background: #4635D1;
        }

        .btn-gray {
            background: #999;
            color: white;
        }

        .btn-gray:hover {
            background: #777;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .activity-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .activity-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .activity-list {
            list-style: none;
        }

        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 122, 255, 0.2);
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .unauthorized {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .unauthorized-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .unauthorized-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .unauthorized-subtext {
            font-size: 14px;
            color: #999;
            margin-bottom: 24px;
        }

        .btn-login {
            padding: 12px 24px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #0051D5;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header-title {
                font-size: 24px;
            }

            .navbar-content {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .navbar-user {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">돌봄케어</div>
            <div class="navbar-user">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">역할</div>
                </div>
                <button class="logout-btn" id="logoutBtn">로그아웃</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <div class="loading">
            <div class="spinner"></div>
            <p>대시보드 로딩 중...</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentUser = null;  // 글로벌 사용자 정보

        // 페이지 로드 시 토큰 확인
        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                showUnauthorized();
                return;
            }

            // 사용자 정보 표시
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent =
                user.role === 'caregiver' ? '요양사' :
                user.role === 'center_manager' ? '센터장' : '사용자';

            // 대시보드 렌더링
            renderDashboard(user);
        });

        function showUnauthorized() {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="unauthorized">
                    <div class="unauthorized-icon">🔐</div>
                    <div class="unauthorized-text">로그인이 필요합니다</div>
                    <div class="unauthorized-subtext">로그인 페이지로 이동하여 계정에 접속하세요.</div>
                    <button class="btn-login" onclick="window.location.href='./login.html'">로그인 페이지로 이동</button>
                </div>
            `;
        }

        function renderDashboard(user) {
            currentUser = user;  // 글로벌 변수 설정
            const mainContent = document.getElementById('mainContent');
            const isCaregiver = user.role === 'caregiver';

            let html = `
                <div class="header">
                    <h1 class="header-title">대시보드</h1>
                    <p class="header-subtitle">${user.full_name}님, 환영합니다!</p>
                </div>

                <div class="grid">
                    <!-- 오늘의 업무 -->
                    <div class="card blue">
                        <div class="card-title">
                            <span class="card-emoji">📋</span>
                            오늘의 업무
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">할당된 이용자</span>
                            <span class="stat-value" id="assignedResidents">-명</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">완료된 기록</span>
                            <span class="stat-value stat-good" id="completedRecords">-건</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">대기 중</span>
                            <span class="stat-value stat-warning" id="pendingRecords">-건</span>
                        </div>
                        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <div class="progress-label">
                                <span>완료율</span>
                                <span class="percentage" id="completionPercentage">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="completionProgressFill" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 음성 기록 + 청구 자동화 -->
                    <div class="card green">
                        <div class="card-title">
                            <span class="card-emoji">🎙️</span>
                            음성 기록
                            <span style="display: inline-block; background: #FF3B30; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px;">AI 청구</span>
                        </div>
                        <div class="card-content">음성 기록 → AI 요약 → 청구액 자동 계산</div>
                        <div class="card-stat">
                            <span class="stat-label">오늘 기록</span>
                            <span class="stat-value stat-good" id="todayRecordsCount">-건</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">예상 청구액</span>
                            <span class="stat-value" style="color: #FF9500;" id="todayEstimatedAmount">-원</span>
                        </div>
                        <button class="card-button btn-green" onclick="window.location.href='./voice_record.html'">+ 새 기록 시작</button>
                    </div>

                    <!-- 건강 지표 + 실시간 알림 -->
                    <div class="card orange">
                        <div class="card-title">
                            <span class="card-emoji">❤️</span>
                            건강 지표
                            <span style="display: inline-block; background: #FF3B30; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px;">실시간</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">정상</span>
                            <span class="stat-value stat-good" id="healthStable">-명</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">주의</span>
                            <span class="stat-value stat-warning" id="healthWarning">-명</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">위험</span>
                            <span class="stat-value stat-critical" id="healthCritical">-명</span>
                        </div>
                        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #f0f0f0;">
                            <div class="progress-label">
                                <span>상태 분포</span>
                            </div>
                            <div style="display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: #f0f0f0;">
                                <div id="healthDistributionStable" style="background: #34C759; transition: width 0.3s ease;"></div>
                                <div id="healthDistributionWarning" style="background: #FFD60A; transition: width 0.3s ease;"></div>
                                <div id="healthDistributionCritical" style="background: #FF3B30; transition: width 0.3s ease;"></div>
                            </div>
                        </div>
                        <div id="healthAlert" style="font-size: 12px; color: #FF9500; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0f0f0; display: none;">
                        </div>
                    </div>

                    <!-- 청구 현황 NEW -->
                    <div class="card indigo" id="billingCard">
                        <div class="card-title">
                            <span class="card-emoji">💳</span>
                            청구 현황
                            <span style="display: inline-block; background: #FF3B30; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px;">NEW</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">오늘 청구액</span>
                            <span class="stat-value stat-good" id="todayBillingAmount">-</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">이번 달 청구액</span>
                            <span class="stat-value" id="totalBillingAmount">-</span>
                        </div>
                        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #e0e0e0;">
                            <div class="progress-label">
                                <span>청부율 (한도액 대비)</span>
                                <span class="percentage" id="billingPercentage">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="billingProgressFill" style="width: 0%"></div>
                            </div>
                            <div style="font-size: 12px; color: #666; text-align: right;">
                                <span id="billingRatio">-원 / -원</span>
                            </div>
                        </div>
                        <div class="card-stat" style="margin-top: 12px;">
                            <span class="stat-label">공단 제출</span>
                            <span class="stat-value stat-good" id="submittedCount">-</span>
                        </div>
                    </div>

                    <!-- 이용자 관리 -->
                    <div class="card purple">
                        <div class="card-title">
                            <span class="card-emoji">👥</span>
                            이용자 관리
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">등록된 이용자</span>
                            <span class="stat-value" id="managedResidents">-명</span>
                        </div>
                        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.05); font-size: 12px;">
                            <div style="color: #666; margin-bottom: 8px;">최근 등록:</div>
                            <div id="recentResidentsList" style="max-height: 80px; overflow-y: auto;">
                                <div style="color: #999; font-size: 11px;">로드 중...</div>
                            </div>
                        </div>
                        <button class="card-button btn-purple" onclick="window.location.href='./resident_management.html'">이용자 관리</button>
                    </div>

                    <!-- 보고서 -->
                    <div class="card indigo">
                        <div class="card-title">
                            <span class="card-emoji">📊</span>
                            보고서
                        </div>
                        <div class="card-content">월별 통계 및 현황을 확인하세요.</div>
                        <button class="card-button btn-indigo">보고서 조회</button>
                    </div>

                    <!-- 직원 관리 NEW -->
                    <div class="card" style="border-left-color: #AF52DE;">
                        <div class="card-title">
                            <span class="card-emoji">👨‍💼</span>
                            요양사 청부 현황
                            <span style="display: inline-block; background: #FF3B30; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px;">NEW</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">등록된 요양사</span>
                            <span class="stat-value" id="staffCount">-명</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">오늘 청부액</span>
                            <span class="stat-value stat-good" id="todayStaffBilling">-원</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">이번 달 총 청부액</span>
                            <span class="stat-value" id="staffSalary">-원</span>
                        </div>
                    </div>

                    <!-- 설정 -->
                    <div class="card" style="border-left-color: #999;">
                        <div class="card-title">
                            <span class="card-emoji">⚙️</span>
                            설정
                        </div>
                        <div class="card-content">계정 설정 및 개인 정보를 관리하세요.</div>
                        <button class="card-button btn-gray">설정 열기</button>
                    </div>
                </div>

                <!-- 최근 활동 -->
                <div class="activity-section">
                    <h2 class="activity-title">📌 최근 활동</h2>
                    <ul class="activity-list">
                        <li class="activity-item">
                            <strong>${user.full_name}</strong>이 이용자 "홍길동"의 기록을 추가했습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-15 14:30</span>
                        </li>
                        <li class="activity-item">
                            건강 지표 "이순신"이 주의 상태로 변경되었습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-15 10:15</span>
                        </li>
                        <li class="activity-item">
                            센터 보고서가 생성되었습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-14 18:00</span>
                        </li>
                        <li class="activity-item">
                            시스템에 로그인했습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-14 09:00</span>
                        </li>
                    </ul>
                </div>
            `;

            mainContent.innerHTML = html;

            // 로그아웃 버튼
            document.getElementById('logoutBtn').addEventListener('click', logout);

            // 모든 동적 데이터 로드
            loadAssignedResidents();
            loadHealthMetrics();
            loadStaffData();
            loadBillingData();
            loadTodayRecordsData();
        }

        // 할당된 이용자 수 로드
        async function loadAssignedResidents() {
            try {
                const response = await fetch(`${API_URL}/residents/`);
                if (!response.ok) throw new Error('Failed to fetch residents');

                const data = await response.json();
                const count = data.total_residents || 0;
                const residents = data.residents || [];

                document.getElementById('assignedResidents').textContent = `${count}명`;
                document.getElementById('managedResidents').textContent = `${count}명`;

                // 최근 등록된 이용자 목록 (최근 3명)
                const recentResidents = residents.slice(-3).reverse();
                const residentsHtml = recentResidents.length > 0
                    ? recentResidents.map(r => `<div style="font-size: 11px; padding: 4px 0; color: #333;">• ${r.name} (${r.care_grade}등급)</div>`).join('')
                    : '<div style="color: #999; font-size: 11px;">등록된 이용자가 없습니다.</div>';

                document.getElementById('recentResidentsList').innerHTML = residentsHtml;
                console.log('✅ 할당된 이용자 로드:', count, '최근:', recentResidents.length);
            } catch (error) {
                console.error('❌ 할당된 이용자 로드 실패:', error);
            }
        }

        // 건강 지표 로드
        async function loadHealthMetrics() {
            try {
                const response = await fetch(`${API_URL}/residents/`);
                if (!response.ok) throw new Error('Failed to fetch residents');

                const data = await response.json();
                const residents = data.residents || [];

                // 건강 상태별 집계
                const stable = residents.filter(r => r.health_status === 'stable').length;
                const warning = residents.filter(r => r.health_status === 'warning').length;
                const critical = residents.filter(r => r.health_status === 'critical').length;
                const total = residents.length;

                document.getElementById('healthStable').textContent = `${stable}명`;
                document.getElementById('healthWarning').textContent = `${warning}명`;
                document.getElementById('healthCritical').textContent = `${critical}명`;

                // 상태 분포 시각화
                if (total > 0) {
                    const stablePercent = (stable / total) * 100;
                    const warningPercent = (warning / total) * 100;
                    const criticalPercent = (critical / total) * 100;

                    document.getElementById('healthDistributionStable').style.width = `${stablePercent}%`;
                    document.getElementById('healthDistributionWarning').style.width = `${warningPercent}%`;
                    document.getElementById('healthDistributionCritical').style.width = `${criticalPercent}%`;
                }

                // 경고 메시지 표시
                const alertEl = document.getElementById('healthAlert');
                if (warning > 0 || critical > 0) {
                    const warningResident = residents.find(r => r.health_status === 'warning' || r.health_status === 'critical');
                    if (warningResident) {
                        alertEl.textContent = `⚠️ ${warningResident.name}님 상태 변화 감지`;
                        alertEl.style.display = 'block';
                    }
                } else {
                    alertEl.style.display = 'none';
                }

                console.log('✅ 건강 지표 로드:', { stable, warning, critical });
            } catch (error) {
                console.error('❌ 건강 지표 로드 실패:', error);
            }
        }

        // 직원 정보 로드
        async function loadStaffData() {
            try {
                const currentDate = new Date();
                const yearMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;

                // 1. 등록된 요양사 수 조회
                const staffResponse = await fetch(`${API_URL}/users/?role=caregiver`);
                if (!staffResponse.ok) throw new Error('Failed to fetch staff');

                const staffData = await staffResponse.json();
                const staffCount = staffData.total_users || 0;

                // 2. 오늘 청부액 조회 (현재 사용자)
                let todayBilling = 0;
                const todayResponse = await fetch(`${API_URL}/records/today?caregiver_id=${currentUser.id}`);
                if (todayResponse.ok) {
                    const todayData = await todayResponse.json();
                    todayBilling = todayData.total_billing_amount || 0;
                }

                // 3. 이번 달 총 청부액 조회
                const billingResponse = await fetch(`${API_URL}/billing/monthly/${yearMonth}`);
                if (!billingResponse.ok) throw new Error('Failed to fetch billing');

                const billingData = await billingResponse.json();
                const monthlySalary = billingData.total_amount || 0;

                // UI 업데이트
                document.getElementById('staffCount').textContent = `${staffCount}명`;
                document.getElementById('todayStaffBilling').textContent = `${todayBilling.toLocaleString()}원`;
                document.getElementById('staffSalary').textContent = `${monthlySalary.toLocaleString()}원`;

                console.log('✅ 요양사 청부 현황 로드:', { staffCount, todayBilling, monthlySalary });
            } catch (error) {
                console.error('❌ 요양사 청부 현황 로드 실패:', error);
            }
        }

        // 오늘의 기록 데이터 로드 (역할별로 다름)
        async function loadTodayRecordsData() {
            try {
                let recordCount = 0;
                let billingAmount = 0;
                let assignedCount = parseInt(document.getElementById('assignedResidents').textContent) || 0;

                if (currentUser.role === 'caregiver') {
                    // 요양관리사: 자신의 오늘 기록만
                    const response = await fetch(`http://localhost:8000/api/v1/records/today?caregiver_id=${currentUser.id}`);
                    if (!response.ok) throw new Error('Failed to fetch today records');

                    const data = await response.json();
                    recordCount = data.total_records || 0;
                    billingAmount = data.total_billing_amount || 0;

                    console.log('✅ 요양관리사 오늘 기록:', { recordCount, billingAmount });
                } else if (currentUser.role === 'center_manager') {
                    // 센터장: 센터 전체의 오늘 기록
                    const response = await fetch(`http://localhost:8000/api/v1/records/today/center`);
                    if (response.ok) {
                        const data = await response.json();
                        recordCount = data.total_records || 0;
                        billingAmount = data.total_billing_amount || 0;
                        console.log('✅ 센터장 오늘 기록:', { recordCount, billingAmount });
                    } else {
                        console.warn('⚠️ 센터 전체 기록 조회 실패, 대체 방법 사용');
                    }
                }

                // UI 업데이트
                document.getElementById('completedRecords').textContent = `${recordCount}건`;
                document.getElementById('todayRecordsCount').textContent = `${recordCount}건`;
                document.getElementById('todayEstimatedAmount').textContent = `${billingAmount.toLocaleString()}원`;
                document.getElementById('pendingRecords').textContent = `${Math.max(0, assignedCount - recordCount)}건`;

                // 완료 비율 계산
                if (assignedCount > 0) {
                    const completionPercentage = Math.round((recordCount / assignedCount) * 100);
                    document.getElementById('completionPercentage').textContent = `${completionPercentage}%`;
                    document.getElementById('completionProgressFill').style.width = `${Math.min(completionPercentage, 100)}%`;
                } else {
                    document.getElementById('completionPercentage').textContent = `0%`;
                    document.getElementById('completionProgressFill').style.width = `0%`;
                }

                console.log('✅ 오늘 업무 데이터 로드 완료:', { role: currentUser.role, recordCount, assignedCount });
            } catch (error) {
                console.error('❌ 오늘 기록 로드 실패:', error);
            }
        }

        async function loadBillingData() {
            const currentDate = new Date();
            const yearMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;

            try {
                // 1️⃣ 오늘의 청구액 로드
                // 오늘 기록 API를 사용하여 현재 사용자의 청부액 조회
                let todayBillingAmount = 0;

                const todayResponse = await fetch(`http://localhost:8000/api/v1/records/today?caregiver_id=${currentUser.id}`);
                if (todayResponse.ok) {
                    const todayData = await todayResponse.json();
                    todayBillingAmount = todayData.total_billing_amount || 0;
                }

                document.getElementById('todayBillingAmount').textContent =
                    `${todayBillingAmount.toLocaleString()}원`;
                console.log('✅ 오늘 청구액 로드:', todayBillingAmount);

                // 2️⃣ 이번 달 청구액 로드
                const monthlyResponse = await fetch(`http://localhost:8000/api/v1/billing/monthly/${yearMonth}`);
                if (!monthlyResponse.ok) throw new Error('Failed to fetch billing data');

                const monthlyData = await monthlyResponse.json();
                const monthlyAmount = monthlyData.total_amount || 0;

                // UI 업데이트
                document.getElementById('totalBillingAmount').textContent =
                    `${monthlyAmount.toLocaleString()}원`;
                document.getElementById('submittedCount').textContent =
                    `${monthlyData.submitted_count}건`;

                // 3️⃣ 청부율 계산 (모든 이용자의 한도액 합산)
                const resResponse = await fetch(`http://localhost:8000/api/v1/residents/`);
                if (resResponse.ok) {
                    const resData = await resResponse.json();
                    const CARE_GRADE_LIMITS = {1: 1577500, 2: 1399500, 3: 1193000, 4: 1082500, 5: 235000};

                    // 모든 이용자의 월 한도액 합산
                    let totalMonthlyLimit = 0;
                    resData.residents?.forEach(resident => {
                        const grade = resident.care_grade || 1;
                        totalMonthlyLimit += CARE_GRADE_LIMITS[grade] || 1577500;
                    });

                    // 청부율 계산
                    const billingPercentage = totalMonthlyLimit > 0
                        ? Math.round((monthlyAmount / totalMonthlyLimit) * 100)
                        : 0;

                    // UI 업데이트
                    document.getElementById('billingPercentage').textContent = `${billingPercentage}%`;
                    document.getElementById('billingProgressFill').style.width = `${Math.min(billingPercentage, 100)}%`;
                    document.getElementById('billingRatio').textContent =
                        `${monthlyAmount.toLocaleString()}원 / ${totalMonthlyLimit.toLocaleString()}원`;

                    console.log('✅ 청부율 계산 완료:', {billingPercentage, monthlyAmount, totalMonthlyLimit});
                }

                console.log('✅ 청구 현황 로드 완료:', monthlyData);
            } catch (error) {
                console.error('❌ 청구 현황 로드 실패:', error);
                // 실패해도 페이지는 계속 표시 (기본값 유지)
            }
        }

        function logout() {
            if (confirm('정말 로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                localStorage.removeItem('user_role');
                window.location.href = './login.html';
            }
        }
    </script>
