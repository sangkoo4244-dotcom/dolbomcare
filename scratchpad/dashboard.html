<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 700;
            color: #007AFF;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .user-role {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #FF3B30;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #E81828;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .header {
            margin-bottom: 32px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 16px;
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            border-left: 4px solid #007AFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card.blue { border-left-color: #007AFF; }
        .card.green { border-left-color: #34C759; }
        .card.orange { border-left-color: #FF9500; }
        .card.purple { border-left-color: #AF52DE; }
        .card.indigo { border-left-color: #5856D6; }
        .card.red { border-left-color: #FF3B30; }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-emoji {
            font-size: 20px;
        }

        .card-content {
            color: #666;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .card-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-size: 13px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .stat-good { color: #34C759; }
        .stat-warning { color: #FF9500; }
        .stat-critical { color: #FF3B30; }

        .card-button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-blue {
            background: #007AFF;
            color: white;
        }

        .btn-blue:hover {
            background: #0051D5;
        }

        .btn-green {
            background: #34C759;
            color: white;
        }

        .btn-green:hover {
            background: #30B846;
        }

        .btn-purple {
            background: #AF52DE;
            color: white;
        }

        .btn-purple:hover {
            background: #9C3FD7;
        }

        .btn-indigo {
            background: #5856D6;
            color: white;
        }

        .btn-indigo:hover {
            background: #4635D1;
        }

        .btn-gray {
            background: #999;
            color: white;
        }

        .btn-gray:hover {
            background: #777;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .activity-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .activity-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .activity-list {
            list-style: none;
        }

        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 122, 255, 0.2);
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .unauthorized {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .unauthorized-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .unauthorized-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .unauthorized-subtext {
            font-size: 14px;
            color: #999;
            margin-bottom: 24px;
        }

        .btn-login {
            padding: 12px 24px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #0051D5;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header-title {
                font-size: 24px;
            }

            .navbar-content {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .navbar-user {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">돌봄케어</div>
            <div class="navbar-user">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">역할</div>
                </div>
                <button class="logout-btn" id="logoutBtn">로그아웃</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <div class="loading">
            <div class="spinner"></div>
            <p>대시보드 로딩 중...</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';

        // 페이지 로드 시 토큰 확인
        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                showUnauthorized();
                return;
            }

            // 사용자 정보 표시
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent =
                user.role === 'caregiver' ? '요양사' :
                user.role === 'center_manager' ? '센터장' : '사용자';

            // 대시보드 렌더링
            renderDashboard(user);
        });

        function showUnauthorized() {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="unauthorized">
                    <div class="unauthorized-icon">🔐</div>
                    <div class="unauthorized-text">로그인이 필요합니다</div>
                    <div class="unauthorized-subtext">로그인 페이지로 이동하여 계정에 접속하세요.</div>
                    <button class="btn-login" onclick="window.location.href='./login.html'">로그인 페이지로 이동</button>
                </div>
            `;
        }

        function renderDashboard(user) {
            const mainContent = document.getElementById('mainContent');
            const isCaregiver = user.role === 'caregiver';

            let html = `
                <div class="header">
                    <h1 class="header-title">대시보드</h1>
                    <p class="header-subtitle">${user.full_name}님, 환영합니다!</p>
                </div>

                <div class="grid">
                    <!-- 오늘의 업무 -->
                    <div class="card blue">
                        <div class="card-title">
                            <span class="card-emoji">📋</span>
                            오늘의 업무
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">할당된 이용자</span>
                            <span class="stat-value">3명</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">완료된 기록</span>
                            <span class="stat-value stat-good">2건</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">대기 중</span>
                            <span class="stat-value stat-warning">1건</span>
                        </div>
                    </div>

                    <!-- 음성 기록 -->
                    <div class="card green">
                        <div class="card-title">
                            <span class="card-emoji">🎙️</span>
                            음성 기록
                        </div>
                        <div class="card-content">이용자의 일일 상태를 음성으로 기록하세요.</div>
                        <button class="card-button btn-green">+ 새 기록 시작</button>
                    </div>

                    <!-- 건강 지표 -->
                    <div class="card orange">
                        <div class="card-title">
                            <span class="card-emoji">❤️</span>
                            건강 지표
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">정상</span>
                            <span class="stat-value stat-good">8명</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">주의</span>
                            <span class="stat-value stat-warning">2명</span>
                        </div>
                        <div class="card-stat">
                            <span class="stat-label">위험</span>
                            <span class="stat-value stat-critical">0명</span>
                        </div>
                    </div>

                    <!-- 이용자 관리 -->
                    <div class="card purple">
                        <div class="card-title">
                            <span class="card-emoji">👥</span>
                            이용자 관리
                        </div>
                        <div class="card-content">센터 내 이용자를 관리하세요.</div>
                        <button class="card-button btn-purple">이용자 관리</button>
                    </div>

                    <!-- 보고서 -->
                    <div class="card indigo">
                        <div class="card-title">
                            <span class="card-emoji">📊</span>
                            보고서
                        </div>
                        <div class="card-content">월별 통계 및 현황을 확인하세요.</div>
                        <button class="card-button btn-indigo">보고서 조회</button>
                    </div>

                    <!-- 설정 -->
                    <div class="card" style="border-left-color: #999;">
                        <div class="card-title">
                            <span class="card-emoji">⚙️</span>
                            설정
                        </div>
                        <div class="card-content">계정 설정 및 개인 정보를 관리하세요.</div>
                        <button class="card-button btn-gray">설정 열기</button>
                    </div>
                </div>

                <!-- 최근 활동 -->
                <div class="activity-section">
                    <h2 class="activity-title">📌 최근 활동</h2>
                    <ul class="activity-list">
                        <li class="activity-item">
                            <strong>${user.full_name}</strong>이 이용자 "홍길동"의 기록을 추가했습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-15 14:30</span>
                        </li>
                        <li class="activity-item">
                            건강 지표 "이순신"이 주의 상태로 변경되었습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-15 10:15</span>
                        </li>
                        <li class="activity-item">
                            센터 보고서가 생성되었습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-14 18:00</span>
                        </li>
                        <li class="activity-item">
                            시스템에 로그인했습니다.
                            <br><span style="color: #999; font-size: 12px;">2024-01-14 09:00</span>
                        </li>
                    </ul>
                </div>
            `;

            mainContent.innerHTML = html;

            // 로그아웃 버튼
            document.getElementById('logoutBtn').addEventListener('click', logout);
        }

        function logout() {
            if (confirm('정말 로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                localStorage.removeItem('user_role');
                window.location.href = './login.html';
            }
        }
    </script>
</body>
</html>
