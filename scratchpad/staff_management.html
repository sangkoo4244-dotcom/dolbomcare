<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 직원 관리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        main {
            padding: 20px;
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* 직원 그리드 */
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .staff-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8e8e8;
            transition: all 0.2s ease;
        }

        .staff-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .staff-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }

        .staff-name {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
        }

        .staff-position {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
            margin-top: 4px;
        }

        .staff-status-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .staff-status-badge.inactive {
            background: #ffebee;
            color: #c62828;
        }

        .staff-status-badge.leave {
            background: #fff3e0;
            color: #e65100;
        }

        .staff-info {
            margin-bottom: 16px;
        }

        .staff-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid #f5f5f5;
        }

        .staff-info-row:last-child {
            border-bottom: none;
        }

        .staff-label {
            color: #999;
            font-weight: 500;
        }

        .staff-value {
            color: #333;
            font-weight: 600;
            text-align: right;
        }

        .staff-actions {
            display: flex;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-sm {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background: #667eea;
            color: white;
        }

        .btn-edit:hover {
            background: #5568d3;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete:hover {
            background: #ee5a52;
        }

        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            main {
                margin-left: 0;
                width: 100%;
                padding: 12px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .staff-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="./navbar.js"></script>
</head>
<body>
    <main>
        <div class="page-header">
            <div>
                <h1 class="page-title">👥 직원 관리</h1>
                <p class="page-subtitle">센터의 요양사 직원을 관리하세요</p>
            </div>
            <button class="btn btn-primary" id="addStaffBtn">+ 직원 추가</button>
        </div>

        <div id="staffList" class="loading">
            <div class="spinner"></div>
            <p>로드 중...</p>
        </div>
    </main>

    <!-- 직원 추가/수정 모달 -->
    <div id="staffModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header" id="modalTitle">직원 추가</div>
            <form id="staffForm" onsubmit="submitStaff(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">이름 *</label>
                        <input type="text" id="staffName" class="form-input" placeholder="직원 이름" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">직급</label>
                        <input type="text" id="staffPosition" class="form-input" placeholder="예: 요양사, 팀장">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">이메일 *</label>
                        <input type="email" id="staffEmail" class="form-input" placeholder="example@dolbomcare.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">전화번호</label>
                        <input type="tel" id="staffPhone" class="form-input" placeholder="010-0000-0000">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">긴급연락처</label>
                        <input type="tel" id="staffEmergency" class="form-input" placeholder="010-0000-0000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">고용 시작일</label>
                        <input type="date" id="staffHireDate" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">근무 상태</label>
                    <select id="staffStatus" class="form-select">
                        <option value="active">근무 중</option>
                        <option value="inactive">비활성</option>
                        <option value="leave">휴직</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-sm" style="background: #e9ecef; color: #2c3e50; border: none; cursor: pointer; padding: 8px 16px;" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-sm btn-primary" style="border: none; cursor: pointer; padding: 8px 16px;">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        let currentUser = null;
        let editingStaffId = null;
        let staffListData = [];

        window.addEventListener('load', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!user.id || user.role !== 'center_manager') {
                alert('센터장만 접근 가능합니다');
                window.location.href = './dashboard.html';
                return;
            }

            currentUser = user;
            loadStaffList();
            document.getElementById('addStaffBtn').addEventListener('click', openAddModal);
        });

        async function loadStaffList() {
            try {
                const centerId = currentUser.center_id || 1;
                const response = await fetch(`${API_URL}/users/?role=caregiver&center_id=${centerId}`);

                if (!response.ok) throw new Error('Failed to load staff');

                const data = await response.json();
                staffListData = data.users || [];

                if (staffListData.length === 0) {
                    document.getElementById('staffList').innerHTML =
                        '<div class="empty-message">등록된 직원이 없습니다</div>';
                    return;
                }

                let html = '<div class="staff-grid">';

                staffListData.forEach(staff => {
                    const statusText = {
                        'active': '근무',
                        'inactive': '비활성',
                        'leave': '휴직'
                    }[staff.employment_status] || '근무';

                    const statusClass = staff.employment_status === 'active' ? '' : staff.employment_status;
                    const hireDate = staff.hire_date ? new Date(staff.hire_date).toLocaleDateString('ko-KR') : '-';

                    html += `
                        <div class="staff-card">
                            <div class="staff-header">
                                <div>
                                    <div class="staff-name">${staff.full_name || '(이름 없음)'}</div>
                                    <div class="staff-position">${staff.position || '요양사'}</div>
                                </div>
                                <div class="staff-status-badge ${statusClass}">${statusText}</div>
                            </div>

                            <div class="staff-info">
                                <div class="staff-info-row">
                                    <span class="staff-label">📧 이메일</span>
                                    <span class="staff-value">${staff.email || '-'}</span>
                                </div>
                                <div class="staff-info-row">
                                    <span class="staff-label">📱 전화</span>
                                    <span class="staff-value">${staff.phone || '-'}</span>
                                </div>
                                <div class="staff-info-row">
                                    <span class="staff-label">🆘 긴급</span>
                                    <span class="staff-value">${staff.emergency_contact || '-'}</span>
                                </div>
                                <div class="staff-info-row">
                                    <span class="staff-label">📅 고용일</span>
                                    <span class="staff-value">${hireDate}</span>
                                </div>
                            </div>

                            <div class="staff-actions">
                                <button class="btn-sm btn-edit" onclick="editStaff(${staff.id})">수정</button>
                                <button class="btn-sm btn-delete" onclick="deleteStaff(${staff.id})">삭제</button>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
                document.getElementById('staffList').innerHTML = html;
                console.log('✅ 직원 목록 로드 완료:', staffListData);
            } catch (error) {
                console.error('❌ 직원 로드 실패:', error);
                document.getElementById('staffList').innerHTML =
                    '<div class="empty-message" style="color: #d32f2f;">직원 정보를 불러올 수 없습니다</div>';
            }
        }

        function openAddModal() {
            editingStaffId = null;
            document.getElementById('modalTitle').textContent = '직원 추가';
            document.getElementById('staffForm').reset();
            document.getElementById('staffStatus').value = 'active';
            document.getElementById('staffModal').classList.add('active');
        }

        function editStaff(staffId) {
            const staff = staffListData.find(s => s.id === staffId);
            if (!staff) return;

            editingStaffId = staffId;
            document.getElementById('modalTitle').textContent = '직원 정보 수정';
            document.getElementById('staffName').value = staff.full_name || '';
            document.getElementById('staffEmail').value = staff.email || '';
            document.getElementById('staffPhone').value = staff.phone || '';
            document.getElementById('staffPosition').value = staff.position || '';
            document.getElementById('staffEmergency').value = staff.emergency_contact || '';
            document.getElementById('staffHireDate').value = staff.hire_date || '';
            document.getElementById('staffStatus').value = staff.employment_status || 'active';
            document.getElementById('staffModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('staffModal').classList.remove('active');
            document.getElementById('staffForm').reset();
            editingStaffId = null;
        }

        async function submitStaff(event) {
            event.preventDefault();

            const staffData = {
                full_name: document.getElementById('staffName').value.trim(),
                email: document.getElementById('staffEmail').value.trim(),
                phone: document.getElementById('staffPhone').value.trim(),
                position: document.getElementById('staffPosition').value.trim(),
                emergency_contact: document.getElementById('staffEmergency').value.trim(),
                hire_date: document.getElementById('staffHireDate').value,
                employment_status: document.getElementById('staffStatus').value
            };

            if (!staffData.full_name || !staffData.email) {
                alert('이름과 이메일은 필수입니다');
                return;
            }

            try {
                const centerId = currentUser.center_id || 1;

                if (editingStaffId) {
                    // 수정
                    const response = await fetch(`${API_URL}/users/${editingStaffId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                        },
                        body: JSON.stringify(staffData)
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Failed to update staff');
                    }
                    alert('직원 정보가 수정되었습니다');
                } else {
                    // 추가
                    const response = await fetch(`${API_URL}/users/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                        },
                        body: JSON.stringify({
                            ...staffData,
                            password: 'password123',
                            role: 'caregiver',
                            center_id: centerId
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Failed to add staff');
                    }
                    alert('직원이 추가되었습니다');
                }

                closeModal();
                loadStaffList();
            } catch (error) {
                console.error('❌ 직원 저장 실패:', error);
                alert('직원 저장에 실패했습니다: ' + error.message);
            }
        }

        async function deleteStaff(staffId) {
            if (!confirm('이 직원을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;

            try {
                const response = await fetch(`${API_URL}/users/${staffId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to delete staff');
                alert('직원이 삭제되었습니다');
                loadStaffList();
            } catch (error) {
                console.error('❌ 직원 삭제 실패:', error);
                alert('직원 삭제에 실패했습니다');
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target === document.getElementById('staffModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
