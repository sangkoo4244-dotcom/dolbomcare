<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 청구 조회</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
        }

        main {
            flex: 1;
            padding: 20px;
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
        }

        /* 카드 스타일 */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8e8e8;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 현재 월 급여 카드 */
        .salary-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .salary-stat {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-subtext {
            font-size: 12px;
            opacity: 0.8;
        }

        /* 월별 내역 테이블 */
        .salary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            table-layout: auto;
        }

        .salary-table thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        .salary-table th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            white-space: nowrap;
            border-right: 1px solid #eee;
        }

        .salary-table th:last-child {
            border-right: none;
        }

        .salary-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            border-right: 1px solid #eee;
            font-size: 14px;
            text-align: left;
        }

        .salary-table td:last-child {
            border-right: none;
        }

        .salary-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-paid {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        /* 버튼 스타일 */
        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        /* 로딩 상태 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            main {
                margin-left: 0;
                width: 100%;
                padding: 12px;
            }

            .salary-summary {
                grid-template-columns: 1fr;
            }

            .salary-table {
                font-size: 12px;
            }

            .salary-table th,
            .salary-table td {
                padding: 8px;
            }
        }
    </style>
    <script src="./navbar.js"></script>
</head>
<body>
    <main>
        <div class="page-header">
            <h1 class="page-title">💳 청구 조회</h1>
            <p class="page-subtitle">월별 청구액 내역을 조회하고 관리하세요</p>
        </div>

        <!-- 현재 월 급여 -->
        <div id="currentSalaryContainer" class="loading">
            <div class="spinner"></div>
            <p>로드 중...</p>
        </div>

        <!-- 월별 급여 내역 -->
        <div class="card">
            <div class="card-title">📅 월별 청구액 내역</div>
            <div id="salaryHistoryContainer" class="loading">
                <div class="spinner"></div>
                <p>로드 중...</p>
            </div>
        </div>

        <!-- 근로계약서 -->
        <div class="card">
            <div class="card-title">📄 근로계약서</div>
            <div id="contractContainer"></div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';

        async function loadCurrentSalary() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) {
                    window.location.href = './login.html';
                    return;
                }

                const response = await fetch(`${API_URL}/salary/current?caregiver_id=${user.id}`);
                if (!response.ok) throw new Error('Failed to fetch current salary');

                const data = await response.json();

                const html = `
                    <div class="salary-summary">
                        <div class="salary-stat">
                            <div class="stat-label">이번 달 급여</div>
                            <div class="stat-value">${(data.total_amount || 0).toLocaleString()}원</div>
                            <div class="stat-subtext">${data.total_records}건 기록</div>
                        </div>
                        <div class="salary-stat" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <div class="stat-label">예상 지급일</div>
                            <div class="stat-value" style="font-size: 20px;">${formatDate(data.estimated_payment_date)}</div>
                            <div class="stat-subtext">${data.status === 'paid' ? '지급 완료' : '지급 예정'}</div>
                        </div>
                    </div>
                `;

                document.getElementById('currentSalaryContainer').innerHTML = html;
                console.log('✅ 현재 급여 로드 완료:', data);
            } catch (error) {
                console.error('❌ 현재 급여 로드 실패:', error);
                document.getElementById('currentSalaryContainer').innerHTML =
                    '<p style="color: #d32f2f;">급여 정보를 불러올 수 없습니다.</p>';
            }
        }

        async function loadSalaryHistory() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) {
                    window.location.href = './login.html';
                    return;
                }

                const response = await fetch(`${API_URL}/salary/history?caregiver_id=${user.id}&months=12`);
                if (!response.ok) throw new Error('Failed to fetch salary history');

                const data = await response.json();

                if (!data.salary_history || data.salary_history.length === 0) {
                    document.getElementById('salaryHistoryContainer').innerHTML =
                        '<p style="text-align: center; color: #666; padding: 20px;">급여 기록이 없습니다.</p>';
                    return;
                }

                const tableHtml = `
                    <table class="salary-table">
                        <thead>
                            <tr>
                                <th>년월</th>
                                <th>기록 건수</th>
                                <th>청구액</th>
                                <th>상태</th>
                                <th>상세 보기</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.salary_history.map(record => `
                                <tr>
                                    <td><strong>${record.year_month}</strong></td>
                                    <td>${record.record_count}건</td>
                                    <td style="text-align: right; color: #667eea; font-weight: 600;">
                                        ${(record.total_amount || 0).toLocaleString()}원
                                    </td>
                                    <td>
                                        <span class="status-badge ${record.status === 'paid' ? 'status-paid' : 'status-pending'}">
                                            ${record.status === 'paid' ? '지급 완료' : '지급 예정'}
                                        </span>
                                    </td>
                                    <td>
                                        <button class="btn btn-secondary" onclick="viewMonthlyDetail('${record.year_month}')">
                                            상세보기
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                document.getElementById('salaryHistoryContainer').innerHTML = tableHtml;
                console.log('✅ 급여 내역 로드 완료:', data);
            } catch (error) {
                console.error('❌ 급여 내역 로드 실패:', error);
                document.getElementById('salaryHistoryContainer').innerHTML =
                    '<p style="color: #d32f2f;">급여 내역을 불러올 수 없습니다.</p>';
            }
        }

        async function loadContract() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) return;

                const response = await fetch(`${API_URL}/salary/contract?caregiver_id=${user.id}`);
                if (!response.ok) throw new Error('Failed to fetch contract');

                const data = await response.json();

                const html = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <p style="font-size: 12px; color: #666; margin-bottom: 4px;">근로자명</p>
                            <p style="font-size: 16px; font-weight: 600;">${data.name}</p>
                        </div>
                        <div>
                            <p style="font-size: 12px; color: #666; margin-bottom: 4px;">계약 상태</p>
                            <p style="font-size: 16px; font-weight: 600; color: #34C759;">${data.contract_status === 'active' ? '활성' : '비활성'}</p>
                        </div>
                        <div>
                            <p style="font-size: 12px; color: #666; margin-bottom: 4px;">근로 형태</p>
                            <p style="font-size: 14px;">${data.work_type}</p>
                        </div>
                        <div>
                            <p style="font-size: 12px; color: #666; margin-bottom: 4px;">근무지</p>
                            <p style="font-size: 14px;">${data.work_location}</p>
                        </div>
                    </div>
                    <p style="font-size: 12px; color: #999; padding: 12px; background: #f9f9f9; border-radius: 8px;">
                        📌 ${data.notes}
                    </p>
                    <div style="margin-top: 20px; display: flex; gap: 12px;">
                        <button class="btn btn-primary" onclick="downloadContract()">
                            📥 계약서 다운로드
                        </button>
                        <button class="btn btn-secondary" onclick="alert('센터에 문의하세요.')">
                            ❓ 계약 관련 문의
                        </button>
                    </div>
                `;

                document.getElementById('contractContainer').innerHTML = html;
                console.log('✅ 근로계약서 로드 완료:', data);
            } catch (error) {
                console.error('❌ 근로계약서 로드 실패:', error);
            }
        }

        async function viewMonthlyDetail(yearMonth) {
            alert(`${yearMonth} 월 상세 내역 페이지 (준비 중)`);
        }

        function downloadContract() {
            alert('근로계약서 다운로드 준비 중입니다. 센터에 문의하세요.');
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString + 'T00:00:00');
            return `${date.getMonth() + 1}월 ${date.getDate()}일`;
        }

        // 페이지 로드 시 데이터 불러오기
        document.addEventListener('DOMContentLoaded', () => {
            loadCurrentSalary();
            loadSalaryHistory();
            loadContract();
        });
    </script>
</body>
</html>
