<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
        }

        .dashboard-wrapper {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        /* ==================== 사이드바 ==================== */
        .sidebar {
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            padding: 24px 0;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 280px;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 0 24px 32px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo {
            font-size: 32px;
        }

        .sidebar-brand {
            flex: 1;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            opacity: 0.7;
        }

        .sidebar-nav {
            padding: 0;
        }

        .nav-group {
            margin-bottom: 24px;
            padding: 0 16px;
        }

        .nav-group-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            padding: 0 12px 12px 12px;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(16, 185, 129, 0.2);
            border-left-color: #10b981;
            color: #10b981;
        }

        .nav-item.hidden {
            display: none;
        }

        .nav-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ==================== 메인 컨텐츠 ==================== */
        .main-layout {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
        }

        /* 탑바 */
        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 24px;
            flex: 1;
        }

        .topbar-title h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a202c;
        }

        .user-role {
            font-size: 12px;
            color: #6b7280;
        }

        .logout-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            border-color: #10b981;
            color: #10b981;
            background: #f0fdf4;
        }

        /* 컨텐츠 영역 */
        .content {
            flex: 1;
            padding: 32px;
            background: #f5f7fa;
            overflow-y: auto;
        }

        /* ==================== 통계 카드 ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.12);
            border-color: #10b981;
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-icon {
            font-size: 24px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 8px;
        }

        .stat-subtitle {
            font-size: 13px;
            color: #9ca3af;
        }

        .stat-trend {
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f3f4f6;
            color: #10b981;
        }

        .stat-trend.negative {
            color: #ef4444;
        }

        /* ==================== 섹션 ==================== */
        .dashboard-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e7eb;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a202c;
        }

        .section-action {
            padding: 8px 16px;
            background: #f0fdf4;
            border: 1px solid #d1fae5;
            border-radius: 8px;
            color: #10b981;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .section-action:hover {
            background: #d1fae5;
            color: #059669;
        }

        /* 리스트 */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 16px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 10px;
            align-items: center;
            transition: all 0.3s;
        }

        .item-row:hover {
            background: #f0fdf4;
            border-left: 3px solid #10b981;
            padding-left: 13px;
        }

        .item-info strong {
            display: block;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .item-info {
            font-size: 13px;
            color: #6b7280;
        }

        .item-amount {
            text-align: right;
            font-weight: 700;
            color: #10b981;
            font-size: 14px;
        }

        .item-status {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .item-status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .item-status.approved {
            background: #d1fae5;
            color: #065f46;
        }

        .item-status.completed {
            background: #dbeafe;
            color: #1e40af;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* 버튼 그룹 */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .btn-large {
            padding: 16px 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .dashboard-wrapper {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                transform: translateX(-100%);
                transition: transform 0.3s;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-layout {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .topbar {
                padding: 16px 20px;
            }

            .content {
                padding: 20px;
            }
        }

        @media (max-width: 640px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .topbar-title h1 {
                font-size: 22px;
            }

            .stat-value {
                font-size: 24px;
            }

            .item-row {
                grid-template-columns: 1fr;
            }

            .item-amount,
            .item-status {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-brand">
                <div class="sidebar-title">돌봄케어</div>
                <div class="sidebar-subtitle">Care Management</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <!-- 네비게이션 동적 생성 -->
            <div id="navContent"></div>
        </nav>
    </aside>

    <!-- 메인 레이아웃 -->
    <div class="main-layout">
        <!-- 탑바 -->
        <div class="topbar">
            <div class="topbar-left">
                <div class="topbar-title">
                    <h1 id="pageTitle">대시보드</h1>
                </div>
            </div>
            <div class="topbar-right">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">역할</div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- 컨텐츠 -->
        <div class="content" id="dashboardContent">
            <!-- 동적 생성 -->
        </div>
    </div>

    <script>
        let currentUser = null;

        // 인증 확인 및 초기화
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            initializeDashboard();
            return true;
        }

        // 대시보드 초기화
        function initializeDashboard() {
            // 사용자 정보 표시
            document.getElementById('userName').textContent = currentUser.full_name || '사용자';
            document.getElementById('userRole').textContent = currentUser.role === 'caregiver' ? '요양사' : '센터장';

            // 네비게이션 생성
            renderNavigation();

            // 대시보드 콘텐츠 생성
            if (currentUser.role === 'caregiver') {
                renderCaregiverDashboard();
            } else {
                renderManagerDashboard();
            }
        }

        // 네비게이션 렌더링
        function renderNavigation() {
            const navContent = document.getElementById('navContent');

            if (currentUser.role === 'caregiver') {
                navContent.innerHTML = `
                    <div class="nav-group">
                        <div class="nav-group-label">주요</div>
                        <a class="nav-item active" href="./dashboard.html">
                            <span class="nav-icon">📊</span>
                            <span>대시보드</span>
                        </a>
                        <a class="nav-item" href="./voice_record.html">
                            <span class="nav-icon">🎤</span>
                            <span>음성 기록</span>
                        </a>
                    </div>
                    <div class="nav-group">
                        <div class="nav-group-label">관리</div>
                        <a class="nav-item" href="./caregiver_billing.html">
                            <span class="nav-icon">📋</span>
                            <span>나의 청부</span>
                        </a>
                        <a class="nav-item" href="./my_salary.html">
                            <span class="nav-icon">💵</span>
                            <span>나의 급여</span>
                        </a>
                        <a class="nav-item" href="./my_schedule.html">
                            <span class="nav-icon">📅</span>
                            <span>나의 일정</span>
                        </a>
                    </div>
                `;
            } else {
                navContent.innerHTML = `
                    <div class="nav-group">
                        <div class="nav-group-label">주요</div>
                        <a class="nav-item active" href="./dashboard.html">
                            <span class="nav-icon">📊</span>
                            <span>대시보드</span>
                        </a>
                    </div>
                    <div class="nav-group">
                        <div class="nav-group-label">관리</div>
                        <a class="nav-item" href="./resident_management.html">
                            <span class="nav-icon">👥</span>
                            <span>이용자 관리</span>
                        </a>
                        <a class="nav-item" href="./billing_management.html">
                            <span class="nav-icon">💰</span>
                            <span>청부 관리</span>
                        </a>
                        <a class="nav-item" href="./staff_management.html">
                            <span class="nav-icon">👔</span>
                            <span>직원 관리</span>
                        </a>
                    </div>
                    <div class="nav-group">
                        <div class="nav-group-label">정산 & 분석</div>
                        <a class="nav-item" href="./monthly_settlement.html">
                            <span class="nav-icon">📈</span>
                            <span>월별 정산</span>
                        </a>
                        <a class="nav-item" href="./profit_analysis.html">
                            <span class="nav-icon">📊</span>
                            <span>수익 분석</span>
                        </a>
                    </div>
                `;
            }
        }

        // 요양사 대시보드
        function renderCaregiverDashboard() {
            const content = document.getElementById('dashboardContent');

            content.innerHTML = `
                <!-- 통계 카드 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">오늘 기록</div>
                            <div class="stat-icon">📝</div>
                        </div>
                        <div class="stat-value" id="todayRecords">0</div>
                        <div class="stat-subtitle">건의 음성 기록</div>
                        <div class="stat-trend">↑ 5% 증가</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">이번달 청부</div>
                            <div class="stat-icon">💰</div>
                        </div>
                        <div class="stat-value" id="monthlyBilling">₩0</div>
                        <div class="stat-subtitle">예상 청부액</div>
                        <div class="stat-trend">목표까지 40%</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">대기 청부</div>
                            <div class="stat-icon">⏳</div>
                        </div>
                        <div class="stat-value" id="pendingBilling">0</div>
                        <div class="stat-subtitle">승인 대기 중</div>
                        <div class="stat-trend">빠른 승인 예정</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">담당 이용자</div>
                            <div class="stat-icon">👥</div>
                        </div>
                        <div class="stat-value" id="residentCount">0</div>
                        <div class="stat-subtitle">명의 이용자</div>
                        <div class="stat-trend">모두 건강함</div>
                    </div>
                </div>

                <!-- 최근 기록 -->
                <div class="dashboard-section">
                    <div class="section-header">
                        <div class="section-title">최근 기록</div>
                        <a href="./voice_record.html" class="section-action">모두 보기</a>
                    </div>
                    <div class="item-list" id="recentRecords">
                        <div class="empty-state">
                            <div class="empty-state-icon">🎤</div>
                            <p>아직 기록이 없습니다</p>
                        </div>
                    </div>
                </div>

                <!-- 빠른 액션 -->
                <div class="action-buttons">
                    <a href="./voice_record.html" class="btn-large">
                        <span>🎤</span>
                        <span>새 기록 추가</span>
                    </a>
                    <a href="./caregiver_billing.html" class="btn-large" style="background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">
                        <span>📋</span>
                        <span>나의 청부 보기</span>
                    </a>
                </div>
            `;

            // 데이터 로드
            loadCaregiverData();
        }

        // 센터장 대시보드
        function renderManagerDashboard() {
            const content = document.getElementById('dashboardContent');

            content.innerHTML = `
                <!-- 통계 카드 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">요양사</div>
                            <div class="stat-icon">👥</div>
                        </div>
                        <div class="stat-value" id="staffCount">0</div>
                        <div class="stat-subtitle">명 관리 중</div>
                        <div class="stat-trend">모두 활성</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">이용자</div>
                            <div class="stat-icon">🏥</div>
                        </div>
                        <div class="stat-value" id="residentCountM">0</div>
                        <div class="stat-subtitle">명 등록</div>
                        <div class="stat-trend">건강 상태 양호</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">이번달 수익</div>
                            <div class="stat-icon">💵</div>
                        </div>
                        <div class="stat-value" id="monthlyRevenue">₩0</div>
                        <div class="stat-subtitle">확정 청부액</div>
                        <div class="stat-trend">↑ 15% 증가</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-header">
                            <div class="stat-label">승인 대기</div>
                            <div class="stat-icon">⏳</div>
                        </div>
                        <div class="stat-value" id="pendingApprovals">0</div>
                        <div class="stat-subtitle">건 검토 필요</div>
                        <div class="stat-trend negative">긴급</div>
                    </div>
                </div>

                <!-- 승인 대기 청부 -->
                <div class="dashboard-section">
                    <div class="section-header">
                        <div class="section-title">승인 대기 청부</div>
                        <a href="./billing_management.html" class="section-action">모두 보기</a>
                    </div>
                    <div class="item-list" id="pendingBillings">
                        <div class="empty-state">
                            <div class="empty-state-icon">✅</div>
                            <p>승인 대기 청부가 없습니다</p>

                    </div>
                </div>

                <!-- 요양사 활동 -->
                <div class="dashboard-section">
                    <div class="section-header">
                        <div class="section-title">요양사 월간 실적</div>
                        <a href="./monthly_settlement.html" class="section-action">상세 보기</a>
                    </div>
                    <div class="item-list" id="staffPerformance">
                        <div class="empty-state">
                            <div class="empty-state-icon">📊</div>
                            <p>아직 기록이 없습니다</p>
                        </div>
                    </div>
                </div>

                <!-- 빠른 액션 -->
                <div class="action-buttons">
                    <a href="./billing_management.html" class="btn-large">
                        <span>✅</span>
                        <span>청부 승인하기</span>
                    </a>
                    <a href="./resident_management.html" class="btn-large" style="background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);">
                        <span>👥</span>
                        <span>이용자 관리</span>
                    </a>
                    <a href="./monthly_settlement.html" class="btn-large" style="background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);">
                        <span>📈</span>
                        <span>월별 정산</span>
                    </a>
                </div>
            `;

            // 데이터 로드
            loadManagerData();
        }
