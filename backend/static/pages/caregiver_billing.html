<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 나의 청부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">나의 청부</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500" id="userRole">역할</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="message" class="hidden mb-6 p-4 rounded-lg animate-in fade-in slide-in-from-top-2"></div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">이번 달 요약</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-lg border border-blue-200">
                            <div class="text-sm text-blue-600 font-bold mb-2">작성중</div>
                            <div class="text-3xl font-bold text-blue-900" id="draftCount">0</div>
                            <div class="text-xs text-blue-500 mt-2">₩<span id="draftAmount">0</span></div>
                        </div>
                        <div class="bg-gradient-to-br from-amber-50 to-amber-100 p-6 rounded-lg border border-amber-200">
                            <div class="text-sm text-amber-600 font-bold mb-2">검토중</div>
                            <div class="text-3xl font-bold text-amber-900" id="pendingCount">0</div>
                            <div class="text-xs text-amber-500 mt-2">₩<span id="pendingAmount">0</span></div>
                        </div>
                        <div class="bg-gradient-to-br from-emerald-50 to-emerald-100 p-6 rounded-lg border border-emerald-200">
                            <div class="text-sm text-emerald-600 font-bold mb-2">승인완료</div>
                            <div class="text-3xl font-bold text-emerald-900" id="approvedCount">0</div>
                            <div class="text-xs text-emerald-500 mt-2">₩<span id="approvedAmount">0</span></div>
                        </div>
                        <div class="bg-gradient-to-br from-red-50 to-red-100 p-6 rounded-lg border border-red-200">
                            <div class="text-sm text-red-600 font-bold mb-2">보완 요청</div>
                            <div class="text-3xl font-bold text-red-900" id="rejectedCount">0</div>
                            <div class="text-xs text-red-500 mt-2">₩<span id="rejectedAmount">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="flex gap-3 mb-8 bg-white p-3 rounded-lg border border-gray-200">
                    <button class="filter-btn flex-1 py-2 px-4 rounded-md font-semibold text-sm bg-emerald-500 text-white" data-filter="all" onclick="filterBilling(event)">📋 전체</button>
                    <button class="filter-btn flex-1 py-2 px-4 rounded-md font-semibold text-sm hover:bg-gray-100" data-filter="draft" onclick="filterBilling(event)">✏️ 작성중</button>
                    <button class="filter-btn flex-1 py-2 px-4 rounded-md font-semibold text-sm hover:bg-gray-100" data-filter="pending" onclick="filterBilling(event)">⏳ 검토중</button>
                    <button class="filter-btn flex-1 py-2 px-4 rounded-md font-semibold text-sm hover:bg-gray-100" data-filter="approved" onclick="filterBilling(event)">✅ 승인</button>
                    <button class="filter-btn flex-1 py-2 px-4 rounded-md font-semibold text-sm hover:bg-gray-100" data-filter="rejected" onclick="filterBilling(event)">❗ 보완 요청</button>
                </div>
                <div class="flex justify-end mb-4">
                    <button onclick="submitAllDrafts()" class="px-5 py-2 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 transition">📤 작성중 전체 제출</button>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">청부 목록</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b-2 border-gray-200">
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">이용자</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">등급</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">서비스</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">청부액</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">날짜</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">상태</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">작업</th>
                                </tr>
                            </thead>
                            <tbody id="billingTableBody">
                                <tr><td colspan="7" class="py-8 text-center text-gray-400">📝 청부가 없습니다</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="menu.js"></script>
    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let billings = [];
        let currentFilter = 'all';

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            loadBillings();
            renderSidebar();
        }


        async function loadBillings() {
            try {
                const r = await fetch(`${API_URL}/billing/?caregiver_id=${currentUser.id}`);
                const d = await r.json();
                billings = d.records || [];
                updateSummary();
                renderBillings();
            } catch (e) {
                showMessage('청부 로드 실패: ' + e.message, 'error');
            }
        }

        function updateSummary() {
            const thisMonth = new Date().getMonth();
            const thisMonthBillings = billings.filter(b => new Date(b.recorded_date).getMonth() === thisMonth);
            const sumOf = list => list.reduce((sum, b) => sum + (b.amount || 0), 0);
            ['draft', 'pending', 'approved', 'rejected'].forEach(key => {
                const list = thisMonthBillings.filter(b => b.approval_status === key);
                document.getElementById(`${key}Count`).textContent = list.length;
                document.getElementById(`${key}Amount`).textContent = sumOf(list).toLocaleString();
            });
        }

        const STATUS_BADGE = {
            draft: ['bg-blue-100 text-blue-800', '✏️ 작성중'],
            pending: ['bg-amber-100 text-amber-800', '⏳ 검토중'],
            approved: ['bg-emerald-100 text-emerald-800', '✅ 승인'],
            rejected: ['bg-red-100 text-red-800', '❗ 보완 요청']
        };

        function renderBillings() {
            const thisMonth = new Date().getMonth();
            let filtered = billings.filter(b => new Date(b.recorded_date).getMonth() === thisMonth);
            if (currentFilter !== 'all') filtered = filtered.filter(b => b.approval_status === currentFilter);
            const tbody = document.getElementById('billingTableBody');
            if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-gray-400">📝 청부가 없습니다</td></tr>'; return; }
            tbody.innerHTML = filtered.map(b => {
                const [cls, label] = STATUS_BADGE[b.approval_status] || ['bg-gray-100 text-gray-700', b.approval_status];
                const canSubmit = b.approval_status === 'draft' || b.approval_status === 'rejected';
                const reason = b.approval_status === 'rejected' && b.rejection_reason ? `<div class="text-xs text-red-600 mt-1">사유: ${b.rejection_reason}</div>` : '';
                const editable = b.approval_status === 'draft' || b.approval_status === 'rejected';
                const editBtn = editable ? `<button onclick="openEdit(${b.id})" class="px-3 py-1 bg-white border border-gray-300 text-gray-700 text-sm font-bold rounded-lg hover:bg-gray-50 mr-2">수정</button>` : '';
                const submitBtn = canSubmit ? `<button onclick="submitBilling(${b.id})" class="px-3 py-1 bg-emerald-600 text-white text-sm font-bold rounded-lg hover:bg-emerald-700">제출</button>` : '';
                const action = editBtn + submitBtn || '-';
                return `<tr class="border-b border-gray-100 hover:bg-gray-50"><td class="py-4 px-4 font-semibold">${b.resident_name || '-'}</td><td class="py-4 px-4">${b.care_grade || '-'}등급</td><td class="py-4 px-4">${getServiceName(b.service_type)}</td><td class="py-4 px-4 font-bold text-emerald-600">₩${(b.amount || 0).toLocaleString()}</td><td class="py-4 px-4 text-gray-500">${new Date(b.recorded_date).toLocaleDateString('ko-KR')}</td><td class="py-4 px-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${cls}">${label}</span>${reason}</td><td class="py-4 px-4">${action}</td></tr>`;
            }).join('');
        }

        const SERVICE_NAMES_EDIT = { basic_care: '기본 돌봄', meal_service: '식사 서빙', medical_care: '의료 관리', emergency: '응급' };
        const CARE_ITEMS_EDIT = [
            ['meal_assist', '식사 보조'], ['toilet_assist', '배설 보조'], ['bath', '목욕·세면'], ['dressing', '옷 갈아입기'], ['mobility', '이동 보조'],
            ['medicine', '투약 확인'], ['vitals', '체온·혈압 측정'], ['symptom', '이상 증상 관찰'],
            ['emotional', '말벗·정서 지원'], ['cognitive', '인지활동'],
            ['cleaning', '청소·정돈'], ['laundry', '세탁'], ['shopping', '장보기·취사']
        ];
        let editingBillingId = null;
        let editingDailyId = null;

        function ensureEditModal() {
            if (document.getElementById('editModal')) return;
            const wrap = document.createElement('div');
            wrap.id = 'editModal';
            wrap.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:3000;align-items:center;justify-content:center;';
            wrap.innerHTML = `
                <div class="bg-white rounded-xl p-8 w-full max-w-lg max-h-[90vh] overflow-y-auto">
                    <h2 class="text-xl font-bold mb-2">청부 수정</h2>
                    <div id="editReason" class="text-sm text-red-600 mb-4"></div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">서비스 유형</label>
                            <select id="editService" class="w-full px-3 py-2 border border-gray-300 rounded-lg">${Object.entries(SERVICE_NAMES_EDIT).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">제공 시간</label>
                            <select id="editDuration" class="w-full px-3 py-2 border border-gray-300 rounded-lg">${[30, 60, 90, 120, 180, 240].map(m => `<option value="${m}">${m}분</option>`).join('')}</select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">제공 항목</label>
                            <div class="grid grid-cols-2 gap-2 text-sm">${CARE_ITEMS_EDIT.map(([v, l]) => `<label class="flex items-center gap-2"><input type="checkbox" name="editItem" value="${v}"> ${l}</label>`).join('')}</div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">컨디션</label>
                            <select id="editCondition" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                                <option value="">선택하세요</option><option value="good">좋음</option><option value="normal">보통</option><option value="poor">나쁨</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">기록 내용</label>
                            <textarea id="editNotes" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                        </div>
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button onclick="saveEdit()" class="flex-1 py-2 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700">저장</button>
                        <button onclick="closeEdit()" class="flex-1 py-2 bg-gray-100 text-gray-700 font-bold rounded-lg hover:bg-gray-200">취소</button>
                    </div>
                </div>`;
            document.body.appendChild(wrap);
        }

        async function openEdit(billingId) {
            const billing = billings.find(b => b.id === billingId);
            if (!billing || !billing.daily_record_id) { showMessage('수정할 기록 정보를 찾을 수 없습니다', 'error'); return; }
            const d = await (await fetch(`${API_URL}/records/all?caregiver_id=${currentUser.id}`)).json();
            const rec = (d.records || []).find(r => r.id === billing.daily_record_id);
            if (!rec) { showMessage('기록을 찾을 수 없습니다', 'error'); return; }

            ensureEditModal();
            editingBillingId = billingId;
            editingDailyId = billing.daily_record_id;
            document.getElementById('editReason').textContent = billing.approval_status === 'rejected' && billing.rejection_reason
                ? `센터장 보완 요청 사유: ${billing.rejection_reason}` : '';
            document.getElementById('editService').value = rec.service_type || 'basic_care';
            document.getElementById('editDuration').value = rec.duration_minutes || 60;
            const items = (rec.care_items || '').split(',');
            document.querySelectorAll('input[name="editItem"]').forEach(cb => { cb.checked = items.includes(cb.value); });
            document.getElementById('editCondition').value = rec.condition || '';
            document.getElementById('editNotes').value = rec.notes || '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEdit() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveEdit() {
            const careItems = Array.from(document.querySelectorAll('input[name="editItem"]:checked')).map(cb => cb.value).join(',');
            const r = await fetch(`${API_URL}/records/daily/${editingDailyId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: currentUser.id,
                    service_type: document.getElementById('editService').value,
                    duration_minutes: parseInt(document.getElementById('editDuration').value),
                    care_items: careItems,
                    condition: document.getElementById('editCondition').value,
                    notes: document.getElementById('editNotes').value
                })
            });
            if (!r.ok) {
                const e = await r.json().catch(() => ({}));
                showMessage(`수정 실패: ${e.detail || '오류'}`, 'error');
                return;
            }
            closeEdit();
            showMessage('수정했습니다. 확인 후 다시 제출해 주세요.', 'success');
            await loadBillings();
        }

        async function postSubmit(id) {
            const r = await fetch(`${API_URL}/billing/${id}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUser.id, user_role: 'caregiver' })
            });
            return r.ok;
        }

        async function submitBilling(id) {
            const ok = await postSubmit(id);
            showMessage(ok ? '청부를 제출했습니다. 센터장 검토를 기다려 주세요.' : '제출에 실패했습니다', ok ? 'success' : 'error');
            await loadBillings();
        }

        async function submitAllDrafts() {
            const thisMonth = new Date().getMonth();
            const drafts = billings.filter(b => b.approval_status === 'draft' && new Date(b.recorded_date).getMonth() === thisMonth);
            if (drafts.length === 0) { showMessage('제출할 작성중 청부가 없습니다', 'error'); return; }
            if (!confirm(`작성중 청부 ${drafts.length}건을 센터장에게 제출할까요?`)) return;
            let ok = 0;
            for (const b of drafts) { if (await postSubmit(b.id)) ok++; }
            showMessage(`${ok}건을 제출했습니다`, 'success');
            await loadBillings();
        }
        function filterBilling(e) {
            document.querySelectorAll('.filter-btn').forEach(btn => { btn.classList.remove('bg-emerald-500', 'text-white'); btn.classList.add('hover:bg-gray-100'); });
            e.currentTarget.classList.add('bg-emerald-500', 'text-white');
            e.currentTarget.classList.remove('hover:bg-gray-100');
            currentFilter = e.currentTarget.dataset.filter;
            renderBillings();
        }

        function getServiceName(type) {
            const names = {'basic_care': '기본 돌봄', 'meal_service': '식사 서빙', 'medical_care': '의료 관리', 'emergency': '응급'};
            return names[type] || type;
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `${type === 'error' ? 'bg-red-50 border border-red-200 text-red-700' : 'bg-emerald-50 border border-emerald-200 text-emerald-700'} mb-6 p-4 rounded-lg`;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 4000);
        }

        function logout() {
            if (confirm('로그아웃하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
