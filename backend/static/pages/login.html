<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 로그인</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body { min-height: 100vh; margin: 0; }
        .login-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
        }
        .login-brand {
            padding: 64px;
            background: var(--ink);
            color: #EEF3EF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .login-wordmark {
            font-family: 'Gowun Batang', serif;
            font-size: 44px;
            font-weight: 700;
            line-height: 1.15;
        }
        .login-lede {
            max-width: 34ch;
            font-size: 17px;
            line-height: 1.8;
            color: #C9D6CE;
        }
        .login-brand-foot {
            font-size: 13px;
            color: #9FB1A7;
            line-height: 1.7;
        }
        .login-form-wrap {
            padding: 64px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--sheet);
        }
        .login-form-wrap h1 { font-size: 30px; margin: 0 0 6px; }
        .login-form-wrap .sub { color: var(--ink-soft); font-size: 15px; margin: 0 0 32px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        .field input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #C5CFC8;
            border-radius: 6px;
            font-size: 16px;
            background: #FBFCFA;
            color: var(--ink);
        }
        .field input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px #DCE6DF; }
        .password-wrap { position: relative; }
        .password-toggle {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--ink-soft);
            font-size: 13px; padding: 6px 8px; cursor: pointer; text-decoration: underline;
        }
        .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); margin: 4px 0 24px; }
        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: var(--persimmon);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .login-button:hover:not(:disabled) { background: var(--persimmon-hover); }
        .login-button:disabled { opacity: 0.6; cursor: not-allowed; }
        .notice {
            display: none;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .notice.show { display: block; }
        .notice.error { background: #FBEDE7; color: #7A2E14; border: 1px solid #F0C9B6; }
        .notice.ok { background: #E8F0EA; color: #1E2B26; border: 1px solid #C5D8CB; }
        .login-help { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-soft); line-height: 1.8; }
        .login-help a { color: var(--persimmon); font-weight: 700; }
        @media (max-width: 860px) {
            .login-shell { grid-template-columns: 1fr; }
            .login-brand { padding: 32px 24px; min-height: 0; gap: 20px; }
            .login-wordmark { font-size: 30px; }
            .login-form-wrap { padding: 36px 24px 56px; }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <section class="login-brand">
            <div>
                <div class="login-wordmark">돌봄케어</div>
            </div>
            <div>
                <p class="login-lede">방문 기록은 빠르게, 돌봄의 내용은 정확하게 남깁니다. 요양사의 일정과 청부, 보호자와의 소통을 한곳에서 확인합니다.</p>
            </div>
            <div class="login-brand-foot">
                직원 계정은 센터장이 만듭니다. 비밀번호를 잊었다면 센터장에게 요청해 주세요.
            </div>
        </section>

        <section class="login-form-wrap">
            <h1>로그인</h1>
            <p class="sub">계정 이메일과 비밀번호를 입력하세요.</p>

            <div id="errorMessage" class="notice error" role="alert"></div>
            <div id="successMessage" class="notice ok" role="status"></div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <div class="password-wrap">
                        <input type="password" id="password" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="비밀번호 보기">보기</button>
                    </div>
                </div>
                <label class="check-row">
                    <input type="checkbox" id="rememberMe">
                    이메일 기억하기
                </label>
                <button type="submit" id="loginButton" class="login-button">로그인</button>
            </form>

            <div class="login-help">
                <p>보호자이신가요? 센터에서 받은 초대 코드로 <a href="./guardian_signup.html">보호자 가입</a>을 해 주세요.</p>
            </div>
        </section>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginButton = document.getElementById('loginButton');
        const togglePassword = document.getElementById('togglePassword');

        // 비밀번호 보기/숨기기
        togglePassword.addEventListener('click', () => {
            const showing = passwordInput.type === 'text';
            passwordInput.type = showing ? 'password' : 'text';
            togglePassword.textContent = showing ? '보기' : '숨기기';
            togglePassword.setAttribute('aria-label', showing ? '비밀번호 보기' : '비밀번호 숨기기');
        });

        function showError(text) {
            successMessage.classList.remove('show');
            errorMessage.textContent = text;
            errorMessage.classList.add('show');
        }

        // 역할은 서버가 계정에서 정한다
        async function handleLogin(email, password) {
            loginButton.disabled = true;
            loginButton.textContent = '로그인 중...';
            errorMessage.classList.remove('show');
            try {
                const response = await fetch('/api/v1/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showError(response.status === 401
                        ? '이메일 또는 비밀번호가 올바르지 않습니다.'
                        : (data.detail || '로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.'));
                    return;
                }

                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('savedEmail', email);
                } else {
                    localStorage.removeItem('savedEmail');
                }

                successMessage.textContent = '로그인되었습니다. 이동하고 있습니다.';
                successMessage.classList.add('show');
                setTimeout(() => {
                    window.location.href = data.user.role === 'guardian' ? './guardian_home.html' : './dashboard.html';
                }, 800);
            } catch (error) {
                showError('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
            } finally {
                if (!successMessage.classList.contains('show')) {
                    loginButton.disabled = false;
                    loginButton.textContent = '로그인';
                }
            }
        }

        // 폼 제출 (Enter 키도 여기로 온다)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (loginButton.disabled) return;
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                showError('이메일과 비밀번호를 입력해 주세요.');
                return;
            }
            await handleLogin(email, password);
        });

        // 이메일 기억하기: 이메일만 저장한다 (비밀번호는 저장하지 않는다)
        window.addEventListener('load', () => {
            const savedEmail = localStorage.getItem('savedEmail');
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberMeCheckbox.checked = true;
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
