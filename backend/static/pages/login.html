<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 로그인</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        :root {
            --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
        body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: var(--charcoal); }

        /* PC에서는 화면 높이에 딱 맞춰서 스크롤 없이 한 화면에 다 보이게 한다 */
        .login-shell { height: 100vh; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(380px, 560px); }

        /* 왼쪽: 배너 이미지 전체를 보여준다 (글자·로고가 잘리지 않도록 contain + 여백은 배경색으로) */
        .login-banner { height: 100%; background: #EFF4F0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
        .login-banner img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 12px; }

        .login-form-wrap { height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 32px; background: #fff; }
        .login-card { width: 100%; max-width: 420px; }

        .login-logo { text-align: center; margin-bottom: 28px; }
        .login-logo .name { font-size: 24px; font-weight: 800; color: var(--navy); letter-spacing: -0.01em; }
        .login-logo .en { font-size: 12px; color: #94A3B8; font-weight: 600; margin-top: 2px; }
        .login-logo .sub { font-size: 14px; color: #64748B; margin-top: 14px; }

        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; font-weight: 700; color: var(--charcoal); margin-bottom: 7px; }
        .field input {
            width: 100%; height: 50px; padding: 0 16px; border: 1.5px solid var(--line2); border-radius: 10px;
            font-size: 15px; background: #fff; color: var(--charcoal); font-family: inherit;
        }
        .field input:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(15,139,128,0.12); }

        /* 입력창 왼쪽 아이콘 */
        .input-icon-wrap { position: relative; }
        .input-icon-wrap input { padding-left: 42px; }
        .input-icon-wrap .field-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94A3B8; display: flex; pointer-events: none;
        }
        .input-icon-wrap .field-icon svg { width: 18px; height: 18px; }

        .password-wrap { position: relative; }
        .password-toggle {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #64748B; font-size: 13px; font-weight: 600;
            padding: 6px 4px; cursor: pointer;
        }

        .trust-box {
            display: flex; gap: 12px; align-items: flex-start; background: #EDF8F6; border: 1px solid #CDEAE5;
            border-radius: 10px; padding: 14px 16px; margin-top: 18px;
        }
        .trust-icon {
            width: 32px; height: 32px; border-radius: 8px; background: var(--teal); color: #fff;
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .trust-icon svg { width: 16px; height: 16px; }
        .trust-title { font-size: 13px; font-weight: 800; color: var(--navy); }
        .trust-desc { font-size: 12px; color: #4B6B64; margin-top: 2px; line-height: 1.5; }

        .check-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #64748B; margin: 2px 0 22px; }
        .check-row input { width: 16px; height: 16px; accent-color: var(--teal); }

        .login-button {
            width: 100%; height: 52px; border: none; border-radius: 10px; background: var(--teal);
            color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
        }
        .login-button:hover:not(:disabled) { background: #0C756C; }
        .login-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .notice { display: none; padding: 12px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 16px; }
        .notice.show { display: block; }
        .notice.error { background: #FDE8E8; color: #B91C1C; border: 1px solid #FBD5D5; }
        .notice.ok { background: #E6F3F1; color: #0C756C; border: 1px solid #CDEAE5; }

        .login-help { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line2); font-size: 13.5px; color: #64748B; line-height: 1.7; }
        .login-help a { color: var(--teal); font-weight: 700; text-decoration: none; }
        .login-help a:hover { text-decoration: underline; }
        .login-help p + p { margin-top: 8px; }

        @media (max-width: 900px) {
            html, body { overflow: auto; }
            .login-shell { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
            .login-banner { display: none; }
            .login-form-wrap { height: auto; padding: 40px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <section class="login-banner">
            <img src="assets/user_design/login_banner.png" alt="돌봄케어 - 사람을 위한 따뜻한 돌봄, 더 편리한 업무">
        </section>

        <section class="login-form-wrap">
            <div class="login-card">
                <div class="login-logo">
                    <div class="name">돌봄케어</div>
                    <div class="en">Care Management</div>
                    <p class="sub">로그인하여 계정 이메일과 비밀번호를 입력하세요.</p>
                </div>

                <div id="errorMessage" class="notice error" role="alert"></div>
                <div id="successMessage" class="notice ok" role="status"></div>

                <form id="loginForm" novalidate>
                    <div class="field">
                        <label for="email">이메일</label>
                        <div class="input-icon-wrap">
                            <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                            <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required>
                        </div>
                    </div>
                    <div class="field">
                        <label for="password">비밀번호</label>
                        <div class="password-wrap input-icon-wrap">
                            <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                            <input type="password" id="password" autocomplete="current-password" required>
                            <button type="button" id="togglePassword" class="password-toggle" aria-label="비밀번호 보기">보기</button>
                        </div>
                    </div>
                    <label class="check-row">
                        <input type="checkbox" id="rememberMe">
                        이메일 기억하기
                    </label>
                    <button type="submit" id="loginButton" class="login-button">로그인</button>
                </form>

                <div class="trust-box">
                    <span class="trust-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></span>
                    <div>
                        <div class="trust-title">안전한 로그인 환경</div>
                        <div class="trust-desc">돌봄케어는 안전한 보안 시스템으로 소중한 개인정보를 보호합니다.</div>
                    </div>
                </div>

                <div class="login-help">
                    <p>요양보호사·센터장·보호자 모두 위 이메일과 비밀번호로 로그인합니다.</p>
                    <p>아직 계정이 없는 보호자이신가요? 센터에서 받은 초대 코드로 <a href="./guardian_signup.html">보호자 가입</a>을 해 주세요.</p>
                    <p>직원 계정은 센터장이 만듭니다. 비밀번호를 잊었다면 센터장에게 요청해 주세요.</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginButton = document.getElementById('loginButton');
        const togglePassword = document.getElementById('togglePassword');

        // 비밀번호 보기/숨기기
        togglePassword.addEventListener('click', () => {
            const showing = passwordInput.type === 'text';
            passwordInput.type = showing ? 'password' : 'text';
            togglePassword.textContent = showing ? '보기' : '숨기기';
            togglePassword.setAttribute('aria-label', showing ? '비밀번호 보기' : '비밀번호 숨기기');
        });

        function showError(text) {
            successMessage.classList.remove('show');
            errorMessage.textContent = text;
            errorMessage.classList.add('show');
        }

        // 역할은 서버가 계정에서 정한다
        async function handleLogin(email, password) {
            loginButton.disabled = true;
            loginButton.textContent = '로그인 중...';
            errorMessage.classList.remove('show');
            try {
                const response = await fetch('/api/v1/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showError(response.status === 401
                        ? '이메일 또는 비밀번호가 올바르지 않습니다.'
                        : (data.detail || '로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.'));
                    return;
                }

                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('savedEmail', email);
                } else {
                    localStorage.removeItem('savedEmail');
                }

                successMessage.textContent = '로그인되었습니다. 이동하고 있습니다.';
                successMessage.classList.add('show');
                setTimeout(() => {
                    window.location.href = data.user.role === 'guardian' ? './guardian_home.html' : './dashboard.html';
                }, 800);
            } catch (error) {
                showError('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
            } finally {
                if (!successMessage.classList.contains('show')) {
                    loginButton.disabled = false;
                    loginButton.textContent = '로그인';
                }
            }
        }

        // 폼 제출 (Enter 키도 여기로 온다)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (loginButton.disabled) return;
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                showError('이메일과 비밀번호를 입력해 주세요.');
                return;
            }
            await handleLogin(email, password);
        });

        // 이메일 기억하기: 이메일만 저장한다 (비밀번호는 저장하지 않는다)
        window.addEventListener('load', () => {
            const savedEmail = localStorage.getItem('savedEmail');
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberMeCheckbox.checked = true;
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
