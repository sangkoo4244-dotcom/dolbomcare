<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 로그인</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #10b981 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .login-wrapper {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* 왼쪽: 브랜딩 섹션 */
        .login-brand {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .brand-logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 14px;
            opacity: 0.95;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .brand-features {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand-feature {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            text-align: left;
        }

        .brand-feature-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .brand-feature-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .brand-feature-text strong {
            display: block;
            font-size: 14px;
            margin-bottom: 2px;
        }

        /* 오른쪽: 로그인 섹션 */
        .login-form-section {
            background: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #6b7280;
        }

        /* 폼 필드 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            background: #f0fdf4;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        /* 체크박스 */
        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .form-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #10b981;
        }

        .form-check label {
            cursor: pointer;
            color: #6b7280;
            margin: 0;
        }

        /* 로그인 버튼 */
        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        /* 링크 */
        .login-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 13px;
        }

        .login-links a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-links a:hover {
            color: #059669;
        }

        /* 구분선 */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 32px 0;
            color: #d1d5db;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        /* 회원가입 링크 */
        .signup-prompt {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            color: #6b7280;
        }

        .signup-prompt a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .login-brand {
                padding: 40px 30px;
                display: none;
            }

            .login-form-section {
                padding: 40px 30px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            body {
                background: white;
            }
        }

        /* 에러 메시지 */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* 성공 메시지 */
        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-wrap {
            position: relative;
        }
        .password-wrap input {
            width: 100%;
            padding-right: 64px;
        }
        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #059669;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 8px;
        }
        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-help {
            margin-top: 24px;
            padding: 14px 16px;
            background: #f9fafb;
            border-radius: 10px;
            font-size: 13px;
            color: #4b5563;
            line-height: 1.6;
        }
        .login-help p + p {
            margin-top: 6px;
        }
        .login-help a {
            color: #059669;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- 왼쪽: 브랜딩 -->
        <div class="login-brand">
            <div class="brand-logo">❤️</div>
            <div class="brand-title">돌봄케어</div>
            <div class="brand-subtitle">
                요양사의 독립성을 지키고<br>
                센터의 효율성을 높이며<br>
                보호자의 신뢰를 얻다
            </div>

            <div class="brand-features">
                <div class="brand-feature">
                    <div class="brand-feature-icon">🎤</div>
                    <div class="brand-feature-text">
                        <strong>음성 기반 기록</strong>
                        손쓰기 시간 80% 단축
                    </div>
                </div>
                <div class="brand-feature">
                    <div class="brand-feature-icon">💰</div>
                    <div class="brand-feature-text">
                        <strong>스마트 청부 관리</strong>
                        자동 계산으로 오류 제거
                    </div>
                </div>
                <div class="brand-feature">
                    <div class="brand-feature-icon">👥</div>
                    <div class="brand-feature-text">
                        <strong>투명한 소통</strong>
                        실시간 현황 공유
                    </div>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 로그인 폼 -->
        <div class="login-form-section">
            <div class="login-header">
                <h1>로그인</h1>
                <p>계정에 접속하세요</p>
            </div>

            <!-- 에러/성공 메시지 -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- 로그인 폼 -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your@email.com"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                            required
                        />
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="비밀번호 보기">보기</button>
                    </div>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="rememberMe" />
                    <label for="rememberMe">이메일 기억하기</label>
                </div>

                <button type="submit" id="loginButton" class="login-button">로그인</button>
            </form>

            <div class="login-help">
                <p><strong>직원 계정</strong>은 센터장이 만들어 드립니다. 계정이 없거나 비밀번호를 잊었다면 센터장에게 요청해 주세요.</p>
                <p><strong>보호자</strong>는 센터에서 받은 초대 코드로 <a href="./guardian_signup.html">보호자 가입</a>을 해 주세요.</p>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginButton = document.getElementById('loginButton');
        const togglePassword = document.getElementById('togglePassword');

        // 비밀번호 보기/숨기기
        togglePassword.addEventListener('click', () => {
            const showing = passwordInput.type === 'text';
            passwordInput.type = showing ? 'password' : 'text';
            togglePassword.textContent = showing ? '보기' : '숨기기';
            togglePassword.setAttribute('aria-label', showing ? '비밀번호 보기' : '비밀번호 숨기기');
        });

        function showError(text) {
            successMessage.classList.remove('show');
            errorMessage.textContent = text;
            errorMessage.classList.add('show');
        }

        // 로그인 함수 (역할은 서버가 계정에서 정한다)
        async function handleLogin(email, password) {
            loginButton.disabled = true;
            loginButton.textContent = '로그인 중...';
            errorMessage.classList.remove('show');
            try {
                const response = await fetch('/api/v1/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showError(response.status === 401
                        ? '이메일 또는 비밀번호가 올바르지 않습니다.'
                        : (data.detail || '로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.'));
                    return;
                }

                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('savedEmail', email);
                } else {
                    localStorage.removeItem('savedEmail');
                }

                successMessage.textContent = '로그인 되었습니다. 이동 중...';
                successMessage.classList.add('show');
                setTimeout(() => {
                    window.location.href = data.user.role === 'guardian' ? './guardian_home.html' : './dashboard.html';
                }, 800);
            } catch (error) {
                showError('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
            } finally {
                if (!successMessage.classList.contains('show')) {
                    loginButton.disabled = false;
                    loginButton.textContent = '로그인';
                }
            }
        }

        // 폼 제출 (Enter 키도 여기로 온다)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (loginButton.disabled) return;
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                showError('이메일과 비밀번호를 입력해 주세요.');
                return;
            }
            await handleLogin(email, password);
        });

        // 이메일 기억하기: 저장된 이메일만 채운다 (비밀번호는 저장하지 않는다)
        window.addEventListener('load', () => {
            const savedEmail = localStorage.getItem('savedEmail');
            if (savedEmail) {
                emailInput.value = savedEmail;
                rememberMeCheckbox.checked = true;
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
