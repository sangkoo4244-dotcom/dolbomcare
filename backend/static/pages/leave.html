<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연차·휴가 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }
        .sidebar { width: 288px; color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .sidebar-nav { padding: 20px 0; overflow: hidden; }
        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title h1 { margin: 0; font-size: 24px; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 600; }
        .content { flex: 1; padding: 30px; }
        @media (max-width: 768px) { .main-layout { margin-left: 0; } .content { padding: 16px; } }

        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0; }
        html, body { background: var(--bg) !important; }
        body, .content { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: linear-gradient(180deg, var(--navy) 0%, #0E1D30 100%) !important; }
        .sidebar .side-item.active { background: var(--teal) !important; color: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }

        .panel { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .panel h2 { margin: 0 0 12px; font-size: 16px; }
        .grid-form { display: grid; grid-template-columns: 160px 160px 1fr auto; gap: 10px; align-items: end; }
        @media (max-width: 900px) { .grid-form { grid-template-columns: 1fr; } }
        .field { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        .field:focus { border-color: var(--teal); outline: none; }
        .lbl { display: block; font-size: 12px; font-weight: 700; color: #64748B; margin-bottom: 4px; }
        .btn-solid { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; background: var(--teal); color: #fff; cursor: pointer; font-family: inherit; }
        .btn-outline { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .btn-danger { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid #FCA5A5; background: #fff; color: #B91C1C; cursor: pointer; font-family: inherit; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab { padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line2); background: #fff; font-size: 13px; font-weight: 700; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }
        .row { display: grid; grid-template-columns: 130px 110px 1fr 200px; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
        .meta { font-size: 12px; color: #64748B; margin-top: 2px; }
        .tag { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .tag-pending { background: #FEF3C7; color: #92400E; }
        .tag-approved { background: #DCFCE7; color: #166534; }
        .tag-rejected { background: #FEE2E2; color: #991B1B; }
        .tag-cancelled { background: #E2E8F0; color: #475569; }
        .warn { font-size: 12px; color: #B45309; font-weight: 700; }
        .visit-list { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: #475569; }
        .empty-note { color: #94A3B8; font-size: 13px; padding: 14px 0; }
        .msg { font-size: 13px; margin-top: 10px; display: none; }
        .msg.err { color: #DC2626; display: block; }
        .msg.ok { color: #15803D; display: block; }
        .return-box { grid-column: 1 / -1; display: none; gap: 8px; }
        .return-box.open { display: grid; }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="menu.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>

    <div class="main-layout">
        <div class="topbar">
            <div class="topbar-title">
                <h1 id="pageTitle">연차·휴가</h1>
                <div class="breadcrumb">홈 › 근무·교육 › <b id="crumb">연차·휴가</b></div>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="content">
            <div id="staffView" style="display:none;">
                <div class="panel">
                    <h2>연차·휴가 신청</h2>
                    <div class="grid-form">
                        <div><label class="lbl" for="lDate">날짜</label><input type="date" id="lDate" class="field"></div>
                        <div><label class="lbl" for="lType">종류</label>
                            <select id="lType" class="field">
                                <option value="annual">연차</option>
                                <option value="half_am">오전 반차</option>
                                <option value="half_pm">오후 반차</option>
                                <option value="other">기타 휴가</option>
                            </select></div>
                        <div><label class="lbl" for="lReason">사유 (선택)</label><input id="lReason" class="field" placeholder="예: 가족 행사"></div>
                        <div><button class="btn-solid" onclick="submitLeave()">신청하기</button></div>
                    </div>
                    <div class="msg" id="formMsg"></div>
                </div>
                <div class="panel">
                    <h2>내 신청</h2>
                    <div id="mineRows"><div class="empty-note">불러오는 중…</div></div>
                </div>
            </div>

            <div id="managerView" style="display:none;">
                <div class="panel">
                    <div class="tabs" id="tabs"></div>
                    <div id="rows"><div class="empty-note">불러오는 중…</div></div>
                    <div class="msg" id="msg"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
        const user = JSON.parse(localStorage.getItem('user') || 'null') || {};
        const isManager = user.role === 'center_manager';
        const STATUS_TAG = { pending: ['tag-pending', '승인 대기'], approved: ['tag-approved', '승인'], rejected: ['tag-rejected', '반려'], cancelled: ['tag-cancelled', '취소'] };
        let managerTab = 'pending';

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html';
            }
        }

        async function api(path, options = {}) {
            const r = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('access_token')}`, ...(options.headers || {}) } });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '처리하지 못했습니다');
            return d;
        }

        function setMsg(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

        /* ----- 직원 화면 ----- */
        async function submitLeave() {
            const msg = document.getElementById('formMsg');
            const body = { leave_date: document.getElementById('lDate').value, leave_type: document.getElementById('lType').value, reason: document.getElementById('lReason').value.trim() || null };
            if (!body.leave_date) { setMsg(msg, '날짜를 골라 주세요.', false); return; }
            try {
                await api('/api/v1/leave/requests', { method: 'POST', body: JSON.stringify(body) });
                setMsg(msg, '신청했습니다. 센터장이 승인하면 알림으로 알려 드립니다.', true);
                document.getElementById('lReason').value = '';
                loadMine();
            } catch (e) { setMsg(msg, e.message, false); }
        }

        async function loadMine() {
            const box = document.getElementById('mineRows');
            try {
                const d = await api('/api/v1/leave/requests/mine');
                box.innerHTML = d.data.length ? d.data.map(r => {
                    const [cls, label] = STATUS_TAG[r.status];
                    return `<div class="row">
                        <div><b>${esc(r.leave_date)}</b></div>
                        <div>${esc(r.leave_type_label)}</div>
                        <div>${r.reason ? esc(r.reason) : '<span class="meta">사유 없음</span>'}${r.decision_note ? `<div class="meta">${esc(r.decided_by_name || '')}: ${esc(r.decision_note)}</div>` : ''}</div>
                        <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;"><span class="tag ${cls}">${label}</span>${r.status === 'pending' ? `<button class="btn-outline" onclick="cancelLeave(${r.id})">취소</button>` : ''}</div>
                    </div>`;
                }).join('') : '<div class="empty-note">신청한 연차·휴가가 없습니다.</div>';
            } catch (e) { box.innerHTML = `<div class="empty-note">${esc(e.message)}</div>`; }
        }

        async function cancelLeave(id) {
            try { await api(`/api/v1/leave/requests/${id}/cancel`, { method: 'POST' }); loadMine(); }
            catch (e) { setMsg(document.getElementById('formMsg'), e.message, false); }
        }

        /* ----- 센터장 화면 ----- */
        function renderManagerTabs() {
            const tabs = [['pending', '승인 대기'], ['approved', '승인'], ['rejected', '반려']];
            document.getElementById('tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${k === managerTab ? 'active' : ''}" onclick="switchManagerTab('${k}')">${l}</button>`).join('');
        }

        function switchManagerTab(k) { managerTab = k; renderManagerTabs(); loadManager(); }

        function managerRow(r) {
            const [cls, label] = STATUS_TAG[r.status];
            const acts = r.status === 'pending' ? `<div style="display:flex;flex-direction:column;gap:6px;">
                    <button class="btn-solid" onclick="decide(${r.id}, 'approve')">승인</button>
                    <button class="btn-danger" onclick="toggleReject(${r.id})">반려</button></div>` : `<span class="tag ${cls}">${label}</span>`;
            const warn = r.scheduled_visits && r.status === 'pending' ? `<div class="warn">이 날 방문 ${r.scheduled_visits}건이 잡혀 있습니다. 방문 일정을 다른 직원에게 옮긴 뒤 승인하세요.</div>
                <ul class="visit-list">${r.visits.map(v => `<li>${esc(v.time)} · ${esc(v.resident_name)}${v.duration_minutes ? ' · ' + v.duration_minutes + '분' : ''}</li>`).join('')}</ul>` : '';
            const decided = r.decided_by_name ? `<div class="meta">${esc(r.decided_by_name)} 처리${r.decision_note ? ': ' + esc(r.decision_note) : ''}</div>` : '';
            return `<div class="row">
                <div><b>${esc(r.leave_date)}</b></div>
                <div>${esc(r.staff_name)}</div>
                <div>${esc(r.leave_type_label)}${r.reason ? ' · ' + esc(r.reason) : ''}${warn}${decided}</div>
                ${acts}
                ${r.status === 'pending' ? `<div class="return-box" id="rb-${r.id}"><textarea class="field" id="rn-${r.id}" rows="2" placeholder="반려 사유 (신청자에게 전달됩니다)"></textarea>
                    <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn-outline" onclick="toggleReject(${r.id})">취소</button><button class="btn-danger" onclick="decide(${r.id}, 'reject')">반려 보내기</button></div></div>` : ''}
            </div>`;
        }

        function toggleReject(id) { document.getElementById(`rb-${id}`).classList.toggle('open'); }

        async function loadManager() {
            const box = document.getElementById('rows');
            try {
                const d = await api(`/api/v1/leave/requests?status=${managerTab}`);
                box.innerHTML = d.data.length ? d.data.map(managerRow).join('') : '<div class="empty-note">해당 신청이 없습니다.</div>';
            } catch (e) { box.innerHTML = `<div class="empty-note">${esc(e.message)}</div>`; }
        }

        async function decide(id, action) {
            const msg = document.getElementById('msg');
            let body = {};
            if (action === 'reject') {
                const note = document.getElementById(`rn-${id}`).value.trim();
                if (!note) { setMsg(msg, '반려 사유를 적어 주세요.', false); return; }
                body = { note };
            }
            try {
                await api(`/api/v1/leave/requests/${id}/${action === 'approve' ? 'approve' : 'reject'}`, { method: 'POST', body: JSON.stringify(body) });
                setMsg(msg, action === 'approve' ? '승인했습니다.' : '반려했습니다.', true);
                loadManager();
            } catch (e) { setMsg(msg, e.message, false); }
        }

        (async function init() {
            if (typeof renderSidebar === 'function') renderSidebar();
            document.getElementById('userName').textContent = user.full_name || '';
            document.getElementById('userRole').textContent = isManager ? '센터장' : (user.role === 'social_worker' ? '사회복지사' : '요양보호사');
            if (isManager) {
                document.getElementById('pageTitle').textContent = '연차 승인';
                document.getElementById('crumb').textContent = '연차 승인';
                document.getElementById('managerView').style.display = '';
                renderManagerTabs();
                loadManager();
            } else {
                document.getElementById('staffView').style.display = '';
                const today = new Date(); today.setDate(today.getDate() + 1);
                document.getElementById('lDate').min = today.toISOString().slice(0, 10);
                document.getElementById('lDate').value = today.toISOString().slice(0, 10);
                loadMine();
            }
        })();
    </script>
</body>
</html>
