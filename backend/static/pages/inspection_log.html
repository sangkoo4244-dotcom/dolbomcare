<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점검 기록 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }
        .sidebar { width: 288px; color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .sidebar-nav { padding: 20px 0; overflow: hidden; }
        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title h1 { margin: 0; font-size: 24px; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 600; }
        .content { flex: 1; padding: 30px; }
        @media (max-width: 768px) { .main-layout { margin-left: 0; } .content { padding: 16px; } }

        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0; }
        html, body { background: var(--bg) !important; }
        body, .content { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: linear-gradient(180deg, var(--navy) 0%, #0E1D30 100%) !important; }
        .sidebar .side-item.active { background: var(--teal) !important; color: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }

        .panel { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .panel h2 { margin: 0 0 10px; font-size: 16px; }
        .note { background: #FFF7EB; border: 1px solid #FCE2B5; color: #8A4A07; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
        .field { padding: 9px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        .field:focus { border-color: var(--teal); outline: none; }
        .btn-solid { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; background: var(--teal); color: #fff; cursor: pointer; font-family: inherit; }
        .btn-outline { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .check-row { display: grid; grid-template-columns: 1fr 150px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        .check-row select { width: 100%; }
        .rec { border: 1px solid var(--line2); border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
        .rec .head { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; }
        .empty-note { color: #94A3B8; font-size: 13px; }
        .fail { color: #DC2626; font-weight: 700; }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="menu.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>

    <div class="main-layout">
        <div class="topbar">
            <div class="topbar-title">
                <h1>점검 기록</h1>
                <div class="breadcrumb">홈 › 방문 운영 › <b>점검 기록</b></div>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="content">
            <div class="note">센터 내부 점검 기록입니다. 공단 공식 서식이 아니며 공단 시스템에 전송되지 않습니다. 점검하지 않은 항목은 비워 두세요.</div>

            <div class="panel">
                <h2>점검 기록 남기기</h2>
                <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
                    <select id="kind" class="field" onchange="renderItems()">
                        <option value="vehicle">차량</option>
                        <option value="bath_tub">욕조</option>
                        <option value="nursing_kit">간호 용품</option>
                    </select>
                    <input id="checkDate" type="date" class="field">
                </div>
                <div id="items"></div>
                <div style="margin-top:12px;">
                    <label style="font-size:13px;font-weight:700;">메모 (문제가 있으면 적어 주세요)</label>
                    <input id="note" class="field" maxlength="500" style="width:100%;margin-top:4px;">
                </div>
                <div style="margin-top:12px;display:flex;gap:10px;align-items:center;">
                    <button class="btn-solid" onclick="save()">저장</button>
                    <span id="msg" style="font-size:13px;color:#64748B;"></span>
                </div>
            </div>

            <div class="panel" id="listPanel" style="display:none;">
                <h2>최근 점검 기록 (센터장)</h2>
                <div id="list"><div class="empty-note">불러오는 중…</div></div>
            </div>
        </div>
    </div>

    <script>
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
        const user = JSON.parse(localStorage.getItem('user') || 'null') || {};
        const isManager = user.role === 'center_manager';
        const VALUE_LABEL = { ok: '이상 없음', fail: '문제 있음', na: '해당 없음' };
        let catalog = {};

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html';
            }
        }

        function renderItems() {
            const kind = document.getElementById('kind').value;
            const list = (catalog[kind] && catalog[kind].items) || [];
            document.getElementById('items').innerHTML = list.map((name, i) =>
                `<div class="check-row"><span>${esc(name)}</span>
                 <select class="field" data-item="${esc(name)}">
                   <option value="">점검 안 함</option>
                   ${Object.entries(VALUE_LABEL).map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}
                 </select></div>`).join('');
        }

        async function save() {
            const msg = document.getElementById('msg');
            const results = {};
            document.querySelectorAll('#items select[data-item]').forEach(s => { if (s.value) results[s.dataset.item] = s.value; });
            if (!Object.keys(results).length) { msg.textContent = '점검한 항목을 하나 이상 골라 주세요'; return; }
            const body = { kind: document.getElementById('kind').value, check_date: document.getElementById('checkDate').value,
                           results, note: document.getElementById('note').value };
            const r = await fetch('/api/v1/inspections', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) { msg.textContent = typeof d.detail === 'string' ? d.detail : '저장하지 못했습니다'; return; }
            msg.textContent = '저장했습니다';
            document.querySelectorAll('#items select').forEach(s => s.value = '');
            document.getElementById('note').value = '';
            if (isManager) loadList();
        }

        async function loadList() {
            const d = await fetch('/api/v1/inspections').then(r => r.json()).catch(() => null);
            const rows = d && d.data ? d.data : [];
            document.getElementById('list').innerHTML = rows.length ? rows.map(o => {
                const fails = Object.entries(o.results).filter(([, v]) => v === 'fail').map(([k]) => k);
                return `<div class="rec"><div class="head"><span>${esc(o.kind_label)} · ${esc(o.check_date)}</span><span>${esc(o.inspector)}</span></div>
                    <div>${fails.length ? `<span class="fail">문제 있음: ${esc(fails.join(', '))}</span>` : '문제 항목 없음'}</div>
                    ${o.note ? `<div style="margin-top:4px;color:#64748B;">메모: ${esc(o.note)}</div>` : ''}</div>`;
            }).join('') : '<div class="empty-note">저장된 점검 기록이 없습니다.</div>';
        }

        (async function init() {
            if (typeof renderSidebar === 'function') renderSidebar();
            document.getElementById('userName').textContent = user.full_name || '';
            document.getElementById('userRole').textContent = isManager ? '센터장' : '직원';
            document.getElementById('checkDate').value = new Date().toISOString().slice(0, 10);
            const d = await fetch('/api/v1/inspections/items').then(r => r.json()).catch(() => ({}));
            catalog = d.data || {};
            renderItems();
            if (isManager) { document.getElementById('listPanel').style.display = ''; loadList(); }
        })();
    </script>
</body>
</html>
