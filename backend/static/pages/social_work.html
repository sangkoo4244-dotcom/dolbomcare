<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사회복지사 업무 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }
        .sidebar { width: 288px; color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .sidebar-nav { padding: 20px 0; overflow: hidden; }
        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title h1 { margin: 0; font-size: 24px; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 600; }
        .content { flex: 1; padding: 30px; }
        @media (max-width: 768px) { .main-layout { margin-left: 0; } .content { padding: 16px; } }

        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --warn: #B45309; --danger2: #DC2626; --line2: #E2E8F0; }
        html, body { background: var(--bg) !important; }
        body, .content { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: linear-gradient(180deg, var(--navy) 0%, #0E1D30 100%) !important; }
        .sidebar .side-item.active { background: var(--teal) !important; color: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }

        .note { background: #FFF7EB; border: 1px solid #FCE2B5; color: #8A4A07; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .tab { padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--line2); background: #fff; font-size: 14px; font-weight: 700; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }
        .tab .dot { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: #DC2626; color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
        .field { padding: 9px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        .field:focus { border-color: var(--teal); outline: none; }
        .btn-solid { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; background: var(--teal); color: #fff; cursor: pointer; font-family: inherit; }
        .btn-outline { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .btn-outline:hover { border-color: var(--teal); color: var(--teal); }

        .panel { background: #fff; border: 1px solid #E8ECF1; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
        .panel h2 { margin: 0 0 12px; font-size: 16px; color: var(--navy); }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #F1F5F9; flex-wrap: wrap; }
        .row:first-of-type { border-top: none; }
        .row .who { font-weight: 700; font-size: 15px; }
        .row .sub { font-size: 12.5px; color: #64748B; margin-top: 2px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .badge.ok { background: #E7F7EF; color: #0D8A61; }
        .badge.no { background: #FEECEC; color: #B91C1C; }
        .badge.wait { background: #FFF7EB; color: #B45309; }
        .empty-note { color: #94A3B8; font-size: 13px; padding: 12px 0; }
        .rec { border-top: 1px solid #F1F5F9; padding: 12px 0; }
        .rec:first-of-type { border-top: none; }
        .rec .head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
        .rec .body { margin-top: 6px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .rec .meta { font-size: 12.5px; color: #64748B; margin-top: 4px; }

        .modal-back { display: none; position: fixed; inset: 0; background: rgba(20,40,63,0.45); align-items: center; justify-content: center; padding: 16px; z-index: 200; }
        .modal-back.open { display: flex; }
        .modal { background: #fff; border-radius: 14px; padding: 24px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; }
        .modal h3 { margin: 0 0 4px; font-size: 18px; color: var(--navy); }
        .modal .fsub { font-size: 13px; color: #64748B; margin-bottom: 14px; }
        .modal label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 5px; }
        .modal input[type=text], .modal input[type=date], .modal select, .modal textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 15px; font-family: inherit; }
        .modal textarea { min-height: 110px; resize: vertical; }
        .modal .hint { font-size: 12px; color: #94A3B8; margin-top: 4px; }
        .modal .err { color: #DC2626; font-size: 13px; margin-top: 10px; display: none; }
        .modal .actions { display: flex; gap: 8px; margin-top: 18px; }
        .modal .actions button { flex: 1; height: 44px; }
    </style>
    <script src="menu.js"></script>
    <script>
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }
    </script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>

    <div class="main-layout">
        <div class="topbar">
            <div class="topbar-title">
                <h1>사회복지사 업무</h1>
                <div class="breadcrumb">홈 › 서비스 품질·평가 › <b>업무수행일지·월 방문 확인</b></div>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="content">
            <div class="panel">
                <h2>이용자 선택</h2>
                <select id="resident" style="padding:10px 12px;border:2px solid var(--line2);border-radius:10px;font-size:15px;min-width:240px;" onchange="loadAll()"></select>
                <div style="font-size:12px;color:#64748B;margin-top:6px;">업무수행일지는 방문 상담마다 한 건씩 쓰고, 월 방문 확인은 달마다 이용자당 한 번 기록합니다 (고시 제57조).</div>
            </div>

            <div class="panel">
                <h2>이번 달 방문 확인 현황 <span id="monthLabel" style="font-size:13px;color:#64748B;font-weight:600;"></span></h2>
                <div id="monitoringBox"><div class="empty-note">불러오는 중…</div></div>
                <div style="margin-top:12px;"><button class="btn-outline" onclick="recordMonitoring()">선택한 이용자 이번 달 방문 확인 기록</button></div>
            </div>

            <div class="panel">
                <h2>방문 예정 (이번 달)</h2>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <input id="planDate" type="date" style="padding:8px;border:2px solid var(--line2);border-radius:10px;">
                    <input id="planNote" maxlength="200" placeholder="메모 (예: 월 방문 확인)" style="padding:8px;border:2px solid var(--line2);border-radius:10px;min-width:200px;">
                    <button class="btn-outline" onclick="addPlan()">선택한 이용자 방문 예정 추가</button>
                    <span id="planErr" style="color:#DC2626;font-size:13px;"></span>
                </div>
                <div id="planList" style="margin-top:12px;"></div>
            </div>

            <div class="panel">
                <h2>업무수행일지 (방문 상담)</h2>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div><label style="font-size:13px;font-weight:700;">방문(상담) 일시</label><input id="visitedAt" type="datetime-local" style="width:100%;padding:8px;border:2px solid var(--line2);border-radius:10px;"></div>
                    <div><label style="font-size:13px;font-weight:700;">상담대상자명(관계)</label><input id="target" placeholder="김영희(딸)" style="width:100%;padding:8px;border:2px solid var(--line2);border-radius:10px;"></div>
                </div>
                <label style="font-size:13px;font-weight:700;display:block;margin-top:10px;">상담결과 (필수)</label>
                <textarea id="result" style="width:100%;min-height:70px;padding:8px;border:2px solid var(--line2);border-radius:10px;" placeholder="예: 식사량 감소로 보호자와 식단 조정 합의"></textarea>
                <label style="font-size:13px;font-weight:700;display:block;margin-top:10px;">상담 내용</label>
                <textarea id="content" style="width:100%;min-height:60px;padding:8px;border:2px solid var(--line2);border-radius:10px;"></textarea>
                <label style="font-size:13px;display:block;margin-top:10px;"><input type="checkbox" id="monitor"> 급여제공 확인(모니터링)을 함께 했습니다</label>
                <div style="margin-top:10px;"><button class="btn-outline" onclick="saveLog()">일지 저장</button> <span id="logErr" style="color:#DC2626;font-size:13px;"></span></div>
                <div id="logList" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api/v1/social-work';
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
        const ym = () => todayLocal().slice(0, 7);
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html';
            }
        }

        async function loadResidents() {
            const rd = await fetch('/api/v1/residents/').then(r => r.json()).catch(() => ({}));
            const list = Array.isArray(rd) ? rd : (rd.residents || []);
            document.getElementById('resident').innerHTML = list.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('') || '<option value="">이용자가 없습니다</option>';
        }

        async function loadAll() {
            const rid = document.getElementById('resident').value;
            document.getElementById('monthLabel').textContent = ym();
            const st = await fetch(`${API}/monitoring/status?year_month=${ym()}`).then(r => r.json()).catch(() => null);
            const box = document.getElementById('monitoringBox');
            if (!st || !st.data) { box.innerHTML = '<div class="empty-note">방문 확인 현황을 불러오지 못했습니다.</div>'; return; }
            const d = st.data;
            box.innerHTML = `<div>확인 완료 ${d.done.length}명 · 아직 없음 <b>${d.missing.length}명</b></div>
                <div style="margin-top:6px;font-size:13px;color:#B45309;">${d.missing.map(m => esc(m.name)).join(', ') || '모두 완료'}</div>`;
            if (!rid) return;
            const logs = await fetch(`${API}/logs?resident_id=${rid}`).then(r => r.json()).catch(() => ({}));
            const rows = (logs.data || []).map(l => `<div class="rec"><div class="head"><b>${esc(l.visited_at)}</b><span>${esc(l.author_name)}</span></div>
                <div class="meta">상담대상자: ${esc(l.counseling_target)} ${l.monitoring_checked ? '· 급여제공 확인 함' : ''}</div>
                <div class="body">${esc(l.counseling_result)}${l.content ? '\n' + esc(l.content) : ''}</div>
                <div style="margin-top:6px;"><a href="./social_work_log_sheet.html?log_id=${l.id}" target="_blank" style="font-size:13px;color:#0F8B80;font-weight:700;">공단 서식으로 출력</a></div></div>`).join('');
            document.getElementById('logList').innerHTML = rows || '<div class="empty-note">이 이용자의 일지가 아직 없습니다.</div>';
        }

        async function saveLog() {
            const err = document.getElementById('logErr'); err.textContent = '';
            const body = {
                resident_id: Number(document.getElementById('resident').value),
                visited_at: document.getElementById('visitedAt').value,
                counseling_target: document.getElementById('target').value,
                counseling_result: document.getElementById('result').value,
                content: document.getElementById('content').value,
                monitoring_checked: document.getElementById('monitor').checked,
            };
            if (!body.visited_at) { err.textContent = '방문(상담) 일시를 적어 주세요'; return; }
            const r = await fetch(`${API}/logs`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const d = await r.json();
            if (!r.ok) { err.textContent = d.detail || '저장하지 못했습니다'; return; }
            document.getElementById('result').value = ''; document.getElementById('content').value = ''; document.getElementById('target').value = '';
            loadAll();
        }

        async function recordMonitoring() {
            const rid = document.getElementById('resident').value;
            if (!rid) return;
            const ymd = todayLocal();
            const r = await fetch(`${API}/monitoring`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resident_id: Number(rid), year_month: ym(), visit_date: ymd + 'T09:00:00', service_checked: true }) });
            const d = await r.json();
            if (!r.ok) { alert(d.detail || '기록하지 못했습니다'); return; }
            loadAll();
        }

        async function loadPlans() {
            const start = ym() + '-01';
            const end = todayLocal(new Date(new Date(start).getFullYear(), new Date(start).getMonth() + 1, 0));
            const d = await fetch(`${API}/visit-plans?from_date=${start}&to_date=${end}`).then(r => r.json()).catch(() => ({}));
            const rows = d.data || [];
            document.getElementById('planList').innerHTML = rows.length ? rows.map(p => `<div class="row"><div class="who">${esc(p.planned_date)} · ${esc(p.resident_name)}</div>
                <div class="sub">${esc(p.note || '')} ${p.done ? '<span class="badge ok">완료</span>' : `<button class="btn-outline" onclick="donePlan(${p.id})">방문 완료</button>`}</div></div>`).join('')
                : '<div class="empty-note">이번 달 방문 예정이 없습니다.</div>';
        }

        async function addPlan() {
            const err = document.getElementById('planErr'); err.textContent = '';
            const date = document.getElementById('planDate').value;
            if (!date) { err.textContent = '방문 날짜를 골라 주세요'; return; }
            const r = await fetch(`${API}/visit-plans`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resident_id: Number(document.getElementById('resident').value), planned_date: date, note: document.getElementById('planNote').value }) });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) { err.textContent = d.detail || '추가하지 못했습니다'; return; }
            document.getElementById('planNote').value = '';
            loadPlans();
        }

        async function donePlan(id) {
            const r = await fetch(`${API}/visit-plans/${id}/done`, { method: 'POST' });
            if (r.ok) loadPlans();
        }

        (async function init() {
            if (typeof renderSidebar === 'function') renderSidebar();  // 사이드바는 본문이 그려진 뒤에 채운다
            const user = JSON.parse(localStorage.getItem('user') || 'null') || {};
            document.getElementById('userName').textContent = user.full_name || '';
            document.getElementById('userRole').textContent = user.role === 'social_worker' ? '사회복지사' : '관리자';
            await loadResidents();
            loadAll();
            loadPlans();
        })();
    </script>
</body>
</html>
