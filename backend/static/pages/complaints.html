<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민원·고충 대장 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }
        .sidebar { width: 288px; color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .sidebar-nav { padding: 20px 0; overflow: hidden; }
        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title h1 { margin: 0; font-size: 24px; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 600; }
        .content { flex: 1; padding: 30px; }
        @media (max-width: 768px) { .main-layout { margin-left: 0; } .content { padding: 16px; } }
        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0; }
        html, body { background: var(--bg) !important; }
        body, .content { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: linear-gradient(180deg, var(--navy) 0%, #0E1D30 100%) !important; }
        .sidebar .side-item.active { background: var(--teal) !important; color: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }
        .panel { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .panel h2 { margin: 0 0 12px; font-size: 16px; }
        .field { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        .field:focus { border-color: var(--teal); outline: none; }
        .lbl { display: block; font-size: 12px; font-weight: 700; color: #64748B; margin: 10px 0 4px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-solid { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; background: var(--teal); color: #fff; cursor: pointer; font-family: inherit; }
        .btn-outline { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line2); background: #fff; font-size: 13px; font-weight: 700; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }
        .row { padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        .meta { font-size: 12px; color: #64748B; margin-top: 2px; }
        .warn { color: #B45309; font-weight: 700; }
        .empty-note { color: #94A3B8; font-size: 13px; padding: 14px 0; }
        .msg { font-size: 13px; margin-top: 10px; display: none; }
        .msg.err { color: #DC2626; display: block; }
        .msg.ok { color: #15803D; display: block; }
        @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="menu.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <div class="main-layout">
        <div class="topbar">
            <div class="topbar-title">
                <h1>민원·고충 대장</h1>
                <div class="breadcrumb">홈 › 수급자·보호자 › <b>민원·고충 대장</b></div>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>
        <div class="content">
            <div class="panel">
                <h2>민원 접수</h2>
                <div class="grid2">
                    <div><label class="lbl" for="cDate">접수일</label><input type="date" id="cDate" class="field"></div>
                    <div><label class="lbl" for="cResident">관련 이용자 (없으면 비움)</label><select id="cResident" class="field"><option value="">해당 없음</option></select></div>
                    <div><label class="lbl" for="cWho">접수인 (이름·관계)</label><input id="cWho" class="field" placeholder="예: 김영희(딸)"></div>
                    <div><label class="lbl" for="cCat">분류</label>
                        <select id="cCat" class="field">
                            <option value="service">서비스</option><option value="caregiver">요양보호사</option>
                            <option value="facility">시설·환경</option><option value="other">기타</option>
                        </select></div>
                </div>
                <label class="lbl" for="cContent">민원 내용</label><textarea id="cContent" class="field" rows="3"></textarea>
                <div style="display:flex;justify-content:flex-end;margin-top:12px;"><button class="btn-solid" onclick="addComplaint()">접수</button></div>
                <div class="msg" id="msg"></div>
            </div>
            <div class="panel">
                <div class="tabs">
                    <button class="tab active" id="tabOpen" onclick="switchTab('open')">미처리</button>
                    <button class="tab" id="tabResolved" onclick="switchTab('resolved')">처리 완료</button>
                </div>
                <div id="rows"><div class="empty-note">불러오는 중…</div></div>
            </div>
        </div>
    </div>
    <script>
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
        const user = JSON.parse(localStorage.getItem('user') || 'null') || {};
        let current = 'open';

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html';
            }
        }
        async function api(path, options = {}) {
            const r = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('access_token')}`, ...(options.headers || {}) } });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '처리하지 못했습니다');
            return d;
        }
        function setMsg(text, ok) { const m = document.getElementById('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

        function switchTab(k) {
            current = k;
            document.getElementById('tabOpen').classList.toggle('active', k === 'open');
            document.getElementById('tabResolved').classList.toggle('active', k === 'resolved');
            load();
        }

        async function loadResidents() {
            const d = await api('/api/v1/residents/');
            const sel = document.getElementById('cResident');
            d.residents.forEach(r => sel.insertAdjacentHTML('beforeend', `<option value="${r.id}">${esc(r.name)}</option>`));
        }

        async function addComplaint() {
            const residentId = document.getElementById('cResident').value;
            const body = {
                resident_id: residentId ? parseInt(residentId, 10) : null,
                complainant: document.getElementById('cWho').value,
                received_date: document.getElementById('cDate').value,
                category: document.getElementById('cCat').value,
                content: document.getElementById('cContent').value,
            };
            try {
                await api('/api/v1/complaints', { method: 'POST', body: JSON.stringify(body) });
                setMsg('접수했습니다.', true);
                ['cWho', 'cContent'].forEach(id => document.getElementById(id).value = '');
                load();
            } catch (e) { setMsg(e.message, false); }
        }

        async function resolve(id) {
            const action = document.getElementById(`act-${id}`).value;
            const date = document.getElementById(`rd-${id}`).value;
            try {
                await api(`/api/v1/complaints/${id}/resolve`, { method: 'PUT', body: JSON.stringify({ action_taken: action, resolved_date: date }) });
                setMsg('처리 완료로 기록했습니다.', true);
                load();
            } catch (e) { setMsg(e.message, false); }
        }

        async function load() {
            const box = document.getElementById('rows');
            try {
                const d = await api(`/api/v1/complaints?status=${current}`);
                const today = todayLocal();
                box.innerHTML = d.data.length ? d.data.map(c => `
                    <div class="row">
                        <div><b>${esc(c.complainant)}</b> · ${esc(c.category_label)}${c.resident_name ? ' · ' + esc(c.resident_name) : ''}
                            <div class="meta">접수 ${esc(c.received_date)}${c.days_open !== null ? ` · <span class="${c.days_open >= 7 ? 'warn' : ''}">${c.days_open}일 경과</span>` : ` · 처리일 ${esc(c.resolved_date)}`}</div>
                        </div>
                        <div style="margin-top:6px;">${esc(c.content)}</div>
                        ${c.status === 'resolved'
                            ? `<div class="meta" style="margin-top:6px;">처리 내용: ${esc(c.action_taken)}</div>`
                            : `<div class="grid2" style="margin-top:8px;">
                                <input id="act-${c.id}" class="field" placeholder="처리 내용 (필수)">
                                <div style="display:flex;gap:8px;"><input type="date" id="rd-${c.id}" class="field" value="${today}"><button class="btn-solid" onclick="resolve(${c.id})">처리 완료</button></div>
                               </div>`}
                    </div>`).join('') : '<div class="empty-note">해당하는 민원이 없습니다.</div>';
            } catch (e) { box.innerHTML = `<div class="empty-note">${esc(e.message)}</div>`; }
        }

        (function init() {
            if (typeof renderSidebar === 'function') renderSidebar();
            document.getElementById('userName').textContent = user.full_name || '';
            document.getElementById('userRole').textContent = user.role === 'social_worker' ? '사회복지사' : '센터장';
            document.getElementById('cDate').value = todayLocal();
            loadResidents().catch(() => {});
            load();
        })();
    </script>
</body>
</html>
