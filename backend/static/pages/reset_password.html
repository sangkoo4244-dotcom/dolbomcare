<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 비밀번호 재설정</title>
    <style>
        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0; --danger: #DC2626; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); }
        body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: var(--charcoal); display: flex; align-items: center; justify-content: center; padding: 24px; }

        .card { width: 100%; max-width: 420px; background: #fff; border-radius: 14px; padding: 36px 32px; box-shadow: 0 10px 30px rgba(20,40,63,0.08); }
        .logo { text-align: center; font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
        h1 { font-size: 18px; margin: 16px 0 6px; text-align: center; }
        .sub { font-size: 13px; color: #64748B; text-align: center; margin: 0 0 24px; line-height: 1.5; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
        .field input {
            width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--line2); border-radius: 9px;
            font-size: 14px; font-family: inherit; box-sizing: border-box;
        }
        .field input:focus { border-color: var(--teal); outline: none; }

        .submit-button {
            width: 100%; height: 48px; border: none; border-radius: 9px; background: var(--teal);
            color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 6px;
        }
        .submit-button:hover:not(:disabled) { background: #0C756C; }
        .submit-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .notice { display: none; padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
        .notice.show { display: block; }
        .notice.error { background: #FDE8E8; color: #B91C1C; border: 1px solid #FBD5D5; }
        .notice.ok { background: #E6F3F1; color: #0C756C; border: 1px solid #CDEAE5; }

        .back-link { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--teal); font-weight: 700; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">돌봄케어</div>
        <h1>새 비밀번호 설정</h1>
        <p class="sub" id="pageSub">이메일로 받은 링크를 통해 들어오셨습니다. 새 비밀번호를 입력해 주세요.</p>

        <div id="notice" class="notice" role="alert"></div>

        <form id="resetForm" novalidate>
            <div class="field">
                <label for="newPassword">새 비밀번호 (8자 이상)</label>
                <input type="password" id="newPassword" autocomplete="new-password" required minlength="8">
            </div>
            <div class="field">
                <label for="confirmPassword">새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="submit-button" id="submitBtn">비밀번호 재설정</button>
        </form>

        <a href="./login.html" class="back-link">로그인으로 돌아가기</a>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('token');
        const form = document.getElementById('resetForm');
        const notice = document.getElementById('notice');
        const submitBtn = document.getElementById('submitBtn');

        function showNotice(text, ok) {
            notice.textContent = text;
            notice.className = 'notice show ' + (ok ? 'ok' : 'error');
        }

        if (!token) {
            showNotice('유효하지 않은 링크입니다. 로그인 화면에서 비밀번호 찾기를 다시 시도해 주세요.', false);
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                showNotice('비밀번호는 8자 이상이어야 합니다.', false);
                return;
            }
            if (newPassword !== confirmPassword) {
                showNotice('비밀번호가 서로 일치하지 않습니다.', false);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '처리 중...';
            try {
                const res = await fetch('/api/v1/users/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.detail || '재설정에 실패했습니다.');

                showNotice('비밀번호가 재설정되었습니다. 잠시 후 로그인 화면으로 이동합니다.', true);
                form.style.display = 'none';
                setTimeout(() => { window.location.href = './login.html'; }, 1800);
            } catch (err) {
                showNotice(err.message, false);
                submitBtn.disabled = false;
                submitBtn.textContent = '비밀번호 재설정';
            }
        });
    </script>
</body>
</html>
