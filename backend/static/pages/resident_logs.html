<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관찰일지·의견 기록 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }
        .sidebar { width: 288px; color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .sidebar-nav { padding: 20px 0; overflow: hidden; }
        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title h1 { margin: 0; font-size: 24px; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 600; }
        .content { flex: 1; padding: 30px; }
        @media (max-width: 768px) { .main-layout { margin-left: 0; } .content { padding: 16px; } }
        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0; }
        html, body { background: var(--bg) !important; }
        body, .content { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: linear-gradient(180deg, var(--navy) 0%, #0E1D30 100%) !important; }
        .sidebar .side-item.active { background: var(--teal) !important; color: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }
        .panel { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .panel h2 { margin: 0 0 12px; font-size: 16px; }
        .field { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        .field:focus { border-color: var(--teal); outline: none; }
        .lbl { display: block; font-size: 12px; font-weight: 700; color: #64748B; margin: 10px 0 4px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
        .btn-solid { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; background: var(--teal); color: #fff; cursor: pointer; font-family: inherit; }
        .btn-outline { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line2); background: #fff; font-size: 13px; font-weight: 700; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }
        .item { border-bottom: 1px solid #F1F5F9; padding: 12px 0; font-size: 14px; }
        .meta { font-size: 12px; color: #64748B; margin-top: 4px; }
        .action { margin-top: 6px; padding: 8px 10px; background: #F0FDF4; border-radius: 8px; font-size: 13px; }
        .empty-note { color: #94A3B8; font-size: 13px; padding: 14px 0; }
        .msg { font-size: 13px; margin-top: 10px; display: none; }
        .msg.err { color: #DC2626; display: block; }
        .msg.ok { color: #15803D; display: block; }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="menu.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <div class="main-layout">
        <div class="topbar">
            <div class="topbar-title">
                <h1>관찰일지·의견 기록</h1>
                <div class="breadcrumb">홈 › 수급자·보호자 › <b>관찰일지·의견 기록</b></div>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>
        <div class="content">
            <div class="panel">
                <label class="lbl" for="resident">수급자</label>
                <select id="resident" class="field" onchange="loadItems()"></select>
            </div>
            <div class="panel">
                <div class="tabs">
                    <button class="tab active" id="tabObs" onclick="setKind('observation')">관찰일지</button>
                    <button class="tab" id="tabFb" onclick="setKind('feedback')">의견수렴·반영</button>
                </div>
                <div class="grid2">
                    <div><label class="lbl" for="logDate">날짜</label><input type="date" id="logDate" class="field"></div>
                    <div id="sourceBox" style="display:none;"><label class="lbl" for="source">의견을 낸 사람</label>
                        <select id="source" class="field"><option>수급자</option><option>보호자</option><option>요양보호사</option><option>기타</option></select></div>
                </div>
                <label class="lbl" for="content" id="contentLbl">관찰 내용</label>
                <textarea id="content" class="field" rows="3"></textarea>
                <div id="actionBox" style="display:none;">
                    <label class="lbl" for="action">반영 내용 (반영하지 않았다면 이유)</label>
                    <textarea id="action" class="field" rows="2"></textarea>
                </div>
                <div style="display:flex;justify-content:flex-end;margin-top:12px;"><button class="btn-solid" onclick="save()">저장</button></div>
                <div class="msg" id="msg"></div>
            </div>
            <div class="panel">
                <h2 id="listTitle">기록 목록</h2>
                <div id="items"><div class="empty-note">수급자를 고르세요.</div></div>
            </div>
        </div>
    </div>
    <script>
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
        const user = JSON.parse(localStorage.getItem('user') || 'null') || {};
        let kind = 'observation';
        let editingId = null;
        let items = [];

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html';
            }
        }
        async function api(path, options = {}) {
            const r = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('access_token')}`, ...(options.headers || {}) } });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '처리하지 못했습니다');
            return d;
        }
        function setMsg(text, ok) { const m = document.getElementById('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

        function setKind(k) {
            kind = k;
            document.getElementById('tabObs').classList.toggle('active', k === 'observation');
            document.getElementById('tabFb').classList.toggle('active', k === 'feedback');
            document.getElementById('sourceBox').style.display = k === 'feedback' ? '' : 'none';
            document.getElementById('actionBox').style.display = k === 'feedback' ? '' : 'none';
            document.getElementById('contentLbl').textContent = k === 'feedback' ? '의견 내용' : '관찰 내용';
            document.getElementById('listTitle').textContent = k === 'feedback' ? '의견수렴·반영 기록' : '관찰일지';
            resetForm();
            loadItems();
        }

        function resetForm() {
            editingId = null;
            document.getElementById('content').value = '';
            document.getElementById('action').value = '';
            document.getElementById('logDate').value = new Date().toISOString().slice(0, 10);
        }

        async function loadResidents() {
            const d = await api('/api/v1/residents/');
            const list = d.residents || d.data || [];
            document.getElementById('resident').innerHTML = list.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
            loadItems();
        }

        async function loadItems() {
            const rid = document.getElementById('resident').value;
            const box = document.getElementById('items');
            if (!rid) { box.innerHTML = '<div class="empty-note">수급자가 없습니다.</div>'; return; }
            try {
                const d = await api(`/api/v1/resident-logs?resident_id=${rid}&kind=${kind}`);
                items = d.data.items;
                box.innerHTML = items.length ? items.map(i => `<div class="item">
                    <b>${esc(i.log_date)}</b>${i.source ? ` · ${esc(i.source)}가 의견` : ''}
                    <div style="margin-top:4px;white-space:pre-wrap;">${esc(i.content)}</div>
                    ${i.kind === 'feedback' ? `<div class="action">${i.action ? '반영: ' + esc(i.action) : '<span class="meta">반영 내용 없음</span>'}</div>` : ''}
                    <div class="meta">${esc(i.author_name)} · ${esc(i.updated_at)} <button class="btn-outline" style="margin-left:8px;" onclick="editItem(${i.id})">수정</button></div>
                </div>`).join('') : '<div class="empty-note">기록이 없습니다.</div>';
            } catch (e) { box.innerHTML = `<div class="empty-note">${esc(e.message)}</div>`; }
        }

        function editItem(id) {
            const i = items.find(x => x.id === id);
            editingId = id;
            document.getElementById('logDate').value = i.log_date;
            document.getElementById('content').value = i.content;
            if (kind === 'feedback') {
                document.getElementById('source').value = i.source;
                document.getElementById('action').value = i.action;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function save() {
            const body = {
                resident_id: parseInt(document.getElementById('resident').value, 10),
                log_date: document.getElementById('logDate').value,
                kind,
                content: document.getElementById('content').value,
                source: kind === 'feedback' ? document.getElementById('source').value : null,
                action: kind === 'feedback' ? document.getElementById('action').value : null,
            };
            try {
                if (editingId) await api(`/api/v1/resident-logs/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
                else await api('/api/v1/resident-logs', { method: 'POST', body: JSON.stringify(body) });
                setMsg('저장했습니다.', true);
                resetForm();
                loadItems();
            } catch (e) { setMsg(e.message, false); }
        }

        (function init() {
            if (typeof renderSidebar === 'function') renderSidebar();
            document.getElementById('userName').textContent = user.full_name || '';
            document.getElementById('userRole').textContent = user.role === 'social_worker' ? '사회복지사' : (user.role === 'center_manager' ? '센터장' : '요양보호사');
            resetForm();
            loadResidents().catch(e => setMsg(e.message, false));
        })();
    </script>
</body>
</html>
