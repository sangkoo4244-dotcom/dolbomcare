<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 나의 급여</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">💵 나의 급여</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500" id="userRole">역할</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="message" class="hidden mb-6 p-4 rounded-lg animate-in fade-in slide-in-from-top-2"></div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📊 이번 달 급여 요약</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-lg border border-blue-200">
                            <div class="text-sm text-blue-600 font-bold mb-2">청부액</div>
                            <div class="text-3xl font-bold text-blue-900" id="totalBillingAmount">₩0</div>
                            <div class="text-xs text-blue-500 mt-2">이번 달 총 청부액</div>
                        </div>
                        <div class="bg-gradient-to-br from-amber-50 to-amber-100 p-6 rounded-lg border border-amber-200">
                            <div class="text-sm text-amber-600 font-bold mb-2">세금·보험료</div>
                            <div class="text-3xl font-bold text-amber-900" id="taxAmount">-₩0</div>
                            <div class="text-xs text-amber-500 mt-2">소득세 + 4대보험</div>
                        </div>
                        <div class="bg-gradient-to-br from-purple-50 to-purple-100 p-6 rounded-lg border border-purple-200">
                            <div class="text-sm text-purple-600 font-bold mb-2">기타 공제</div>
                            <div class="text-3xl font-bold text-purple-900" id="deductionAmount">-₩0</div>
                            <div class="text-xs text-purple-500 mt-2">특별공제 등</div>
                        </div>
                        <div class="bg-gradient-to-br from-emerald-50 to-emerald-100 p-6 rounded-lg border border-emerald-200">
                            <div class="text-sm text-emerald-600 font-bold mb-2">실수령액</div>
                            <div class="text-3xl font-bold text-emerald-900" id="netSalary">₩0</div>
                            <div class="text-xs text-emerald-500 mt-2">최종 수령액</div>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📋 급여 계산 상세</h2>
                    <div class="space-y-4">
                        <div class="grid grid-cols-3 gap-4 pb-4 border-b border-gray-200">
                            <div><div class="text-xs text-gray-500 font-bold">항목</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500 font-bold">금액</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500 font-bold">비고</div></div>
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div><div class="font-semibold text-gray-900">총 청부액</div></div>
                            <div class="text-right"><div class="text-lg font-bold text-blue-600" id="detail_billing">₩0</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500">기본 + 가산</div></div>
                        </div>
                        <div class="grid grid-cols-3 gap-4 pt-4 border-t border-gray-100">
                            <div><div class="font-semibold text-gray-900">소득세</div></div>
                            <div class="text-right"><div class="text-lg font-bold text-red-600" id="detail_income_tax">-₩0</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500">3.3%</div></div>
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div><div class="font-semibold text-gray-900">국민연금</div></div>
                            <div class="text-right"><div class="text-lg font-bold text-red-600" id="detail_pension">-₩0</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500">9%</div></div>
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div><div class="font-semibold text-gray-900">건강보험</div></div>
                            <div class="text-right"><div class="text-lg font-bold text-red-600" id="detail_health">-₩0</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500">3.49%</div></div>
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div><div class="font-semibold text-gray-900">고용보험</div></div>
                            <div class="text-right"><div class="text-lg font-bold text-red-600" id="detail_employment">-₩0</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500">0.65%</div></div>
                        </div>
                        <div class="grid grid-cols-3 gap-4 pt-4 border-t-2 border-gray-300 mt-4">
                            <div><div class="font-bold text-lg text-gray-900">실수령액</div></div>
                            <div class="text-right"><div class="text-2xl font-bold text-emerald-600" id="detail_net">₩0</div></div>
                            <div class="text-right"><div class="text-xs text-gray-500">최종</div></div>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📝 월별 급여 내역</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b-2 border-gray-200">
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">년월</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">청부액</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">세금</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">실수령액</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">수령상태</th>
                                </tr>
                            </thead>
                            <tbody id="salaryTableBody">
                                <tr><td colspan="5" class="py-8 text-center text-gray-400">💵 급여 내역이 없습니다</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        let currentUser = null;
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            renderNavigation();
            loadSalaryData();
        }
        function renderNavigation() {
            const nav = document.getElementById('navContent');
            nav.innerHTML = `
                <a href="./dashboard.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">📊</span>
                    <span>대시보드</span>
                </a>
                <a href="./resident_management.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">👥</span>
                    <span>이용자관리</span>
                </a>
                <a href="./voice_record.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">🎤</span>
                    <span>음성 기록</span>
                </a>
                <a href="./caregiver_billing.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">📋</span>
                    <span>나의 청부</span>
                </a>
                <a href="./my_salary.html" class="flex items-center gap-3 px-4 py-2 rounded-lg bg-emerald-600 text-white transition">
                    <span style="font-size:18px">💵</span>
                    <span>나의 급여</span>
                </a>
                <a href="./my_schedule.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">📅</span>
                    <span>나의 일정</span>
                </a>
                <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition bg-transparent border-none cursor-pointer text-left">
                    <span style="font-size:18px">🚪</span>
                    <span>로그아웃</span>
                </button>
            `;
        }
        function loadSalaryData() {
            const billingAmount = 2660000;
            const incomeTax = Math.round(billingAmount * 0.033);
            const pension = Math.round(billingAmount * 0.09);
            const health = Math.round(billingAmount * 0.0349);
            const employment = Math.round(billingAmount * 0.0065);
            const totalTax = incomeTax + pension + health + employment;
            const netSalary = billingAmount - totalTax;
            document.getElementById('totalBillingAmount').textContent = `₩${billingAmount.toLocaleString()}`;
            document.getElementById('taxAmount').textContent = `-₩${totalTax.toLocaleString()}`;
            document.getElementById('deductionAmount').textContent = `-₩0`;
            document.getElementById('netSalary').textContent = `₩${netSalary.toLocaleString()}`;
            document.getElementById('detail_billing').textContent = `₩${billingAmount.toLocaleString()}`;
            document.getElementById('detail_income_tax').textContent = `-₩${incomeTax.toLocaleString()}`;
            document.getElementById('detail_pension').textContent = `-₩${pension.toLocaleString()}`;
            document.getElementById('detail_health').textContent = `-₩${health.toLocaleString()}`;
            document.getElementById('detail_employment').textContent = `-₩${employment.toLocaleString()}`;
            document.getElementById('detail_net').textContent = `₩${netSalary.toLocaleString()}`;
            renderSalaryHistory();
        }
        function renderSalaryHistory() {
            const tbody = document.getElementById('salaryTableBody');
            const months = [
                { month: '2026년 10월', billing: 2660000, tax: 289000, net: 2371000, status: '수령예정' },
                { month: '2026년 09월', billing: 2450000, tax: 267000, net: 2183000, status: '완납' },
                { month: '2026년 08월', billing: 2200000, tax: 240000, net: 1960000, status: '완납' }
            ];
            tbody.innerHTML = months.map(m => `<tr class="border-b border-gray-100 hover:bg-emerald-50 transition"><td class="py-4 px-4 text-gray-900 font-semibold">${m.month}</td><td class="py-4 px-4 text-gray-700">₩${m.billing.toLocaleString()}</td><td class="py-4 px-4 text-red-600">-₩${m.tax.toLocaleString()}</td><td class="py-4 px-4 text-emerald-600 font-bold">₩${m.net.toLocaleString()}</td><td class="py-4 px-4"><span class="px-3 py-1 rounded-full text-xs font-semibold ${m.status === '완납' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">${m.status}</span></td></tr>`).join('');
        }
        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
