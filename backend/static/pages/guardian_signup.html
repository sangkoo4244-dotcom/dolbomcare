<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 보호자 가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-lg border border-gray-200 shadow-sm p-8">
        <div class="text-center mb-6">
            <div class="text-4xl mb-2">❤️</div>
            <h1 class="text-2xl font-bold text-gray-900">보호자 가입</h1>
            <p class="text-sm text-gray-500 mt-2">센터에서 받은 초대 코드를 입력해 주세요. 센터장이 승인하면 이용할 수 있습니다.</p>
        </div>
        <form id="signupForm" class="space-y-4">
            <label class="block"><span class="text-sm font-semibold text-gray-700">초대 코드</span>
                <input id="inviteCode" required maxlength="8" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 uppercase tracking-widest"></label>
            <label class="block"><span class="text-sm font-semibold text-gray-700">이름</span>
                <input id="fullName" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2"></label>
            <label class="block"><span class="text-sm font-semibold text-gray-700">연락처</span>
                <input id="phone" type="tel" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2"></label>
            <label class="block"><span class="text-sm font-semibold text-gray-700">이메일 (로그인 아이디)</span>
                <input id="email" type="email" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2"></label>
            <label class="block"><span class="text-sm font-semibold text-gray-700">비밀번호 (8자 이상)</span>
                <input id="password" type="password" required minlength="8" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2"></label>
            <label class="flex items-start gap-2 text-sm text-gray-600">
                <input id="consent" type="checkbox" required class="mt-1">
                <span>이용자의 방문 기록(방문 시각, 제공 항목, 컨디션, 메모)을 보호자로서 확인하는 데 동의합니다. 개인정보는 이 목적에만 사용합니다.</span>
            </label>
            <div id="message" class="hidden p-3 rounded-lg text-sm"></div>
            <button type="submit" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700">가입 신청</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6"><a href="./login.html" class="text-emerald-700 font-semibold underline">로그인 화면으로</a></p>
    </div>
    <script>
        const API_URL = '/api/v1';
        function showMessage(text, ok) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = `p-3 rounded-lg text-sm ${ok ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-700'}`;
        }
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                invite_code: document.getElementById('inviteCode').value.trim(),
                full_name: document.getElementById('fullName').value.trim(),
                phone: document.getElementById('phone').value.trim() || null,
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
            };
            try {
                const r = await fetch(`${API_URL}/guardian/signup`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) {
                    const msg = Array.isArray(d.detail) ? d.detail.map(x => x.msg).join(', ') : d.detail;
                    showMessage(msg || '가입에 실패했습니다', false);
                    return;
                }
                showMessage(d.message, true);
                e.target.reset();
            } catch (err) {
                showMessage('서버에 연결할 수 없습니다', false);
            }
        });
    </script>
</body>
</html>
