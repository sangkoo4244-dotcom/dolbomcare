<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 가까운 센터 찾기</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        :root {
            --navy: #14283F; --ink: #1E2B26; --muted: #5B6B7A; --teal: #0F8B80; --teal-dark: #0C756C;
            --clay: #B5532F; --clay-bg: #FBEDE7; --line: #E4E1DA; --bg: #F6F4F0;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--bg); min-height: 100vh; }
        body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: var(--ink); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

        .top-bar { background: var(--bg); padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; }
        .top-bar .logo { font-size: 17px; font-weight: 800; color: var(--navy); }
        .top-bar a.back { color: var(--muted); font-weight: 600; font-size: 13.5px; text-decoration: none; }
        .top-bar a.back:hover { color: var(--teal); }

        .col { max-width: 720px; margin: 0 auto; padding: 0 28px; }

        .hero { padding: 36px 0 40px; text-align: center; }
        .hero h1 { font-size: 32px; font-weight: 800; color: var(--navy); margin: 0 0 12px; line-height: 1.35; letter-spacing: -0.01em; }
        .hero p { font-size: 16px; color: var(--muted); margin: 0; line-height: 1.6; }

        .search-field { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 18px; margin-top: 26px; box-shadow: 0 2px 10px rgba(20,40,63,0.04); }
        .search-field:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,139,128,0.12); }
        .search-field svg { width: 19px; height: 19px; color: var(--muted); flex: 0 0 auto; }
        .search-field input { flex: 1; height: 48px; border: none; outline: none; font-size: 16px; background: transparent; color: var(--ink); font-family: inherit; }
        .search-field button { height: 44px; padding: 0 22px; border-radius: 10px; border: none; background: var(--teal); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .search-field button:hover { background: var(--teal-dark); }

        .section { padding: 30px 0; }
        .section + .section { border-top: 1px solid var(--line); }
        .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
        .section-head h2 { font-size: 20px; font-weight: 800; color: var(--navy); margin: 0; }
        .section-head .count { font-size: 13.5px; color: var(--muted); }
        .section-desc { font-size: 14px; color: var(--muted); margin: 6px 0 18px; line-height: 1.55; max-width: 58ch; }
        .section-desc .ref-tag { color: var(--clay); font-weight: 700; }

        .result-list { animation: riseIn .35s ease both; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .center-row { display: flex; align-items: flex-start; gap: 18px; padding: 20px 4px 20px 18px; border-left: 3px solid var(--teal); border-bottom: 1px solid var(--line); background: #fff; }
        .center-row:first-child { border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .center-row:last-child { border-bottom: none; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }
        .center-row img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #F1F5F9; flex: 0 0 auto; margin-top: 2px; }
        .center-row .info { flex: 1; min-width: 160px; }
        .center-row .name { font-size: 18px; font-weight: 800; color: var(--navy); }
        .center-row .meta { font-size: 14.5px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
        .center-row .consult-btn { height: 40px; padding: 0 18px; border-radius: 9px; border: 1.5px solid var(--teal); background: #fff; color: var(--teal); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; align-self: center; }
        .center-row .consult-btn:hover { background: #EDF8F6; }

        .facility-row { padding: 15px 4px; border-bottom: 1px solid var(--line); }
        .facility-row:last-child { border-bottom: none; }
        .facility-row .name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .facility-row .name { font-size: 15.5px; font-weight: 700; color: var(--ink); }
        .facility-row .category { font-size: 12.5px; color: var(--teal); }
        .facility-row .meta { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
        .facility-row a.map-link { font-size: 13px; color: var(--clay); font-weight: 700; text-decoration: none; margin-left: 8px; }
        .facility-row a.map-link:hover { text-decoration: underline; }

        .empty-note { padding: 44px 8px; color: var(--muted); font-size: 14.5px; line-height: 1.6; }

        .nearby-field { margin-top: 2px; }

        /* 상담 신청 모달 */
        .trial-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(20,40,63,0.45); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
        .trial-modal-backdrop.open { display: flex; }
        .trial-modal { background: #fff; border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .trial-modal h3 { font-size: 19px; font-weight: 800; color: var(--navy); margin: 0 0 6px; }
        .trial-modal .trial-modal-sub { font-size: 13.5px; color: var(--muted); margin-bottom: 22px; line-height: 1.55; }
        .trial-modal .field { margin-bottom: 14px; }
        .trial-modal .field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
        .trial-modal .field input {
            width: 100%; height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 9px;
            font-size: 14.5px; background: #fff; color: var(--ink); font-family: inherit;
        }
        .trial-modal .field input:disabled { background: #FAF9F7; color: var(--muted); }
        .trial-modal .field input:focus { border-color: var(--teal); outline: none; }
        .trial-modal-actions { display: flex; gap: 8px; margin-top: 20px; }
        .trial-modal-actions button { flex: 1; height: 46px; border-radius: 9px; font-size: 14.5px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; }
        .trial-modal-cancel { background: #F1EFEA; color: var(--ink); }
        .trial-modal-cancel:hover { background: #E7E4DD; }
        .trial-modal-submit { background: var(--teal); color: #fff; }
        .trial-modal-submit:hover { background: var(--teal-dark); }
        .trial-modal-note { font-size: 12px; color: var(--muted); margin-top: 14px; text-align: center; }

        @media (max-width: 560px) {
            .hero h1 { font-size: 26px; }
            .center-row { flex-wrap: wrap; }
            .center-row .consult-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">돌봄케어</div>
        <a class="back" href="./login.html">로그인으로 돌아가기</a>
    </div>

    <div class="col hero">
        <h1>요양센터, 어디서부터 찾아야 할지<br>막막하신가요</h1>
        <p>지역을 검색하면 돌봄케어와 함께하는 센터부터 보여드립니다. 상담은 바로 신청할 수 있어요.</p>
        <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="searchInput" placeholder="센터명 또는 지역 (예: 강남구)" autocomplete="off">
            <button type="button" onclick="search()">검색</button>
        </div>
    </div>

    <div class="col section">
        <div class="section-head">
            <h2>돌봄케어와 함께하는 센터</h2>
            <span class="count" id="resultCount"></span>
        </div>
        <div id="resultList"></div>
    </div>

    <div class="col section">
        <div class="section-head">
            <h2>더 둘러보기</h2>
        </div>
        <p class="section-desc"><span class="ref-tag">참고용</span> · 카카오맵 검색 결과입니다. 공단이 인증한 기관 목록은 아니니, 정확한 정보는 시설에 직접 확인해 주세요.</p>
        <div class="search-field nearby-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="nearbyInput" placeholder="예: 강남구 요양원, 분당 주야간보호센터" autocomplete="off">
            <button type="button" onclick="searchNearby()">검색</button>
        </div>
        <div class="section-head" style="margin-top:18px;">
            <span></span>
            <span class="count" id="nearbyCount"></span>
        </div>
        <div id="nearbyList"></div>
    </div>

    <div class="trial-modal-backdrop" id="consultBackdrop">
        <div class="trial-modal">
            <h3>상담 신청</h3>
            <p class="trial-modal-sub" id="consultSub"></p>
            <form id="consultForm" novalidate>
                <div class="field">
                    <label for="cCenterName">센터명</label>
                    <input id="cCenterName" disabled>
                </div>
                <div class="field">
                    <label for="cName">신청자명 *</label>
                    <input id="cName" required maxlength="50" autocomplete="name">
                </div>
                <div class="field">
                    <label for="cPhone">연락처 *</label>
                    <input id="cPhone" type="tel" required autocomplete="tel">
                </div>
                <div class="field">
                    <label for="cMessage">문의 내용 (선택)</label>
                    <input id="cMessage" maxlength="200" placeholder="예: 방문요양 상담 받고 싶어요">
                </div>
                <div class="trial-modal-actions">
                    <button type="button" class="trial-modal-cancel" onclick="closeConsultModal()">취소</button>
                    <button type="submit" class="trial-modal-submit">이메일로 신청하기</button>
                </div>
            </form>
            <p class="trial-modal-note">메일 앱이 열리며, 그곳에서 최종 발송해야 신청이 접수됩니다.</p>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let centers = [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        async function search() {
            const q = document.getElementById('searchInput').value.trim();
            const list = document.getElementById('resultList');
            list.innerHTML = '<div class="empty-note">찾는 중...</div>';
            try {
                const res = await fetch(`${API_URL}/centers/directory${q ? `?q=${encodeURIComponent(q)}` : ''}`);
                const d = await res.json();
                centers = d.centers || [];
                render();
            } catch (e) {
                list.innerHTML = '<div class="empty-note">목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
            }
        }

        function render() {
            document.getElementById('resultCount').textContent = centers.length ? `${centers.length}곳` : '';
            const list = document.getElementById('resultList');
            if (!centers.length) {
                list.innerHTML = '<div class="empty-note">아직 이 지역에 공개된 센터가 없습니다. 아래에서 주변 시설을 먼저 둘러보세요.</div>';
                return;
            }
            list.innerHTML = `<div class="result-list">${centers.map((c, i) => `
                <div class="center-row">
                    <img src="${c.logo_image || 'assets/user_design/29_top_profile_icon.png'}" alt="">
                    <div class="info">
                        <div class="name">${escapeHtml(c.name)}</div>
                        <div class="meta">${[c.address, c.phone].filter(Boolean).map(escapeHtml).join(' · ')}</div>
                    </div>
                    <button type="button" class="consult-btn" onclick="openConsultModal(${i})">상담 신청</button>
                </div>`).join('')}</div>`;
        }

        function openConsultModal(i) {
            const c = centers[i];
            document.getElementById('cCenterName').value = c.name;
            document.getElementById('consultSub').textContent = `${c.name}에 상담을 신청합니다. 아래 정보를 보내주시면 센터에서 연락드립니다.`;
            document.getElementById('consultBackdrop').classList.add('open');
            document.getElementById('cName').focus();
        }

        function closeConsultModal() {
            document.getElementById('consultBackdrop').classList.remove('open');
        }

        document.getElementById('consultBackdrop').addEventListener('click', (e) => {
            if (e.target.id === 'consultBackdrop') closeConsultModal();
        });

        document.getElementById('consultForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!e.currentTarget.reportValidity()) return;
            const v = (id) => document.getElementById(id).value.trim();
            const subject = '[돌봄케어 상담 신청] ' + v('cCenterName');
            const body = [
                '관심 센터: ' + v('cCenterName'),
                '신청자명: ' + v('cName'),
                '연락처: ' + v('cPhone'),
                '문의 내용: ' + (v('cMessage') || '(없음)'),
            ].join('\n');
            location.href = 'mailto:contact@eeum-logic.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
            closeConsultModal();
        });

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') search();
        });

        async function searchNearby() {
            const q = document.getElementById('nearbyInput').value.trim();
            const list = document.getElementById('nearbyList');
            if (!q) { alert('검색어를 입력해 주세요 (예: 강남구 요양원)'); return; }
            list.innerHTML = '<div class="empty-note">찾는 중...</div>';
            document.getElementById('nearbyCount').textContent = '';
            try {
                const res = await fetch(`${API_URL}/centers/nearby-facilities?q=${encodeURIComponent(q)}`);
                const d = await res.json();
                if (!d.ok) {
                    list.innerHTML = `<div class="empty-note">${escapeHtml(d.message || '검색 기능을 쓸 수 없습니다')}</div>`;
                    return;
                }
                if (!d.places.length) {
                    list.innerHTML = '<div class="empty-note">검색 결과가 없습니다. 다른 지역명으로 찾아보세요.</div>';
                    return;
                }
                document.getElementById('nearbyCount').textContent = `${d.places.length}곳`;
                list.innerHTML = `<div class="result-list">${d.places.map(p => `
                    <div class="facility-row">
                        <div class="name-line">
                            <span class="name">${escapeHtml(p.name)}</span>
                            ${p.category ? `<span class="category">${escapeHtml(p.category)}</span>` : ''}
                        </div>
                        <div class="meta">${[p.address, p.phone].filter(Boolean).map(escapeHtml).join(' · ')}${p.place_url ? ` <a class="map-link" href="${escapeHtml(p.place_url)}" target="_blank" rel="noopener">지도에서 보기</a>` : ''}</div>
                    </div>`).join('')}</div>`;
            } catch (e) {
                list.innerHTML = '<div class="empty-note">검색하지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
            }
        }

        document.getElementById('nearbyInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchNearby();
        });

        search();
    </script>
</body>
</html>
