<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* 대시보드는 일지 줄무늬 없이 깨끗한 바탕에 둔다 (줄이 제목과 그림을 가로지르는 문제) */
        html, body { background-image: none !important; }
        .summary-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            background: var(--sheet);
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 40px;
        }
        .summary-row > div {
            padding: 22px 24px;
        }
        .summary-row > div + div {
            border-left: 1px solid var(--line);
        }
        .summary-label { font-size: 13px; color: var(--ink-soft); }
        .summary-cell { display: flex; align-items: center; gap: 18px; }
        .summary-icon { flex: 0 0 auto; color: var(--ink); }
        .summary-text { min-width: 0; }
        .metric-art { width: 44px; height: 44px; display: block; }
        .summary-value {
            font-size: 30px;
            font-weight: 700;
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
        }
        .summary-note { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

        .section-title {
            font-family: 'Gowun Batang', serif;
            font-size: 22px;
            margin: 0 0 4px;
        }
        .section-sub { font-size: 14px; color: var(--ink-soft); margin: 0 0 24px; }

        /* 타임라인: 시간, 선, 내용 세 열 */
        .timeline { position: relative; list-style: none; margin: 0; padding: 0; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 96px;
            top: 8px;
            bottom: 8px;
            width: 1px;
            background: var(--line);
        }
        .tl-item {
            display: grid;
            grid-template-columns: 72px 48px 1fr;
            align-items: start;
            padding: 14px 0;
        }
        .tl-time {
            font-size: 15px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            padding-top: 2px;
        }
        .tl-stamp {
            position: relative;
            z-index: 1;
            margin-left: 9px;
            margin-top: -2px;
            transform: rotate(-4deg);
        }
        .tl-body { padding-left: 4px; }
        .tl-name { font-size: 16px; font-weight: 700; }
        .tl-meta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; line-height: 1.6; }
        .tl-state { font-size: 13px; font-weight: 500; margin-top: 6px; }
        .tl-item.now .tl-state { color: var(--persimmon); }

        .empty { padding: 32px 0; color: var(--ink-soft); font-size: 15px; }
        .empty p { margin: 12px 0 0; }
        .empty-art { width: 96px; height: auto; display: block; }

        .task-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
        .task-list li { border-bottom: 1px solid var(--line); }
        .task-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px;
            color: var(--ink);
            text-decoration: none;
        }
        .task-list a:hover { background: #EEF2EE; }
        .task-count { font-variant-numeric: tabular-nums; font-weight: 700; }
        .task-main { display: flex; align-items: center; gap: 16px; }
        .task-ico svg { width: 56px; height: 56px; display: block; }
        .metric-art, .illus-art, .metric-img { width: 84px; height: 84px; display: block; }
        .metric-img { object-fit: contain; }
        .task-ico img { width: 44px; height: 44px; display: block; object-fit: contain; }
        .task-ico svg { width: 44px; height: 44px; display: block; }
        .dash-banner { width: 100%; height: auto; display: block; border-radius: 8px; margin-bottom: 32px; }
        .design-metric { width: 96px; height: auto; display: block; }
        .panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 24px 28px; }
        .hero { display: flex; justify-content: space-between; align-items: center; gap: 24px; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 28px 32px; margin-bottom: 32px; }
        .hero-kicker { font-size: 14px; color: var(--ink-soft); margin: 0 0 8px; }
        .hero-title { font-family: 'Gowun Batang', serif; font-size: 32px; line-height: 1.3; margin: 0 0 10px; }
        .hero-sub { font-size: 15px; color: var(--ink-soft); margin: 0; }
        .hero-img { width: 300px; max-width: 42%; height: auto; display: block; }
        .cg-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 40px; }
        @media (max-width: 900px) {
            .hero { flex-direction: column-reverse; align-items: flex-start; }
            .hero-img { max-width: 100%; width: 100%; }
            .cg-grid { grid-template-columns: 1fr; }
        }
        .task-chev { display: inline-block; margin-left: 14px; color: var(--ink-soft); font-size: 22px; line-height: 1; }
        .section-head { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; }
        .section-head .section-title { margin: 0; }
        .section-head img { width: 40px; height: 40px; object-fit: contain; flex: 0 0 auto; }
        .empty-box { border: 1px dashed var(--line); border-radius: 8px; padding: 32px 16px; text-align: center; color: var(--ink-soft); background: var(--sheet); }
        .empty-scene { width: min(380px, 100%); height: auto; display: block; margin: 0 auto; }
        .header-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--sheet); border: 1px solid var(--line); }

        /* 한 번만 나타나는 움직임 (동작 줄이기 설정이면 생략) */
        @keyframes tl-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .tl-item { animation: tl-in 0.4s ease both; }
        .tl-item:nth-child(2) { animation-delay: 0.05s; }
        .tl-item:nth-child(3) { animation-delay: 0.1s; }
        .tl-item:nth-child(4) { animation-delay: 0.15s; }
        .tl-item:nth-child(5) { animation-delay: 0.2s; }
        @media (prefers-reduced-motion: reduce) { .tl-item { animation: none; } }

        @media (max-width: 900px) {
            .summary-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .summary-row > div:nth-child(3) { border-left: none; }
            .summary-row > div:nth-child(n+3) { border-top: 1px solid var(--line); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- 사이드바 -->
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl"></div>
                <div>
                    <div class="text-lg font-bold">돌봄케어</div>
                    <div class="text-xs text-gray-400">Care Management</div>
                </div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>

        <!-- 메인 컨텐츠 -->
        <main class="ml-72 w-full flex flex-col">
            <!-- 탑바 -->
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900" id="pageTitle"></h1>
                <div class="flex items-center gap-6">
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-900" id="userName">사용자</div>
                        <div class="text-xs text-gray-500" id="userRole">역할</div>
                    </div>
                    <img class="header-avatar" src="assets/hd/user_guardian.png" alt="">
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>

            <!-- 스크롤 컨텐츠 -->
            <div class="flex-1 overflow-y-auto px-8 py-8 w-full" id="dashboardContent">
                <!-- 동적 생성 -->
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script src="art.js"></script>
    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        const DASH_APPROVED = ['approved', 'submitted_to_nhis', 'reimbursed'];
        const STATE_LABEL = { '예정': '예정', '방문중': '방문 중', '방문완료': '기록 작성 필요', '완료': '완료', '미기록': '미기록', '승인 대기': '승인 대기', '반려': '반려' };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) {
                window.location.href = './login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            renderSidebar();
            if (user.role === 'caregiver') {
                renderCaregiverDashboard();
            } else {
                renderManagerDashboard();
            }
        }

        function emptyState(text, art = ART.sprout) {
            return `<div class="empty">${art}<p>${text}</p></div>`;
        }

        // 직접 그린 그림 파일 (assets/)을 아이콘 자리에 넣는다
        function imgIcon(file, cls = 'metric-img') {
            return `<img class="${cls}" src="assets/hd/${file}" alt="">`;
        }

        // 디자인 시안 그림 (assets/user_design/): 요약 칸에서 더 크게 쓴다
        function designImg(file) {
            return `<img class="design-metric" src="assets/user_design/${file}" alt="">`;
        }

        function summaryRow(items) {
            return `<div class="summary-row">${items.map(([label, id, note, icon]) => `
                <div class="summary-cell">
                    ${icon ? `<div class="summary-icon">${icon}</div>` : ''}
                    <div class="summary-text">
                        <div class="summary-label">${label}</div>
                        <div class="summary-value" id="${id}">0</div>
                        <div class="summary-note">${note}</div>
                    </div>
                </div>`).join('')}</div>`;
        }

        function renderCaregiverDashboard() {
            document.getElementById('pageTitle').textContent = '';
            document.getElementById('dashboardContent').innerHTML = `
                <div class="hero">
                    <div>
                        <p class="hero-kicker">${new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' })}</p>
                        <h2 class="hero-title">오늘도 따뜻한 돌봄이<br>이어집니다</h2>
                        <p class="hero-sub">방문 순서를 확인하고, 끝난 방문은 바로 기록해 주세요.</p>
                    </div>
                    ${imgIcon('user_caregiver_scene.png', 'hero-img')}
                </div>
                ${summaryRow([
                    ['오늘 방문', 'todayVisits', '계획된 방문', ART.illus.clock],
                    ['기록 필요', 'needRecord', '방문을 마치고 기록 전', ART.illus.checklist],
                    ['이번 달 청부', 'monthlyBilling', '반려 제외 금액', imgIcon('user_wallet.png')],
                    ['검토 대기 청부', 'pendingBilling', '센터장 승인 전', ART.illus.doc],
                ])}
                <div class="cg-grid">
                    <section>
                        <h2 class="section-title">오늘의 방문 순서</h2>
                        <p class="section-sub">시간 순서대로 보여 줍니다. 도착과 퇴실은 나의 일정에서 누릅니다.</p>
                        <div id="timeline"><div class="empty">불러오는 중입니다</div></div>
                    </section>
                    <section>
                        <h2 class="section-title">나의 할 일</h2>
                        <p class="section-sub">눌러서 해당 화면으로 이동합니다.</p>
                        <ul class="task-list">
                            <li><a href="./voice_record.html"><span class="task-main"><span class="task-ico">${imgIcon('user_checklist.png')}</span><span>기록 작성</span></span><span class="task-count" id="taskRecord">0건<span class="task-chev">›</span></span></a></li>
                            <li><a href="./caregiver_billing.html"><span class="task-main"><span class="task-ico">${ART.illus.doc}</span><span>청부 확인</span></span><span class="task-count" id="taskBilling">0건<span class="task-chev">›</span></span></a></li>
                            <li><a href="./my_schedule.html"><span class="task-main"><span class="task-ico">${imgIcon('user_calendar.png')}</span><span>나의 일정</span></span><span class="task-count" id="taskSchedule">0건<span class="task-chev">›</span></span></a></li>
                        </ul>
                    </section>
                </div>
            `;
            loadCaregiverData();
        }

        function renderManagerDashboard() {
            document.getElementById('pageTitle').textContent = '';
            document.getElementById('dashboardContent').innerHTML = `
                <img class="dash-banner" src="assets/user_design/dashboard_banner.png" alt="">
                ${summaryRow([
                    ['요양사', 'totalStaff', '명', designImg('icon_metric_caregiver.png')],
                    ['이용자', 'totalResidents', '명', designImg('icon_metric_user.png')],
                    ['이번 달 승인 금액', 'monthlyRevenue', '승인 이후 청부 합계', designImg('icon_metric_payment.png')],
                    ['처리할 일', 'pendingApprovals', '승인·확정이 필요한 항목', designImg('icon_metric_task.png')],
                ])}
                <div class="cg-grid">
                    <section class="panel">
                        <div class="section-head">${imgIcon('user_calendar.png', '')}<h2 class="section-title">오늘 들어온 방문 기록</h2></div>
                        <p class="section-sub">요양사가 오늘 저장한 기록을 시간 순서로 보여 줍니다.</p>
                        <div id="timeline"><div class="empty">불러오는 중입니다</div></div>
                    </section>
                    <section class="panel">
                        <div class="section-head">${imgIcon('user_clock.png', '')}<h2 class="section-title">처리할 일</h2></div>
                        <p class="section-sub">눌러서 해당 화면으로 이동합니다.</p>
                        <ul class="task-list" id="taskList"></ul>
                    </section>
                </div>
            `;
            loadManagerData();
        }

        // 도장: 완료(완)는 채운 도장, 진행 중(중)은 채운 칸, 예정(예)은 빈 칸
        function timelineItem(time, name, meta, state, cls, glyph = '예') {
            const seal = cls === 'done' ? 'filled' : (cls === 'now' ? 'filled' : 'empty');
            return `
                <li class="tl-item ${cls}">
                    <div class="tl-time">${time}</div>
                    <div><span class="seal tl-stamp ${seal}">${glyph}</span></div>
                    <div class="tl-body">
                        <div class="tl-name">${escapeHtml(name)}</div>
                        <div class="tl-meta">${escapeHtml(meta)}</div>
                        <div class="tl-state">${escapeHtml(state)}</div>
                    </div>
                </li>`;
        }

        async function loadCaregiverData() {
            try {
                const now = new Date();
                const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                const [recs, bills, plan] = await Promise.all([
                    fetch(`${API_URL}/records/all?caregiver_id=${currentUser.id}`).then(r => r.json()),
                    fetch(`${API_URL}/billing/?caregiver_id=${currentUser.id}&include_archived=true`).then(r => r.json()),
                    fetch(`${API_URL}/schedule/caregiver-view?caregiver_id=${currentUser.id}&year_month=${ym}&user_id=${currentUser.id}&user_role=${currentUser.role}`).then(r => r.json()),
                ]);

                const today = todayKey();
                const todays = (plan.items || []).filter(i => i.date === today && i.schedule_id);
                const needRecord = todays.filter(i => i.state === '방문완료' || i.state === '미기록').length;
                const monthBills = (bills.records || []).filter(b => {
                    const d = new Date(b.recorded_date);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
                const monthly = monthBills.filter(b => b.approval_status !== 'rejected').reduce((s, b) => s + (b.amount || 0), 0);
                const pending = monthBills.filter(b => b.approval_status === 'pending').length;

                document.getElementById('todayVisits').textContent = todays.length;
                document.getElementById('needRecord').textContent = needRecord;
                document.getElementById('monthlyBilling').textContent = `₩${monthly.toLocaleString()}`;
                document.getElementById('pendingBilling').textContent = pending;
                document.getElementById('taskRecord').innerHTML = `${needRecord}건<span class="task-chev">›</span>`;
                document.getElementById('taskBilling').innerHTML = `${pending}건<span class="task-chev">›</span>`;
                document.getElementById('taskSchedule').innerHTML = `${todays.length}건<span class="task-chev">›</span>`;

                const list = document.getElementById('timeline');
                if (!todays.length) {
                    list.innerHTML = emptyState('오늘 예정된 방문이 없습니다. 나의 일정에서 방문 계획을 제안할 수 있습니다.');
                    return;
                }
                list.innerHTML = `<ul class="timeline">${todays.map(i => {
                    const done = i.state === '완료' || i.state === '방문완료';
                    const now_ = i.state === '방문중';
                    const cls = done ? 'done' : (now_ ? 'now' : '');
                    const meta = `${i.duration_minutes || 60}분 · 계획 항목 ${i.planned_items.length ? i.planned_items.length : 0}개`;
                    const glyph = done ? '완' : (now_ ? '중' : '예');
                    return timelineItem(i.time, i.resident_name || '이용자', meta, STATE_LABEL[i.state] || i.state, cls, glyph);
                }).join('')}</ul>`;
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('timeline').innerHTML = '<div class="empty">오늘 일정을 불러오지 못했습니다.</div>';
            }
        }

        async function loadManagerData() {
            try {
                const centerId = currentUser.center_id || 1;
                const [users, residents, bills, today, requests, plans] = await Promise.all([
                    fetch(`${API_URL}/users/?center_id=${centerId}`).then(r => r.json()),
                    fetch(`${API_URL}/residents/?center_id=${centerId}`).then(r => r.json()),
                    fetch(`${API_URL}/billing/?center_id=${centerId}&include_archived=true`).then(r => r.json()),
                    fetch(`${API_URL}/records/today/center?center_id=${centerId}`).then(r => r.json()),
                    fetch(`${API_URL}/guardian/requests`).then(r => r.json()).catch(() => ({ requests: [] })),
                    fetch(`${API_URL}/schedule/proposals?center_id=${centerId}`).then(r => r.json()).catch(() => ({})),
                ]);

                const now = new Date();
                const monthBills = (bills.records || []).filter(b => {
                    const d = new Date(b.recorded_date);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
                const revenue = monthBills.filter(b => DASH_APPROVED.includes(b.approval_status)).reduce((s, b) => s + (b.amount || 0), 0);
                const pendingClaims = (bills.records || []).filter(b => b.approval_status === 'pending').length;
                const pendingPlans = (Array.isArray(plans) ? plans : (plans.proposals || plans.items || [])).length;
                const pendingGuardians = (requests.requests || []).length;
                const staff = (users.users || []).filter(u => u.role === 'caregiver').length;
                const names = {};
                (users.users || []).forEach(u => names[u.id] = u.full_name);
                const residentNames = {};
                (residents.residents || []).forEach(r => residentNames[r.id] = r.name);

                document.getElementById('totalStaff').textContent = staff;
                document.getElementById('totalResidents').textContent = residents.total_residents ?? (residents.residents || []).length;
                document.getElementById('monthlyRevenue').textContent = `₩${revenue.toLocaleString()}`;
                document.getElementById('pendingApprovals').textContent = pendingClaims + pendingPlans + pendingGuardians;

                const records = today.records || [];
                const list = document.getElementById('timeline');
                list.innerHTML = records.length
                    ? `<ul class="timeline">${records.map(r => {
                        const time = r.recorded_at ? r.recorded_at.slice(11, 16) : '--:--';
                        const meta = `${names[r.caregiver_id] || '요양사'} · ${r.service_type || ''} · 청부 ₩${(r.billing_amount || 0).toLocaleString()}`;
                        return timelineItem(time, residentNames[r.resident_id] || '이용자', meta, '기록 저장됨', 'done', '기');
                    }).join('')}</ul>`
                    : `<div class="empty-box">${imgIcon('user_caregiver_scene.png', 'empty-scene')}<p>오늘 저장된 방문 기록이 없습니다.</p></div>`;

                const tasks = [
                    ['청부 승인 대기', pendingClaims, './billing_management.html', ART.illus.doc],
                    ['방문 계획 승인 대기', pendingPlans, './schedule_approval.html', imgIcon('user_calendar.png')],
                    ['보호자 가입 요청', pendingGuardians, './guardian_management.html', ART.illus.group],
                ];
                document.getElementById('taskList').innerHTML = tasks.map(([label, count, href, icon]) => `
                    <li><a href="${href}"><span class="task-main"><span class="task-ico">${icon}</span><span>${label}</span></span><span class="task-count">${count}건<span class="task-chev">›</span></span></a></li>`).join('');
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('timeline').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>';
            }
        }

        function logout() {
            if (confirm('로그아웃하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
