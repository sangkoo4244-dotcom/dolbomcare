<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- 사이드바 -->
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div>
                    <div class="text-lg font-bold">돌봄케어</div>
                    <div class="text-xs text-gray-400">Care Management</div>
                </div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>

        <!-- 메인 컨텐츠 -->
        <main class="ml-72 w-full flex flex-col">
            <!-- 탑바 -->
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">📊 대시보드</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-900" id="userName">사용자</div>
                        <div class="text-xs text-gray-500" id="userRole">역할</div>
                    </div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>

            <!-- 스크롤 컨텐츠 -->
            <div class="flex-1 overflow-y-auto p-8" id="dashboardContent">
                <!-- 동적 생성 -->
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script>
        const API_URL = '/api/v1';
        let currentUser = null;

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) {
                window.location.href = './login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            renderSidebar();
            if (user.role === 'caregiver') {
                renderCaregiverDashboard();
            } else {
                renderManagerDashboard();
            }
        }


        function renderCaregiverDashboard() {
            const content = document.getElementById('dashboardContent');
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-lg border border-blue-200">
                        <div class="text-sm text-blue-600 font-bold mb-2">오늘 기록</div>
                        <div class="text-3xl font-bold text-blue-900" id="todayRecords">0</div>
                        <div class="text-xs text-blue-500 mt-2">건의 음성 기록</div>
                    </div>
                    <div class="bg-gradient-to-br from-amber-50 to-amber-100 p-6 rounded-lg border border-amber-200">
                        <div class="text-sm text-amber-600 font-bold mb-2">이번 달 청부</div>
                        <div class="text-3xl font-bold text-amber-900" id="monthlyBilling">₩0</div>
                        <div class="text-xs text-amber-500 mt-2">예상 청부액</div>
                    </div>
                    <div class="bg-gradient-to-br from-emerald-50 to-emerald-100 p-6 rounded-lg border border-emerald-200">
                        <div class="text-sm text-emerald-600 font-bold mb-2">대기 청부</div>
                        <div class="text-3xl font-bold text-emerald-900" id="pendingBilling">0</div>
                        <div class="text-xs text-emerald-500 mt-2">승인 대기 중</div>
                    </div>
                    <div class="bg-gradient-to-br from-purple-50 to-purple-100 p-6 rounded-lg border border-purple-200">
                        <div class="text-sm text-purple-600 font-bold mb-2">담당 이용자</div>
                        <div class="text-3xl font-bold text-purple-900" id="residentCount">0</div>
                        <div class="text-xs text-purple-500 mt-2">명의 이용자</div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">🎤 최근 음성 기록</h2>
                    <div id="recentRecords" class="space-y-3">
                        <div class="text-center py-8 text-gray-400">기록이 없습니다</div>
                    </div>
                </div>
            `;
            loadCaregiverData();
        }

        function renderManagerDashboard() {
            const content = document.getElementById('dashboardContent');
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-lg border border-blue-200">
                        <div class="text-sm text-blue-600 font-bold mb-2">전체 요양사</div>
                        <div class="text-3xl font-bold text-blue-900" id="totalStaff">0</div>
                        <div class="text-xs text-blue-500 mt-2">명</div>
                    </div>
                    <div class="bg-gradient-to-br from-amber-50 to-amber-100 p-6 rounded-lg border border-amber-200">
                        <div class="text-sm text-amber-600 font-bold mb-2">전체 이용자</div>
                        <div class="text-3xl font-bold text-amber-900" id="totalResidents">0</div>
                        <div class="text-xs text-amber-500 mt-2">명</div>
                    </div>
                    <div class="bg-gradient-to-br from-emerald-50 to-emerald-100 p-6 rounded-lg border border-emerald-200">
                        <div class="text-sm text-emerald-600 font-bold mb-2">이번 달 수익</div>
                        <div class="text-3xl font-bold text-emerald-900" id="monthlyRevenue">₩0</div>
                        <div class="text-xs text-emerald-500 mt-2">센터 수익</div>
                    </div>
                    <div class="bg-gradient-to-br from-purple-50 to-purple-100 p-6 rounded-lg border border-purple-200">
                        <div class="text-sm text-purple-600 font-bold mb-2">승인 대기</div>
                        <div class="text-3xl font-bold text-purple-900" id="pendingApprovals">0</div>
                        <div class="text-xs text-purple-500 mt-2">건</div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">⚡ 빠른 액션</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <a href="./resident_management.html" class="p-4 border border-gray-200 rounded-lg hover:border-emerald-500 hover:bg-emerald-50 transition text-center">
                            <div class="text-3xl mb-2">👥</div>
                            <div class="font-semibold text-gray-900">이용자 추가</div>
                        </a>
                        <a href="./billing_management.html" class="p-4 border border-gray-200 rounded-lg hover:border-emerald-500 hover:bg-emerald-50 transition text-center">
                            <div class="text-3xl mb-2">💰</div>
                            <div class="font-semibold text-gray-900">청부 관리</div>
                        </a>
                        <a href="./staff_management.html" class="p-4 border border-gray-200 rounded-lg hover:border-emerald-500 hover:bg-emerald-50 transition text-center">
                            <div class="text-3xl mb-2">👔</div>
                            <div class="font-semibold text-gray-900">직원 관리</div>
                        </a>
                        <a href="./monthly_settlement.html" class="p-4 border border-gray-200 rounded-lg hover:border-emerald-500 hover:bg-emerald-50 transition text-center">
                            <div class="text-3xl mb-2">📈</div>
                            <div class="font-semibold text-gray-900">월별 정산</div>
                        </a>
                    </div>
                </div>
            `;
            loadManagerData();
        }

        const DASH_APPROVED = ['approved', 'submitted_to_nhis', 'reimbursed'];

        async function loadCaregiverData() {
            try {
                const [recs, bills] = await Promise.all([
                    fetch(`${API_URL}/records/all?caregiver_id=${currentUser.id}`).then(r => r.json()),
                    fetch(`${API_URL}/billing/?caregiver_id=${currentUser.id}`).then(r => r.json())
                ]);
                const today = new Date().toDateString();
                const now = new Date();
                const todayCount = (recs.records || []).filter(r => new Date(r.recorded_at).toDateString() === today).length;
                const monthBills = (bills.records || []).filter(b => {
                    const d = new Date(b.recorded_date);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
                const monthly = monthBills.filter(b => b.approval_status !== 'rejected').reduce((s, b) => s + (b.amount || 0), 0);
                const pending = monthBills.filter(b => b.approval_status === 'pending').length;
                const residents = new Set(monthBills.map(b => b.resident_id)).size;
                document.getElementById('todayRecords').textContent = todayCount;
                document.getElementById('monthlyBilling').textContent = `₩${monthly.toLocaleString()}`;
                document.getElementById('pendingBilling').textContent = pending;
                document.getElementById('residentCount').textContent = residents;
            } catch (error) {
                console.error('데이터 로드 실패:', error);
            }
        }

        async function loadManagerData() {
            try {
                const centerId = currentUser.center_id || 1;
                const [users, residents, bills] = await Promise.all([
                    fetch(`${API_URL}/users/?center_id=${centerId}`).then(r => r.json()),
                    fetch(`${API_URL}/residents/?center_id=${centerId}`).then(r => r.json()),
                    fetch(`${API_URL}/billing/?center_id=${centerId}`).then(r => r.json())
                ]);
                const now = new Date();
                const monthBills = (bills.records || []).filter(b => {
                    const d = new Date(b.recorded_date);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
                const revenue = monthBills.filter(b => DASH_APPROVED.includes(b.approval_status)).reduce((s, b) => s + (b.amount || 0), 0);
                const pending = (bills.records || []).filter(b => b.approval_status === 'pending').length;
                const staff = (users.users || []).filter(u => u.role === 'caregiver').length;
                document.getElementById('totalStaff').textContent = staff;
                document.getElementById('totalResidents').textContent = residents.total_residents ?? (residents.residents || []).length;
                document.getElementById('monthlyRevenue').textContent = `₩${revenue.toLocaleString()}`;
                document.getElementById('pendingApprovals').textContent = pending;
            } catch (error) {
                console.error('데이터 로드 실패:', error);
            }
        }
        function logout() {
            if (confirm('로그아웃하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
