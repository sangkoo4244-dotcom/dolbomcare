<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ===== Premium Healthcare Management SaaS 톤 (이 페이지에만 적용, 다른 페이지는 영향 없음) ===== */
        :root {
            --navy: #14283F;
            --navy-soft: #1C3450;
            --teal: #0F8B80;
            --bg: #F5F7FA;
            --charcoal: #243247;
            --warn: #D97706;
            --danger: #DC2626;
        }
        html, body { background: var(--bg) !important; background-image: none !important; }
        body { color: var(--charcoal); }

        /* 사이드바: 네이비 + 그룹 라벨 + 청록 활성 상태 (menu.js는 건드리지 않고 이 페이지에서만 덮어쓴다) */
        .sidebar, aside.w-72 { background: var(--navy) !important; }
        .side-group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #7E93AC; padding: 16px 16px 6px; text-transform: uppercase; }
        #navContent .side-item { color: #C9D6E3; border-radius: 8px; }
        #navContent .side-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
        #navContent .side-item.active, #navContent a[href="dashboard.html"].side-item { background: var(--teal) !important; color: #fff !important; }

        /* 상단 헤더 */
        .dash-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .dash-head h1 { font-size: 26px; font-weight: 800; color: var(--navy); margin: 0 0 4px; }
        .dash-head .dash-sub { font-size: 14px; color: #64748B; }
        .dash-date-chip { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--charcoal); }

        /* 지표 카드 4개 */
        .summary-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
        .summary-row > div { background: #fff; border: 1px solid #E8ECF1; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(20,40,63,0.04); }
        .summary-cell { display: flex; flex-direction: column; gap: 10px; }
        .summary-top { display: flex; align-items: center; justify-content: space-between; }
        .summary-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .summary-icon svg { width: 20px; height: 20px; }
        .summary-row > div:nth-child(1) .summary-icon { background: #E6F7EE; color: #15803D; }
        .summary-row > div:nth-child(2) .summary-icon { background: #E8F1FC; color: #1D4ED8; }
        .summary-row > div:nth-child(3) .summary-icon { background: #FDF1E3; color: #B45309; }
        .summary-row > div:nth-child(4) .summary-icon { background: #F1ECFB; color: #6D28D9; }
        .summary-label { font-size: 13px; font-weight: 600; color: #64748B; }
        .summary-value { font-size: 28px; font-weight: 800; color: var(--navy); line-height: 1.1; font-variant-numeric: tabular-nums; }
        .summary-note { font-size: 12px; color: #94A3B8; }
        .summary-bar { height: 6px; border-radius: 3px; background: #EEF2F6; overflow: hidden; margin-top: 2px; }
        .summary-bar > span { display: block; height: 100%; background: var(--teal); border-radius: 3px; }
        .summary-trend { font-size: 12px; font-weight: 700; }
        .summary-trend.up { color: #15803D; }
        .summary-trend.down { color: var(--danger); }

        /* 가운데 2단 레이아웃 */
        .cg-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 16px; margin-bottom: 16px; }
        .panel { background: #fff; border: 1px solid #E8ECF1; border-radius: 14px; padding: 20px 22px; box-shadow: 0 1px 2px rgba(20,40,63,0.04); }
        .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .section-head-left { display: flex; align-items: center; gap: 8px; }
        .section-head-left svg { width: 18px; height: 18px; color: var(--teal); }
        .section-title { font-size: 16px; font-weight: 800; color: var(--navy); margin: 0; }
        .section-link { font-size: 13px; font-weight: 600; color: var(--teal); text-decoration: none; display: flex; align-items: center; gap: 2px; }

        /* 오늘의 방문 서비스 표 */
        .visit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .visit-table th { text-align: left; font-weight: 700; color: #64748B; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid #EEF2F6; }
        .visit-table td { padding: 10px 10px; border-bottom: 1px solid #F3F5F8; color: var(--charcoal); }
        .visit-table tr:last-child td { border-bottom: none; }
        .visit-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .visit-badge.done { background: #E6F7EE; color: #15803D; }
        .visit-badge.now { background: #E8F1FC; color: #1D4ED8; }
        .visit-badge.wait { background: #F1F5F9; color: #64748B; }
        .visit-badge.no-show { background: #FDE8E8; color: var(--danger); }

        /* 우선 처리 업무 */
        .priority-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
        .priority-list a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: #F8FAFC; text-decoration: none; color: var(--charcoal); transition: background 0.15s; }
        .priority-list a:hover { background: #EEF2F6; }
        .priority-ico { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .priority-ico svg { width: 18px; height: 18px; }
        .priority-list li:nth-child(1) .priority-ico { background: #FDF1E3; color: #B45309; }
        .priority-list li:nth-child(2) .priority-ico { background: #E8F1FC; color: #1D4ED8; }
        .priority-list li:nth-child(3) .priority-ico { background: #F1ECFB; color: #6D28D9; }
        .priority-title { font-size: 14px; font-weight: 700; }
        .priority-desc { font-size: 12px; color: #94A3B8; margin-top: 1px; }
        .priority-count { margin-left: auto; font-size: 18px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }

        /* 하단 분석 영역 */
        .analytics-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .chart-box { position: relative; height: 220px; }
        .donut-wrap { display: flex; align-items: center; gap: 16px; }
        .donut-canvas-wrap { position: relative; width: 120px; height: 120px; flex: 0 0 auto; }
        .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .donut-center b { font-size: 18px; color: var(--navy); }
        .donut-center span { font-size: 11px; color: #94A3B8; }
        .donut-legend { list-style: none; margin: 0; padding: 0; font-size: 12px; flex: 1; }
        .donut-legend li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
        .donut-legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
        .donut-legend .lbl { flex: 1; color: var(--charcoal); }
        .donut-legend .pct { font-weight: 700; color: var(--navy); }

        /* 빠른 이동 */
        .quick-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
        .quick-card { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #E8ECF1; border-radius: 12px; padding: 14px; text-decoration: none; color: var(--charcoal); transition: border-color 0.15s, transform 0.15s; }
        .quick-card:hover { border-color: var(--teal); transform: translateY(-1px); }
        .quick-ico { width: 34px; height: 34px; border-radius: 9px; background: #E6F7EE; color: var(--teal); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .quick-ico svg { width: 17px; height: 17px; }
        .quick-title { font-size: 13px; font-weight: 700; }
        .quick-desc { font-size: 11px; color: #94A3B8; }

        .empty { padding: 32px 0; color: #94A3B8; font-size: 14px; text-align: center; }
        .header-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #fff; border: 1px solid #E2E8F0; }
        .header-bell-wrap { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #F1F5F9; border-radius: 10px; }
        .header-bell-wrap svg { width: 18px; height: 18px; color: var(--charcoal); }
        .header-bell-badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
        .side-icon img { display: block; }
        .side-bottom { display: none; }

        /* 요양사용 카드(성격이 다른 역할이라 같은 카드 톤만 공유) */
        .task-list { list-style: none; margin: 0; padding: 0; }
        .task-list li { border-bottom: 1px solid #F3F5F8; }
        .task-list li:last-child { border-bottom: none; }
        .task-list a { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; color: var(--charcoal); text-decoration: none; }
        .task-list a:hover { background: #F8FAFC; }
        .task-main { display: flex; align-items: center; gap: 12px; }
        .task-ico { width: 32px; height: 32px; border-radius: 9px; background: #E8F1FC; color: #1D4ED8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .task-ico svg { width: 16px; height: 16px; }
        .task-count { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--navy); }
        .task-chev { display: inline-block; margin-left: 10px; color: #94A3B8; font-size: 18px; line-height: 1; }

        @media (max-width: 1100px) {
            .analytics-grid { grid-template-columns: 1fr; }
            .quick-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 900px) {
            .summary-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .cg-grid { grid-template-columns: 1fr; }
            .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- 사이드바 -->
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-hidden flex flex-col">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl"></div>
                <div>
                    <div class="text-lg font-bold">돌봄케어</div>
                    <div class="text-xs text-gray-400">Care Management</div>
                </div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>

        <!-- 메인 컨텐츠 -->
        <main class="ml-72 w-full flex flex-col">
            <!-- 탑바 -->
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-40">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900" id="pageTitle"></h1>
                    <div class="dash-sub" id="pageSub"></div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="dash-date-chip" id="headerDate"></div>
                    <div class="header-bell-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="header-bell-badge" id="headerBellBadge" style="display:none;">0</span>
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-900" id="userName">사용자</div>
                        <div class="text-xs text-gray-500" id="userRole">역할</div>
                    </div>
                    <img class="header-avatar" src="assets/user_design/29_top_profile_icon.png" alt="">
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>

            <!-- 스크롤 컨텐츠 -->
            <div class="flex-1 overflow-y-auto px-8 py-8 w-full" id="dashboardContent">
                <!-- 동적 생성 -->
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script src="art.js"></script>
    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        const DASH_APPROVED = ['approved', 'submitted_to_nhis', 'reimbursed'];
        const STATE_LABEL = { '예정': '예정', '방문중': '방문 중', '방문완료': '기록 작성 필요', '완료': '완료', '미기록': '미기록', '승인 대기': '승인 대기', '반려': '반려' };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function todayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) {
                window.location.href = './login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            document.getElementById('headerDate').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
            renderSidebar();
            groupSidebar();
            if (user.role === 'caregiver') {
                renderCaregiverDashboard();
            } else {
                renderManagerDashboard();
            }
        }

        function emptyState(text) {
            return `<div class="empty">${escapeHtml(text)}</div>`;
        }

        // Lucide 선형 아이콘 (ISC license, assets/icons/) — 색은 부모 요소의 color를 따른다
        const ICO = {
            users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>',
            house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
            wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>',
            clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>',
            fileText: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>',
            calendarCheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="m9 15 2 2 4-4"/></svg>',
            userRound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>',
            trendingUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>',
            banknote: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>',
            idCard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 19a4 4 0 00-8 0"/><path d="M16 10h2"/><path d="M16 14h2"/><circle cx="9" cy="12" r="3"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg>',
            receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V7"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/></svg>',
            pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>',
            clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
        };

        // 사이드바에 섹션 그룹 라벨을 넣는다 (menu.js는 그대로 두고, 이 페이지에서만 DOM을 보정)
        // 요양사·센터장 메뉴 라벨을 모두 포함해 두면, groupSidebar()가 실제로 있는 항목만 걸러서 묶는다
        // (다른 재구축 페이지들과 동일한 SIDE_GROUPS_CG)
        const SIDE_GROUPS_CG = [
            ['매인', ['대시보드']],
            ['대상자 및 인력 관리', ['이용자관리', '보호자 관리', '직원관리']],
            ['방문 서비스 운영', ['음성 기록', '나의 일정', '방문계획 승인', '보호자 소통']],
            ['청구 및 경영 관리', ['나의 청부', '나의 급여', '청부관리', '월별정산', '수익분석', '급여 확정']],
        ];
        function groupSidebar() {
            const nav = document.getElementById('navContent');
            const items = Array.from(nav.querySelectorAll(':scope > a.side-item'));
            if (!items.length) return;
            const byLabel = {};
            items.forEach(item => { byLabel[item.querySelector('span:last-child')?.textContent.trim()] = item; });
            const frag = document.createDocumentFragment();
            SIDE_GROUPS_CG.forEach(([groupLabel, labels]) => {
                const found = labels.map(l => byLabel[l]).filter(Boolean);
                if (!found.length) return;
                const h = document.createElement('div');
                h.className = 'side-group-label';
                h.textContent = groupLabel;
                frag.appendChild(h);
                found.forEach(el => frag.appendChild(el));
            });
            items.forEach(el => { if (!frag.contains(el)) frag.appendChild(el); });
            nav.innerHTML = '';
            nav.appendChild(frag);
        }

        function visitBadge(state) {
            const map = {
                '완료': ['done', '완료'], '방문완료': ['done', '완료'], '기록 저장됨': ['done', '완료'],
                '방문중': ['now', '진행 중'],
                '예정': ['wait', '대기'],
                '미기록': ['no-show', '미방문'],
                '승인 대기': ['wait', '승인 대기'], '반려': ['no-show', '반려'],
            };
            const [cls, label] = map[state] || ['wait', state];
            return `<span class="visit-badge ${cls}">${label}</span>`;
        }

        async function loadCaregiverData() {
            try {
                const now = new Date();
                const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                const [recs, bills, plan] = await Promise.all([
                    fetch(`${API_URL}/records/all?caregiver_id=${currentUser.id}`).then(r => r.json()),
                    fetch(`${API_URL}/billing/?caregiver_id=${currentUser.id}&include_archived=true`).then(r => r.json()),
                    fetch(`${API_URL}/schedule/caregiver-view?caregiver_id=${currentUser.id}&year_month=${ym}&user_id=${currentUser.id}&user_role=${currentUser.role}`).then(r => r.json()),
                ]);

                const today = todayKey();
                const todays = (plan.items || []).filter(i => i.date === today && i.schedule_id);
                const needRecord = todays.filter(i => i.state === '방문완료' || i.state === '미기록').length;
                const monthBills = (bills.records || []).filter(b => {
                    const d = new Date(b.recorded_date);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
                const monthly = monthBills.filter(b => b.approval_status !== 'rejected').reduce((s, b) => s + (b.amount || 0), 0);
                const pending = monthBills.filter(b => b.approval_status === 'pending').length;

                document.getElementById('todayVisits').textContent = todays.length;
                document.getElementById('needRecord').textContent = needRecord;
                document.getElementById('monthlyBilling').textContent = `₩${monthly.toLocaleString()}`;
                document.getElementById('pendingBilling').textContent = pending;
                document.getElementById('taskRecord').innerHTML = `${needRecord}건<span class="task-chev">›</span>`;
                document.getElementById('taskBilling').innerHTML = `${pending}건<span class="task-chev">›</span>`;
                document.getElementById('taskSchedule').innerHTML = `${todays.length}건<span class="task-chev">›</span>`;

                const list = document.getElementById('timeline');
                if (!todays.length) {
                    list.innerHTML = emptyState('오늘 예정된 방문이 없습니다. 나의 일정에서 방문 계획을 제안할 수 있습니다.');
                    return;
                }
                list.innerHTML = `<table class="visit-table"><thead><tr><th>시간</th><th>이용자</th><th>내용</th><th>상태</th></tr></thead><tbody>${todays.map(i => {
                    const meta = `${i.duration_minutes || 60}분 · 계획 항목 ${i.planned_items.length ? i.planned_items.length : 0}개`;
                    return `<tr><td>${i.time}</td><td>${escapeHtml(i.resident_name || '이용자')}</td><td>${escapeHtml(meta)}</td><td>${visitBadge(i.state)}</td></tr>`;
                }).join('')}</tbody></table>`;
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('timeline').innerHTML = emptyState('오늘 일정을 불러오지 못했습니다.');
            }
        }

        let charts = {};
        function donutChart(canvasId, centerEl, legendEl, data, colors) {
            const ctx = document.getElementById(canvasId);
            if (charts[canvasId]) charts[canvasId].destroy();
            const total = data.reduce((s, d) => s + d.value, 0);
            document.getElementById(centerEl).textContent = total ? `${total}` : '-';
            if (!total) {
                document.getElementById(legendEl).innerHTML = `<li class="lbl" style="color:#94A3B8;">데이터 없음</li>`;
                charts[canvasId] = new Chart(ctx, { type: 'doughnut', data: { labels: ['없음'], datasets: [{ data: [1], backgroundColor: ['#EEF2F6'] }] }, options: { cutout: '72%', plugins: { legend: { display: false }, tooltip: { enabled: false } } } });
                return;
            }
            charts[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: data.map(d => d.label), datasets: [{ data: data.map(d => d.value), backgroundColor: colors, borderWidth: 0 }] },
                options: { cutout: '72%', plugins: { legend: { display: false } } }
            });
            document.getElementById(legendEl).innerHTML = data.map((d, i) => `
                <li><span class="dot" style="background:${colors[i]};"></span><span class="lbl">${escapeHtml(d.label)}</span><span class="pct">${total ? Math.round(d.value / total * 100) : 0}%</span></li>`).join('');
        }

        function barChart(canvasId, labels, values) {
            const ctx = document.getElementById(canvasId);
            if (charts[canvasId]) charts[canvasId].destroy();
            charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: '방문 건수', data: values, backgroundColor: '#0F8B80', borderRadius: 4, maxBarThickness: 28 }] },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#EEF2F6' } }, x: { grid: { display: false } } },
                    maintainAspectRatio: false,
                }
            });
        }

        async function loadManagerData() {
            try {
                const centerId = currentUser.center_id || 1;
                const [users, residents, bills, requests, plans, schedulesToday] = await Promise.all([
                    fetch(`${API_URL}/users/?center_id=${centerId}`).then(r => r.json()),
                    fetch(`${API_URL}/residents/?center_id=${centerId}`).then(r => r.json()),
                    fetch(`${API_URL}/billing/?center_id=${centerId}&include_archived=true`).then(r => r.json()),
                    fetch(`${API_URL}/guardian/requests`).then(r => r.json()).catch(() => ({ requests: [] })),
                    fetch(`${API_URL}/schedule/proposals?center_id=${centerId}`).then(r => r.json()).catch(() => ({})),
                    fetch(`${API_URL}/schedule/?center_id=${centerId}`).then(r => r.json()).catch(() => ({ schedules: [] })),
                ]);

                const now = new Date();
                const bRecords = bills.records || [];
                const monthKey = (d) => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth()}`; };
                const thisMonthKey = monthKey(now);
                const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const prevMonthKey = monthKey(prevMonth);
                const monthBills = bRecords.filter(b => monthKey(b.recorded_date) === thisMonthKey);
                const prevMonthBills = bRecords.filter(b => monthKey(b.recorded_date) === prevMonthKey);
                const revenue = monthBills.filter(b => DASH_APPROVED.includes(b.approval_status)).reduce((s, b) => s + (b.amount || 0), 0);
                const prevRevenue = prevMonthBills.filter(b => DASH_APPROVED.includes(b.approval_status)).reduce((s, b) => s + (b.amount || 0), 0);
                const pendingClaims = bRecords.filter(b => b.approval_status === 'pending').length;
                const pendingPlans = (Array.isArray(plans) ? plans : (plans.proposals || plans.items || [])).length;
                const pendingGuardians = (requests.requests || []).length;
                const allStaff = (users.users || []).filter(u => u.role === 'caregiver');
                const activeStaff = allStaff.filter(u => u.employment_status === 'active' || !u.employment_status);
                const names = {};
                (users.users || []).forEach(u => names[u.id] = u.full_name);
                const residentList = residents.residents || [];
                const residentNames = {};
                residentList.forEach(r => residentNames[r.id] = r.name);

                // 지표 카드
                document.getElementById('totalStaff').textContent = allStaff.length;
                document.getElementById('totalStaffNote').innerHTML = allStaff.length
                    ? `재직 인원 · <span style="color:#15803D;font-weight:700;">활동 중 ${activeStaff.length}명 (${Math.round(activeStaff.length / allStaff.length * 100)}%)</span>` : '재직 인원';
                document.getElementById('totalResidents').textContent = residents.total_residents ?? residentList.length;
                document.getElementById('monthlyRevenue').textContent = `₩${revenue.toLocaleString()}`;
                if (prevRevenue > 0) {
                    const diff = Math.round((revenue - prevRevenue) / prevRevenue * 100);
                    document.getElementById('monthlyRevenueNote').innerHTML = `승인 기준 · <span class="summary-trend ${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '▲' : '▼'} 전월 대비 ${Math.abs(diff)}%</span>`;
                }
                document.getElementById('pendingApprovals').textContent = pendingClaims + pendingPlans + pendingGuardians;

                // 오늘의 방문 서비스 표: /schedule/caregiver-view를 요양사별로 모아 오늘 날짜만 뽑는다 (API 추가 변경 없음)
                const today = todayKey();
                const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                const todaySchedules = (schedulesToday.schedules || []).filter(s => s.scheduled_date && s.scheduled_date.slice(0, 10) === today && s.status !== 'cancelled');
                const caregiverIds = [...new Set(todaySchedules.map(s => s.caregiver_id))];
                const perCaregiver = await Promise.all(caregiverIds.map(cid =>
                    fetch(`${API_URL}/schedule/caregiver-view?caregiver_id=${cid}&year_month=${ym}&user_id=${currentUser.id}&user_role=${currentUser.role}`).then(r => r.json()).catch(() => ({ items: [] }))
                ));
                const itemsById = {};
                perCaregiver.forEach(p => (p.items || []).forEach(it => { if (it.schedule_id) itemsById[it.schedule_id] = it; }));

                const visitRows = todaySchedules.map(s => {
                    const detail = itemsById[s.id];
                    return {
                        time: detail ? detail.time : new Date(s.scheduled_date).toTimeString().slice(0, 5),
                        resident: residentNames[s.resident_id] || '이용자',
                        caregiver: names[s.caregiver_id] || '요양사',
                        serviceType: SERVICE_LABEL[s.service_type] || s.service_type || '-',
                        state: detail ? detail.state : (s.status === 'completed' ? '완료' : '예정'),
                    };
                }).sort((a, b) => a.time.localeCompare(b.time));

                const visitTable = document.getElementById('visitTable');
                visitTable.innerHTML = visitRows.length
                    ? `<table class="visit-table"><thead><tr><th>시간</th><th>이용자</th><th>담당 요양보호사</th><th>서비스 종류</th><th>상태</th></tr></thead><tbody>${visitRows.map(v => `
                        <tr><td>${v.time}</td><td>${escapeHtml(v.resident)}</td><td>${escapeHtml(v.caregiver)}</td><td>${escapeHtml(v.serviceType)}</td><td>${visitBadge(v.state)}</td></tr>`).join('')}</tbody></table>`
                    : emptyState('오늘 예정된 방문 서비스가 없습니다.');

                // 우선 처리 업무
                const tasks = [
                    ['청구 승인 대기', pendingClaims, './billing_management.html', ICO.fileText, '방문기록 기반 청구 승인'],
                    ['방문 계획 승인', pendingPlans, './schedule_approval.html', ICO.calendarCheck, '신규 및 변경 방문 계획'],
                    ['보호자 가입 요청', pendingGuardians, './guardian_management.html', ICO.userRound, '보호자 계정 승인'],
                ];
                document.getElementById('taskList').innerHTML = tasks.map(([label, count, href, icon, desc]) => `
                    <li><a href="${href}"><span class="priority-ico">${icon}</span><div><div class="priority-title">${label}</div><div class="priority-desc">${desc}</div></div><span class="priority-count">${count}건</span></a></li>`).join('');

                // 서비스 종류별 비율 (이번 달 청구 기준, 실제 service_type)
                const svcCounts = {};
                monthBills.forEach(b => { const k = SERVICE_LABEL[b.service_type] || '기타'; svcCounts[k] = (svcCounts[k] || 0) + 1; });
                const svcData = Object.entries(svcCounts).map(([label, value]) => ({ label, value }));
                donutChart('chartService', 'serviceCenterNum', 'serviceLegend', svcData, ['#0F8B80', '#1D4ED8', '#B45309', '#DC2626', '#64748B']);

                // 이용자 건강 상태 (실제 health_status 필드)
                const healthCounts = {};
                residentList.forEach(r => { const k = HEALTH_LABEL[r.health_status] || '미등록'; healthCounts[k] = (healthCounts[k] || 0) + 1; });
                const healthData = Object.entries(healthCounts).map(([label, value]) => ({ label, value }));
                donutChart('chartHealth', 'healthCenterNum', 'healthLegend', healthData, ['#15803D', '#B45309', '#DC2626', '#94A3B8']);

                // 월별 방문 건수 추이 (최근 6개월, 승인 청구 건수 = 실제 방문 수 근사치)
                const monthLabels = [];
                const monthCounts = [];
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const key = monthKey(d);
                    monthLabels.push(`${d.getMonth() + 1}월`);
                    monthCounts.push(bRecords.filter(b => monthKey(b.recorded_date) === key).length);
                }
                barChart('chartMonthly', monthLabels, monthCounts);
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('visitTable').innerHTML = emptyState('데이터를 불러오지 못했습니다.');
            }
        }

        const SERVICE_LABEL = { basic_care: '기본 돌봄', meal_service: '식사 지원', medical_care: '의료 돌봄', emergency: '응급 대응' };
        const HEALTH_LABEL = { stable: '안정', warning: '주의', critical: '위험' };

        function logout() {
            if (confirm('로그아웃하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        window.addEventListener('load', checkAuth);
    </script>
