<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청부 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }

        .sidebar {
            width: 288px;
            background: linear-gradient(180deg, #1E2B26 0%, #16201C 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo { font-size: 24px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #3b82f6;
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .nav-item.hidden {
            display: none !important;
        }

        .main-layout {
            margin-left: 288px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            font-size: 13px;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all var(--transition-base);
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .filter-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .table-wrapper {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table thead {
            background: var(--bg-tertiary);
            border-bottom: 2px solid var(--border);
        }

        .table th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
        }

        .table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
        }

        .status-approved {
            background: var(--secondary-light);
            color: #065f46;
        }

        .status-rejected {
            background: var(--danger-light);
            color: #991b1b;
        }

        .status-pending {
            background: var(--warning-light);
            color: #92400e;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .action-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn.success:hover {
            background: var(--secondary-light);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .action-btn.danger:hover {
            background: var(--danger-light);
            border-color: var(--danger);
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-layout {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .content {
                padding: 20px;
            }
        }
    </style>
    <script src="menu.js"></script>
    <script>
        // 필수 네비게이션 함수 (early definition)
        function navigateTo(url) {
            window.location.href = url;
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                localStorage.removeItem('user_role');
                window.location.href = './login.html';
            }
        }
    </script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="side-brand"><div class="side-logo"></div><div><div class="side-title">돌봄케어</div><div class="side-sub">Care Management</div></div></div>
        <nav class="sidebar-nav"></nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1>청부 관리</h1>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">센터장</div>
                    <div class="user-role">관리자</div>
                </div>
                <div class="avatar" id="userAvatar">M</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">전체</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"> 검토대기</div>
                    <div class="stat-value" id="pendingCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"> 센터장승인</div>
                    <div class="stat-value" id="approvedCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"> 공단청구</div>
                    <div class="stat-value" id="submittedToNhisCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"> 정산완료</div>
                    <div class="stat-value" id="reimbursedCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"> 반려</div>
                    <div class="stat-value" id="rejectedCount">0</div>
                </div>
            </div>

            <!-- Archive Tabs -->
            <div class="archive-tabs" style="margin-bottom: 20px; display: flex; gap: 10px; border-bottom: 2px solid var(--border);">
                <button class="archive-tab active" onclick="switchTab('current')" style="padding: 12px 20px; font-weight: 600; color: #3b82f6; border-bottom: 3px solid #3b82f6; background: none; border: none; cursor: pointer;">
                     현재 청부
                </button>
                <button class="archive-tab" onclick="switchTab('archived')" style="padding: 12px 20px; font-weight: 600; color: rgba(0,0,0,0.5); border-bottom: 3px solid transparent; background: none; border: none; cursor: pointer;">
                     아카이브된 청부
                </button>
            </div>

            <!-- Filters -->
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterByStatus('all')">전체</button>
                <button class="filter-btn" onclick="filterByStatus('pending')"> 검토대기</button>
                <button class="filter-btn" onclick="filterByStatus('approved')"> 승인</button>
                <button class="filter-btn" onclick="filterByStatus('submitted_to_nhis')"> 공단청구</button>
                <button class="filter-btn" onclick="filterByStatus('reimbursed')"> 정산</button>
                <button class="filter-btn" onclick="filterByStatus('rejected')"> 반려</button>
                <button class="filter-btn" onclick="approveCleanBilling()" style="background: #B5532F; color: white;"> 정상 건 일괄 승인</button>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>요양사</th>
                            <th>이용자</th>
                            <th>서비스</th>
                            <th style="text-align: right;">금액</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="billingTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                                청부 기록을 로드 중입니다...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';

        // 상태값 한글 변환 함수 (요양보호사/센터장 관점)
        function getStatusLabel(status) {
            const statusMap = {
                'draft': '📝 작성중',
                'pending': '🔍 센터장검토대기',
                'approved': '✅ 센터장승인',
                'submitted_to_nhis': '📤 공단청구',
                'submitted': '📤 공단청구',
                'reimbursed': '💰 정산완료',
                'rejected': '❌ 반려',
                'cancelled': '🚫 취소됨'
            };
            return statusMap[status] || status;
        }

        // 서비스 타입 한글 변환 함수
        function getServiceLabel(type) {
            const serviceMap = {
                'basic_care': '기본 요양',
                'meal_service': '식사 서비스',
                'medical_care': '의료 처치',
                'emergency': '응급 대응'
            };
            return serviceMap[type] || type;
        }


        let currentUser = null;
        let allBillings = [];
        let currentFilter = 'all';
        let currentTab = 'current';  // 'current' or 'archived'

        function loadUserInfo() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = './login.html';
                return;
            }

            // Only center_manager can access this page
            if (user.role !== 'center_manager') {
                alert('센터장만 접근 가능합니다');
                window.location.href = './caregiver_billing.html';
                return;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || user.email.split('@')[0];
            document.getElementById('userAvatar').textContent = (user.full_name || user.email).charAt(0).toUpperCase();

            // 메뉴 필터링
            if (typeof renderSidebar === 'function') {
                renderSidebar();
            }
        }

        async function loadBillingRecords() {
            try {
                const centerId = currentUser?.center_id || 1;
                const includeArchived = currentTab === 'archived' ? 'true' : 'false';
                const response = await fetch(`${API_URL}/billing/?center_id=${centerId}&include_archived=${includeArchived}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error('청부 기록 조회 실패');
                }

                const data = await response.json();
                allBillings = data.records || [];

                // 통계 업데이트 - 활성 청부만 포함 (아카이브 제외)
                const activeOnly = allBillings.filter(r => !r.is_archived);
                const totalCount = activeOnly.length;
                const pendingCount = activeOnly.filter(r => r.approval_status === 'pending').length;
                const approvedCount = activeOnly.filter(r => r.approval_status === 'approved').length;
                const submittedToNhisCount = activeOnly.filter(r => r.approval_status === 'submitted_to_nhis').length;
                const reimbursedCount = activeOnly.filter(r => r.approval_status === 'reimbursed').length;
                const rejectedCount = activeOnly.filter(r => r.approval_status === 'rejected').length;

                document.getElementById('totalCount').textContent = totalCount;
                document.getElementById('pendingCount').textContent = pendingCount;
                document.getElementById('approvedCount').textContent = approvedCount;
                document.getElementById('submittedToNhisCount').textContent = submittedToNhisCount;
                document.getElementById('reimbursedCount').textContent = reimbursedCount;
                document.getElementById('rejectedCount').textContent = rejectedCount;

                console.log('📊 통계 업데이트:', {
                    total: totalCount,
                    pending: pendingCount,
                    approved: approvedCount,
                    submittedToNhis: submittedToNhisCount,
                    reimbursed: reimbursedCount,
                    rejected: rejectedCount
                });

                // 주민 정보 로드 (센터의 모든 주민)
                const residentsRes = await fetch(`${API_URL}/residents/?center_id=${centerId}`);
                const residentsData = residentsRes.ok ? await residentsRes.json() : { residents: [] };
                const residents = residentsData.residents || [];
                const residentMap = {};
                residents.forEach(r => {
                    // 이용자 정보: 이름 (등급 · 소득분류) 형식으로 저장
                    residentMap[r.id] = `${r.name} (${r.care_grade}등급 · ${r.client_type})`;
                });

                renderBillingTable(allBillings, residentMap);
                console.log('✅ 청부 기록 로드 완료:', allBillings.length + '건');
            } catch (error) {
                console.error('❌ 청부 기록 로드 실패:', error);
                document.getElementById('billingTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                            청부 기록을 불러올 수 없습니다: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        function renderBillingTable(records, residentMap = {}) {
            const tbody = document.getElementById('billingTableBody');
            let html = '';

            if (records.length === 0) {
                html = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                            청부 기록이 없습니다
                        </td>
                    </tr>
                `;
            } else {
                records.forEach(record => {
                    const statusClass = `status-${record.approval_status}`;
                    const statusLabel = getStatusLabel(record.approval_status || record.status);
                    const serviceLabel = getServiceLabel(record.service_type);

                    const recordedDate = new Date(record.recorded_date).toLocaleDateString('ko-KR');
                    const residentName = residentMap[record.resident_id] || `ID: ${record.resident_id}`;

                    let actionHtml = '';
                    if (record.approval_status === 'pending') {
                        actionHtml = `
                            <div class="action-buttons">
                                <button class="action-btn success" onclick="approveBilling(${record.id})">승인</button>
                                <button class="action-btn danger" onclick="rejectBilling(${record.id})">거절</button>
                                ${(record.review_flags || []).length ? `<div class="text-xs text-red-600 font-semibold mt-1">⚠️ ${record.review_flags.join(', ')}</div>` : ''}
                            </div>
                        `;
                    } else if (record.approval_status === 'approved') {
                        actionHtml = `
                            <div class="action-buttons">
                                <button class="action-btn primary" onclick="submitToNHIS(${record.id})">건보 청구</button>
                                <button class="action-btn danger" onclick="deleteBilling(${record.id}, '${currentUser.role}')">취소</button>
                            </div>
                        `;
                    } else if (record.approval_status === 'submitted_to_nhis') {
                        // 건보 청구됨 - 센터장이 수동으로 확인 후 처리
                        actionHtml = `
                            <div class="action-buttons">
                                <button class="action-btn success" onclick="confirmReimbursement(${record.id})">환급 확인</button>
                                <button class="action-btn warning" onclick="cancelNHISSubmission(${record.id})">취소</button>
                            </div>
                        `;
                    } else if (record.approval_status === 'reimbursed') {
                        // 환급완료 (아카이브됨)
                        actionHtml = '-';
                    }

                    html += `
                        <tr>
                            <td>${recordedDate}</td>
                            <td>${record.caregiver_name || '미등록'}</td>
                            <td>${residentName}</td>
                            <td>${serviceLabel}</td>
                            <td style="text-align: right;">${record.amount?.toLocaleString() || '0'}원</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td>${actionHtml || '-'}</td>
                        </tr>
                    `;
                });
            }

            tbody.innerHTML = html;
        }

        async function filterByStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const filtered = currentFilter === 'all'
                ? allBillings
                : allBillings.filter(b => b.approval_status === currentFilter);

            console.log('🔍 필터:', {
                status: currentFilter,
                count: filtered.length,
                records: filtered.map(r => r.approval_status)
            });

            // 주민 정보 로드 (센터의 모든 주민)
            try {
                const centerId = currentUser?.center_id || 1;
                const residentsRes = await fetch(`${API_URL}/residents/?center_id=${centerId}`);
                const residentsData = residentsRes.ok ? await residentsRes.json() : { residents: [] };
                const residents = residentsData.residents || [];
                const residentMap = {};
                residents.forEach(r => {
                    // 이용자 정보: 이름 (등급 · 소득분류) 형식으로 저장
                    residentMap[r.id] = `${r.name} (${r.care_grade}등급 · ${r.client_type})`;
                });
                renderBillingTable(filtered, residentMap);
            } catch (error) {
                console.error('❌ 주민 정보 로드 실패:', error);
                renderBillingTable(filtered, {});
            }
        }

        async function approveCleanBilling() {
            const response = await fetch(`${API_URL}/billing/?center_id=${currentUser?.center_id || 1}`);
            const records = (await response.json()).records || [];
            const pending = records.filter(r => r.approval_status === 'pending');
            const clean = pending.filter(r => !(r.review_flags || []).length);
            const flagged = pending.length - clean.length;
            if (clean.length === 0) {
                alert(`일괄 승인할 정상 건이 없습니다. 확인 필요 ${flagged}건은 개별로 확인해 주세요.`);
                return;
            }
            if (!confirm(`정상 건 ${clean.length}건을 승인합니다. 확인 필요 ${flagged}건은 제외됩니다. 계속할까요?`)) return;
            let approved = 0;
            for (const r of clean) {
                const result = await fetch(`${API_URL}/billing/${r.id}/approve`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, user_role: 'center_manager', reason: '' })
                });
                if (result.ok) approved++;
            }
            alert(`${approved}건을 승인했습니다. 확인 필요 ${flagged}건은 개별로 처리해 주세요.`);
            loadBillingRecords();
        }

        async function approveBilling(recordId) {
            if (!confirm('이 청부를 승인하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('승인 실패');
                }

                alert('청부가 승인되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 승인 오류:', error);
                alert('승인 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function rejectBilling(recordId) {
            const reason = prompt('거절 사유를 입력하세요:');
            if (reason === null) return;
            if (!reason.trim()) {
                alert('거절 사유를 입력해 주세요');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role,
                        reason: reason
                    })
                });

                if (!response.ok) {
                    throw new Error('거절 실패');
                }

                alert('청부가 거절되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 거절 오류:', error);
                alert('거절 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function submitToNHIS(recordId) {
            if (!confirm('이 청부를 건강보험공단에 청구하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/submit-to-nhis`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('건보 청구 실패');
                }

                alert('청부가 건강보험공단에 청구되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 건보 청구 오류:', error);
                alert('건보 청구 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function confirmReimbursement(recordId) {
            if (!confirm('건보 환급을 확인하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/confirm-reimbursement`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('환급 확인 실패');
                }

                alert('환급이 확인되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 환급 확인 오류:', error);
                alert('환급 확인 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function cancelNHISSubmission(recordId) {
            if (!confirm('건보 청구를 취소하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/cancel-nhis-submission`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('건보 청구 취소 실패');
                }

                alert('건보 청구가 취소되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 건보 청구 취소 오류:', error);
                alert('건보 청구 취소 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function resubmitToNHIS(recordId) {
            if (!confirm('건보 반려된 청부를 다시 청구하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/billing/${recordId}/submit-to-nhis`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        user_role: currentUser.role
                    })
                });

                if (!response.ok) {
                    throw new Error('재청구 실패');
                }

                alert('청부가 다시 건강보험공단에 청구되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 재청구 오류:', error);
                alert('재청구 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function deleteBilling(recordId, userRole) {
            if (!confirm('이 청부를 이전 단계로 되돌리시겠습니까?')) return;

            try {
                // 승인됨 → 대기 중으로 되돌리기
                const response = await fetch(`${API_URL}/billing/${recordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        approval_status: 'pending',
                        user_id: currentUser.id,
                        user_role: userRole
                    })
                });

                if (!response.ok) {
                    throw new Error('상태 변경 실패');
                }

                alert('청부 상태가 대기 중으로 변경되었습니다');
                loadBillingRecords();
            } catch (error) {
                console.error('❌ 상태 변경 오류:', error);
                alert('상태 변경 중 오류가 발생했습니다: ' + error.message);
            }
        }

        let autoRefreshInterval = null;

        async function refreshBillingData() {
            try {
                // center_id 포함해서 API 호출
                const centerId = currentUser?.center_id || 1;
                const includeArchived = currentTab === 'archived' ? 'true' : 'false';
                const apiUrl = `${API_URL}/billing/?center_id=${centerId}&include_archived=${includeArchived}`;

                console.log('🔄 API 호출 정보:', {
                    url: apiUrl,
                    centerId: centerId,
                    currentTab: currentTab,
                    currentUser: currentUser,
                    currentUserCenterId: currentUser?.center_id
                });

                const response = await fetch(apiUrl);
                if (!response.ok) {
                    console.error('❌ API 응답 오류:', response.status, response.statusText);
                    return;  // 실패 시 기존 데이터 유지
                }

                const data = await response.json();
                console.log('📋 원본 API 응답:', data);

                // API 응답: { total_records: 4, records: [...] }
                const newBillings = Array.isArray(data.records) ? data.records : (Array.isArray(data.billings) ? data.billings : []);

                console.log('📊 새로고침 - API 응답:', {
                    total: newBillings.length,
                    filter: currentFilter,
                    statuses: newBillings.map(b => b.approval_status)
                });

                // 데이터가 변경되었을 때만 업데이트
                if (JSON.stringify(newBillings) !== JSON.stringify(allBillings)) {
                    allBillings = newBillings;
                    console.log('✅ 청부 데이터 갱신:', allBillings.length + '건');
                }

                // 현재 필터 유지하면서 재렌더링
                const filtered = currentFilter === 'all'
                    ? allBillings
                    : allBillings.filter(b => b.approval_status === currentFilter);

                console.log('🔍 필터링 결과:', {
                    filter: currentFilter,
                    count: filtered.length + '건',
                    statuses: filtered.map(b => b.approval_status)
                });

                const residentsRes = await fetch(`${API_URL}/residents/`);
                const residentsData = residentsRes.ok ? await residentsRes.json() : { residents: [] };
                const residents = residentsData.residents || [];
                const residentMap = {};
                residents.forEach(r => {
                    // 이용자 정보: 이름 (등급 · 소득분류) 형식으로 저장
                    residentMap[r.id] = `${r.name} (${r.care_grade}등급 · ${r.client_type})`;
                });

                renderBillingTable(filtered, residentMap);
            } catch (error) {
                console.error('❌ 새로고침 오류:', error);
            }
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) return;
            autoRefreshInterval = setInterval(() => {
                refreshBillingData();  // ← 필터 유지하면서 갱신
            }, 3000); // 3초마다 새로고침 (안정성 향상)
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            currentFilter = 'all';  // 탭 전환 시 필터 초기화

            // 탭 UI 업데이트
            document.querySelectorAll('.archive-tab').forEach(t => {
                t.classList.remove('active');
                t.style.color = 'rgba(0,0,0,0.5)';
                t.style.borderBottomColor = 'transparent';
            });

            event.target.classList.add('active');
            event.target.style.color = '#3b82f6';
            event.target.style.borderBottomColor = '#3b82f6';

            // 필터 버튼도 초기화
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.filter-btn')[0].classList.add('active');  // 첫 번째 '전체' 버튼 활성화

            // 데이터 새로 로드 (이 과정에서 통계도 자동으로 업데이트됨)
            loadBillingRecords();

            console.log('📑 탭 전환:', currentTab === 'current' ? '현재 청부' : '아카이브된 청부');
        }

        window.addEventListener('load', () => {
            loadUserInfo();
            loadBillingRecords();
            startAutoRefresh();
        });

        window.addEventListener('beforeunload', () => {
            stopAutoRefresh();
        });
    </script>
    <script src="art.js"></script>
    <script>ART.placeScene('billing');</script>
