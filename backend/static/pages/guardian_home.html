<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 이용자 방문 기록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* 보호자 화면: 고령 사용자를 위해 글자를 키운다 (스타일 가이드 4장) */
        main { font-size: 18px; }
        main .text-xs { font-size: 15px !important; }
        main .text-sm { font-size: 17px !important; }
        main h1 { font-size: 32px !important; }
        main h2 { font-size: 24px !important; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">이용자 방문 기록</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500">보호자</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="homeArt" class="mb-4" aria-hidden="true"></div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6 mb-6">
                    <label class="text-sm font-semibold text-gray-700">이용자 선택
                        <select id="residentSelect" onchange="loadVisits()" class="ml-2 border border-gray-300 rounded-lg px-3 py-2"></select>
                    </label>
                    <div id="emptyNotice" class="hidden mt-4 text-gray-500">
                        <div id="emptyArt"></div>
                        <p>연결된 이용자가 없습니다. 센터에서 승인이 완료되면 여기에 표시됩니다.</p>
                    </div>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">최근 14일 방문 기록</h2>
                    <p class="text-sm text-gray-500 mb-6">방문 시각, 제공 내용, 컨디션, 요양보호사 메모를 보여 줍니다. 비용 정보는 보이지 않습니다.</p>
                    <ul id="visitList" class="divide-y divide-gray-100"></ul>
                </div>
            </div>
        </main>
    </div>
    <script src="menu.js"></script>
    <script src="art.js"></script>
    <script>
        let currentUser = null;
        const API_URL = '/api/v1';

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            if (user.role !== 'guardian') { window.location.href = './dashboard.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '보호자';
            renderSidebar();
            loadResidents();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        async function loadResidents() {
            const d = await (await fetch(`${API_URL}/guardian/my-residents`)).json();
            const select = document.getElementById('residentSelect');
            const residents = d.residents || [];
            document.getElementById('emptyNotice').classList.toggle('hidden', residents.length > 0);
            document.getElementById('emptyArt').innerHTML = ART.home;
            document.getElementById('homeArt').innerHTML = ART.home;
            select.innerHTML = residents.map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
            if (residents.length) loadVisits();
        }

        async function loadVisits() {
            const id = document.getElementById('residentSelect').value;
            const list = document.getElementById('visitList');
            if (!id) { list.innerHTML = ''; return; }
            const r = await fetch(`${API_URL}/guardian/residents/${id}/visits?days=14`);
            if (!r.ok) { list.innerHTML = '<li class="py-8 text-center text-gray-400">기록을 불러올 수 없습니다</li>'; return; }
            const d = await r.json();
            if (!d.visits.length) { list.innerHTML = '<li class="py-8 text-center text-gray-400">최근 14일 기록이 없습니다</li>'; return; }
            list.innerHTML = d.visits.map(v => `
                <li class="py-5">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-gray-900">${escapeHtml(v.date)} ${escapeHtml(v.time)}</span>
                        <span class="text-sm text-gray-500">담당 ${escapeHtml(v.caregiver_name)}</span>
                    </div>
                    <div class="text-sm text-gray-700 mb-1">제공 내용: ${v.care_items.map(escapeHtml).join(', ') || '-'}</div>
                    <div class="text-sm text-gray-700 mb-1">컨디션: ${escapeHtml(v.condition) || '-'}</div>
                    <div class="text-sm text-gray-600 bg-gray-50 rounded p-3 mt-2">${escapeHtml(v.notes) || '메모 없음'}</div>
                </li>`).join('');
        }

        function logout() { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
