<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 이용자 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* 이 화면은 줄무늬 없이 깨끗한 바탕에 둔다 (시안과 같게) */
        :root, :root body { background-image: none !important; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
        }

        .sidebar {
            width: 288px;
            background: linear-gradient(180deg, #1E2B26 0%, #16201C 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; line-height: 1; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 24px 0;
            overflow: hidden;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #B5532F;
            border-left-color: #B5532F;
            background: rgba(16, 185, 129, 0.1);
        }

        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 288px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: #1a202c; font-size: 13px; }
        .user-role { font-size: 12px; color: #6b7280; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #B5532F 0%, #9A4425 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .add-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #B5532F 0%, #9A4425 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }

        .stat-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #B5532F;
        }

        .stat-with-art { display: flex; align-items: center; gap: 18px; background: #E9F7F1; }
        .stat-art { width: 120px; height: auto; flex: 0 0 auto; mix-blend-mode: multiply; }
        .section-title-row { display: flex; align-items: center; gap: 12px; }
        .section-title-row img { width: 40px; height: 40px; object-fit: contain; }
        .resident-banner-wrap { height: 260px; overflow: hidden; border-radius: 16px; margin-bottom: 24px; }
        /* 원본 그림의 흰 여백을 잘라 낸다 */
        .resident-banner { display: block; width: 102.5%; max-width: none; height: auto; margin: -3.75% 0 0 -1.25%; }
        .top-bell { width: 28px; height: 28px; object-fit: contain; display: block; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .side-icon img { display: block; }

        /* ===== 시안(원본)에 맞춘 배치: 이 화면만 적용 ===== */
        :root, :root body { background-image: none !important; background-color: #FAF7F2 !important; }
        body { font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1F2937; }
        .sidebar { display: flex; flex-direction: column; background: linear-gradient(180deg, #1F3A2D 0%, #14261D 100%); }
        .sidebar .side-brand { padding: 26px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .sidebar .side-title { font-size: 20px; font-weight: 800; }
        .sidebar .side-sub { font-size: 12px; color: #A7B8AE; }
        .sidebar .sidebar-nav { padding: 20px 16px; }
        .sidebar .side-item { color: #E5EDE8; font-size: 15px; padding: 12px 16px; border-radius: 12px; }
        .sidebar .side-item:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .sidebar .side-item.active { background: #4E7D5E; color: #fff; }
        .sidebar-landscape { display: block; width: 100%; height: auto; margin-top: auto; flex-shrink: 0; }
        .topbar { padding: 22px 36px; background: #FFFFFF; box-shadow: none; border-bottom: 1px solid #ECE7DF; }
        .page-title { font-size: 30px; font-weight: 800; color: #1F2937; }
        .user-menu { gap: 22px; }
        .user-divider { width: 1px; height: 36px; background: #E5E0D8; }
        .user-name { font-size: 15px; font-weight: 700; }
        .user-role { font-size: 13px; }
        .user-menu .avatar-img { width: 48px; height: 48px; }
        .logout-btn { background: #fff; }
        .content { padding: 28px 36px; }
        .resident-banner-wrap { height: 260px; margin-bottom: 28px; }
        .stats-grid { grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .stat-card.stat-with-art { min-height: 150px; padding: 22px 28px; border: none; box-shadow: none; border-radius: 16px; background: #EAF6F0; }
        .stat-card.stat-with-art:nth-child(2) { background: #EAF6F0; }
        .stat-with-art .stat-art { width: 150px; }
        .stat-with-art .stat-label { font-size: 17px; font-weight: 700; color: #1F2937; text-transform: none; letter-spacing: 0; margin-bottom: 4px; }
        .stat-with-art .stat-value { font-size: 52px; font-weight: 800; color: #1F2937; line-height: 1.1; display: inline-block; }
        .stat-unit { font-size: 24px; font-weight: 700; color: #1F2937; margin-left: 6px; }
        .stat-deco { margin-left: auto; width: 150px; height: 90px; flex: 0 0 auto; color: #9CCBB3; opacity: 0.55; }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }
        .action-card { display: flex; align-items: center; gap: 22px; padding: 22px 28px; border-radius: 16px; background: #FDF6EC; color: #1F2937; text-decoration: none; }
        .action-card.approve { background: #EAF6F0; }
        .action-card img { width: 96px; height: 96px; object-fit: contain; flex: 0 0 auto; mix-blend-mode: multiply; }
        .action-title { font-size: 20px; font-weight: 800; }
        .action-desc { font-size: 15px; color: #4B5563; margin-top: 6px; line-height: 1.5; }
        .action-count { font-size: 15px; font-weight: 700; color: #B5532F; margin-top: 6px; }
        .action-chev { margin-left: auto; font-size: 30px; color: #6B7280; }
        .list-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
        .list-title { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
        .list-title img { width: 40px; height: 40px; object-fit: contain; }
        .list-tools { display: flex; align-items: center; gap: 14px; }
        .search-box { display: flex; align-items: center; gap: 10px; width: 420px; height: 50px; padding: 0 16px; background: #fff; border: 1px solid #E5E0D8; border-radius: 12px; }
        .search-box input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; }
        .search-box svg { flex: 0 0 auto; color: #6B7280; }
        .add-btn { padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 700; background: #B5532F; box-shadow: none; }
        .add-btn:hover { transform: none; box-shadow: none; }
        .table-wrapper { border-radius: 16px; border: 1px solid #ECE7DF; box-shadow: none; }
        .table thead { background: #F7F4EE; }
        .table th { padding: 18px; font-size: 14px; color: #374151; }
        .table td { padding: 16px 18px; font-size: 15px; color: #1F2937; }
        .resident-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
        .resident-name { font-size: 16px; font-weight: 700; }
        .resident-info { font-size: 13px; color: #6B7280; margin-top: 2px; }
        .grade-pill { display: inline-block; min-width: 56px; text-align: center; padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; }
        .grade-1 { background: #FDE8E8; color: #B91C1C; }
        .grade-2 { background: #E6F4EA; color: #15803D; }
        .grade-3 { background: #FEF3C7; color: #B45309; }
        .grade-4 { background: #EDE9FE; color: #6D28D9; }
        .grade-5 { background: #E0F2FE; color: #0369A1; }
        .health { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
        .health::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
        .health-stable { color: #15803D; }
        .health-warning { color: #EA580C; }
        .health-critical { color: #DC2626; }
        .btn-detail { padding: 10px 18px; border: 1px solid #D6D0C4; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 600; color: #374151; cursor: pointer; }
        .btn-detail:hover { border-color: #B5532F; color: #B5532F; background: #fff; }
        .btn-kebab { width: 36px; height: 36px; border: none; background: transparent; font-size: 22px; color: #6B7280; cursor: pointer; border-radius: 8px; }
        .btn-kebab:hover { background: #F3F4F6; color: #B91C1C; }
        .empty-wide { display: flex; align-items: center; gap: 24px; margin: 20px; padding: 24px 32px; border: 1px dashed #D6D0C4; border-radius: 16px; background: #fff; text-align: left; }
        .empty-wide img { width: 200px; height: auto; flex: 0 0 auto; }
        .empty-wide-title { font-size: 19px; font-weight: 800; }
        .empty-wide-desc { font-size: 15px; color: #6B7280; margin: 6px 0 16px; }
        @media (max-width: 900px) {
            .action-row, .stats-grid { grid-template-columns: 1fr; }
            .search-box { width: 100%; }
        }

        .table-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        .table th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            color: #374151;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
            text-align: left;
            white-space: nowrap;
        }

        .table th {
            white-space: nowrap;
        }

        .table td:first-child {
            white-space: normal;
        }

        .table tbody tr:hover {
            background: #f9fafb;
        }

        .resident-name {
            font-weight: 600;
            color: #1a202c;
        }

        .resident-info {
            font-size: 13px;
            color: #6b7280;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #6b7280;
        }

        .btn-sm:hover {
            border-color: #B5532F;
            color: #B5532F;
            background: #f0fdf4;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
            .topbar { padding: 16px; }
            .topbar-title h1 { font-size: 20px; }
        }
    </style>
    <script src="menu.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="side-brand"><div class="side-logo"></div><div><div class="side-title">돌봄케어</div><div class="side-sub">Care Management</div></div></div>
        <nav class="sidebar-nav"></nav>
        <img class="sidebar-landscape" src="assets/user_design/sidebar_care_landscape.jpg" alt="">
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1 class="page-title">이용자 관리</h1></div>
            <div class="user-menu">
                <img class="top-bell" src="assets/user_design/28_top_notification_icon.png" alt="">
                <span class="user-divider"></span>
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">요양사</div>
                </div>
                <img class="avatar-img" id="userAvatar" src="assets/user_design/29_top_profile_icon.png" alt="">
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card stat-with-art">
                    <img class="stat-art" src="assets/user_design/resident_metric_total.png" alt="">
                    <div>
                        <div class="stat-label">전체 이용자</div>
                        <div><span class="stat-value" id="totalCount">0</span><span class="stat-unit">명</span></div>
                    </div>
                    <svg class="stat-deco" viewBox="0 0 150 90" fill="currentColor" aria-hidden="true">
                        <circle cx="40" cy="30" r="14"/><path d="M14 80 Q14 50 40 50 Q66 50 66 80 Z"/>
                        <circle cx="110" cy="30" r="14"/><path d="M84 80 Q84 50 110 50 Q136 50 136 80 Z"/>
                        <circle cx="75" cy="36" r="16"/><path d="M48 86 Q48 52 75 52 Q102 52 102 86 Z"/>
                    </svg>
                </div>
                <div class="stat-card stat-with-art">
                    <img class="stat-art" src="assets/user_design/resident_metric_active.png" alt="">
                    <div>
                        <div class="stat-label">활성 이용자</div>
                        <div><span class="stat-value" id="activeCount">0</span><span class="stat-unit">명</span></div>
                    </div>
                    <svg class="stat-deco" viewBox="0 0 150 90" fill="currentColor" aria-hidden="true">
                        <rect x="20" y="52" width="18" height="30" rx="4"/>
                        <rect x="50" y="36" width="18" height="46" rx="4"/>
                        <rect x="80" y="20" width="18" height="62" rx="4"/>
                        <rect x="110" y="6" width="18" height="76" rx="4"/>
                    </svg>
                </div>
            </div>

            <!-- 역할별 바로가기 카드: 요양사는 내 변경 요청, 센터장은 변경 요청 승인 -->
            <div class="action-row">
                <a class="action-card" id="cardMyRequest" href="#myRequestPanel" style="display: none;">
                    <img src="assets/user_design/resident_change_request.png" alt="">
                    <div>
                        <div class="action-title">내 변경 요청</div>
                        <div class="action-desc">수정이 필요한 이용자 정보 변경을 요청할 수 있습니다.</div>
                        <div class="action-count" id="myRequestCount"></div>
                    </div>
                    <span class="action-chev">›</span>
                </a>
                <a class="action-card approve" id="cardApproval" href="#changeRequestPanel" style="display: none;">
                    <img src="assets/user_design/resident_request_approval.png" alt="">
                    <div>
                        <div class="action-title">변경 요청 승인</div>
                        <div class="action-desc">요청된 이용자 정보 변경을 검토하고 승인합니다.</div>
                        <div class="action-count" id="approvalCount"></div>
                    </div>
                    <span class="action-chev">›</span>
                </a>
            </div>

            <!-- 요양사: 내가 올린 변경 요청과 처리 결과 -->
            <div id="myRequestPanel" style="display: none; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                <h3 class="section-title-row" style="font-size: 15px; font-weight: 700; margin-bottom: 8px;"><img src="assets/user_design/resident_change_request.png" alt="">내 변경 요청</h3>
                <div id="myRequestList" style="font-size: 14px;"></div>
            </div>

            <!-- 센터장: 요양사의 변경 요청 -->
            <div id="changeRequestPanel" style="display: none; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                <h3 class="section-title-row" style="font-size: 15px; font-weight: 700; margin-bottom: 8px;"><img src="assets/user_design/resident_request_approval.png" alt="">변경 요청 <span id="changeRequestCount"></span></h3>
                <div id="changeRequestList" style="font-size: 14px;"></div>
            </div>

            <!-- Header -->
            <div class="list-head">
                <h2 class="list-title"><img src="assets/user_design/section_resident_list.png" alt="">이용자 목록</h2>
                <div class="list-tools">
                    <label class="search-box">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                        <input id="residentSearch" type="search" placeholder="이름, 주소, 보호자명 등으로 검색하세요" oninput="filterResidents()">
                    </label>
                    <button class="add-btn" onclick="showAddModal()">+ 이용자 추가</button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <div id="residentsTable" class="empty-state">
                    <div class="empty-state-icon"></div>
                    <div>이용자 정보를 불러오는 중입니다...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="residentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 12px; padding: 32px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <div id="caregiverRequestBox" style="display: none; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px;">
                <div style="font-weight: 700; margin-bottom: 6px;">센터장 확인이 필요한 정보 변경 요청</div>
                <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                    <select id="changeField" style="padding: 6px; border: 1px solid #d1d5db; border-radius: 6px;">
                        <option value="care_grade">요양등급 (1~5)</option>
                        <option value="client_type">소득분류</option>
                        <option value="recognition_number">인정번호</option>
                        <option value="recognition_start">인정 시작일</option>
                        <option value="recognition_end">인정 종료일</option>
                        <option value="name">이름</option>
                        <option value="birth_date">생년월일</option>
                    </select>
                    <input id="changeValue" placeholder="새 값" style="padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 150px;">
                    <button type="button" onclick="submitChangeRequest()" style="padding: 6px 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">요청 보내기</button>
                </div>
            </div>
            <h2 id="modalTitle" style="margin-top: 0; margin-bottom: 24px;">이용자 추가</h2>
            <form id="residentForm" onsubmit="saveResident(event)">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">이름</label>
                    <input type="text" id="residentName" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">생년월일 (YYYY-MM-DD)</label>
                    <input type="date" id="residentBirthDate" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">요양등급</label>
                    <select id="careGrade" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="">선택하세요</option>
                        <option value="1">1등급 (최중증) - ₩2,512,900</option>
                        <option value="2">2등급 (중증) - ₩2,331,200</option>
                        <option value="3">3등급 (중증~중등증) - ₩1,528,200</option>
                        <option value="4">4등급 (중등증) - ₩1,409,700</option>
                        <option value="5">5등급 (경증) - ₩1,208,900</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">소득분류</label>
                    <select id="clientType" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="">선택하세요</option>
                        <option value="일반">일반 (본인부담 15-20%)</option>
                        <option value="차상위계층">차상위계층 (본인부담 10-15%)</option>
                        <option value="기초생활보장">기초생활보장 (본인부담 0%)</option>
                        <option value="의료급여">의료급여 (본인부담 0%)</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">건강 상태</label>
                    <select id="healthStatus" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="stable">안정</option>
                        <option value="warning">주의</option>
                        <option value="critical">위험</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">성별</label>
                    <select id="residentGender" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="">선택하세요</option>
                        <option value="남">남</option>
                        <option value="여">여</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">주소</label>
                    <input type="text" id="residentAddress" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">장기요양인정번호</label>
                    <input type="text" id="recognitionNumber" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">인정 유효기간 시작일</label>
                    <input type="date" id="recognitionStart" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">인정 유효기간 종료일</label>
                    <input type="date" id="recognitionEnd" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">보호자 이름</label>
                    <input type="text" id="guardianName" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">보호자 연락처</label>
                    <input type="tel" id="guardianPhone" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" style="flex: 1; padding: 10px; background: #B5532F; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">저장</button>
                    <button type="button" onclick="closeResidentModal()" style="flex: 1; padding: 10px; background: #f3f4f6; color: #6b7280; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">취소</button>
                </div>
            </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let residents = [];
        let currentResidentId = null;

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            document.getElementById(user.role === 'caregiver' ? 'cardMyRequest' : 'cardApproval').style.display = 'flex';

            // 메뉴 필터링은 menu.js의 renderSidebar() 함수에서 처리
            renderSidebar();
            applyNavIcons();

            return true;
        }

        // 시안의 메뉴 아이콘 (assets/user_design/20~27_nav_*): 이 화면의 사이드바에만 적용한다
        const NAV_ICON_FILES = {
            '대시보드': '20_nav_dashboard_icon.png',
            '이용자관리': '21_nav_user_icon.png',
            '음성 기록': '22_nav_voice_icon.png',
            '청부관리': '24_nav_billing_icon.png',
            '나의 청부': '24_nav_billing_icon.png',
            '수익분석': '25_nav_statistics_icon.png',
            '알림': '26_nav_notice_icon.png',
            '설정': '27_nav_settings_icon.png',
        };

        function applyNavIcons() {
            document.querySelectorAll('.sidebar-nav .side-item').forEach(item => {
                const file = NAV_ICON_FILES[item.querySelector('span:last-child')?.textContent.trim()];
                if (file) item.querySelector('.side-icon').innerHTML = `<img src="assets/user_design/${file}" width="24" height="24" alt="">`;
            });
        }

        async function loadResidents() {
            loadChangeRequests();
            try {
                const tableDiv = document.getElementById('residentsTable');
                tableDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div>로드 중...</div></div>';

                // 요양사: 자신이 담당하는 이용자만, 센터장: 센터의 모든 이용자
                let url = `${API_URL}/residents/`;
                if (currentUser.role === 'caregiver') {
                    url += `?caregiver_id=${currentUser.id}`;
                } else if (currentUser.role === 'center_manager') {
                    url += `?center_id=${currentUser.center_id}`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error('이용자 정보 조회 실패');

                const data = await response.json();
                residents = data.residents || [];

                document.getElementById('totalCount').textContent = residents.length;
                document.getElementById('activeCount').textContent = residents.filter(r => !r.is_archived).length;

                filterResidents();
            } catch (error) {
                console.error('❌ 이용자 로드 실패:', error);
                document.getElementById('residentsTable').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>이용자 정보를 불러올 수 없습니다</div></div>';
            }
        }

        function filterResidents() {
            const q = document.getElementById('residentSearch').value.trim();
            const list = q
                ? residents.filter(r => [r.name, r.address, r.guardian_name].some(v => (v || '').includes(q)))
                : residents;
            renderResidentsTable(list, Boolean(q));
        }

        function renderResidentsTable(residents, isSearching = false) {
            const tableDiv = document.getElementById('residentsTable');

            if (residents.length === 0) {
                tableDiv.innerHTML = isSearching
                    ? '<div class="empty-state"><div>검색 결과가 없습니다</div></div>'
                    : `<div class="empty-wide"><img src="assets/user_design/empty_residents.png" alt="">
                        <div><div class="empty-wide-title">등록된 이용자가 없습니다</div>
                        <div class="empty-wide-desc">이용자를 추가하면 이곳에서 관리할 수 있습니다.</div>
                        <button class="add-btn" onclick="showAddModal()">+ 이용자 추가</button></div></div>`;
                return;
            }

            const healthLabels = { stable: '안정', warning: '주의', critical: '위험' };

            let html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>성별 / 연령</th>
                            <th>요양등급</th>
                            <th>소득분류</th>
                            <th>인정번호</th>
                            <th>인정 기간</th>
                            <th>보호자</th>
                            <th>건강 상태</th>
                            <th style="text-align: center;">작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            residents.forEach(r => {
                const age = calculateAge(new Date(r.birth_date));
                const period = r.recognition_start || r.recognition_end
                    ? `${r.recognition_start || '-'} ~ ${r.recognition_end || '-'}`
                    : '-';
                const guardian = r.guardian_name ? `${r.guardian_name}${r.guardian_phone ? '<br>' + r.guardian_phone : ''}` : '-';
                html += `
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center; gap: 14px;">
                                <img class="resident-avatar" src="assets/user_design/resident_avatar_${r.gender === '여' ? 'female' : 'male'}.png" alt="">
                                <div>
                                    <div class="resident-name">${r.name}</div>
                                    <div class="resident-info">${r.address || '주소 미등록'}</div>
                                </div>
                            </div>
                        </td>
                        <td>${r.gender || '-'} / ${age}세</td>
                        <td><span class="grade-pill grade-${r.care_grade}">${r.care_grade}등급</span></td>
                        <td>${r.client_type}</td>
                        <td>${r.recognition_number || '-'}</td>
                        <td>${period}</td>
                        <td>${guardian}</td>
                        <td><span class="health health-${r.health_status}">${healthLabels[r.health_status] || '-'}</span></td>
                        <td style="text-align: center;">
                            <div class="action-buttons" style="justify-content: center; align-items: center;">
                                <button class="btn-detail" onclick="editResident(${r.id})">상세보기</button>
                                <button class="btn-kebab" title="삭제" onclick="deleteResident(${r.id})">⋮</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableDiv.innerHTML = html;
        }

        function calculateAge(birthDate) {
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        function showAddModal() {
            currentResidentId = null;
            document.getElementById('modalTitle').textContent = '이용자 추가';
            document.getElementById('residentForm').reset();
            document.getElementById('residentModal').style.display = 'flex';
        }

        function editResident(id) {
            const resident = residents.find(r => r.id === id);
            if (!resident) return;

            currentResidentId = id;
            document.getElementById('modalTitle').textContent = '이용자 편집';
            document.getElementById('residentName').value = resident.name;
            document.getElementById('residentBirthDate').value = resident.birth_date;
            document.getElementById('careGrade').value = resident.care_grade || '';
            document.getElementById('clientType').value = resident.client_type || '';
            document.getElementById('healthStatus').value = resident.health_status;
            document.getElementById('residentGender').value = resident.gender || '';
            document.getElementById('residentAddress').value = resident.address || '';
            document.getElementById('recognitionNumber').value = resident.recognition_number || '';
            document.getElementById('recognitionStart').value = resident.recognition_start || '';
            document.getElementById('recognitionEnd').value = resident.recognition_end || '';
            document.getElementById('guardianName').value = resident.guardian_name || '';
            document.getElementById('guardianPhone').value = resident.guardian_phone || '';
            lockFieldsForCaregiver();
            document.getElementById('residentModal').style.display = 'flex';
        }

        const CAREGIVER_EDITABLE_IDS = ['healthStatus', 'residentAddress', 'guardianName', 'guardianPhone'];

        function lockFieldsForCaregiver() {
            const isCaregiver = currentUser && currentUser.role === 'caregiver';
            const modal = document.getElementById('residentModal');
            modal.querySelectorAll('input, select, textarea').forEach(el => {
                if (el.closest('#caregiverRequestBox')) return;  // 변경 요청 입력칸은 잠그지 않는다
                const editable = CAREGIVER_EDITABLE_IDS.includes(el.id);
                el.disabled = isCaregiver && !editable;
                el.style.background = isCaregiver && !editable ? '#f3f4f6' : '';
                el.style.color = isCaregiver && !editable ? '#6b7280' : '';
            });
            let note = document.getElementById('caregiverLockNote');
            if (isCaregiver && !note) {
                note = document.createElement('p');
                note.id = 'caregiverLockNote';
                note.style.cssText = 'font-size: 12px; color: #6b7280; margin: 8px 0;';
                note.textContent = '요양사는 건강상태, 주소, 보호자 정보를 직접 수정할 수 있습니다. 나머지 정보는 변경 요청으로 센터장에게 요청하세요.';
                modal.querySelector('form').prepend(note);
            }
            if (note) note.style.display = isCaregiver ? 'block' : 'none';
            const box = document.getElementById('caregiverRequestBox');
            if (box) box.style.display = isCaregiver && currentResidentId ? 'block' : 'none';
        }

        async function submitChangeRequest() {
            const field = document.getElementById('changeField').value;
            const value = document.getElementById('changeValue').value.trim();
            if (!value) { alert('새 값을 입력해 주세요'); return; }
            const response = await fetch(`${API_URL}/residents/${currentResidentId}/change-requests`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ field, value })
            });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                alert(`요청 실패: ${err.detail || '오류'}`);
                return;
            }
            alert('센터장에게 변경을 요청했습니다. 승인되면 반영됩니다.');
            document.getElementById('changeValue').value = '';
        }

        const CHANGE_LABELS = { care_grade: '요양등급', client_type: '소득분류', recognition_number: '인정번호', recognition_start: '인정 시작일', recognition_end: '인정 종료일', name: '이름', birth_date: '생년월일' };
        const CHANGE_STATUS = {
            pending: '<span style="color:#b45309; font-weight:700;">센터장 확인 대기</span>',
            approved: '<span style="color:#047857; font-weight:700;">승인되어 반영됨</span>',
            rejected: '<span style="color:#b91c1c; font-weight:700;">반려됨</span>'
        };

        async function loadMyChangeRequests() {
            if (!currentUser || currentUser.role !== 'caregiver') return;
            const response = await fetch(`${API_URL}/residents/change-requests/mine`);
            if (!response.ok) return;
            const data = await response.json();
            const panel = document.getElementById('myRequestPanel');
            panel.style.display = data.requests.length ? 'block' : 'none';
            document.getElementById('myRequestCount').textContent = `${data.requests.length}건`;
            document.getElementById('myRequestList').innerHTML = data.requests.map(r => `
                <div style="padding: 8px 0; border-top: 1px solid #bae6fd;">
                    <div><b>${r.resident_name}</b> · ${CHANGE_LABELS[r.field] || r.field} → <b>${r.new_value}</b> ${CHANGE_STATUS[r.status] || r.status}</div>
                    ${r.status === 'rejected' && r.reason ? `<div style="color:#b91c1c; font-size: 13px; margin-top: 4px;">반려 사유: ${r.reason}</div>` : ''}
                </div>`).join('');
        }

        async function loadChangeRequests() {
            loadMyChangeRequests();
            if (!currentUser || currentUser.role !== 'center_manager') return;
            const response = await fetch(`${API_URL}/residents/change-requests?status=pending`);
            if (!response.ok) return;
            const data = await response.json();
            const panel = document.getElementById('changeRequestPanel');
            const list = document.getElementById('changeRequestList');
            const labels = { care_grade: '요양등급', client_type: '소득분류', recognition_number: '인정번호', recognition_start: '인정 시작일', recognition_end: '인정 종료일', name: '이름', birth_date: '생년월일' };
            panel.style.display = data.requests.length ? 'block' : 'none';
            document.getElementById('changeRequestCount').textContent = `(${data.requests.length}건)`;
            document.getElementById('approvalCount').textContent = `승인 대기 ${data.requests.length}건`;
            list.innerHTML = data.requests.map(r => `
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid #fde68a;">
                    <span><b>${r.resident_name}</b> · ${labels[r.field] || r.field} → <b>${r.new_value}</b> <span style="color:#6b7280;">(요청: ${r.requested_by})</span></span>
                    <span>
                        <button onclick="decideChangeRequest(${r.id}, 'approve')" style="padding: 4px 10px; background: #B5532F; color: white; border: none; border-radius: 6px; cursor: pointer;">승인</button>
                        <button onclick="decideChangeRequest(${r.id}, 'reject')" style="padding: 4px 10px; background: white; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 6px; cursor: pointer;">반려</button>
                    </span>
                </div>`).join('');
        }

        async function decideChangeRequest(id, action) {
            let body = undefined;
            if (action === 'reject') {
                const reason = prompt('반려 사유를 입력해 주세요');
                if (!reason || !reason.trim()) return;
                body = JSON.stringify({ reason: reason.trim() });
            }
            const response = await fetch(`${API_URL}/residents/change-requests/${id}/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body
            });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                alert(`처리 실패: ${err.detail || '오류'}`);
                return;
            }
            loadChangeRequests();
            loadResidents();
        }

        function closeResidentModal() {
            document.getElementById('residentModal').style.display = 'none';
            document.getElementById('residentForm').reset();
            document.querySelectorAll('#residentModal input, #residentModal select, #residentModal textarea').forEach(el => {
                el.disabled = false;
                el.style.background = '';
                el.style.color = '';
            });
            const box = document.getElementById('caregiverRequestBox');
            if (box) box.style.display = 'none';
            currentResidentId = null;
        }

        async function saveResident(event) {
            event.preventDefault();

            const name = document.getElementById('residentName').value;
            const birthDate = document.getElementById('residentBirthDate').value;
            const careGrade = parseInt(document.getElementById('careGrade').value);
            const clientType = document.getElementById('clientType').value;
            const healthStatus = document.getElementById('healthStatus').value;
            const gender = document.getElementById('residentGender').value;
            const address = document.getElementById('residentAddress').value;
            const recognitionNumber = document.getElementById('recognitionNumber').value;
            const recognitionStart = document.getElementById('recognitionStart').value || null;
            const recognitionEnd = document.getElementById('recognitionEnd').value || null;
            const guardianName = document.getElementById('guardianName').value;
            const guardianPhone = document.getElementById('guardianPhone').value;

            if (recognitionStart && recognitionEnd && recognitionEnd < recognitionStart) {
                alert('인정 종료일이 시작일보다 빠를 수 없습니다. 인정서의 날짜를 다시 확인해 주세요.');
                return;
            }
            const today = new Date().toISOString().slice(0, 10);
            if (recognitionEnd && recognitionEnd < today && !confirm('인정 유효기간이 지났습니다. 그래도 저장할까요? (갱신 여부를 확인하세요)')) {
                return;
            }

            try {
                const method = currentResidentId ? 'PUT' : 'POST';
                const url = currentResidentId
                    ? `${API_URL}/residents/${currentResidentId}`
                    : `${API_URL}/residents/?user_role=${currentUser.role}`;

                const fullBody = {
                        name,
                        center_id: currentUser.center_id,
                        birth_date: birthDate,
                        age: Math.floor((new Date() - new Date(birthDate)) / (365.25 * 24 * 60 * 60 * 1000)),
                        care_grade: careGrade,
                        client_type: clientType,
                        health_status: healthStatus,
                        gender: gender,
                        address: address,
                        recognition_number: recognitionNumber,
                        recognition_start: recognitionStart,
                        recognition_end: recognitionEnd,
                        guardian_name: guardianName,
                        guardian_phone: guardianPhone,
                        admission_date: new Date().toISOString()
                };
                // 요양사는 기존 이용자의 건강상태·주소·보호자 정보만 직접 수정할 수 있다
                const isCaregiverEdit = currentResidentId && currentUser.role === 'caregiver';
                const payload = isCaregiverEdit
                    ? { health_status: healthStatus, address: address, guardian_name: guardianName, guardian_phone: guardianPhone }
                    : fullBody;

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(currentResidentId ? '이용자가 수정되었습니다' : '이용자가 추가되었습니다');
                    closeResidentModal();
                    loadResidents();
                } else {
                    const error = await response.json();
                    alert(`오류: ${error.detail || '요청에 실패했습니다'}`);
                }
            } catch (error) {
                console.error('저장 오류:', error);
                alert('저장 중 오류가 발생했습니다');
            }
        }

        function deleteResident(id) {
            if (confirm('이용자를 삭제하시겠습니까?')) {
                fetch(`${API_URL}/residents/${id}`, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        alert('이용자가 삭제되었습니다');
                        loadResidents();
                    } else {
                        alert('삭제에 실패했습니다');
                    }
                }).catch(error => {
                    console.error('삭제 오류:', error);
                    alert('삭제 중 오류가 발생했습니다');
                });
            }
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                loadResidents();
            }
        });
    </script>
    <script src="art.js"></script>
    <script>
        // 상단 배너: 디자인 시안 그림 (assets/user_design/)
        const banner = document.createElement('div');
        banner.className = 'resident-banner-wrap';
        banner.innerHTML = '<img class="resident-banner" src="assets/user_design/resident_banner.jpg" alt="">';
        document.querySelector('.content').prepend(banner);
    </script>
</body>
