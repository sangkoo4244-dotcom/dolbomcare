<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👥 이용자 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; line-height: 1; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 24px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #10b981;
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: #1a202c; font-size: 13px; }
        .user-role { font-size: 12px; color: #6b7280; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .add-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }

        .stat-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #10b981;
        }

        .table-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        .table th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            color: #374151;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .table tbody tr:hover {
            background: #f9fafb;
        }

        .resident-name {
            font-weight: 600;
            color: #1a202c;
        }

        .resident-info {
            font-size: 13px;
            color: #6b7280;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #6b7280;
        }

        .btn-sm:hover {
            border-color: #10b981;
            color: #10b981;
            background: #f0fdf4;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
            .topbar { padding: 16px; }
            .topbar-title h1 { font-size: 20px; }
        }
    </style>
    <script src="menu.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <!-- 공통 메뉴 -->
            <a class="nav-item" id="menu-dashboard" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>

            <!-- 역할별 메뉴: menu.js에서 필터링 -->
            <a class="nav-item hidden active" id="menu-residents" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item hidden" id="menu-voice-records" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>

            <!-- 요양사 메뉴 -->
            <a class="nav-item hidden" id="menu-caregiver-billing" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item hidden" id="menu-my-salary" onclick="navigateTo('./my_salary.html')">
                <span>💰</span> 나의 급여
            </a>
            <a class="nav-item hidden" id="menu-my-schedule" onclick="navigateTo('./my_schedule.html')">
                <span>📅</span> 나의 일정
            </a>

            <!-- 센터장 메뉴 -->
            <a class="nav-item hidden" id="menu-billing-management" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item hidden" id="menu-monthly-settlement" onclick="navigateTo('./monthly_settlement.html')">
                <span>📊</span> 월별 정산
            </a>
            <a class="nav-item hidden" id="menu-staff" onclick="navigateTo('./staff_management.html')">
                <span>👔</span> 직원 관리
            </a>
            <a class="nav-item hidden" id="menu-profit" onclick="navigateTo('./profit_analysis.html')">
                <span>📈</span> 수익 분석
            </a>
            <a class="nav-item hidden" id="menu-roadmap" onclick="navigateTo('./center-roadmap.html')">
                <span>🗺️</span> 성과 로드맵
            </a>

            <!-- 로그아웃 (공통) -->
            <a class="nav-item" id="menu-logout" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>이용자 관리</h1></div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">요양사</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">전체 이용자</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">활성 이용자</div>
                    <div class="stat-value" id="activeCount">0</div>
                </div>
            </div>

            <!-- Header -->
            <div class="header-action">
                <h2 style="font-size: 18px; font-weight: 700;">이용자 목록</h2>
                <button class="add-btn" onclick="showAddModal()">+ 이용자 추가</button>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <div id="residentsTable" class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div>이용자 정보를 불러오는 중입니다...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let allResidents = [];

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();

            // 메뉴 필터링은 menu.js의 filterMenuByRole() 함수에서 처리
            filterMenuByRole();

            return true;
        }

        async function loadResidents() {
            try {
                const tableDiv = document.getElementById('residentsTable');
                tableDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div>로드 중...</div></div>';

                // 요양사: 자신이 담당하는 이용자만, 센터장: 센터의 모든 이용자
                let url = `${API_URL}/residents/`;
                if (currentUser.role === 'caregiver') {
                    url += `?caregiver_id=${currentUser.id}`;
                } else if (currentUser.role === 'center_manager') {
                    url += `?center_id=${currentUser.center_id}`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error('이용자 정보 조회 실패');

                const data = await response.json();
                const residents = data.residents || [];
                allResidents = residents;

                document.getElementById('totalCount').textContent = residents.length;
                document.getElementById('activeCount').textContent = residents.filter(r => !r.is_archived).length;

                renderResidentsTable(residents);
            } catch (error) {
                console.error('❌ 이용자 로드 실패:', error);
                document.getElementById('residentsTable').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>이용자 정보를 불러올 수 없습니다</div></div>';
            }
        }

        function renderResidentsTable(residents) {
            const tableDiv = document.getElementById('residentsTable');

            if (residents.length === 0) {
                tableDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">😴</div><div>등록된 이용자가 없습니다</div></div>';
                return;
            }

            let html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>연령</th>
                            <th>담당 요양사</th>
                            <th>상태</th>
                            <th style="text-align: center;">작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            residents.forEach(r => {
                const age = calculateAge(new Date(r.date_of_birth));
                html += `
                    <tr>
                        <td>
                            <div class="resident-name">${r.name}</div>
                            <div class="resident-info">${r.phone || '전화번호 없음'}</div>
                        </td>
                        <td>${age}세</td>
                        <td>${r.caregiver_name || '-'}</td>
                        <td><span class="status-badge">${r.is_archived ? '아카이브' : '활성'}</span></td>
                        <td style="text-align: center;">
                            <div class="action-buttons">
                                <button class="btn-sm" onclick="editResident(${r.id})">편집</button>
                                <button class="btn-sm" onclick="deleteResident(${r.id})">삭제</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableDiv.innerHTML = html;
        }

        function calculateAge(birthDate) {
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        function showAddModal() {
            alert('이용자 추가 기능은 준비 중입니다');
        }

        function editResident(id) {
            alert('편집 기능은 준비 중입니다');
        }

        function deleteResident(id) {
            if (confirm('이용자를 삭제하시겠습니까?')) {
                alert('삭제 기능은 준비 중입니다');
            }
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                loadResidents();
            }
        });
    </script>
</body>
</html>
