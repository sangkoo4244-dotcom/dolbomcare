<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 이용자 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
        }

        .sidebar {
            width: 288px;
            background: linear-gradient(180deg, #1E2B26 0%, #16201C 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; line-height: 1; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 24px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #B5532F;
            border-left-color: #B5532F;
            background: rgba(16, 185, 129, 0.1);
        }

        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 288px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: #1a202c; font-size: 13px; }
        .user-role { font-size: 12px; color: #6b7280; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #B5532F 0%, #9A4425 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .add-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #B5532F 0%, #9A4425 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }

        .stat-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #B5532F;
        }

        .table-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        .table th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            color: #374151;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
            text-align: left;
            white-space: nowrap;
        }

        .table th {
            white-space: nowrap;
        }

        .table td:first-child {
            white-space: normal;
        }

        .table tbody tr:hover {
            background: #f9fafb;
        }

        .resident-name {
            font-weight: 600;
            color: #1a202c;
        }

        .resident-info {
            font-size: 13px;
            color: #6b7280;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #6b7280;
        }

        .btn-sm:hover {
            border-color: #B5532F;
            color: #B5532F;
            background: #f0fdf4;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
            .topbar { padding: 16px; }
            .topbar-title h1 { font-size: 20px; }
        }
    </style>
    <script src="menu.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="side-brand"><div class="side-logo"></div><div><div class="side-title">돌봄케어</div><div class="side-sub">Care Management</div></div></div>
        <nav class="sidebar-nav"></nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>이용자 관리</h1></div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">요양사</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">전체 이용자</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">활성 이용자</div>
                    <div class="stat-value" id="activeCount">0</div>
                </div>
            </div>

            <!-- 요양사: 내가 올린 변경 요청과 처리 결과 -->
            <div id="myRequestPanel" style="display: none; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 8px;"> 내 변경 요청</h3>
                <div id="myRequestList" style="font-size: 14px;"></div>
            </div>

            <!-- 센터장: 요양사의 변경 요청 -->
            <div id="changeRequestPanel" style="display: none; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 8px;"> 변경 요청 <span id="changeRequestCount"></span></h3>
                <div id="changeRequestList" style="font-size: 14px;"></div>
            </div>

            <!-- Header -->
            <div class="header-action">
                <h2 style="font-size: 18px; font-weight: 700;">이용자 목록</h2>
                <button class="add-btn" onclick="showAddModal()">+ 이용자 추가</button>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <div id="residentsTable" class="empty-state">
                    <div class="empty-state-icon"></div>
                    <div>이용자 정보를 불러오는 중입니다...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="residentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 12px; padding: 32px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <div id="caregiverRequestBox" style="display: none; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px;">
                <div style="font-weight: 700; margin-bottom: 6px;">센터장 확인이 필요한 정보 변경 요청</div>
                <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                    <select id="changeField" style="padding: 6px; border: 1px solid #d1d5db; border-radius: 6px;">
                        <option value="care_grade">요양등급 (1~5)</option>
                        <option value="client_type">소득분류</option>
                        <option value="recognition_number">인정번호</option>
                        <option value="recognition_start">인정 시작일</option>
                        <option value="recognition_end">인정 종료일</option>
                        <option value="name">이름</option>
                        <option value="birth_date">생년월일</option>
                    </select>
                    <input id="changeValue" placeholder="새 값" style="padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 150px;">
                    <button type="button" onclick="submitChangeRequest()" style="padding: 6px 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">요청 보내기</button>
                </div>
            </div>
            <h2 id="modalTitle" style="margin-top: 0; margin-bottom: 24px;">이용자 추가</h2>
            <form id="residentForm" onsubmit="saveResident(event)">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">이름</label>
                    <input type="text" id="residentName" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">생년월일 (YYYY-MM-DD)</label>
                    <input type="date" id="residentBirthDate" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">요양등급</label>
                    <select id="careGrade" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="">선택하세요</option>
                        <option value="1">1등급 (최중증) - ₩2,512,900</option>
                        <option value="2">2등급 (중증) - ₩2,331,200</option>
                        <option value="3">3등급 (중증~중등증) - ₩1,528,200</option>
                        <option value="4">4등급 (중등증) - ₩1,409,700</option>
                        <option value="5">5등급 (경증) - ₩1,208,900</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">소득분류</label>
                    <select id="clientType" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="">선택하세요</option>
                        <option value="일반">일반 (본인부담 15-20%)</option>
                        <option value="차상위계층">차상위계층 (본인부담 10-15%)</option>
                        <option value="기초생활보장">기초생활보장 (본인부담 0%)</option>
                        <option value="의료급여">의료급여 (본인부담 0%)</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">건강 상태</label>
                    <select id="healthStatus" required style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="stable">안정</option>
                        <option value="warning">주의</option>
                        <option value="critical">위험</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">성별</label>
                    <select id="residentGender" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                        <option value="">선택하세요</option>
                        <option value="남">남</option>
                        <option value="여">여</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">주소</label>
                    <input type="text" id="residentAddress" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">장기요양인정번호</label>
                    <input type="text" id="recognitionNumber" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">인정 유효기간 시작일</label>
                    <input type="date" id="recognitionStart" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">인정 유효기간 종료일</label>
                    <input type="date" id="recognitionEnd" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">보호자 이름</label>
                    <input type="text" id="guardianName" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c;">보호자 연락처</label>
                    <input type="tel" id="guardianPhone" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px;">
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" style="flex: 1; padding: 10px; background: #B5532F; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">저장</button>
                    <button type="button" onclick="closeResidentModal()" style="flex: 1; padding: 10px; background: #f3f4f6; color: #6b7280; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">취소</button>
                </div>
            </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let residents = [];
        let currentResidentId = null;

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();

            // 메뉴 필터링은 menu.js의 renderSidebar() 함수에서 처리
            renderSidebar();

            return true;
        }

        async function loadResidents() {
            loadChangeRequests();
            try {
                const tableDiv = document.getElementById('residentsTable');
                tableDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div>로드 중...</div></div>';

                // 요양사: 자신이 담당하는 이용자만, 센터장: 센터의 모든 이용자
                let url = `${API_URL}/residents/`;
                if (currentUser.role === 'caregiver') {
                    url += `?caregiver_id=${currentUser.id}`;
                } else if (currentUser.role === 'center_manager') {
                    url += `?center_id=${currentUser.center_id}`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error('이용자 정보 조회 실패');

                const data = await response.json();
                residents = data.residents || [];

                document.getElementById('totalCount').textContent = residents.length;
                document.getElementById('activeCount').textContent = residents.filter(r => !r.is_archived).length;

                renderResidentsTable(residents);
            } catch (error) {
                console.error('❌ 이용자 로드 실패:', error);
                document.getElementById('residentsTable').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>이용자 정보를 불러올 수 없습니다</div></div>';
            }
        }

        function renderResidentsTable(residents) {
            const tableDiv = document.getElementById('residentsTable');

            if (residents.length === 0) {
                tableDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">😴</div><div>등록된 이용자가 없습니다</div></div>';
                return;
            }

            const healthLabels = { stable: '안정', warning: '주의', critical: '위험' };

            let html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>성별 / 연령</th>
                            <th>요양등급</th>
                            <th>소득분류</th>
                            <th>인정번호</th>
                            <th>인정 기간</th>
                            <th>보호자</th>
                            <th>건강 상태</th>
                            <th style="text-align: center;">작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            residents.forEach(r => {
                const age = calculateAge(new Date(r.birth_date));
                const period = r.recognition_start || r.recognition_end
                    ? `${r.recognition_start || '-'} ~ ${r.recognition_end || '-'}`
                    : '-';
                const guardian = r.guardian_name ? `${r.guardian_name}${r.guardian_phone ? '<br>' + r.guardian_phone : ''}` : '-';
                html += `
                    <tr>
                        <td>
                            <div class="resident-name">${r.name}</div>
                            <div class="resident-info">${r.address || '주소 미등록'}</div>
                        </td>
                        <td>${r.gender || '-'} / ${age}세</td>
                        <td>${r.care_grade}등급</td>
                        <td>${r.client_type}</td>
                        <td>${r.recognition_number || '-'}</td>
                        <td>${period}</td>
                        <td>${guardian}</td>
                        <td><span class="status-badge">${healthLabels[r.health_status] || '-'}</span></td>
                        <td style="text-align: center;">
                            <div class="action-buttons">
                                <button class="btn-sm" onclick="editResident(${r.id})">편집</button>
                                <button class="btn-sm" onclick="deleteResident(${r.id})">삭제</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableDiv.innerHTML = html;
        }

        function calculateAge(birthDate) {
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        function showAddModal() {
            currentResidentId = null;
            document.getElementById('modalTitle').textContent = '이용자 추가';
            document.getElementById('residentForm').reset();
            document.getElementById('residentModal').style.display = 'flex';
        }

        function editResident(id) {
            const resident = residents.find(r => r.id === id);
            if (!resident) return;

            currentResidentId = id;
            document.getElementById('modalTitle').textContent = '이용자 편집';
            document.getElementById('residentName').value = resident.name;
            document.getElementById('residentBirthDate').value = resident.birth_date;
            document.getElementById('careGrade').value = resident.care_grade || '';
            document.getElementById('clientType').value = resident.client_type || '';
            document.getElementById('healthStatus').value = resident.health_status;
            document.getElementById('residentGender').value = resident.gender || '';
            document.getElementById('residentAddress').value = resident.address || '';
            document.getElementById('recognitionNumber').value = resident.recognition_number || '';
            document.getElementById('recognitionStart').value = resident.recognition_start || '';
            document.getElementById('recognitionEnd').value = resident.recognition_end || '';
            document.getElementById('guardianName').value = resident.guardian_name || '';
            document.getElementById('guardianPhone').value = resident.guardian_phone || '';
            lockFieldsForCaregiver();
            document.getElementById('residentModal').style.display = 'flex';
        }

        const CAREGIVER_EDITABLE_IDS = ['healthStatus', 'residentAddress', 'guardianName', 'guardianPhone'];

        function lockFieldsForCaregiver() {
            const isCaregiver = currentUser && currentUser.role === 'caregiver';
            const modal = document.getElementById('residentModal');
            modal.querySelectorAll('input, select, textarea').forEach(el => {
                if (el.closest('#caregiverRequestBox')) return;  // 변경 요청 입력칸은 잠그지 않는다
                const editable = CAREGIVER_EDITABLE_IDS.includes(el.id);
                el.disabled = isCaregiver && !editable;
                el.style.background = isCaregiver && !editable ? '#f3f4f6' : '';
                el.style.color = isCaregiver && !editable ? '#6b7280' : '';
            });
            let note = document.getElementById('caregiverLockNote');
            if (isCaregiver && !note) {
                note = document.createElement('p');
                note.id = 'caregiverLockNote';
                note.style.cssText = 'font-size: 12px; color: #6b7280; margin: 8px 0;';
                note.textContent = '요양사는 건강상태, 주소, 보호자 정보를 직접 수정할 수 있습니다. 나머지 정보는 변경 요청으로 센터장에게 요청하세요.';
                modal.querySelector('form').prepend(note);
            }
            if (note) note.style.display = isCaregiver ? 'block' : 'none';
            const box = document.getElementById('caregiverRequestBox');
            if (box) box.style.display = isCaregiver && currentResidentId ? 'block' : 'none';
        }

        async function submitChangeRequest() {
            const field = document.getElementById('changeField').value;
            const value = document.getElementById('changeValue').value.trim();
            if (!value) { alert('새 값을 입력해 주세요'); return; }
            const response = await fetch(`${API_URL}/residents/${currentResidentId}/change-requests`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ field, value })
            });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                alert(`요청 실패: ${err.detail || '오류'}`);
                return;
            }
            alert('센터장에게 변경을 요청했습니다. 승인되면 반영됩니다.');
            document.getElementById('changeValue').value = '';
        }

        const CHANGE_LABELS = { care_grade: '요양등급', client_type: '소득분류', recognition_number: '인정번호', recognition_start: '인정 시작일', recognition_end: '인정 종료일', name: '이름', birth_date: '생년월일' };
        const CHANGE_STATUS = {
            pending: '<span style="color:#b45309; font-weight:700;">센터장 확인 대기</span>',
            approved: '<span style="color:#047857; font-weight:700;">승인되어 반영됨</span>',
            rejected: '<span style="color:#b91c1c; font-weight:700;">반려됨</span>'
        };

        async function loadMyChangeRequests() {
            if (!currentUser || currentUser.role !== 'caregiver') return;
            const response = await fetch(`${API_URL}/residents/change-requests/mine`);
            if (!response.ok) return;
            const data = await response.json();
            const panel = document.getElementById('myRequestPanel');
            panel.style.display = data.requests.length ? 'block' : 'none';
            document.getElementById('myRequestList').innerHTML = data.requests.map(r => `
                <div style="padding: 8px 0; border-top: 1px solid #bae6fd;">
                    <div><b>${r.resident_name}</b> · ${CHANGE_LABELS[r.field] || r.field} → <b>${r.new_value}</b> ${CHANGE_STATUS[r.status] || r.status}</div>
                    ${r.status === 'rejected' && r.reason ? `<div style="color:#b91c1c; font-size: 13px; margin-top: 4px;">반려 사유: ${r.reason}</div>` : ''}
                </div>`).join('');
        }

        async function loadChangeRequests() {
            loadMyChangeRequests();
            if (!currentUser || currentUser.role !== 'center_manager') return;
            const response = await fetch(`${API_URL}/residents/change-requests?status=pending`);
            if (!response.ok) return;
            const data = await response.json();
            const panel = document.getElementById('changeRequestPanel');
            const list = document.getElementById('changeRequestList');
            const labels = { care_grade: '요양등급', client_type: '소득분류', recognition_number: '인정번호', recognition_start: '인정 시작일', recognition_end: '인정 종료일', name: '이름', birth_date: '생년월일' };
            panel.style.display = data.requests.length ? 'block' : 'none';
            document.getElementById('changeRequestCount').textContent = `(${data.requests.length}건)`;
            list.innerHTML = data.requests.map(r => `
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid #fde68a;">
                    <span><b>${r.resident_name}</b> · ${labels[r.field] || r.field} → <b>${r.new_value}</b> <span style="color:#6b7280;">(요청: ${r.requested_by})</span></span>
                    <span>
                        <button onclick="decideChangeRequest(${r.id}, 'approve')" style="padding: 4px 10px; background: #B5532F; color: white; border: none; border-radius: 6px; cursor: pointer;">승인</button>
                        <button onclick="decideChangeRequest(${r.id}, 'reject')" style="padding: 4px 10px; background: white; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 6px; cursor: pointer;">반려</button>
                    </span>
                </div>`).join('');
        }

        async function decideChangeRequest(id, action) {
            let body = undefined;
            if (action === 'reject') {
                const reason = prompt('반려 사유를 입력해 주세요');
                if (!reason || !reason.trim()) return;
                body = JSON.stringify({ reason: reason.trim() });
            }
            const response = await fetch(`${API_URL}/residents/change-requests/${id}/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body
            });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                alert(`처리 실패: ${err.detail || '오류'}`);
                return;
            }
            loadChangeRequests();
            loadResidents();
        }

        function closeResidentModal() {
            document.getElementById('residentModal').style.display = 'none';
            document.getElementById('residentForm').reset();
            document.querySelectorAll('#residentModal input, #residentModal select, #residentModal textarea').forEach(el => {
                el.disabled = false;
                el.style.background = '';
                el.style.color = '';
            });
            const box = document.getElementById('caregiverRequestBox');
            if (box) box.style.display = 'none';
            currentResidentId = null;
        }

        async function saveResident(event) {
            event.preventDefault();

            const name = document.getElementById('residentName').value;
            const birthDate = document.getElementById('residentBirthDate').value;
            const careGrade = parseInt(document.getElementById('careGrade').value);
            const clientType = document.getElementById('clientType').value;
            const healthStatus = document.getElementById('healthStatus').value;
            const gender = document.getElementById('residentGender').value;
            const address = document.getElementById('residentAddress').value;
            const recognitionNumber = document.getElementById('recognitionNumber').value;
            const recognitionStart = document.getElementById('recognitionStart').value || null;
            const recognitionEnd = document.getElementById('recognitionEnd').value || null;
            const guardianName = document.getElementById('guardianName').value;
            const guardianPhone = document.getElementById('guardianPhone').value;

            if (recognitionStart && recognitionEnd && recognitionEnd < recognitionStart) {
                alert('인정 종료일이 시작일보다 빠를 수 없습니다. 인정서의 날짜를 다시 확인해 주세요.');
                return;
            }
            const today = new Date().toISOString().slice(0, 10);
            if (recognitionEnd && recognitionEnd < today && !confirm('인정 유효기간이 지났습니다. 그래도 저장할까요? (갱신 여부를 확인하세요)')) {
                return;
            }

            try {
                const method = currentResidentId ? 'PUT' : 'POST';
                const url = currentResidentId
                    ? `${API_URL}/residents/${currentResidentId}`
                    : `${API_URL}/residents/?user_role=${currentUser.role}`;

                const fullBody = {
                        name,
                        center_id: currentUser.center_id,
                        birth_date: birthDate,
                        age: Math.floor((new Date() - new Date(birthDate)) / (365.25 * 24 * 60 * 60 * 1000)),
                        care_grade: careGrade,
                        client_type: clientType,
                        health_status: healthStatus,
                        gender: gender,
                        address: address,
                        recognition_number: recognitionNumber,
                        recognition_start: recognitionStart,
                        recognition_end: recognitionEnd,
                        guardian_name: guardianName,
                        guardian_phone: guardianPhone,
                        admission_date: new Date().toISOString()
                };
                // 요양사는 기존 이용자의 건강상태·주소·보호자 정보만 직접 수정할 수 있다
                const isCaregiverEdit = currentResidentId && currentUser.role === 'caregiver';
                const payload = isCaregiverEdit
                    ? { health_status: healthStatus, address: address, guardian_name: guardianName, guardian_phone: guardianPhone }
                    : fullBody;

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(currentResidentId ? '이용자가 수정되었습니다' : '이용자가 추가되었습니다');
                    closeResidentModal();
                    loadResidents();
                } else {
                    const error = await response.json();
                    alert(`오류: ${error.detail || '요청에 실패했습니다'}`);
                }
            } catch (error) {
                console.error('저장 오류:', error);
                alert('저장 중 오류가 발생했습니다');
            }
        }

        function deleteResident(id) {
            if (confirm('이용자를 삭제하시겠습니까?')) {
                fetch(`${API_URL}/residents/${id}`, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        alert('이용자가 삭제되었습니다');
                        loadResidents();
                    } else {
                        alert('삭제에 실패했습니다');
                    }
                }).catch(error => {
                    console.error('삭제 오류:', error);
                    alert('삭제 중 오류가 발생했습니다');
                });
            }
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                loadResidents();
            }
        });
    </script>
    <script src="art.js"></script>
    <script>
        // 상단 배너: 디자인 시안 그림 (assets/user_design/)
        const banner = document.createElement('div');
        banner.className = 'page-scene';
        banner.innerHTML = '<img src="assets/user_design/resident_banner.png" alt="" style="width:100%;height:auto;border-radius:8px;display:block;">';
        document.querySelector('.main-layout').children[0].after(banner);
    </script>
</body>
</html>
