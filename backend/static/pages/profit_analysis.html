<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 수익 분석 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: #f5f7fa;
            color: var(--text-primary);
        }

        .sidebar {
            width: 288px;
            background: linear-gradient(180deg, #1E2B26 0%, #16201C 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav { padding: 24px 0; }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { color: #B5532F; border-left-color: #B5532F; background: rgba(181, 83, 47, 0.1); }
        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 288px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 { margin: 0; font-size: 24px; font-weight: 700; color: var(--text-primary); }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #B5532F 0%, #9A4425 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }

        .metric-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #B5532F;
            margin-bottom: 8px;
        }

        .metric-change {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .metric-change.positive { color: #B5532F; }
        .metric-change.negative { color: #dc2626; }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 32px 0 20px 0;
            color: var(--text-primary);
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            margin-bottom: 32px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
        }

        .data-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th {
            background: #f9fafb;
            padding: 16px;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid #e5e7eb;
            color: var(--text-primary);
        }

        .data-table td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .data-table tbody tr:hover {
            background: #f9fafb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
            .metrics-grid { grid-template-columns: 1fr; }
        }
    </style>
    <script src="menu.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="side-brand"><div class="side-logo">❤️</div><div><div class="side-title">돌봄케어</div><div class="side-sub">Care Management</div></div></div>
        <nav class="sidebar-nav"></nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>수익 분석</h1></div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">센터장</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Key Metrics -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">월 수익</div>
                    <div class="metric-value" id="monthlyRevenue">₩0</div>
                    <div class="metric-change positive">↑ 12.5% vs 지난 달</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">평균 이용자당 수익</div>
                    <div class="metric-value" id="revenuePerResident">₩0</div>
                    <div class="metric-change positive">↑ 8.3% vs 지난 달</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">수익화율</div>
                    <div class="metric-value" id="profitMargin">0%</div>
                    <div class="metric-change">평균 대비 기준</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">누적 청부액</div>
                    <div class="metric-value" id="totalBilling">₩0</div>
                    <div class="metric-change">현월 집계</div>
                </div>
            </div>

            <!-- Revenue Chart -->
            <div class="section-title">📊 월별 수익 추이</div>
            <div class="chart-container">
                <div class="empty-state">
                    <div class="empty-state-icon">📈</div>
                    <div>수익 차트는 향후 업데이트됩니다</div>
                </div>
            </div>

            <!-- Service Breakdown -->
            <div class="section-title">🎯 서비스별 수익 현황</div>
            <div class="chart-container">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <div>서비스별 분석은 향후 업데이트됩니다</div>
                </div>
            </div>

            <!-- Billing History -->
            <div class="section-title">💳 최근 청부 기록</div>
            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>이용자</th>
                            <th>요양사</th>
                            <th>서비스</th>
                            <th>금액</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody id="billingTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                                데이터를 로드하는 중입니다...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id || user.role !== 'center_manager') {
                alert('센터장 권한이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();
            renderSidebar();

            return true;
        }

        async function loadProfitData() {
            try {
                const centerId = currentUser?.center_id || 1;
                const response = await fetch(`${API_URL}/billing/?center_id=${centerId}&include_archived=true`);

                if (!response.ok) throw new Error('데이터 조회 실패');

                const data = await response.json();
                const records = data.records || [];

                // 월 수익 (승인 이후 상태: approved, submitted_to_nhis, reimbursed — 대시보드·정산과 동일)
                const paidRecords = records.filter(r => ['approved', 'submitted_to_nhis', 'reimbursed'].includes(r.approval_status));
                const monthlyRevenue = paidRecords.reduce((sum, r) => sum + (r.amount || 0), 0);

                // 주민별 평균
                const residents = records.map(r => r.resident_id);
                const uniqueResidents = new Set(residents);
                const revenuePerResident = uniqueResidents.size > 0 ? Math.floor(monthlyRevenue / uniqueResidents.size) : 0;

                // 수익화율 (확정 / 전체)
                const profitMargin = records.length > 0 ? Math.round((paidRecords.length / records.length) * 100) : 0;

                // UI 업데이트
                document.getElementById('monthlyRevenue').textContent = new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(monthlyRevenue);
                document.getElementById('revenuePerResident').textContent = new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(revenuePerResident);
                document.getElementById('profitMargin').textContent = profitMargin + '%';
                document.getElementById('totalBilling').textContent = new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(
                    records.reduce((sum, r) => sum + (r.amount || 0), 0)
                );

                // 최근 기록
                renderBillingTable(records.slice(0, 10));

            } catch (error) {
                console.error('❌ 데이터 로드 실패:', error);
                document.getElementById('billingTableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-secondary);">데이터를 불러올 수 없습니다</td></tr>';
            }
        }

        function renderBillingTable(records) {
            const tbody = document.getElementById('billingTableBody');

            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-secondary);">기록이 없습니다</td></tr>';
                return;
            }

            let html = '';
            records.forEach(r => {
                const date = new Date(r.recorded_date).toLocaleDateString('ko-KR');
                const statusMap = { 'reimbursed': '확정', 'submitted_to_nhis': '제출', 'approved': '승인', 'pending': '대기', 'draft': '작성' };
                html += `
                    <tr>
                        <td>${date}</td>
                        <td>${r.resident_name || '알 수 없음'}</td>
                        <td>${r.caregiver_name || '-'}</td>
                        <td>${r.service_type}</td>
                        <td>₩${(r.amount || 0).toLocaleString()}</td>
                        <td>${statusMap[r.approval_status] || r.approval_status}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                loadProfitData();
            }
        });
    </script>
</body>
</html>
