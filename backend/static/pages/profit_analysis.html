<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수익 분석 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-family); background: #f5f7fa; color: var(--text-primary); }

        /* 사이드바: 직원 관리 시안과 동일 */
        .sidebar { width: 288px; background: linear-gradient(180deg, #1F3A2D 0%, #14261D 100%); color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow-y: auto; box-shadow: var(--shadow-lg); z-index: 1000; display: flex; flex-direction: column; }
        .sidebar-landscape { display: block; width: 100%; height: auto; margin-top: auto; }
        .sidebar .side-item.active { background: #4E7D5E; color: #fff; }
        .side-icon img { display: block; }

        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid #e5e7eb; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
        .topbar-title h1 { margin: 0; font-size: 26px; font-weight: 800; color: #1E3A5F; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #1F2937; font-size: 14px; }
        .user-info .chev { width: 14px; height: 14px; color: #6B7280; }
        .logout-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: white; border: 1px solid #D6D0C4; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; color: #374151; }
        .logout-btn:hover { border-color: #dc2626; color: #dc2626; }

        .content { flex: 1; padding: 30px 32px; }
        .pa-banner { border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        .pa-banner img { width: 100%; height: auto; display: block; }

        .pa-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
        .pa-metric { display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-radius: 16px; min-height: 118px; border: 1px solid #e5e7eb; }
        .pa-metric img { width: 92px; height: 92px; object-fit: contain; flex: 0 0 auto; mix-blend-mode: multiply; }
        .pa-metric-label { font-size: 15px; font-weight: 700; }
        .pa-metric-value { font-size: 28px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
        .pa-delta { font-size: 13px; font-weight: 700; margin-top: 4px; }
        .pa-delta.up { color: #15803D; }
        .pa-delta.down { color: #DC2626; }
        .pa-delta.flat { color: #6B7280; }

        .pa-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-bottom: 20px; }
        .pa-row-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
        .pa-card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px 22px; }
        .pa-card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .pa-card-title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: #1F2937; }
        .pa-card-title img { width: 30px; height: 30px; object-fit: contain; mix-blend-mode: multiply; }
        .pa-note { font-size: 12px; color: #6B7280; }
        .pa-select { height: 36px; padding: 0 10px; border: 1px solid #D6D0C4; border-radius: 8px; font-size: 13px; background: white; }

        .pa-chart { position: relative; height: 300px; }
        .pa-donut-wrap { display: flex; align-items: center; gap: 16px; }
        .pa-donut { position: relative; width: 220px; height: 220px; flex: 0 0 auto; }
        .pa-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .pa-donut-center .k { font-size: 13px; color: #6B7280; font-weight: 700; }
        .pa-donut-center .v { font-size: 16px; font-weight: 800; color: #1F2937; }
        .pa-legend { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        .pa-legend-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .pa-dot { width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto; }
        .pa-legend-name { font-weight: 700; color: #1F2937; }
        .pa-legend-amt { font-size: 12px; color: #6B7280; }
        .pa-legend-pct { margin-left: auto; font-weight: 800; color: #1F2937; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { padding: 12px 14px; text-align: center; background: #f9fafb; border-bottom: 1px solid #e5e7eb; font-weight: 700; color: #1F2937; }
        td { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; text-align: center; color: #1F2937; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        tr.total td { background: #EEF4FC; font-weight: 800; }
        .pa-muted { color: #9CA3AF; }

        .pa-quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .pa-quick-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 16px 10px; border-radius: 14px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; font: inherit; color: inherit; }
        .pa-quick-item:disabled { cursor: not-allowed; opacity: 0.9; }
        .pa-quick-item img { width: 62px; height: 62px; object-fit: contain; mix-blend-mode: multiply; }
        .pa-quick-title { font-size: 14px; font-weight: 800; color: #1F2937; }
        .pa-quick-desc { font-size: 12px; color: #6B7280; line-height: 1.4; }

        .error { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 8px; margin-bottom: 20px; }

        @media (max-width: 1100px) { .pa-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pa-row, .pa-row-2 { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
            .pa-metrics { grid-template-columns: 1fr; }
            .pa-donut-wrap { flex-direction: column; }
        }
    </style>
    <script src="menu.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="side-brand"><div class="side-logo"></div><div><div class="side-title">돌봄케어</div><div class="side-sub">Care Management</div></div></div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <img class="sidebar-landscape" src="assets/user_design/sidebar_care_landscape.png" alt="">
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>수익 분석</h1></div>
            <div class="user-menu">
                <img src="assets/user_design/28_top_notification_icon.png" alt="" style="width:28px;height:28px;object-fit:contain;">
                <div class="user-info">
                    <img id="userAvatar" src="assets/user_design/29_top_profile_icon.png" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">
                    <span id="userName">사용자</span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                    로그아웃
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="pa-banner"><img src="assets/user_design/profit_banner.png" alt=""></div>

            <div id="errorContainer"></div>

            <!-- Key Metrics -->
            <div class="pa-metrics">
                <div class="pa-metric" style="background:#EEF4FC;">
                    <img src="assets/user_design/profit_metric_total.png" alt="">
                    <div>
                        <div class="pa-metric-label" style="color:#1D4ED8;">총 청구액</div>
                        <div class="pa-metric-value" id="metricTotal" style="color:#1F2937;">₩0</div>
                        <div class="pa-delta flat" id="deltaTotal">-</div>
                    </div>
                </div>
                <div class="pa-metric" style="background:#EAF8F0;">
                    <img src="assets/user_design/profit_metric_service.png" alt="">
                    <div>
                        <div class="pa-metric-label" style="color:#15803D;">정산 완료 금액</div>
                        <div class="pa-metric-value" id="metricPaid" style="color:#1F2937;">₩0</div>
                        <div class="pa-delta flat" id="deltaPaid">-</div>
                    </div>
                </div>
                <div class="pa-metric" style="background:#FBEAEA;">
                    <img src="assets/user_design/profit_metric_copay.png" alt="">
                    <div>
                        <div class="pa-metric-label" style="color:#DC2626;">정산 대기 금액</div>
                        <div class="pa-metric-value" id="metricPending" style="color:#DC2626;">₩0</div>
                        <div class="pa-delta flat" id="deltaPending">-</div>
                    </div>
                </div>
                <div class="pa-metric" style="background:#F3F0FD;">
                    <img src="assets/user_design/profit_metric_other.png" alt="">
                    <div>
                        <div class="pa-metric-label" style="color:#6D28D9;">정산 중단 금액</div>
                        <div class="pa-metric-value" id="metricSuspended" style="color:#6D28D9;">₩0</div>
                        <div class="pa-delta flat" id="deltaSuspended">-</div>
                    </div>
                </div>
            </div>

            <!-- Monthly chart + composition -->
            <div class="pa-row">
                <div class="pa-card">
                    <div class="pa-card-head">
                        <div class="pa-card-title"><img src="assets/user_design/profit_title_bar.png" alt="">월별 수익 추이</div>
                        <select class="pa-select" id="yearSelect" onchange="loadProfitData()"></select>
                    </div>
                    <div class="pa-chart"><canvas id="monthlyChart"></canvas></div>
                </div>
                <div class="pa-card">
                    <div class="pa-card-head">
                        <div class="pa-card-title"><img src="assets/user_design/profit_title_pie.png" alt="">수익 구성 비율</div>
                        <span class="pa-note" id="donutNote"></span>
                    </div>
                    <div class="pa-donut-wrap">
                        <div class="pa-donut">
                            <canvas id="donutChart"></canvas>
                            <div class="pa-donut-center"><span class="k">총 청구액</span><span class="v" id="donutTotal">₩0</span></div>
                        </div>
                        <div class="pa-legend" id="donutLegend"></div>
                    </div>
                </div>
            </div>

            <!-- Service table + quick actions -->
            <div class="pa-row-2">
                <div class="pa-card">
                    <div class="pa-card-head">
                        <div class="pa-card-title"><img src="assets/user_design/profit_title_table.png" alt="">주요 항목별 수익 현황</div>
                        <span class="pa-note" id="tableNote"></span>
                    </div>
                    <table>
                        <thead>
                            <tr><th style="text-align:left;">항목</th><th style="text-align:right;">금액</th><th>비율</th><th>전월 대비</th></tr>
                        </thead>
                        <tbody id="serviceTableBody">
                            <tr><td colspan="4" class="pa-muted" style="padding:30px;">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pa-card">
                    <div class="pa-card-head">
                        <div class="pa-card-title"><img src="assets/user_design/profit_title_bolt.png" alt="">빠른 기능</div>
                    </div>
                    <div class="pa-quick">
                        <button class="pa-quick-item" style="background:#FFF1F1;" disabled title="준비 중인 기능입니다">
                            <img src="assets/user_design/profit_quick_detail.png" alt="">
                            <span class="pa-quick-title">상세 수익 분석</span>
                            <span class="pa-quick-desc">항목별 수익을 상세히 분석합니다.</span>
                        </button>
                        <button class="pa-quick-item" style="background:#EEF4FC;" disabled title="준비 중인 기능입니다">
                            <img src="assets/user_design/profit_quick_report.png" alt="">
                            <span class="pa-quick-title">월별 보고서</span>
                            <span class="pa-quick-desc">월별 수익 보고서를 생성합니다.</span>
                        </button>
                        <button class="pa-quick-item" style="background:#EAF8F0;" onclick="exportCsv()">
                            <img src="assets/user_design/profit_quick_excel.png" alt="">
                            <span class="pa-quick-title">엑셀 다운로드</span>
                            <span class="pa-quick-desc">수익 데이터를 엑셀로 다운로드합니다.</span>
                        </button>
                        <button class="pa-quick-item" style="background:#FFF7EC;" onclick="window.print()">
                            <img src="assets/user_design/profit_quick_print.png" alt="">
                            <span class="pa-quick-title">인쇄하기</span>
                            <span class="pa-quick-desc">분석 결과를 인쇄할 수 있습니다.</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let monthlyChart = null;
        let donutChart = null;
        let loadedRows = [];   // 선택 연도의 월별·서비스별 집계
        let serviceRows = [];  // 표 CSV 용

        // 청구 기록 상태 묶음 (정산 화면과 동일 기준)
        const PAID = ['approved', 'submitted_to_nhis', 'reimbursed'];
        const SERVICE_LABEL = { basic_care: '기본요양', meal_service: '식사지원', medical_care: '의료관리', emergency: '응급' };

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        const won = v => `₩${Math.round(v || 0).toLocaleString()}`;
        const manLabel = v => v >= 10000 ? `${Math.round(v / 10000).toLocaleString()}만원` : `${Math.round(v).toLocaleString()}원`;

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id || user.role !== 'center_manager') {
                alert('센터장 권한이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userAvatar').alt = user.full_name || '';
            renderSidebar();
            applyNavIcons();
            return true;
        }

        // 시안의 메뉴 아이콘 (assets/user_design/20~27_nav_*): 이 화면의 사이드바에만 적용한다
        const NAV_ICON_FILES = {
            '대시보드': '20_nav_dashboard_icon.png',
            '이용자관리': '21_nav_user_icon.png',
            '음성 기록': '22_nav_voice_icon.png',
            '방문계획 승인': '23_nav_service_plan_icon.png',
            '청부관리': '24_nav_billing_icon.png',
            '수익분석': '25_nav_statistics_icon.png',
            '알림': '26_nav_notice_icon.png',
            '설정': '27_nav_settings_icon.png',
        };

        function applyNavIcons() {
            document.querySelectorAll('.sidebar-nav .side-item').forEach(item => {
                const file = NAV_ICON_FILES[item.querySelector('span:last-child')?.textContent.trim()];
                if (file) item.querySelector('.side-icon').innerHTML = `<img src="assets/user_design/${file}" width="24" height="24" alt="">`;
            });
        }

        // 청부 기록을 연·월별로 묶는다 (금액은 반려 제외 기준)
        function summarize(records, year) {
            const months = Array.from({ length: 12 }, () => ({ total: 0, paid: 0, pending: 0, suspended: 0, services: {} }));
            records.forEach(r => {
                if (!r.recorded_date) return;
                const [y, m] = r.recorded_date.slice(0, 7).split('-').map(Number);
                if (y !== year) return;
                const cell = months[m - 1];
                const amount = r.amount || 0;
                if (r.approval_status === 'rejected') { cell.suspended += amount; return; }
                cell.total += amount;
                if (PAID.includes(r.approval_status)) cell.paid += amount;
                else if (r.approval_status === 'pending') cell.pending += amount;
                cell.services[r.service_type] = (cell.services[r.service_type] || 0) + amount;
            });
            return months;
        }

        // 기준 월: 선택 연도에서 기록이 있는 가장 최근 달 (없으면 1월)
        function pickMonth(months) {
            for (let i = 11; i >= 0; i--) {
                if (months[i].total || months[i].suspended) return i;
            }
            return 0;
        }

        function delta(cur, prev) {
            if (!prev && !cur) return { text: '-', cls: 'flat' };
            if (!prev) return { text: '전월 기록 없음', cls: 'flat' };
            const pct = (cur - prev) / prev * 100;
            const arrow = pct >= 0 ? '▲' : '▼';
            return { text: `${arrow} ${Math.abs(pct).toFixed(1)}% 전월 대비`, cls: pct >= 0 ? 'up' : 'down' };
        }

        function setDelta(id, d) {
            const el = document.getElementById(id);
            el.textContent = d.text;
            el.className = `pa-delta ${d.cls}`;
        }

        async function loadProfitData() {
            try {
                const centerId = currentUser?.center_id || 1;
                const year = parseInt(document.getElementById('yearSelect').value);
                const response = await fetch(`${API_URL}/billing/?center_id=${centerId}&include_archived=true`);
                if (!response.ok) throw new Error('데이터 조회 실패');

                const data = await response.json();
                const records = data.records || [];
                const months = summarize(records, year);
                const idx = pickMonth(months);
                const cur = months[idx];
                const prev = idx > 0 ? months[idx - 1] : { total: 0, paid: 0, pending: 0, suspended: 0, services: {} };

                // 지표 카드
                document.getElementById('metricTotal').textContent = won(cur.total);
                document.getElementById('metricPaid').textContent = won(cur.paid);
                document.getElementById('metricPending').textContent = won(cur.pending);
                document.getElementById('metricSuspended').textContent = won(cur.suspended);
                setDelta('deltaTotal', delta(cur.total, prev.total));
                setDelta('deltaPaid', delta(cur.paid, prev.paid));
                setDelta('deltaPending', delta(cur.pending, prev.pending));
                setDelta('deltaSuspended', delta(cur.suspended, prev.suspended));

                renderMonthlyChart(months);
                renderDonut(cur, idx + 1, year);
                renderServiceTable(cur, prev, idx + 1);
                hideError();
            } catch (error) {
                console.error('❌ 데이터 로드 실패:', error);
                showError('수익 데이터를 불러올 수 없습니다');
            }
        }

        function renderMonthlyChart(months) {
            const labels = months.map((_, i) => `${i + 1}월`);
            if (monthlyChart) monthlyChart.destroy();
            monthlyChart = new Chart(document.getElementById('monthlyChart'), {
                data: {
                    labels,
                    datasets: [
                        { type: 'bar', label: '정산 완료', data: months.map(m => m.paid), backgroundColor: '#86D7A6', borderRadius: 3, order: 2 },
                        { type: 'bar', label: '정산 대기', data: months.map(m => m.pending), backgroundColor: '#FB923C', borderRadius: 3, order: 2 },
                        { type: 'line', label: '총 청구액', data: months.map(m => m.total), borderColor: '#2563EB', backgroundColor: '#2563EB', tension: 0, pointRadius: 4, order: 1 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 10 } } },
                    scales: {
                        y: { beginAtZero: true, ticks: { callback: v => manLabel(v) }, grid: { color: '#eef1f5' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderDonut(cur, month, year) {
            const parts = [
                { name: '정산 완료', color: '#22C55E', value: cur.paid },
                { name: '정산 대기', color: '#F97316', value: cur.pending },
                { name: '정산 중단', color: '#8B5CF6', value: cur.suspended }
            ];
            const sum = parts.reduce((s, p) => s + p.value, 0);
            document.getElementById('donutNote').textContent = `${year}년 ${month}월 기준`;
            document.getElementById('donutTotal').textContent = won(cur.total);
            if (donutChart) donutChart.destroy();
            donutChart = new Chart(document.getElementById('donutChart'), {
                type: 'doughnut',
                data: { labels: parts.map(p => p.name), datasets: [{ data: parts.map(p => p.value), backgroundColor: parts.map(p => p.color), borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '64%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${won(c.parsed)}` } } } }
            });
            document.getElementById('donutLegend').innerHTML = parts.map(p => `
                <div class="pa-legend-row">
                    <span class="pa-dot" style="background:${p.color};"></span>
                    <div><div class="pa-legend-name">${p.name}</div><div class="pa-legend-amt">${won(p.value)}</div></div>
                    <span class="pa-legend-pct">${sum ? (p.value / sum * 100).toFixed(1) : '0.0'}%</span>
                </div>`).join('');
        }

        function renderServiceTable(cur, prev, month) {
            const keys = Object.keys(cur.services).sort((a, b) => cur.services[b] - cur.services[a]);
            document.getElementById('tableNote').textContent = `${month}월 기준`;
            const tbody = document.getElementById('serviceTableBody');
            serviceRows = keys.map(k => ({
                name: SERVICE_LABEL[k] || k,
                amount: cur.services[k],
                ratio: cur.total ? (cur.services[k] / cur.total * 100) : 0,
                change: delta(cur.services[k], prev.services[k] || 0)
            }));
            if (serviceRows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="pa-muted" style="padding:30px;">해당 월의 청구 기록이 없습니다</td></tr>';
                return;
            }
            const rows = serviceRows.map(r => `
                <tr>
                    <td style="text-align:left;">${r.name}</td>
                    <td class="num">${won(r.amount)}</td>
                    <td>${r.ratio.toFixed(1)}%</td>
                    <td style="color:${r.change.cls === 'up' ? '#15803D' : r.change.cls === 'down' ? '#DC2626' : '#6B7280'};font-weight:700;">${r.change.text}</td>
                </tr>`).join('');
            const total = `<tr class="total"><td style="text-align:left;">합계</td><td class="num">${won(cur.total)}</td><td>100%</td><td>${delta(cur.total, prev.total).text}</td></tr>`;
            tbody.innerHTML = rows + total;
        }

        function exportCsv() {
            if (serviceRows.length === 0) { alert('내려받을 수익 기록이 없습니다'); return; }
            const header = ['항목', '금액', '비율(%)', '전월 대비'];
            const lines = serviceRows.map(r => [r.name, Math.round(r.amount), r.ratio.toFixed(1), r.change.text]);
            const csv = [header, ...lines].map(cols => cols.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `수익분석_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
        }

        function initYearSelect() {
            const now = new Date().getFullYear();
            const select = document.getElementById('yearSelect');
            select.innerHTML = [now - 2, now - 1, now].map(y => `<option value="${y}">${y}년</option>`).join('');
            select.value = now;
        }

        function showError(message) {
            document.getElementById('errorContainer').innerHTML = `<div class="error">${message}</div>`;
        }

        function hideError() {
            document.getElementById('errorContainer').innerHTML = '';
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                initYearSelect();
                loadProfitData();
            }
        });
    </script>
    <script src="art.js"></script>
</body>
</html>
