<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 방문 현황 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }
        .sidebar { width: 288px; color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .sidebar-nav { padding: 20px 0; overflow: hidden; }
        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title h1 { margin: 0; font-size: 24px; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 600; }
        .content { flex: 1; padding: 30px; }
        @media (max-width: 768px) { .main-layout { margin-left: 0; } .content { padding: 16px; } }

        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0; }
        html, body { background: var(--bg) !important; }
        body, .content { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: linear-gradient(180deg, var(--navy) 0%, #0E1D30 100%) !important; }
        .sidebar .side-item.active { background: var(--teal) !important; color: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }

        .panel { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
        .card { background: #fff; border: 1px solid var(--line2); border-radius: 12px; padding: 14px; }
        .card .k { font-size: 12px; color: #64748B; }
        .card .v { font-size: 24px; font-weight: 800; margin-top: 4px; }
        .field { padding: 9px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        .row { display: grid; grid-template-columns: 70px 1fr 1fr 120px 1fr; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .b-upcoming { background: #E2E8F0; color: #334155; }
        .b-in_progress { background: #DBEAFE; color: #1E40AF; }
        .b-left_unrecorded { background: #FEF3C7; color: #92400E; }
        .b-check { background: #FEE2E2; color: #991B1B; }
        .b-recorded { background: #DCFCE7; color: #166534; }
        .note { font-size: 12px; color: #94A3B8; margin-top: 10px; }
        .empty-note { color: #94A3B8; font-size: 13px; }
        @media (max-width: 768px) { .row { grid-template-columns: 1fr 1fr; } }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="menu.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>

    <div class="main-layout">
        <div class="topbar">
            <div class="topbar-title">
                <h1>오늘 방문 현황</h1>
                <div class="breadcrumb">홈 › 방문 운영 › <b>오늘 방문 현황</b></div>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role">센터장</div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="content">
            <div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <input id="day" type="date" class="field" onchange="load()">
                <span id="stamp" style="font-size:13px;color:#64748B;"></span>
                <button class="logout-btn" onclick="load()">새로고침</button>
            </div>

            <div class="cards" id="cards"></div>

            <div class="panel">
                <div id="rows"><div class="empty-note">불러오는 중…</div></div>
                <div class="note" id="note"></div>
            </div>
        </div>
    </div>

    <script>
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
        const user = JSON.parse(localStorage.getItem('user') || 'null') || {};
        const LABEL = { upcoming: '예정', in_progress: '진행 중', left_unrecorded: '기록 필요', check: '확인 필요', recorded: '기록 완료' };
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html';
            }
        }

        async function load() {
            const day = document.getElementById('day').value;
            const q = day ? `?day=${day}` : '';
            const r = await fetch(`/api/v1/today-board${q}`);
            const d = await r.json().catch(() => ({}));
            if (!r.ok) { document.getElementById('rows').innerHTML = `<div class="empty-note">${esc(d.detail || '불러오지 못했습니다')}</div>`; return; }
            const v = d.data;
            document.getElementById('stamp').textContent = `${v.date} · ${v.generated_at} 기준`;
            const c = v.counts;
            document.getElementById('cards').innerHTML = [
                ['오늘 계획', v.total], ['기록률', v.record_rate === null ? '-' : v.record_rate + '%'],
                ['진행 중', c.in_progress], ['기록 필요', c.left_unrecorded], ['확인 필요', c.check], ['예정', c.upcoming],
            ].map(([k, x]) => `<div class="card"><div class="k">${k}</div><div class="v">${esc(x)}</div></div>`).join('');
            document.getElementById('rows').innerHTML = v.rows.length ? v.rows.map(x => `<div class="row">
                <div><b>${esc(x.planned)}</b></div><div>${esc(x.resident)}</div><div>${esc(x.caregiver)}</div>
                <div>${x.arrived ? '도착 ' + esc(x.arrived) : '도착 전'}${x.left ? ' · 퇴실 ' + esc(x.left) : ''}</div>
                <div><span class="badge b-${x.status}">${LABEL[x.status]}</span></div></div>`).join('')
                : '<div class="empty-note">이 날 계획된 방문이 없습니다.</div>';
            document.getElementById('note').textContent = v.note;
        }

        (async function init() {
            if (typeof renderSidebar === 'function') renderSidebar();
            document.getElementById('userName').textContent = user.full_name || '';
            document.getElementById('day').value = new Date().toISOString().slice(0, 10);
            load();
            setInterval(load, 60000);
        })();
    </script>
</body>
</html>
