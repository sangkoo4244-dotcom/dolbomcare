<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 센터 찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ===== Premium Healthcare Management SaaS 톤 (guardian_home.html과 동일, 보호자 공통) ===== */
        :root {
            --navy: #14283F; --teal: #0F8B80; --teal-dark: #0C756C; --charcoal: #243247; --muted: #64748B;
            --warn: #B45309; --warn-bg: #FFF7EB; --warn-line: #FCE2B5; --danger: #DC2626; --line2: #E2E8F0; --bg: #F5F7FA;
        }
        aside.w-72 { background: var(--navy) !important; }
        .side-group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #7E93AC; padding: 16px 16px 6px; text-transform: uppercase; }
        #navContent .side-item { color: #C9D6E3 !important; border-radius: 8px; }
        #navContent .side-item:hover { background: rgba(255,255,255,0.06) !important; color: #fff !important; }
        #navContent .side-item.active { background: var(--teal) !important; color: #fff !important; }

        /* 보호자 화면: 고령 사용자를 위해 글자를 키운다 (스타일 가이드 4장: 본문 18px, 제목 30px 이상) */
        main { font-size: 18px; }
        main .text-xs { font-size: 15px !important; }
        main .text-sm { font-size: 17px !important; }

        .g-breadcrumb { font-size: 13px; color: #94A3B8; }
        .g-breadcrumb b { color: var(--charcoal); font-weight: 700; }
        .g-date-chip { display: inline-flex; align-items: center; gap: 6px; background: #F1F5F9; border: 1px solid var(--line2); border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--charcoal); white-space: nowrap; }
        #userName { white-space: nowrap; }
        @media (max-width: 640px) {
            .g-header-row { flex-wrap: wrap; row-gap: 10px; }
            .g-date-chip { display: none; }
            .center-card { flex-wrap: wrap; }
            .card-right { width: 100%; align-items: stretch; }
            .card-actions { width: 100%; }
            .card-actions .call-btn, .card-actions .consult-btn { flex: 1; }
        }

        .icon-circle { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .icon-circle svg { width: 18px; height: 18px; }
        .icon-circle.teal { background: #E6F3F1; color: var(--teal); }
        .icon-circle.warn { background: var(--warn-bg); color: var(--warn); }

        .search-panel { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 22px 24px; box-shadow: 0 1px 3px rgba(20,40,63,0.05); }
        .panel-label { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: var(--charcoal); margin-bottom: 16px; }
        .search-field { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--line2); border-radius: 11px; padding: 6px 6px 6px 18px; }
        .search-field:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,139,128,0.12); }
        .search-field svg { width: 20px; height: 20px; color: var(--muted); flex: 0 0 auto; }
        .search-field input { flex: 1; height: 48px; border: none; outline: none; font-size: 17px; background: transparent; color: var(--charcoal); font-family: inherit; }
        .search-field button { height: 44px; padding: 0 24px; border-radius: 9px; border: none; background: var(--teal); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .search-field button:hover { background: var(--teal-dark); }
        .search-field.warn { border-color: var(--warn-line); }
        .search-field.warn:focus-within { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(180,83,9,0.12); }
        .search-field.warn button { background: var(--warn); }
        .search-field.warn button:hover { background: #8F4007; }

        .section { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 24px 26px; margin-top: 20px; box-shadow: 0 1px 3px rgba(20,40,63,0.05); }
        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .section-head h2 { font-size: 20px; font-weight: 800; color: var(--navy); margin: 0; }
        .section-head .count { font-size: 14.5px; color: var(--muted); font-weight: 600; }
        .section-desc { font-size: 14.5px; color: var(--muted); margin: 0 0 18px 46px; line-height: 1.6; max-width: 64ch; }
        .ref-tag { display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 999px; padding: 2px 10px; }

        .nearby-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
        .nearby-head-text { flex: 1 1 320px; }
        .section-desc-inline { font-size: 14px; color: var(--muted); margin: 6px 0 0 46px; line-height: 1.6; max-width: 58ch; }
        .nearby-search-col { flex: 0 0 auto; width: 360px; max-width: 100%; }
        @media (max-width: 760px) { .nearby-search-col { width: 100%; } }

        .facility-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .facility-card .facility-thumb { width: 100%; height: 80px; border-radius: 10px; background: linear-gradient(155deg, #FFF3E2, #FFFBF2); border: 1px solid var(--warn-line); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .facility-card .facility-thumb svg { width: 26px; height: 26px; color: #E3A765; }

        .search-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
        .search-row .search-field { flex: 1 1 280px; margin: 0; }
        .search-row select { flex: 0 0 auto; min-width: 150px; height: 48px; padding: 0 14px; border: 1.5px solid var(--line2); border-radius: 11px; font-size: 15px; font-family: inherit; color: var(--charcoal); background: #fff; }
        .search-row select:focus { border-color: var(--teal); outline: none; }
        @media (max-width: 760px) { .search-row select { flex: 1 1 100%; } }

        .list-map-layout { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
        @media (min-width: 980px) {
            .list-map-layout.has-map { grid-template-columns: 1.25fr 1fr; }
        }
        .map-panel { display: none; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; height: 420px; position: sticky; top: 16px; }
        .map-panel > div { width: 100%; height: 100%; }

        .name-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .dist-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--teal); background: #EDF8F6; border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
        .dist-badge svg { width: 13px; height: 13px; }
        .verified-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #0D8A61; background: #E7F7EF; border-radius: 999px; padding: 3px 10px 3px 8px; white-space: nowrap; }
        .verified-badge svg { width: 13px; height: 13px; }
        .svc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .svc-tag { font-size: 12px; font-weight: 600; color: var(--teal); background: #EDF8F6; border-radius: 999px; padding: 3px 10px; }

        .center-card {
            background: #FBFDFC; border: 1px solid var(--line2); border-radius: 12px; padding: 18px 22px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            transition: border-color .15s, box-shadow .15s;
        }
        .center-card:hover { border-color: #CDEAE5; box-shadow: 0 4px 16px rgba(20,40,63,0.06); }
        .center-card:last-child { margin-bottom: 0; }
        .center-card .thumb { width: 128px; height: 100px; border-radius: 12px; object-fit: cover; background: #F1F5F9; flex: 0 0 auto; border: 1px solid var(--line2); }
        .center-card .thumb-fallback { width: 128px; height: 100px; border-radius: 12px; flex: 0 0 auto; background: linear-gradient(155deg, #EAF6F4, #F4FAF9); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; }
        .center-card .thumb-fallback svg { width: 34px; height: 34px; color: #9AC9C2; }
        .center-card .info { flex: 1; min-width: 180px; }
        .center-card .name { font-size: 18.5px; font-weight: 800; color: var(--navy); }
        .meta-row { display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--muted); margin-top: 6px; }
        .meta-row svg { width: 15px; height: 15px; flex: 0 0 auto; color: #94A3B8; }
        .meta-row a { color: var(--muted); text-decoration: none; }
        .meta-row a:hover { color: var(--teal); text-decoration: underline; }
        .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex: 0 0 auto; }
        .card-actions { display: flex; gap: 8px; flex: 0 0 auto; }
        .call-btn { height: 44px; padding: 0 16px; border-radius: 9px; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .call-btn:hover { border-color: var(--teal); color: var(--teal); }
        .call-btn svg { width: 16px; height: 16px; }
        .center-card .consult-btn { height: 44px; padding: 0 20px; border-radius: 9px; border: 1.5px solid var(--teal); background: #fff; color: var(--teal); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .center-card .consult-btn:hover { background: #EDF8F6; }

        .facility-card { background: #fff; border: 1px solid var(--line2); border-radius: 12px; padding: 16px; }
        .facility-card .name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .facility-card .name { font-size: 16px; font-weight: 700; color: var(--charcoal); }
        .facility-card .category { font-size: 12.5px; color: var(--warn); margin-top: 2px; }
        .facility-card .meta-row { font-size: 14px; }
        .facility-card a.map-link { display: inline-block; font-size: 13.5px; color: var(--teal); font-weight: 700; text-decoration: none; margin-top: 6px; }
        .facility-card a.map-link:hover { text-decoration: underline; }

        .empty-note { text-align: center; padding: 40px 8px; color: var(--muted); font-size: 16px; line-height: 1.6; background: #fff; border: 1px solid var(--line2); border-radius: 12px; }
        .empty-cta { margin-top: 14px; height: 44px; padding: 0 22px; border-radius: 9px; border: none; background: var(--warn); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .empty-cta:hover { background: #8F4007; }

        /* 상담 신청 모달 */
        .trial-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(20,40,63,0.45); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
        .trial-modal-backdrop.open { display: flex; }
        .trial-modal { background: #fff; border-radius: 14px; padding: 28px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .trial-modal h3 { font-size: 19px; color: var(--navy); margin: 0 0 6px; }
        .trial-modal .trial-modal-sub { font-size: 14px; color: #64748B; margin-bottom: 20px; line-height: 1.5; }
        .trial-modal .field { margin-bottom: 14px; }
        .trial-modal .field label { display: block; font-size: 14px; font-weight: 700; color: var(--charcoal); margin-bottom: 6px; }
        .trial-modal .field input {
            width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--line2); border-radius: 9px;
            font-size: 15px; background: #fff; color: var(--charcoal); font-family: inherit;
        }
        .trial-modal .field input:disabled { background: #F8FAFC; color: #64748B; }
        .trial-modal .field input:focus { border-color: var(--teal); outline: none; }
        .trial-modal-actions { display: flex; gap: 8px; margin-top: 18px; }
        .trial-modal-actions button { flex: 1; height: 48px; border-radius: 9px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; }
        .trial-modal-cancel { background: #F1F5F9; color: var(--charcoal); }
        .trial-modal-cancel:hover { background: #E2E8F0; }
        .trial-modal-submit { background: var(--teal); color: #fff; }
        .trial-modal-submit:hover { background: #0C756C; }
        .trial-modal-note { font-size: 13px; color: #94A3B8; margin-top: 12px; text-align: center; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 text-white fixed h-screen overflow-hidden">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="g-header-row bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <div>
                    <div class="g-breadcrumb">홈 › <b>센터 찾기</b></div>
                    <h1 class="text-3xl font-bold text-[#1E3A5F] mt-1">센터 찾기</h1>
                    <p class="text-sm text-gray-500 mt-1">우리 가족에게 필요한 돌봄 서비스를 제공하는 센터를 찾아보세요.</p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="g-date-chip" id="headerDate"></div>
                    <a href="./notifications.html"><img src="assets/user_design/28_top_notification_icon.png" alt="알림" class="w-7 h-7 object-contain"></a>
                    <div class="flex items-center gap-3">
                        <img src="assets/user_design/29_top_profile_icon.png" alt="" class="w-11 h-11 rounded-full object-cover">
                        <span id="userName" class="text-base font-bold text-gray-900">보호자</span>
                    </div>
                    <button onclick="logout()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-xl text-sm font-bold text-gray-700 hover:border-red-500 hover:text-red-600 transition">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                        로그아웃
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="search-panel">
                    <div class="panel-label">
                        <span class="icon-circle teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></span>
                        지역 또는 센터명으로 찾아보세요
                    </div>
                    <div class="search-row">
                        <div class="search-field">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
                            <input id="searchInput" placeholder="센터명 또는 지역 (예: 강남구)" autocomplete="off">
                            <button type="button" onclick="search()">검색</button>
                        </div>
                        <select id="svcFilter" onchange="render()">
                            <option value="">서비스 종류 전체</option>
                            <option>방문요양</option>
                            <option>방문목욕</option>
                            <option>방문간호</option>
                            <option>주야간보호</option>
                            <option>단기보호</option>
                            <option>노인요양시설</option>
                            <option>노인요양공동생활가정</option>
                            <option>가사활동 지원</option>
                        </select>
                        <select id="sortSelect" onchange="onSortChange()">
                            <option value="name">이름순으로 보기</option>
                            <option value="distance">가까운 순으로 보기</option>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <div class="section-head">
                        <div class="title-row">
                            <span class="icon-circle teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span>
                            <h2>돌봄케어와 함께하는 센터</h2>
                        </div>
                        <span class="count" id="resultCount"></span>
                    </div>
                    <div class="list-map-layout" id="listMapLayout">
                        <div id="resultList"></div>
                        <div class="map-panel" id="mapPanel"><div id="centerMap"></div></div>
                    </div>
                </div>

                <div class="section">
                    <div class="nearby-head">
                        <div class="nearby-head-text">
                            <div class="title-row">
                                <span class="icon-circle warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
                                <h2>더 둘러보기</h2>
                                <span class="ref-tag">참고용</span>
                            </div>
                            <p class="section-desc-inline">돌봄케어 가입 여부와 상관없이 카카오맵에 등록된 시설을 보여드려요. 공단이 인증한 기관 목록이 아니니, 정확한 정보는 시설에 직접 확인해 주세요.</p>
                        </div>
                        <div class="nearby-search-col">
                            <div class="search-field warn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
                                <input id="nearbyInput" placeholder="예: 강남구 요양원" autocomplete="off">
                                <button type="button" onclick="searchNearby()">검색</button>
                            </div>
                        </div>
                    </div>
                    <div class="section-head" style="margin-top:18px;">
                        <span></span>
                        <span class="count" id="nearbyCount"></span>
                    </div>
                    <div class="list-map-layout" id="nearbyListMapLayout">
                        <div id="nearbyList" class="facility-grid"></div>
                        <div class="map-panel" id="nearbyMapPanel"><div id="nearbyMap"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="trial-modal-backdrop" id="consultBackdrop">
        <div class="trial-modal">
            <h3>상담 신청</h3>
            <p class="trial-modal-sub" id="consultSub"></p>
            <form id="consultForm" novalidate>
                <div class="field">
                    <label for="cCenterName">센터명</label>
                    <input id="cCenterName" disabled>
                </div>
                <div class="field">
                    <label for="cName">신청자명 *</label>
                    <input id="cName" required maxlength="50" autocomplete="name">
                </div>
                <div class="field">
                    <label for="cPhone">연락처 *</label>
                    <input id="cPhone" type="tel" required autocomplete="tel">
                </div>
                <div class="field">
                    <label for="cMessage">문의 내용 (선택)</label>
                    <input id="cMessage" maxlength="200" placeholder="예: 방문요양 상담 받고 싶어요">
                </div>
                <div class="trial-modal-actions">
                    <button type="button" class="trial-modal-cancel" onclick="closeConsultModal()">취소</button>
                    <button type="submit" class="trial-modal-submit">이메일로 신청하기</button>
                </div>
            </form>
            <p class="trial-modal-note">메일 앱이 열리며, 그곳에서 최종 발송해야 신청이 접수됩니다.</p>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        let currentUser = null;
        const API_URL = '/api/v1';
        let centers = [];
        let sortByDistance = false;
        let userCoords = null;
        let kakaoMapReady = false;
        let lastVisible = [];
        let lastNearbyPlaces = [];
        const centerMapState = { layoutId: 'listMapLayout', panelId: 'mapPanel', mapDivId: 'centerMap', instance: null };
        const nearbyMapState = { layoutId: 'nearbyListMapLayout', panelId: 'nearbyMapPanel', mapDivId: 'nearbyMap', instance: null };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        async function search() {
            const q = document.getElementById('searchInput').value.trim();
            const list = document.getElementById('resultList');
            list.innerHTML = '<div class="empty-note">찾는 중...</div>';
            try {
                const res = await fetch(`${API_URL}/centers/directory${q ? `?q=${encodeURIComponent(q)}` : ''}`);
                const d = await res.json();
                centers = d.centers || [];
                render();
            } catch (e) {
                list.innerHTML = '<div class="empty-note">목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
            }
        }

        function haversineKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function onSortChange() {
            const sel = document.getElementById('sortSelect');
            if (sel.value !== 'distance') {
                sortByDistance = false;
                render();
                return;
            }
            if (userCoords) {
                sortByDistance = true;
                render();
                return;
            }
            if (!navigator.geolocation) {
                alert('이 브라우저에서는 위치 확인을 지원하지 않습니다');
                sel.value = 'name';
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    sortByDistance = true;
                    render();
                },
                () => {
                    alert('위치 확인을 허용해야 가까운 순으로 볼 수 있습니다');
                    sel.value = 'name';
                }
            );
        }

        function render() {
            const svc = document.getElementById('svcFilter').value;
            let visible = svc ? centers.filter(c => (c.service_types || []).includes(svc)) : centers.slice();

            visible = visible.map(c => ({
                ...c,
                _dist: (sortByDistance && userCoords && c.latitude != null && c.longitude != null)
                    ? haversineKm(userCoords.lat, userCoords.lng, c.latitude, c.longitude) : null,
            }));

            if (sortByDistance && userCoords) {
                visible.sort((a, b) => {
                    if (a._dist == null && b._dist == null) return a.name.localeCompare(b.name);
                    if (a._dist == null) return 1;
                    if (b._dist == null) return -1;
                    return a._dist - b._dist;
                });
            }

            document.getElementById('resultCount').textContent = visible.length ? `${visible.length}곳` : '';
            const list = document.getElementById('resultList');
            if (!visible.length) {
                list.innerHTML = centers.length
                    ? '<div class="empty-note">선택한 조건에 맞는 센터가 없습니다.</div>'
                    : `<div class="empty-note">아직 이 지역에 공개된 센터가 없어요.<br>
                        <button type="button" class="empty-cta" onclick="jumpToNearbySearch()">주변 시설 바로 찾아보기 ↓</button>
                       </div>`;
            } else {
                list.innerHTML = visible.map(c => `
                    <div class="center-card">
                        ${c.logo_image
                            ? `<img class="thumb" src="${c.logo_image}" alt="">`
                            : `<div class="thumb-fallback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></div>`}
                        <div class="info">
                            <div class="name-line">
                                <span class="name">${escapeHtml(c.name)}</span>
                                ${c.institution_verified ? `<span class="verified-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>장기요양기관 등록</span>` : ''}
                            </div>
                            ${c.address ? `<div class="meta-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${escapeHtml(c.address)}</div>` : ''}
                            ${c.phone ? `<div class="meta-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg><a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>` : ''}
                            ${c.service_types && c.service_types.length ? `<div class="svc-tags">${c.service_types.map(s => `<span class="svc-tag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
                        </div>
                        <div class="card-right">
                            ${c._dist != null ? `<span class="dist-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${c._dist.toFixed(1)}km</span>` : ''}
                            <div class="card-actions">
                                ${c.phone ? `<a class="call-btn" href="tel:${escapeHtml(c.phone)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>전화하기</a>` : ''}
                                <button type="button" class="consult-btn" onclick="openConsultModal(${c.id})">상담 신청</button>
                            </div>
                        </div>
                    </div>`).join('');
            }

            lastVisible = visible;
            renderPinsOnMap(centerMapState, visible);
        }

        async function initKakaoMap() {
            try {
                const res = await fetch(`${API_URL}/centers/kakao-js-key`);
                const d = await res.json();
                if (!d.key) return;
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(d.key)}&autoload=false`;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
                window.kakao.maps.load(() => {
                    kakaoMapReady = true;
                    renderPinsOnMap(centerMapState, lastVisible);
                    renderPinsOnMap(nearbyMapState, lastNearbyPlaces);
                });
            } catch (e) {
                // 지도 없이도 목록·전화·상담신청 기능은 그대로 동작해야 한다 - 화면은 그대로 두되,
                // 조용히 묻히지 않도록 콘솔에는 남긴다 (SDK URL 오타 같은 버그가 몇 세션째
                // "콘솔 에러 없음"으로 오인됐던 적이 있었음)
                console.warn('카카오맵 로드 실패 - 지도 없이 목록만 표시됩니다', e);
            }
        }

        function renderPinsOnMap(state, items) {
            const layout = document.getElementById(state.layoutId);
            const panel = document.getElementById(state.panelId);
            const withCoords = (items || []).filter(c => c.latitude != null && c.longitude != null);
            if (!kakaoMapReady || !withCoords.length) {
                panel.style.display = 'none';
                layout.classList.remove('has-map');
                return;
            }
            panel.style.display = 'block';
            layout.classList.add('has-map');

            const center = new kakao.maps.LatLng(withCoords[0].latitude, withCoords[0].longitude);
            if (!state.instance) {
                state.instance = new kakao.maps.Map(document.getElementById(state.mapDivId), { center, level: 8 });
            }
            (state.instance.__markers || []).forEach(m => m.setMap(null));
            state.instance.__markers = withCoords.map(c => {
                const pos = new kakao.maps.LatLng(c.latitude, c.longitude);
                const marker = new kakao.maps.Marker({ position: pos, map: state.instance });
                const iw = new kakao.maps.InfoWindow({ content: `<div style="padding:6px 10px;font-size:13px;white-space:nowrap;">${escapeHtml(c.name)}</div>` });
                kakao.maps.event.addListener(marker, 'click', () => iw.open(state.instance, marker));
                return marker;
            });
            if (withCoords.length > 1) {
                const bounds = new kakao.maps.LatLngBounds();
                withCoords.forEach(c => bounds.extend(new kakao.maps.LatLng(c.latitude, c.longitude)));
                state.instance.setBounds(bounds);
            } else {
                state.instance.setCenter(center);
            }
        }

        function openConsultModal(id) {
            const c = centers.find(x => x.id === id);
            if (!c) return;
            document.getElementById('cCenterName').value = c.name;
            document.getElementById('cName').value = currentUser?.full_name || '';
            document.getElementById('consultSub').textContent = `${c.name}에 상담을 신청합니다. 아래 정보를 보내주시면 센터에서 연락드립니다.`;
            document.getElementById('consultBackdrop').classList.add('open');
            document.getElementById('cPhone').focus();
        }

        function closeConsultModal() {
            document.getElementById('consultBackdrop').classList.remove('open');
        }

        document.getElementById('consultBackdrop').addEventListener('click', (e) => {
            if (e.target.id === 'consultBackdrop') closeConsultModal();
        });

        document.getElementById('consultForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!e.currentTarget.reportValidity()) return;
            const v = (id) => document.getElementById(id).value.trim();
            const subject = '[돌봄케어 상담 신청] ' + v('cCenterName');
            const body = [
                '관심 센터: ' + v('cCenterName'),
                '신청자명: ' + v('cName'),
                '연락처: ' + v('cPhone'),
                '문의 내용: ' + (v('cMessage') || '(없음)'),
            ].join('\n');
            location.href = 'mailto:contact@eeum-logic.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
            closeConsultModal();
        });

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') search();
        });

        function jumpToNearbySearch() {
            const q = document.getElementById('searchInput').value.trim();
            const nearbyInput = document.getElementById('nearbyInput');
            if (q) nearbyInput.value = q;
            document.querySelector('.nearby-head').scrollIntoView({ behavior: 'smooth', block: 'start' });
            nearbyInput.focus();
            if (q) searchNearby();
        }

        async function searchNearby() {
            const q = document.getElementById('nearbyInput').value.trim();
            const list = document.getElementById('nearbyList');
            if (!q) { alert('검색어를 입력해 주세요 (예: 강남구 요양원)'); return; }
            list.innerHTML = '<div class="empty-note">찾는 중...</div>';
            document.getElementById('nearbyCount').textContent = '';
            try {
                const res = await fetch(`${API_URL}/centers/nearby-facilities?q=${encodeURIComponent(q)}`);
                const d = await res.json();
                if (!d.ok) {
                    list.innerHTML = `<div class="empty-note">${escapeHtml(d.message || '검색 기능을 쓸 수 없습니다')}</div>`;
                    lastNearbyPlaces = [];
                    renderPinsOnMap(nearbyMapState, lastNearbyPlaces);
                    return;
                }
                if (!d.places.length) {
                    list.innerHTML = '<div class="empty-note">검색 결과가 없습니다. 다른 지역명으로 찾아보세요.</div>';
                    lastNearbyPlaces = [];
                    renderPinsOnMap(nearbyMapState, lastNearbyPlaces);
                    return;
                }
                document.getElementById('nearbyCount').textContent = `${d.places.length}곳`;
                list.innerHTML = d.places.map(p => `
                    <div class="facility-card">
                        <div class="facility-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></div>
                        <div class="name-line">
                            <span class="name">${escapeHtml(p.name)}</span>
                        </div>
                        ${p.category ? `<div class="category">${escapeHtml(p.category)}</div>` : ''}
                        ${p.address ? `<div class="meta-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${escapeHtml(p.address)}</div>` : ''}
                        ${p.phone ? `<div class="meta-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg><a href="tel:${escapeHtml(p.phone)}">${escapeHtml(p.phone)}</a></div>` : ''}
                        ${p.place_url ? `<a class="map-link" href="${escapeHtml(p.place_url)}" target="_blank" rel="noopener">지도에서 보기 ↗</a>` : ''}
                    </div>`).join('');
                lastNearbyPlaces = d.places;
                renderPinsOnMap(nearbyMapState, lastNearbyPlaces);
            } catch (e) {
                list.innerHTML = '<div class="empty-note">검색하지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
                lastNearbyPlaces = [];
                renderPinsOnMap(nearbyMapState, lastNearbyPlaces);
            }
        }

        document.getElementById('nearbyInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchNearby();
        });

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = `${user.full_name || '보호자'}님`;
            document.getElementById('headerDate').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
            renderSidebar();
            search();
            initKakaoMap();
        }

        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
