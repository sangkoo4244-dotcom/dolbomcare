<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 나의 일정</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">📅 나의 일정</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500" id="userRole">역할</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="message" class="hidden mb-6 p-4 rounded-lg animate-in fade-in slide-in-from-top-2"></div>

                <!-- 월간 캘린더 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900">📆 <span id="currentMonth">10월 2026</span></h2>
                        <div class="flex gap-3">
                            <button onclick="prevMonth()" class="px-3 py-2 border border-gray-200 rounded-lg hover:bg-gray-100">◀ 이전</button>
                            <button onclick="nextMonth()" class="px-3 py-2 border border-gray-200 rounded-lg hover:bg-gray-100">다음 ▶</button>
                        </div>
                    </div>
                    <div id="calendar" class="grid grid-cols-7 gap-2"></div>
                </div>

                <!-- 오늘의 일정 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">🎯 <span id="todayTitle">오늘의 일정</span></h2>
                    <div id="todaySchedule" class="space-y-4">
                        <div class="text-center py-8 text-gray-400">📅 오늘의 일정이 없습니다</div>
                    </div>
                </div>

                <!-- 월별 일정 목록 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📋 월별 일정 목록</h2>
                    <div id="summaryLine" class="text-sm text-gray-600 mb-4"></div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b-2 border-gray-200">
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">날짜</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">시간</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">이용자</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">제공 시간</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">계획 항목 이행</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">상태</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleTableBody">
                                <tr><td colspan="6" class="py-8 text-center text-gray-400">📅 일정이 없습니다</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let currentMonth = new Date();
        currentMonth.setDate(1);
        let selectedDate = null;
        let items = [];

        const CARE_ITEM_LABELS = {
            meal_assist: '식사 보조', toilet_assist: '배설 보조', bath: '목욕·세면', dressing: '옷 갈아입기', mobility: '이동 보조',
            medicine: '투약 확인', vitals: '체온·혈압 측정', symptom: '이상 증상 관찰',
            emotional: '말벗·정서 지원', cognitive: '인지활동',
            cleaning: '청소·정돈', laundry: '세탁', shopping: '장보기·취사'
        };
        const stateStyle = {
            '예정': 'bg-blue-100 text-blue-800',
            '완료': 'bg-emerald-100 text-emerald-800',
            '미기록': 'bg-red-600 text-white',
            '계획 외': 'bg-gray-100 text-gray-700'
        };

        function pad(n) { return String(n).padStart(2, '0'); }
        function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
        function ymKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
        function badge(state) { return `<span class="px-3 py-1 rounded-full text-xs font-bold ${stateStyle[state] || 'bg-gray-100 text-gray-700'}">${state}</span>`; }
        function labels(codes) { return codes.map(c => CARE_ITEM_LABELS[c] || c).join(', '); }
        function coverage(it) {
            if (!it.planned_items.length) return '-';
            return `${it.done_items.filter(c => it.planned_items.includes(c)).length} / ${it.planned_items.length}`;
        }
        function recordLink(it) {
            if (it.state === '완료' || !it.planned) return '';
            return `<a href="./voice_record.html?resident_id=${it.resident_id}" class="ml-2 text-xs font-bold text-emerald-700 underline">기록 작성</a>`;
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            renderSidebar();
            selectedDate = dateKey(new Date());
            loadSchedules();
        }

        async function loadSchedules() {
            try {
                const r = await fetch(`${API_URL}/schedule/caregiver-view?caregiver_id=${currentUser.id}&year_month=${ymKey(currentMonth)}`);
                const d = await r.json();
                items = d.items || [];
                renderSummary(d);
            } catch (e) {
                items = [];
                document.getElementById('summaryLine').textContent = '일정을 불러오지 못했습니다';
            }
            document.getElementById('currentMonth').textContent = `${currentMonth.getMonth() + 1}월 ${currentMonth.getFullYear()}`;
            renderCalendar();
            renderToday();
            renderTable();
        }

        function renderSummary(d) {
            const s = d.summary || {};
            const parts = [`방문 계획 ${d.items.length}건`, `완료 ${s['완료'] || 0}건`];
            if (s['미기록']) parts.push(`⚠️ 기록 미작성 ${s['미기록']}건`);
            if (s['계획 외']) parts.push(`계획 외 ${s['계획 외']}건`);
            document.getElementById('summaryLine').textContent = parts.join(' · ');
        }

        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const first = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const cal = document.getElementById('calendar');
            cal.innerHTML = '';
            ['일', '월', '화', '수', '목', '금', '토'].forEach(day => {
                const header = document.createElement('div');
                header.className = 'text-center font-bold text-gray-700 py-2';
                header.textContent = day;
                cal.appendChild(header);
            });
            for (let i = 0; i < first.getDay(); i++) cal.appendChild(document.createElement('div'));

            for (let day = 1; day <= daysInMonth; day++) {
                const key = `${year}-${pad(month + 1)}-${pad(day)}`;
                const dayItems = items.filter(it => it.date === key);
                const missed = dayItems.some(it => it.state === '미기록');
                const cell = document.createElement('div');
                cell.className = `p-2 border rounded-lg text-center cursor-pointer hover:bg-emerald-50 transition ${key === selectedDate ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200'}`;
                cell.innerHTML = `<div class="font-bold text-gray-900">${day}</div>` +
                    (dayItems.length ? `<div class="text-xs ${missed ? 'text-red-600 font-bold' : 'text-emerald-600'}">${dayItems.length}건${missed ? ' · 미작성' : ''}</div>` : '');
                cell.onclick = () => { selectedDate = key; renderCalendar(); renderToday(); };
                cal.appendChild(cell);
            }
        }

        function renderToday() {
            const dayItems = items.filter(it => it.date === selectedDate);
            document.getElementById('todayTitle').textContent = selectedDate === dateKey(new Date()) ? '오늘의 방문 계획' : `${selectedDate} 방문 계획`;
            const container = document.getElementById('todaySchedule');
            if (dayItems.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400">📅 이 날짜의 방문 계획이 없습니다</div>';
                return;
            }
            container.innerHTML = dayItems.map(it => {
                const plan = it.planned_items.length
                    ? `<div class="text-sm text-gray-700 mt-2">계획 항목: ${it.planned_items.map(c => `<span class="inline-block mr-1 mb-1 px-2 py-1 rounded ${it.done_items.includes(c) ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-600'}">${it.done_items.includes(c) ? '✔ ' : ''}${CARE_ITEM_LABELS[c] || c}</span>`).join('')}</div>`
                    : '';
                const hint = it.state === '미기록'
                    ? '<div class="text-sm text-red-600 font-semibold mt-2">방문 시간이 지났지만 기록이 없습니다. 음성기록을 작성해 주세요.</div>'
                    : it.state === '계획 외'
                    ? `<div class="text-sm text-gray-600 mt-2">계획에 없던 방문입니다. 제공 항목: ${labels(it.done_items) || '-'}</div>`
                    : '';
                return `
                    <div class="border border-gray-200 rounded-lg p-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="text-lg font-bold text-gray-900">${it.resident_name || '-'}${it.planned ? '' : ' <span class="ml-2 text-xs px-2 py-1 rounded bg-gray-100 text-gray-600">계획 외</span>'}</div>
                                <div class="text-sm text-gray-600 mt-1">${it.time}${it.duration_minutes ? ` · ${it.duration_minutes}분` : ''}</div>
                            </div>
                            <div class="text-right">${badge(it.state)}${recordLink(it)}</div>
                        </div>
                        ${plan}
                        ${hint}
                    </div>`;
            }).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('scheduleTableBody');
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-gray-400">📅 방문 계획이 없습니다</td></tr>';
                return;
            }
            tbody.innerHTML = items.map(it => `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="py-4 px-4 text-gray-900 font-semibold">${it.date}</td>
                    <td class="py-4 px-4 text-gray-700">${it.time}</td>
                    <td class="py-4 px-4 font-semibold text-gray-900">${it.resident_name || '-'}${it.planned ? '' : ' <span class="text-xs text-gray-500">(계획 외)</span>'}</td>
                    <td class="py-4 px-4 text-sm text-gray-700">${it.duration_minutes ? `${it.duration_minutes}분` : '-'}</td>
                    <td class="py-4 px-4 text-sm text-gray-700">${coverage(it)}</td>
                    <td class="py-4 px-4">${badge(it.state)}${recordLink(it)}</td>
                </tr>`).join('');
        }

        function prevMonth() { currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1); selectedDate = null; loadSchedules(); }
        function nextMonth() { currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1); selectedDate = null; loadSchedules(); }
        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
