<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 나의 일정</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">📅 나의 일정</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500" id="userRole">역할</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="message" class="hidden mb-6 p-4 rounded-lg animate-in fade-in slide-in-from-top-2"></div>

                <!-- 월간 캘린더 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900">📆 <span id="currentMonth">10월 2026</span></h2>
                        <div class="flex gap-3">
                            <button onclick="prevMonth()" class="px-3 py-2 border border-gray-200 rounded-lg hover:bg-gray-100">◀ 이전</button>
                            <button onclick="nextMonth()" class="px-3 py-2 border border-gray-200 rounded-lg hover:bg-gray-100">다음 ▶</button>
                        </div>
                    </div>
                    <div id="calendar" class="grid grid-cols-7 gap-2"></div>
                </div>

                <!-- 오늘의 일정 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8 mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">🎯 오늘의 일정</h2>
                    <div id="todaySchedule" class="space-y-4">
                        <div class="text-center py-8 text-gray-400">📅 오늘의 일정이 없습니다</div>
                    </div>
                </div>

                <!-- 월별 일정 목록 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📋 월별 일정 목록</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b-2 border-gray-200">
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">날짜</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">시간</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">이용자</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">주소</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">서비스</th>
                                    <th class="text-left py-3 px-4 font-bold text-gray-700">상태</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleTableBody">
                                <tr><td colspan="6" class="py-8 text-center text-gray-400">📅 일정이 없습니다</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUser = null;
        let currentDate = new Date(2026, 9, 5);
        let schedules = [];

        const serviceNames = { basic_care: '기본돌봄', meal_service: '식사', medical_care: '의료관리', emergency: '응급' };
        const statusColors = { '예정': 'bg-blue-100 text-blue-800', '진행중': 'bg-orange-100 text-orange-800', '완료': 'bg-emerald-100 text-emerald-800', '취소': 'bg-red-100 text-red-800', '지연': 'bg-yellow-100 text-yellow-800' };

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            renderNavigation();
            loadSchedules();
        }

        function renderNavigation() {
            const nav = document.getElementById('navContent');
            nav.innerHTML = `
                <a href="./dashboard.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">📊</span>
                    <span>대시보드</span>
                </a>
                <a href="./resident_management.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">👥</span>
                    <span>이용자관리</span>
                </a>
                <a href="./voice_record.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">🎤</span>
                    <span>음성 기록</span>
                </a>
                <a href="./caregiver_billing.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">📋</span>
                    <span>나의 청부</span>
                </a>
                <a href="./my_salary.html" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition">
                    <span style="font-size:18px">💵</span>
                    <span>나의 급여</span>
                </a>
                <a href="./my_schedule.html" class="flex items-center gap-3 px-4 py-2 rounded-lg bg-emerald-600 text-white transition">
                    <span style="font-size:18px">📅</span>
                    <span>나의 일정</span>
                </a>
                <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition bg-transparent border-none cursor-pointer text-left">
                    <span style="font-size:18px">🚪</span>
                    <span>로그아웃</span>
                </button>
            `;
        }

        function loadSchedules() {
            schedules = [
                { date: '2026-10-05', time: '09:00-12:00', resident: '김철수', age: 72, address: '서울시 강남구 테헤란로 123', service: 'basic_care', status: '예정', note: '기본 돌봄' },
                { date: '2026-10-05', time: '14:00-16:00', resident: '이영미', age: 68, address: '서울시 강남구 역삼동 456', service: 'medical_care', status: '진행중', note: '의료관리' },
                { date: '2026-10-06', time: '10:00-13:00', resident: '박민준', age: 75, address: '서울시 강남구 삼성동 789', service: 'meal_service', status: '예정', note: '식사 준비' },
                { date: '2026-10-07', time: '15:00-17:00', resident: '최순영', age: 70, address: '서울시 강남구 청담동 321', service: 'basic_care', status: '완료', note: '기본 돌봄' },
                { date: '2026-10-10', time: '09:00-11:00', resident: '김철수', age: 72, address: '서울시 강남구 테헤란로 123', service: 'basic_care', status: '예정', note: '기본 돌봄' },
            ];
            renderCalendar();
            renderTodaySchedule();
            renderScheduleTable();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('currentMonth').textContent = `${month + 1}월 ${year}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();
            
            const cal = document.getElementById('calendar');
            cal.innerHTML = '';
            const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
            weekDays.forEach(day => {
                const header = document.createElement('div');
                header.className = 'text-center font-bold text-gray-700 py-2';
                header.textContent = day;
                cal.appendChild(header);
            });
            
            for (let i = 0; i < startingDayOfWeek; i++) cal.appendChild(document.createElement('div'));
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const daySchedules = schedules.filter(s => s.date === dateStr);
                const cell = document.createElement('div');
                cell.className = 'p-2 border border-gray-200 rounded-lg text-center cursor-pointer hover:bg-emerald-50 transition';
                cell.innerHTML = `<div class="font-bold text-gray-900">${day}</div><div class="text-xs text-emerald-600">${daySchedules.length > 0 ? daySchedules.length + '개' : ''}</div>`;
                cal.appendChild(cell);
            }
        }

        function renderTodaySchedule() {
            const today = '2026-10-05';
            const todaySchedules = schedules.filter(s => s.date === today).sort((a, b) => a.time.localeCompare(b.time));
            const container = document.getElementById('todaySchedule');
            
            if (todaySchedules.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400">📅 오늘의 일정이 없습니다</div>';
                return;
            }
            
            container.innerHTML = todaySchedules.map(s => `
                <div class="border border-gray-200 rounded-lg p-6 hover:shadow-lg transition">
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <div class="text-xs text-gray-500 font-bold">이용자</div>
                            <div class="text-lg font-bold text-gray-900">${s.resident} (${s.age}세)</div>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500 font-bold">시간</div>
                            <div class="text-lg font-bold text-blue-600">${s.time}</div>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500 font-bold">상태</div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${statusColors[s.status]}">${s.status}</span>
                        </div>
                        <div class="col-span-2 md:col-span-3">
                            <div class="text-xs text-gray-500 font-bold">📍 주소</div>
                            <div class="text-sm text-gray-700">${s.address}</div>
                        </div>
                        <div class="col-span-2 md:col-span-3">
                            <div class="text-xs text-gray-500 font-bold">📝 서비스</div>
                            <div class="text-sm text-gray-700">${serviceNames[s.service]} - ${s.note}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderScheduleTable() {
            const tbody = document.getElementById('scheduleTableBody');
            if (schedules.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-gray-400">📅 일정이 없습니다</td></tr>';
                return;
            }
            
            tbody.innerHTML = schedules.map(s => `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="py-4 px-4 text-gray-900 font-semibold">${s.date}</td>
                    <td class="py-4 px-4 text-gray-700">${s.time}</td>
                    <td class="py-4 px-4"><div class="font-semibold text-gray-900">${s.resident}</div><div class="text-xs text-gray-500">${s.age}세</div></td>
                    <td class="py-4 px-4 text-sm text-gray-600">${s.address}</td>
                    <td class="py-4 px-4 text-sm text-gray-700">${serviceNames[s.service]}</td>
                    <td class="py-4 px-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${statusColors[s.status]}">${s.status}</span></td>
                </tr>
            `).join('');
        }

        function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }
        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
