<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 알림</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl"></div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">알림</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500" id="userRole">역할</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900">
                            새 알림 <span id="unreadBadge" class="ml-2 px-3 py-1 rounded-full text-sm bg-emerald-100 text-emerald-800 hidden"></span>
                        </h2>
                        <button id="readAllBtn" onclick="markAllRead()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 transition">모두 읽음</button>
                    </div>
                    <ul id="notificationList" class="divide-y divide-gray-100">
                        <li class="py-8 text-center text-gray-400">불러오는 중...</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
    <script src="menu.js"></script>
    <script>
        let currentUser = null;
        const API_URL = '/api/v1';

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            renderSidebar();
            loadNotifications();
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadNotifications() {
            try {
                const r = await fetch(`${API_URL}/notifications/mine`);
                const d = await r.json();
                renderNotifications(d.notifications || []);
                const badge = document.getElementById('unreadBadge');
                badge.textContent = `${d.unread_count}건`;
                badge.classList.toggle('hidden', !d.unread_count);
            } catch (e) {
                document.getElementById('notificationList').innerHTML = '<li class="py-8 text-center text-gray-400">알림을 불러올 수 없습니다</li>';
            }
        }

        function renderNotifications(items) {
            const list = document.getElementById('notificationList');
            if (!items.length) {
                list.innerHTML = '<li class="py-8 text-center text-gray-400">🔔 새 알림이 없습니다</li>';
                return;
            }
            list.innerHTML = items.map(n => `
                <li class="py-4 px-2 flex justify-between items-start gap-4 ${n.is_read ? 'text-gray-500' : 'bg-emerald-50 font-semibold text-gray-900'} rounded cursor-pointer" onclick="markRead(${n.id}, ${n.is_read})">
                    <span>${escapeHtml(n.message)}</span>
                    <span class="text-xs text-gray-400 whitespace-nowrap">${formatTime(n.created_at)}</span>
                </li>`).join('');
        }

        async function markRead(id, alreadyRead) {
            if (alreadyRead) return;
            await fetch(`${API_URL}/notifications/${id}/read`, { method: 'POST' });
            loadNotifications();
        }

        async function markAllRead() {
            await fetch(`${API_URL}/notifications/read-all`, { method: 'POST' });
            loadNotifications();
        }

        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
