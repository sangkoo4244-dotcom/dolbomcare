<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 알림</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ===== Premium Healthcare Management SaaS 톤 (대시보드·나의 일정 등과 동일) ===== */
        :root {
            --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247;
            --warn: #B45309; --danger: #DC2626; --line2: #E2E8F0;
        }
        html, body { background: var(--bg) !important; }
        body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .nt-sidebar { background: var(--navy) !important; }
        .side-group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #7E93AC; padding: 16px 16px 6px; text-transform: uppercase; }
        #navContent .side-item { color: #C9D6E3 !important; border-radius: 8px; }
        #navContent .side-item:hover { background: rgba(255,255,255,0.06) !important; color: #fff !important; }
        #navContent .side-item.active { background: var(--teal) !important; color: #fff !important; }

        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }
        .date-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line2); border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--charcoal); white-space: nowrap; }
        .bell-wrap { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #F1F5F9; border-radius: 10px; flex: 0 0 auto; }
        .bell-wrap svg { width: 17px; height: 17px; color: var(--charcoal); }
        .bell-badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

        .info-line { background: #EDF8F6; border: 1px solid #CDEAE5; border-radius: 12px; padding: 11px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #2E6B61; font-weight: 600; }
        .info-line svg { width: 16px; height: 16px; color: var(--teal); flex: 0 0 auto; }

        .summary-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
        .summary-row > div { background: #fff; border: 1px solid #E8ECF1; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(20,40,63,0.04); display: flex; align-items: center; gap: 14px; }
        .summary-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .summary-icon svg { width: 21px; height: 21px; }
        .summary-label { font-size: 13px; font-weight: 700; color: #64748B; }
        .summary-value { font-size: 24px; font-weight: 800; color: var(--navy); line-height: 1.2; font-variant-numeric: tabular-nums; }
        @media (max-width: 1100px) { .summary-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .panel2 { background: #fff; border: 1px solid #E8ECF1; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(20,40,63,0.04); }
        .panel2-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 14px; font-weight: 800; color: var(--navy); }

        .btn-outline { padding: 7px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; }
        .btn-outline:hover { border-color: var(--teal); color: var(--teal); }
        .btn-outline:disabled { opacity: .5; cursor: not-allowed; }
        .btn-solid { padding: 7px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 700; border: none; background: var(--teal); color: #fff; cursor: pointer; }
        .btn-solid:hover { background: #0C756C; }
        .btn-solid:disabled { opacity: .55; cursor: not-allowed; }

        .filter-bar { background: #fff; border: 1px solid var(--line2); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .flt-chip { padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .flt-chip:hover { border-color: var(--teal); }
        .flt-chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }
        .flt-chip .cnt { background: #F1F5F9; border-radius: 999px; padding: 1px 7px; font-size: 11px; color: #64748B; }
        .flt-chip.active .cnt { background: rgba(255,255,255,0.2); color: #fff; }
        .filter-input { padding: 8px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 13px; outline: none; }
        .filter-input:focus { border-color: var(--teal); }

        .status-pill2 { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; display: inline-block; }
        .sp-draft { background: #E8F1FC; color: #1D4ED8; }
        .sp-pending { background: #FDF1E3; color: #B45309; }
        .sp-approved { background: #E6F3F1; color: #0F8B80; }
        .sp-rejected { background: #FDE8E8; color: #DC2626; }
        .sp-neutral { background: #F1F5F9; color: #64748B; }

        .sl-table { border-collapse: collapse; width: 100%; }
        .sl-table th { text-align: left; font-size: 12px; font-weight: 700; color: #64748B; padding: 10px 12px; background: #F8FAFC; border-bottom: 1px solid var(--line2); white-space: nowrap; }
        .sl-table td { padding: 12px; font-size: 13px; color: var(--charcoal); border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
        .sl-table tr.notif-row { cursor: pointer; }
        .sl-table tr.notif-row:hover td { background: #FAFBFC; }
        .sl-table tr.notif-row.selected td { background: #EDF8F6; }
        .sl-table tr.notif-row.unread td:first-child { box-shadow: inset 3px 0 0 var(--teal); }
        .sl-table tr.date-group td { background: #F8FAFC; font-size: 12px; font-weight: 800; color: #94A3B8; padding: 8px 12px; }
        .notif-title { font-weight: 700; color: var(--charcoal); }
        .notif-row.unread .notif-title { color: var(--navy); }
        .notif-desc { font-size: 12px; color: #94A3B8; margin-top: 2px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line2); font-size: 12px; color: #64748B; }
        .pager-btns { display: flex; align-items: center; gap: 4px; }
        .pager-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line2); background: #fff; font-size: 12px; font-weight: 700; color: var(--charcoal); cursor: pointer; }
        .pager-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; }
        .pager-btn:disabled { opacity: .4; cursor: not-allowed; }

        .detail-empty { text-align: center; padding: 40px 10px; color: #94A3B8; font-size: 13px; }
        .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .detail-title { font-size: 15px; font-weight: 800; color: var(--navy); margin: 10px 0 4px; line-height: 1.4; }
        .detail-time { font-size: 12px; color: #94A3B8; }
        .detail-msg { font-size: 13px; color: var(--charcoal); line-height: 1.6; background: #F8FAFC; border-radius: 10px; padding: 12px 14px; margin: 10px 0 14px; white-space: pre-wrap; }
        .related-row { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 10px; cursor: pointer; border: none; background: transparent; }
        .related-row:hover { background: #F8FAFC; }
        .related-row .rr-title { font-size: 12.5px; font-weight: 600; color: var(--charcoal); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .related-row .rr-time { font-size: 11px; color: #94A3B8; flex: 0 0 auto; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="nt-sidebar w-72 text-white fixed h-screen overflow-hidden">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div>
                    <div class="text-lg font-bold">돌봄케어</div>
                    <div class="text-xs text-gray-400">Care Management</div>
                </div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">알림</h1>
                    <div class="breadcrumb">홈 › <b>알림</b></div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="date-chip" id="headerDate"></div>
                    <div class="bell-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

                    </div>
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-900" id="userName">사용자</div>

                    </div>
                    <img src="assets/user_design/29_top_profile_icon.png" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-8 py-8">
                <div id="infoLine" class="info-line" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span id="infoLineText"></span>
                </div>

                <!-- 알림 현황 -->
                <div class="summary-row">
                    <div>
                        <div class="summary-icon" style="background:#FDF1E3;color:#B45309;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
                        <div><div class="summary-label">새 알림</div><div class="summary-value" id="metricNew">0건</div></div>
                    </div>
                    <div>
                        <div class="summary-icon" style="background:#FDE8E8;color:#DC2626;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/></svg></div>
                        <div><div class="summary-label">처리 필요</div><div class="summary-value" id="metricAction">0건</div></div>
                    </div>
                    <div>
                        <div class="summary-icon" style="background:#E8F1FC;color:#1D4ED8;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
                        <div><div class="summary-label">오늘 일정</div><div class="summary-value" id="metricToday">-</div></div>
                    </div>
                    <div>
                        <div class="summary-icon" style="background:#E6F3F1;color:#0F8B80;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 2.5 7h7.5l-6 4.9 2.3 7.1-6.3-4.5-6.3 4.5 2.3-7.1-6-4.9h7.5z"/></svg></div>
                        <div><div class="summary-label">중요 알림</div><div class="summary-value" id="metricImportant">0건</div></div>
                    </div>
                </div>

                <!-- 필터 -->
                <div class="filter-bar">
                    <div id="filterChips" class="flex gap-2 flex-wrap" style="flex: 1;"></div>
                    <input id="searchInput" type="search" class="filter-input" placeholder="알림 내용 검색" style="min-width:220px;" oninput="currentPage=1;renderNotifications();">
                    <button id="readAllBtn" onclick="markAllRead()" class="btn-outline">
                        <svg style="width:13px;height:13px;display:inline;vertical-align:-2px;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                        모두 읽음
                    </button>
                </div>

                <div style="display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;">
                    <!-- 알림 목록 -->
                    <div style="background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden;">
                        <div style="overflow-x:auto;">
                            <table class="sl-table">
                                <thead>
                                    <tr><th>구분</th><th>제목 및 내용</th><th>날짜</th><th>상태</th></tr>
                                </thead>
                                <tbody id="notificationList">
                                    <tr><td colspan="4" style="text-align:center;padding:40px;color:#94A3B8;">불러오는 중...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="pager" id="pager"></div>
                    </div>

                    <!-- 상세 패널 -->
                    <div>
                        <div class="panel2" style="margin-bottom:16px;">
                            <div class="panel2-head"><span>알림 상세보기</span><button onclick="closeDetail()" id="detailCloseBtn" style="display:none;background:none;border:none;color:#94A3B8;cursor:pointer;font-size:16px;line-height:1;">&times;</button></div>
                            <div id="detailBody"><div class="detail-empty">알림을 선택하면 상세 내용을 볼 수 있습니다.</div></div>
                        </div>
                        <div class="panel2" id="relatedPanel" style="display:none;margin-bottom:0;">
                            <div class="panel2-head"><span>관련 알림</span></div>
                            <div id="relatedList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script>
        let currentUser = null;
        const API_URL = '/api/v1';
        let allNotifications = [];
        let currentFilter = 'all';
        let currentPage = 1;
        let pageSize = 10;
        let selectedId = null;
        let markBusy = false;

        // 알림 종류(kind)를 화면 분류로 묶는다. 시스템 알림은 아직 만드는 곳이 없어 항상 비어 있을 수 있다
        // (가짜 데이터를 넣지 않는다). schedule_today(오늘 일정 리마인더)·record_needed(기록 작성 필요)는
        // app/api/schedule.py가 실제 방문 데이터를 기준으로 보낸다.
        const CATEGORY_OF = {
            plan_approved: 'approval', plan_rejected: 'approval',
            claim_approved: 'approval', claim_rejected: 'approval',
            change_approved: 'approval', change_rejected: 'approval',
            statement_confirmed: 'salary',
            message_received: 'guardian',
            schedule_today: 'schedule',
            record_needed: 'record',
        };
        const CATEGORY_LABEL = { schedule: '일정 알림', record: '기록 알림', salary: '급여 알림', guardian: '보호자 소통 알림', approval: '승인 알림', system: '시스템 알림' };
        const CATEGORY_COLOR = {
            schedule: ['#E6F3F1', '#0F8B80'], record: ['#E8F1FC', '#1D4ED8'], salary: ['#FDF1E3', '#B45309'],
            guardian: ['#EDE9FE', '#6D28D9'], approval: ['#E6F3F1', '#0F8B80'], system: ['#F1F5F9', '#64748B'],
        };
        // 중요(처리 필요) 알림: 반려된 건은 요양사가 다시 조치해야 한다
        const IMPORTANT_KINDS = ['claim_rejected', 'plan_rejected', 'change_rejected'];
        // 알림을 누르면 이동할 화면 (실제로 존재하는 화면만 연결한다)
        const ACTION_LINK = {
            statement_confirmed: ['급여 보기', './my_salary.html'],
            message_received: ['메시지 보기', './messages.html'],
            plan_approved: ['일정 보기', './my_schedule.html'],
            plan_rejected: ['일정 보기', './my_schedule.html'],
            claim_approved: ['청구 보기', './caregiver_billing.html'],
            claim_rejected: ['청구 보기', './caregiver_billing.html'],
            schedule_today: ['일정 보기', './my_schedule.html'],
            record_needed: ['기록 작성', './voice_record.html'],
        };
        const ROLE_LABEL = { caregiver: '요양보호사', center_manager: '센터장', guardian: '보호자' };

        // 필터 칩: 기존 카테고리 필터에 처리 필요/중요/시스템을 추가한다 (전부 kind·is_read로 판정 가능한 것만)
        const FILTERS = [
            ['all', '전체'], ['unread', '읽지 않음'], ['action', '처리 필요'], ['important', '중요'],
            ['schedule', '일정'], ['record', '기록'], ['salary', '급여'], ['guardian', '보호자'], ['approval', '승인'], ['system', '시스템'],
        ];

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRoleLabel').textContent = ROLE_LABEL[user.role] || '';
            document.getElementById('headerDate').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
            renderSidebar();
            groupSidebar();
            renderFilterChips();
            loadNotifications();
            loadTodayScheduleCount();
        }

        // 대시보드·나의 일정과 동일한 사이드바 그룹 라벨 (menu.js는 그대로 두고 이 페이지에서만 DOM 보정)
        const SIDE_GROUPS_CG = [
            ['매인', ['대시보드']],
            ['대상자 및 인력 관리', ['이용자관리', '보호자 관리', '직원관리']],
            ['방문 서비스 운영', ['음성 기록', '나의 일정', '방문계획 승인', '보호자 소통']],
            ['청구 및 경영 관리', ['나의 청부', '나의 급여', '청부관리', '월별정산', '수익분석', '급여 확정']],
        ];
        function groupSidebar() {
            const nav = document.getElementById('navContent');
            const items = Array.from(nav.querySelectorAll(':scope > a.side-item'));
            if (!items.length) return;
            const byLabel = {};
            items.forEach(item => { byLabel[item.querySelector('span:last-child')?.textContent.trim()] = item; });
            const frag = document.createDocumentFragment();
            SIDE_GROUPS_CG.forEach(([groupLabel, labels]) => {
                const found = labels.map(l => byLabel[l]).filter(Boolean);
                if (!found.length) return;
                const h = document.createElement('div');
                h.className = 'side-group-label';
                h.textContent = groupLabel;
                frag.appendChild(h);
                found.forEach(el => frag.appendChild(el));
            });
            items.forEach(el => { if (!frag.contains(el)) frag.appendChild(el); });
            nav.innerHTML = '';
            nav.appendChild(frag);
        }

        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text ?? ''; return div.innerHTML; }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            const diffMin = Math.floor((now - d) / 60000);
            if (diffMin < 1) return '방금 전';
            if (diffMin < 60) return `${diffMin}분 전`;
            if (diffMin < 1440 && d.toDateString() === now.toDateString()) return `${Math.floor(diffMin / 60)}시간 전`;
            const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return `어제 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            return `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function fullTime(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function groupLabel(iso) {
            const d = new Date(iso);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) return '오늘';
            const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return '어제';
            return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        }

        async function loadNotifications() {
            try {
                const r = await fetch(`${API_URL}/notifications/mine`);
                const d = await r.json();
                allNotifications = d.notifications || [];
                updateMetrics(d.unread_count || 0);
                renderNotifications();
                if (selectedId === null && allNotifications.length) selectNotification(allNotifications[0].id, false);
            } catch (e) {
                document.getElementById('notificationList').innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:#94A3B8;">알림을 불러올 수 없습니다</td></tr>';
            }
        }

        // 오늘 일정: 요양사 본인 일정만 알 수 있다 (센터장은 개인 일정이 없어 "-"로 둔다)
        async function loadTodayScheduleCount() {
            if (currentUser.role !== 'caregiver') return;
            try {
                const now = new Date();
                const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                const r = await fetch(`${API_URL}/schedule/caregiver-view?caregiver_id=${currentUser.id}&year_month=${ym}&user_id=${currentUser.id}&user_role=${currentUser.role}`);
                const d = await r.json();
                const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const count = (d.items || []).filter(it => it.date === todayKey).length;
                document.getElementById('metricToday').textContent = `${count}건`;
            } catch (e) { /* 오늘 일정은 참고 정보이므로 실패해도 화면은 그대로 둔다 */ }
        }

        function updateMetrics(unreadCount) {
            document.getElementById('metricNew').textContent = `${unreadCount}건`;
            const actionCount = allNotifications.filter(n => !n.is_read && IMPORTANT_KINDS.includes(n.kind)).length;
            const importantCount = allNotifications.filter(n => IMPORTANT_KINDS.includes(n.kind)).length;
            document.getElementById('metricAction').textContent = `${actionCount}건`;
            document.getElementById('metricImportant').textContent = `${importantCount}건`;

            const infoLine = document.getElementById('infoLine');
            if (unreadCount > 0) {
                document.getElementById('infoLineText').textContent = `읽지 않은 알림이 ${unreadCount}건 있습니다.`;
                infoLine.style.display = 'flex';
            } else {
                infoLine.style.display = 'none';
            }
        }

        function filterCount(key) {
            if (key === 'all') return allNotifications.length;
            if (key === 'unread') return allNotifications.filter(n => !n.is_read).length;
            if (key === 'action') return allNotifications.filter(n => !n.is_read && IMPORTANT_KINDS.includes(n.kind)).length;
            if (key === 'important') return allNotifications.filter(n => IMPORTANT_KINDS.includes(n.kind)).length;
            return allNotifications.filter(n => (CATEGORY_OF[n.kind] || 'system') === key).length;
        }

        function renderFilterChips() {
            const box = document.getElementById('filterChips');
            box.innerHTML = FILTERS.map(([key, label]) =>
                `<button class="flt-chip ${key === currentFilter ? 'active' : ''}" data-filter="${key}" onclick="setFilter('${key}')">${label}<span class="cnt" id="fltCnt_${key}">0</span></button>`
            ).join('');
        }

        function refreshFilterCounts() {
            FILTERS.forEach(([key]) => {
                const el = document.getElementById(`fltCnt_${key}`);
                if (el) el.textContent = filterCount(key);
            });
        }

        function setFilter(key) {
            currentFilter = key;
            currentPage = 1;
            document.querySelectorAll('.flt-chip').forEach(b => b.classList.toggle('active', b.dataset.filter === key));
            renderNotifications();
        }

        function matchesFilter(n) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'unread') return !n.is_read;
            if (currentFilter === 'action') return !n.is_read && IMPORTANT_KINDS.includes(n.kind);
            if (currentFilter === 'important') return IMPORTANT_KINDS.includes(n.kind);
            return (CATEGORY_OF[n.kind] || 'system') === currentFilter;
        }

        function categoryIcon(category) {
            const [bg, fg] = CATEGORY_COLOR[category] || CATEGORY_COLOR.system;
            return `<span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:${bg};color:${fg};flex:0 0 auto;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
            </span>`;
        }

        function importancePill(n) {
            const important = IMPORTANT_KINDS.includes(n.kind);
            if (important && !n.is_read) return '<span class="status-pill2 sp-pending">처리 필요</span>';
            if (important) return '<span class="status-pill2 sp-rejected">중요</span>';
            if (!n.is_read) return '<span class="status-pill2 sp-draft">읽지 않음</span>';
            return '<span class="status-pill2 sp-neutral">일반</span>';
        }

        function renderNotifications() {
            refreshFilterCounts();

            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            let rows = allNotifications.filter(matchesFilter);
            if (q) rows = rows.filter(n => (n.message || '').toLowerCase().includes(q));

            const tbody = document.getElementById('notificationList');
            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:#94A3B8;">해당하는 알림이 없습니다</td></tr>';
                document.getElementById('pager').innerHTML = '';
                return;
            }

            const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
            currentPage = Math.min(currentPage, totalPages);
            const start = (currentPage - 1) * pageSize;
            const pageRows = rows.slice(start, start + pageSize);

            let html = '';
            let lastGroup = null;
            pageRows.forEach(n => {
                const g = groupLabel(n.created_at);
                if (g !== lastGroup) { html += `<tr class="date-group"><td colspan="4">${g}</td></tr>`; lastGroup = g; }
                const category = CATEGORY_OF[n.kind] || 'system';
                const [title, rest] = splitMessage(n.message);
                html += `
                    <tr class="notif-row ${n.is_read ? '' : 'unread'} ${n.id === selectedId ? 'selected' : ''}" onclick="selectNotification(${n.id})">
                        <td style="width:140px;">
                            <div style="display:flex;align-items:center;gap:8px;">
                                ${categoryIcon(category)}
                                <span style="font-size:12px;font-weight:700;color:#64748B;">${CATEGORY_LABEL[category]}</span>
                            </div>
                        </td>
                        <td>
                            <div class="notif-title">${escapeHtml(title)}</div>
                            ${rest ? `<div class="notif-desc">${escapeHtml(rest)}</div>` : ''}
                        </td>
                        <td style="width:120px;color:#94A3B8;font-size:12px;">${formatTime(n.created_at)}</td>
                        <td style="width:110px;">${importancePill(n)}</td>
                    </tr>`;
            });
            tbody.innerHTML = html;

            const from = start + 1, to = Math.min(start + pageSize, rows.length);
            let btns = '';
            for (let p = 1; p <= totalPages; p++) {
                if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) {
                    btns += `<button class="pager-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                } else if (Math.abs(p - currentPage) === 2) {
                    btns += `<span style="padding:0 2px;">…</span>`;
                }
            }
            document.getElementById('pager').innerHTML = `
                <span>총 ${rows.length}건 중 ${from}-${to}건 표시</span>
                <div class="pager-btns">
                    <button class="pager-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">‹</button>
                    ${btns}
                    <button class="pager-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">›</button>
                </div>`;
        }

        function goPage(p) { currentPage = p; renderNotifications(); }

        // 메시지 앞부분을 제목처럼, 나머지를 설명처럼 보여 준다 (문장이 짧으면 제목만 나온다)
        function splitMessage(message) {
            const m = message || '';
            const idx = m.indexOf(': ');
            if (idx > -1 && idx < 20) return [m.slice(0, idx), m.slice(idx + 2)];
            return [m, ''];
        }

        // 알림을 선택해 상세 패널에 보여준다. 안 읽은 알림이면 서버에 읽음 처리를 요청하고,
        // 성공했을 때만 화면에도 읽음으로 반영한다 (실패를 성공처럼 보이지 않게 한다).
        async function selectNotification(id, markRead = true) {
            selectedId = id;
            const n = allNotifications.find(x => x.id === id);
            if (!n) return;
            renderDetail(n);
            renderNotifications();

            if (markRead && !n.is_read && !markBusy) {
                markBusy = true;
                try {
                    const r = await fetch(`${API_URL}/notifications/${id}/read`, { method: 'POST' });
                    if (r.ok) {
                        n.is_read = true;
                        const unread = allNotifications.filter(x => !x.is_read).length;
                        updateMetrics(unread);
                        renderNotifications();
                        renderDetail(n);
                    }
                } catch (e) { /* 네트워크 오류 시 읽음 상태를 바꾸지 않는다 */ }
                markBusy = false;
            }
        }

        function closeDetail() {
            selectedId = null;
            document.getElementById('detailBody').innerHTML = '<div class="detail-empty">알림을 선택하면 상세 내용을 볼 수 있습니다.</div>';
            document.getElementById('detailCloseBtn').style.display = 'none';
            document.getElementById('relatedPanel').style.display = 'none';
            renderNotifications();
        }

        // 알림 API에 없는 이용자 연락처·주소 등은 만들어내지 않는다. 보이는 건 실제 알림 데이터뿐이다.
        function renderDetail(n) {
            const category = CATEGORY_OF[n.kind] || 'system';
            const important = IMPORTANT_KINDS.includes(n.kind);
            const action = ACTION_LINK[n.kind];
            const [title] = splitMessage(n.message);
            document.getElementById('detailCloseBtn').style.display = 'block';
            document.getElementById('detailBody').innerHTML = `
                <div class="detail-head">
                    ${categoryIcon(category)}
                    <span style="font-size:12px;font-weight:700;color:#64748B;">${CATEGORY_LABEL[category]}</span>
                    ${important ? '<span class="status-pill2 sp-rejected" style="margin-left:auto;">중요</span>' : ''}
                </div>
                <div class="detail-title">${escapeHtml(title)}</div>
                <div class="detail-time">${fullTime(n.created_at)}</div>
                <div class="detail-msg">${escapeHtml(n.message)}</div>
                ${action ? `<button onclick="goAction('${action[1]}')" class="btn-solid" style="width:100%;padding:10px;">${action[0]} →</button>` : '<div style="font-size:12px;color:#94A3B8;">이 알림에는 연결된 업무 화면이 없습니다.</div>'}
            `;
            renderRelated(n);
        }

        // 지금 보고 있는 알림과 같은 분류의 다른 알림을 몇 건 보여준다 (실제 데이터만, 꾸며내지 않는다)
        function renderRelated(current) {
            const category = CATEGORY_OF[current.kind] || 'system';
            const rows = allNotifications.filter(n => n.id !== current.id && (CATEGORY_OF[n.kind] || 'system') === category).slice(0, 5);
            const panel = document.getElementById('relatedPanel');
            if (rows.length === 0) { panel.style.display = 'none'; return; }
            panel.style.display = 'block';
            document.getElementById('relatedList').innerHTML = rows.map(n => {
                const [title] = splitMessage(n.message);
                return `<button class="related-row" onclick="selectNotification(${n.id})">
                    <span class="rr-title">${n.is_read ? '' : '● '}${escapeHtml(title)}</span>
                    <span class="rr-time">${formatTime(n.created_at)}</span>
                </button>`;
            }).join('');
        }

        function goAction(link) { window.location.href = link; }

        async function markAllRead() {
            const btn = document.getElementById('readAllBtn');
            if (markBusy) return;
            markBusy = true;
            btn.disabled = true;
            try {
                const r = await fetch(`${API_URL}/notifications/read-all`, { method: 'POST' });
                if (r.ok) await loadNotifications();
            } catch (e) { /* 실패 시 화면은 그대로 둔다 */ }
            btn.disabled = false;
            markBusy = false;
        }

        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
