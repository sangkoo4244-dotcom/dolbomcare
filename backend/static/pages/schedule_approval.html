<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 방문 계획 승인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        .sa-banner { height: 220px; border-radius: 16px; overflow: hidden; margin-bottom: 24px; }
        .sa-banner img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; display: block; }
        .sa-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
        .sa-metric { display: flex; align-items: center; gap: 16px; padding: 22px 24px; border-radius: 16px; min-height: 130px; }
        .sa-metric img { width: 84px; height: 84px; object-fit: contain; flex: 0 0 auto; mix-blend-mode: multiply; }
        .sa-metric-label { font-size: 16px; font-weight: 700; color: #1F2937; }
        .sa-metric-value { font-size: 40px; font-weight: 800; color: #1F2937; line-height: 1.2; margin-top: 4px; }
        .sa-metric-note { font-size: 13px; color: #6B7280; margin-top: 2px; }
        .sa-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .sa-head img { width: 44px; height: 44px; object-fit: contain; }
        .side-icon img { display: block; }
        @media (max-width: 900px) { .sa-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl"></div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">방문 계획 승인</h1>
                <div class="flex items-center gap-6">
                    <img src="assets/user_design/28_top_notification_icon.png" alt="" style="width:28px;height:28px;object-fit:contain;">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500" id="userRole">역할</div></div>
                    <img src="assets/user_design/29_top_profile_icon.png" alt="" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="message" class="hidden mb-6 p-4 rounded-lg"></div>
                <div class="sa-banner"><img src="assets/user_design/approval_banner.png" alt=""></div>
                <div class="sa-metrics">
                    <div class="sa-metric" style="background:#FDF6EC;"><img src="assets/user_design/approval_metric_pending.png" alt=""><div><div class="sa-metric-label">승인 대기 계획</div><div class="sa-metric-value" id="metricPending">0건</div><div class="sa-metric-note">요양사가 제안한 계획</div></div></div>
                    <div class="sa-metric" style="background:#EAF6F0;"><img src="assets/user_design/approval_metric_approved.png" alt=""><div><div class="sa-metric-label">승인된 계획</div><div class="sa-metric-value" id="metricApproved">-</div><div class="sa-metric-note">이번 달 승인 완료</div></div></div>
                    <div class="sa-metric" style="background:#FBEAEA;"><img src="assets/user_design/approval_metric_rejected.png" alt=""><div><div class="sa-metric-label">반려된 계획</div><div class="sa-metric-value" id="metricRejected">0건</div><div class="sa-metric-note">수정 요청한 계획</div></div></div>
                    <div class="sa-metric" style="background:#E8F2FC;"><img src="assets/user_design/approval_metric_today_visit.png" alt=""><div><div class="sa-metric-label">오늘 예정 방문</div><div class="sa-metric-value" id="metricToday">-</div><div class="sa-metric-note">승인된 일정</div></div></div>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <div class="sa-head"><img src="assets/user_design/approval_section_header_icon.png" alt=""><h2 class="text-2xl font-bold text-gray-900">승인 대기 계획</h2></div>
                    <p class="text-sm text-gray-600 mb-6">요양사가 제안한 방문 계획입니다. 승인하면 요양사의 나의 일정에 확정됩니다. 반려하면 사유가 요양사에게 전달됩니다.</p>
                    <div class="flex justify-end mb-4">
                        <button onclick="approveAllPlans()" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-lg hover:bg-emerald-700">승인 대기 계획 모두 승인</button>
                    </div>
                    <div id="proposalList" class="space-y-4">
                        <div class="text-center py-8 text-gray-400">불러오는 중...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="menu.js"></script>
    <script>
        const API_URL = '/api/v1';
        const CARE_ITEM_LABELS = {
            meal_assist: '식사 보조', toilet_assist: '배설 보조', bath: '목욕·세면', dressing: '옷 갈아입기', mobility: '이동 보조',
            medicine: '투약 확인', vitals: '체온·혈압 측정', symptom: '이상 증상 관찰',
            emotional: '말벗·정서 지원', cognitive: '인지활동',
            cleaning: '청소·정돈', laundry: '세탁', shopping: '장보기·취사'
        };
        let currentUser = null;

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            if (user.role !== 'center_manager') { alert('센터장만 접근할 수 있습니다'); window.location.href = './dashboard.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = '센터장';
            renderSidebar();
            applyNavIcons();
            loadProposals();
        }

        // 시안의 메뉴 아이콘 (assets/user_design/20~27_nav_*): 이 화면의 사이드바에만 적용한다
        const NAV_ICON_FILES = {
            '대시보드': '20_nav_dashboard_icon.png',
            '이용자관리': '21_nav_user_icon.png',
            '음성 기록': '22_nav_voice_icon.png',
            '방문계획 승인': '23_nav_service_plan_icon.png',
            '청부관리': '24_nav_billing_icon.png',
            '수익분석': '25_nav_statistics_icon.png',
            '알림': '26_nav_notice_icon.png',
            '설정': '27_nav_settings_icon.png',
        };

        function applyNavIcons() {
            document.querySelectorAll('.sidebar-nav .side-item, #navContent .side-item').forEach(item => {
                const file = NAV_ICON_FILES[item.querySelector('span:last-child')?.textContent.trim()];
                if (file) item.querySelector('.side-icon').innerHTML = `<img src="assets/user_design/${file}" width="24" height="24" alt="">`;
            });
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `${type === 'error' ? 'bg-red-50 border border-red-200 text-red-700' : 'bg-emerald-50 border border-emerald-200 text-emerald-700'} mb-6 p-4 rounded-lg`;
            setTimeout(() => msg.classList.add('hidden'), 4000);
        }

        async function loadProposals() {
            const r = await fetch(`${API_URL}/schedule/proposals?center_id=${currentUser.center_id || 1}&user_role=center_manager`);
            const d = await r.json();
            const list = document.getElementById('proposalList');
            const items = d.items || [];
            const pendingItems = items.filter(p => p.status === 'proposed');
            document.getElementById('metricPending').textContent = `${pendingItems.length}건`;
            document.getElementById('metricRejected').textContent = `${items.length - pendingItems.length}건`;
            if (items.length === 0) {
                list.innerHTML = '<div class="text-center py-8 text-gray-400"><img src="assets/user_design/approval_empty_state.png" alt="" style="width:260px;height:auto;margin:0 auto 8px;display:block;">승인 대기 중인 방문 계획이 없습니다</div>';
                return;
            }
            list.innerHTML = d.items.map(p => {
                const items = p.planned_items.map(c => CARE_ITEM_LABELS[c] || c).join(', ') || '-';
                const status = p.status === 'proposed'
                    ? '<span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">승인 대기</span>'
                    : '<span class="px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-800">요양사 수정 대기</span>';
                const actions = p.status === 'proposed'
                    ? `<button onclick="approve(${p.schedule_id})" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-lg hover:bg-emerald-700">승인</button>
                       <button onclick="reject(${p.schedule_id})" class="px-4 py-2 bg-white border border-red-300 text-red-700 text-sm font-bold rounded-lg hover:bg-red-50 ml-2">반려</button>`
                    : '';
                return `
                    <div class="border border-gray-200 rounded-lg p-6 flex justify-between items-start gap-6">
                        <div>
                            <div class="text-lg font-bold text-gray-900">${p.resident_name || '-'} <span class="text-sm font-normal text-gray-500">· 요양사 ${p.caregiver_name || p.caregiver_id}</span></div>
                            <div class="text-sm text-gray-700 mt-1">${p.scheduled_date} · ${p.duration_minutes || '-'}분</div>
                            <div class="text-sm text-gray-700 mt-1">계획 항목: ${items}</div>
                            ${p.review_note ? `<div class="text-sm text-red-600 mt-1">반려 사유: ${p.review_note}</div>` : ''}
                        </div>
                        <div class="text-right shrink-0">
                            <div class="mb-3">${status}</div>
                            <div>${actions}</div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function approveAllPlans() {
            const listed = await fetch(`${API_URL}/schedule/proposals?center_id=${currentUser.center_id || 1}&user_role=center_manager`);
            const items = ((await listed.json()).items || []).filter(p => p.status === 'proposed');
            if (items.length === 0) { showMessage('승인 대기 중인 방문 계획이 없습니다', 'error'); return; }
            if (!confirm(`승인 대기 계획 ${items.length}건을 모두 승인하시겠습니까?`)) return;
            let approved = 0;
            for (const p of items) {
                const r = await fetch(`${API_URL}/schedule/${p.schedule_id}/approve`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, user_role: 'center_manager', reason: '' })
                });
                if (r.ok) approved++;
            }
            showMessage(`방문 계획 ${approved}건을 승인했습니다`, 'success');
            loadProposals();
        }

        async function approve(scheduleId) {
            if (!confirm('이 방문 계획을 승인하시겠습니까?')) return;
            const r = await fetch(`${API_URL}/schedule/${scheduleId}/approve`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUser.id, user_role: 'center_manager', reason: '' })
            });
            if (!r.ok) { const e = await r.json().catch(() => ({})); showMessage(e.detail || '승인 실패', 'error'); return; }
            showMessage('방문 계획을 승인했습니다', 'success');
            loadProposals();
        }

        async function reject(scheduleId) {
            const reason = prompt('반려 사유를 입력하세요:');
            if (reason === null) return;
            if (!reason.trim()) { showMessage('반려 사유를 입력해 주세요', 'error'); return; }
            const r = await fetch(`${API_URL}/schedule/${scheduleId}/reject`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUser.id, user_role: 'center_manager', reason: reason })
            });
            if (!r.ok) { const e = await r.json().catch(() => ({})); showMessage(e.detail || '반려 실패', 'error'); return; }
            showMessage('방문 계획을 반려했습니다', 'success');
            loadProposals();
        }

        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
