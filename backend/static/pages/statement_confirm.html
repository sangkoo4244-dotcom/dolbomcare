<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 급여 확정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">🧾 급여 확정</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500">센터장</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8 space-y-6">
                <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-4 text-sm">
                    확정하면 그 시점의 금액이 명세로 저장되고, 요양사에게 보입니다. 확정 후 청구가 바뀌어도 명세는 바뀌지 않습니다. 확정은 되돌릴 수 없습니다.
                </div>
                <div id="message" class="hidden p-4 rounded-lg text-sm"></div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6 flex items-center gap-3">
                    <label class="text-sm font-semibold text-gray-700">달</label>
                    <input id="yearMonth" type="month" onchange="loadStatus()" class="border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b-2 border-gray-200">
                                <th class="text-left py-3 px-4 font-bold text-gray-700">요양사</th>
                                <th class="text-left py-3 px-4 font-bold text-gray-700">승인 청부액</th>
                                <th class="text-left py-3 px-4 font-bold text-gray-700">상태</th>
                                <th class="text-left py-3 px-4 font-bold text-gray-700">관리</th>
                            </tr>
                        </thead>
                        <tbody id="statusBody">
                            <tr><td colspan="4" class="py-8 text-center text-gray-400">달을 고르세요</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="menu.js"></script>
    <script>
        let currentUser = null;
        const API_URL = '/api/v1';

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            if (user.role !== 'center_manager') { window.location.href = './dashboard.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '센터장';
            renderSidebar();
            const now = new Date();
            document.getElementById('yearMonth').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            loadStatus();
        }

        function showMessage(text, ok) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = `p-4 rounded-lg text-sm ${ok ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-700'}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        async function loadStatus() {
            const ym = document.getElementById('yearMonth').value;
            if (!ym) return;
            const r = await fetch(`${API_URL}/statements/status?year_month=${ym}`);
            const body = document.getElementById('statusBody');
            if (!r.ok) { body.innerHTML = '<tr><td colspan="4" class="py-8 text-center text-gray-400">불러올 수 없습니다</td></tr>'; return; }
            const d = await r.json();
            body.innerHTML = d.caregivers.length ? d.caregivers.map(c => `
                <tr class="border-b border-gray-100">
                    <td class="py-4 px-4 font-semibold text-gray-900">${escapeHtml(c.caregiver_name)}</td>
                    <td class="py-4 px-4 text-gray-700">₩${c.billing_total.toLocaleString()}</td>
                    <td class="py-4 px-4">${c.confirmed
                        ? '<span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">확정됨</span>'
                        : '<span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">미확정</span>'}</td>
                    <td class="py-4 px-4">${c.confirmed || c.billing_total <= 0 ? '' :
                        `<button onclick="confirmStatement(${c.caregiver_id})" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-lg hover:bg-emerald-700">확정</button>`}</td>
                </tr>`).join('') : '<tr><td colspan="4" class="py-8 text-center text-gray-400">요양사가 없습니다</td></tr>';
        }

        async function confirmStatement(caregiverId) {
            const ym = document.getElementById('yearMonth').value;
            if (!confirm(`${ym} 급여를 확정할까요? 확정 후에는 되돌릴 수 없습니다.`)) return;
            const r = await fetch(`${API_URL}/statements/confirm`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ caregiver_id: caregiverId, year_month: ym }),
            });
            const d = await r.json().catch(() => ({}));
            showMessage(r.ok ? '확정했습니다. 요양사에게 알림이 갑니다.' : (d.detail || '확정하지 못했습니다'), r.ok);
            loadStatus();
        }

        function logout() { if (confirm('로그아웃하시겠습니까?')) { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; } }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
