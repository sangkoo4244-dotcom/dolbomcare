<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 직원 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: #f5f7fa;
            color: var(--text-primary);
        }

        .sidebar {
            width: 288px;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav { padding: 24px 0; }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { color: #B5532F; border-left-color: #B5532F; background: rgba(16, 185, 129, 0.1); }
        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 288px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 { margin: 0; font-size: 24px; font-weight: 700; color: var(--text-primary); }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #B5532F 0%, #9A4425 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .table-wrapper {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        .table th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 13px;
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .table tbody tr:hover {
            background: #f9fafb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* 직원 관리 시안 배치 */
        .sidebar { display: flex; flex-direction: column; }
        .st-act { padding: 8px 14px; border: 1px solid #D6D0C4; border-radius: 10px; background: white; color: #374151; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 6px; }
        .st-act:hover { border-color: #B5532F; color: #B5532F; }
        .st-cal { padding: 0; border: none; background: none; cursor: pointer; vertical-align: middle; display: inline-flex; align-items: center; justify-content: center; margin-left: 4px; }
        .st-sch-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .st-sch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px; }
        .st-cal img { width: 40px; height: auto; display: block; flex: 0 0 auto; }
        .sidebar .side-item.active { background: #4E7D5E; color: #fff; }
        .side-icon img { display: block; }
        .st-banner { border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
        .st-banner img { width: 100%; height: auto; display: block; }
        .st-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
        .st-metric { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; }
        .st-metric img { width: 44px; height: 44px; object-fit: contain; flex: 0 0 auto; mix-blend-mode: multiply; }
        .st-metric-label { font-size: 13px; font-weight: 700; color: #1F2937; }
        .st-metric-value { font-size: 26px; font-weight: 800; color: #1F2937; line-height: 1.2; margin-top: 2px; }
        .st-metric-sub { font-size: 12px; color: #6B7280; margin-top: 1px; }
        .st-search { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px 20px; margin-bottom: 20px; }
        .st-search-box { display: flex; align-items: center; gap: 10px; flex: 1 1 320px; height: 46px; padding: 0 14px; border: 1px solid #D6D0C4; border-radius: 12px; color: #6B7280; }
        .st-search-box input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; }
        .st-field { display: flex; flex-direction: column; gap: 6px; }
        .st-label { font-size: 12px; font-weight: 700; color: #374151; }
        .st-field select { height: 42px; padding: 0 10px; border: 1px solid #D6D0C4; border-radius: 10px; font-size: 14px; background: white; min-width: 140px; }
        .st-search-btn { height: 44px; padding: 0 26px; border: none; border-radius: 12px; background: #2E7D4F; color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
        .st-add-btn { height: 44px; padding: 0 22px; border: none; border-radius: 12px; background: #B5532F; color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
        .st-name { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #1F2937; }
        .st-initial { width: 34px; height: 34px; border-radius: 50%; background: #EAF6F0; color: #15803D; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; }
        .st-work { display: inline-block; padding: 4px 12px; border-radius: 10px; background: #DCFCE7; color: #15803D; font-size: 12px; font-weight: 700; }
        .st-pw-btn { padding: 6px 12px; background: #e5e7eb; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .st-leave { background: #FEF3C7; color: #B45309; }
        .st-inactive { background: #FBEAEA; color: #B91C1C; }
        .st-modal[hidden] { display: none; }
        .st-add-panel { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 16px; padding: 16px; background: #f9fafb; border-radius: 8px; }
        .st-add-panel[hidden] { display: none; }
        .st-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .st-modal-box { background: white; border-radius: 16px; padding: 28px; width: min(480px, 92vw); max-height: 90vh; overflow-y: auto; }
        .st-modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .st-modal-head h3 { font-size: 20px; font-weight: 800; color: #1F2937; }
        .st-modal-x { border: none; background: none; font-size: 26px; cursor: pointer; color: #6B7280; }
        .st-form { display: flex; flex-direction: column; gap: 12px; }
        .st-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #374151; }
        .st-form input, .st-form select { height: 40px; padding: 0 10px; border: 1px solid #D6D0C4; border-radius: 10px; font-size: 14px; }
        .st-form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
        .st-detail-row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px; }
        .st-detail-row span:first-child { color: #6B7280; }
        .st-cert-title { font-size: 15px; font-weight: 800; color: #1F2937; margin: 18px 0 8px; }
        .st-cert-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px; }
        .st-muted { color: #9CA3AF; font-size: 14px; padding: 6px 0; }
        .st-calc-box { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; color: #14532D; }
        .st-cert-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .st-cert-form input { height: 38px; padding: 0 10px; border: 1px solid #D6D0C4; border-radius: 10px; font-size: 14px; }
        .st-cert-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #374151; }
        .st-cert-form .st-add-btn { grid-column: 1 / -1; }
        .st-features { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
        .st-feature { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: white; border: 1px solid #e5e7eb; border-radius: 12px; }
        .st-feature img { width: 36px; height: 36px; object-fit: contain; flex: 0 0 auto; }
        .st-feature-title { font-size: 15px; font-weight: 700; color: #1F2937; }
        .st-feature-desc { font-size: 13px; color: #6B7280; margin-top: 4px; line-height: 1.5; }
        @media (max-width: 900px) { .st-metrics, .st-features { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
        }

        /* ===== Premium Healthcare Management SaaS 톤 (대시보드·이용자관리·보호자관리와 동일) ===== */
        :root {
            --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247;
            --warn: #B45309; --danger: #DC2626; --line2: #E2E8F0;
        }
        html, body { background: var(--bg) !important; }
        body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: var(--navy) !important; }
        .side-group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #7E93AC; padding: 16px 16px 6px; text-transform: uppercase; }
        .sidebar-nav .side-item { color: #C9D6E3 !important; border-radius: 8px; }
        .sidebar-nav .side-item:hover { background: rgba(255,255,255,0.06) !important; color: #fff !important; }
        .sidebar-nav .side-item.active { background: var(--teal) !important; color: #fff !important; }

        .topbar { background: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }
        .date-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line2); border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--charcoal); }
        .bell-wrap { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #F1F5F9; border-radius: 10px; }
        .bell-wrap svg { width: 17px; height: 17px; color: var(--charcoal); }

        .summary-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 20px; }
        .summary-row > div { background: #fff; border: 1px solid var(--line2); border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(20,40,63,0.04); }
        .summary-top { display: flex; align-items: center; justify-content: space-between; }
        .summary-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .summary-icon svg { width: 19px; height: 19px; }
        .summary-row > div:nth-child(1) .summary-icon { background: #E6F7EE; color: #15803D; }
        .summary-row > div:nth-child(2) .summary-icon { background: #E8F1FC; color: #1D4ED8; }
        .summary-row > div:nth-child(3) .summary-icon { background: #FDF1E3; color: var(--warn); }
        .summary-row > div:nth-child(4) .summary-icon { background: #F1ECFB; color: #6D28D9; }
        .summary-label { font-size: 13px; font-weight: 600; color: #64748B; }
        .summary-value { font-size: 28px; font-weight: 800; color: var(--navy); margin-top: 8px; font-variant-numeric: tabular-nums; }
        .summary-note { font-size: 12px; color: #94A3B8; margin-top: 2px; }
        .summary-note .up { color: #15803D; font-weight: 700; }

        .panel { background: #fff; border: 1px solid var(--line2); border-radius: 12px; }
        .list-panel { padding: 18px 20px; }
        .filter-row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
        .filter-row2 select, .filter-row2 .search-box2 { height: 40px; border: 1px solid var(--line2); border-radius: 9px; font-size: 13px; }
        .filter-row2 select { padding: 0 10px; background: #fff; color: var(--charcoal); }
        .filter-row2 .search-box2 { flex: 1 1 260px; min-width: 200px; padding: 0 12px; display: flex; align-items: center; gap: 8px; }
        .filter-row2 .search-box2 input { border: none; outline: none; flex: 1; font-size: 13px; background: transparent; }
        .btn-ghost2 { height: 40px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 9px; background: #fff; font-size: 13px; font-weight: 600; color: var(--charcoal); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-ghost2:hover { border-color: var(--teal); color: var(--teal); }
        .btn-teal2 { height: 40px; padding: 0 16px; border: none; border-radius: 9px; background: var(--teal); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-teal2:hover { background: #0C6F66; }

        .ptable2 { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ptable2 th { text-align: left; font-weight: 700; color: #64748B; font-size: 12px; padding: 10px 8px; border-bottom: 1px solid #EEF2F6; white-space: nowrap; }
        .ptable2 td { padding: 10px 8px; border-bottom: 1px solid #F3F5F8; color: var(--charcoal); vertical-align: middle; }
        .ptable2 tr:last-child td { border-bottom: none; }
        .ptable2 tr:hover td { background: #F8FAFC; }
        .p-badge2 { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
        .p-badge2::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .badge-active { color: #15803D; background: #E6F7EE; }
        .badge-leave { color: var(--warn); background: #FDF1E3; }
        .badge-inactive { color: var(--danger); background: #FDE8E8; }
        .job-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #E8F1FC; color: #1D4ED8; }
        .pager2 { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 13px; color: #64748B; }
        .pager2-btns { display: flex; align-items: center; gap: 4px; }
        .pager2-btns button { width: 30px; height: 30px; border: 1px solid var(--line2); background: #fff; border-radius: 7px; cursor: pointer; font-size: 12px; color: var(--charcoal); }
        .pager2-btns button.active { background: var(--teal); color: #fff; border-color: var(--teal); }
        .pager2-btns button:disabled { opacity: 0.4; cursor: default; }
        .pager2-size { border: 1px solid var(--line2); border-radius: 7px; padding: 5px 8px; font-size: 12px; }

        .side-panel2 { background: #fff; border: 1px solid var(--line2); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
        .side-panel2-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; font-weight: 800; color: var(--navy); }
        .donut-wrap2 { display: flex; align-items: center; gap: 16px; }
        .donut-canvas-wrap2 { position: relative; width: 110px; height: 110px; flex: 0 0 auto; }
        .donut-center2 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .donut-center2 b { font-size: 17px; color: var(--navy); }
        .donut-center2 span { font-size: 10px; color: #94A3B8; }
        .donut-legend2 { list-style: none; margin: 0; padding: 0; font-size: 12px; flex: 1; }
        .donut-legend2 li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
        .donut-legend2 .dot2 { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
        .donut-legend2 .lbl2 { flex: 1; color: var(--charcoal); }
        .donut-legend2 .pct2 { font-weight: 700; color: var(--navy); }
        .status-bar-row { margin-bottom: 10px; font-size: 12px; }
        .status-bar-row .sb-top { display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--charcoal); }
        .status-bar-row .sb-track { height: 6px; border-radius: 3px; background: #EEF2F6; overflow: hidden; }
        .status-bar-row .sb-fill { height: 100%; border-radius: 3px; }
        .recent-row2 { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F3F5F8; }
        .recent-row2:last-child { border-bottom: none; }
        .recent-row2 .rn2 { font-size: 13px; font-weight: 700; }
        .recent-row2 .rd2 { font-size: 11px; color: #94A3B8; }
        .layout-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
        @media (max-width: 1100px) { .layout-grid2 { grid-template-columns: 1fr; } .summary-row { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="menu.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav" id="navContent"></nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title">
                <h1>직원 관리</h1>
                <div class="breadcrumb">홈 › <b>직원 관리</b></div>
            </div>
            <div class="user-menu">
                <div class="date-chip" id="headerDate"></div>
                <div class="bell-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </div>
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">센터장</div>
                </div>
                <img id="userAvatar" src="assets/user_design/29_top_profile_icon.png" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="summary-row">
                <div>
                    <div class="summary-top"><div class="summary-label">전체 직원</div><div class="summary-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></div></div>
                    <div class="summary-value" id="staffTotal">0</div>
                    <div class="summary-note">센터 소속 전체 직원 수</div>
                </div>
                <div>
                    <div class="summary-top"><div class="summary-label">요양보호사</div><div class="summary-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></div></div>
                    <div class="summary-value" id="staffCaregiver">0</div>
                    <div class="summary-note" id="staffCaregiverNote">방문 서비스 담당</div>
                </div>
                <div>
                    <div class="summary-top"><div class="summary-label">이번 달 신규 등록</div><div class="summary-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg></div></div>
                    <div class="summary-value" id="staffNewCount">0</div>

                    <div class="summary-top"><div class="summary-label">자격증 보유</div><div class="summary-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg></div></div>
                    <div class="summary-value" id="staffCertCount">0</div>

            <div class="layout-grid2">
                <div class="list-panel panel">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
                        <svg width="20" height="20" style="color:var(--teal);flex:0 0 auto;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                        <h2 style="font-size:18px;font-weight:800;color:var(--navy);margin:0;">직원 검색 및 필터</h2>
                    </div>
                    <div class="filter-row2">
                        <label class="search-box2">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                            <input id="staffSearch" type="search" placeholder="이름, 이메일로 검색하세요" oninput="filterStaff()">
                        </label>
                        <select id="roleFilter" onchange="filterStaff()"><option value="">직종 전체</option><option value="caregiver">요양사</option><option value="center_manager">센터장</option></select>
                        <select id="statusFilter" onchange="filterStaff()"><option value="">근무상태 전체</option><option value="active">근무 중</option><option value="leave">휴직</option><option value="inactive">비활성</option></select>
                        <select id="certFilter" onchange="filterStaff()"><option value="">자격증 전체</option><option value="has">보유</option><option value="none">미보유</option></select>
                        <button type="button" class="btn-ghost2" onclick="resetStaffFilters()">↻ 초기화</button>
                        <button type="button" class="btn-teal2" onclick="document.getElementById('newStaffName').focus()">+ 직원 등록</button>
                    </div>

                    <div id="addStaffPanel" class="st-add-panel">
                        <label style="display: flex; flex-direction: column; font-size: 12px; gap: 4px;">이름
                            <input id="newStaffName" type="text" autocomplete="off" style="padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 140px;">
                        </label>
                        <label style="display: flex; flex-direction: column; font-size: 12px; gap: 4px;">이메일(로그인 아이디)
                            <input id="newStaffEmail" type="email" autocomplete="off" style="padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 220px;">
                        </label>
                        <label style="display: flex; flex-direction: column; font-size: 12px; gap: 4px;">초기 비밀번호(8자 이상)
                            <input id="newStaffPassword" type="password" autocomplete="new-password" style="padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 180px;">
                        </label>
                        <label style="display: flex; flex-direction: column; font-size: 12px; gap: 4px;">역할
                            <select id="newStaffRole" style="padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                                <option value="caregiver">요양사</option>
                                <option value="center_manager">센터장</option>
                            </select>
                        </label>
                        <button onclick="addStaff()" style="padding: 9px 16px; background: #0F8B80; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">직원 추가</button>
                        <button type="button" onclick="resetAddStaffForm()" style="padding: 9px 16px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; border-radius: 6px; font-weight: 700; cursor: pointer;">초기화</button>
                    </div>

                    <div id="staffTableWrap">
                        <table class="ptable2">
                            <thead>
                                <tr>
                                    <th style="width:40px;"><input type="checkbox" aria-label="전체 선택"></th>
                                    <th>No.</th>
                                    <th>직원 정보</th>
                                    <th>직종</th>
                                    <th>연락처</th>
                                    <th>자격증</th>
                                    <th>입사일</th>
                                    <th>근무 상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="staffTableBody">
                                <tr><td colspan="9" style="text-align: center; padding: 40px; color: #94A3B8;">직원 정보를 불러오는 중입니다...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pager2" id="sPager" style="display:none;">
                        <div id="sPagerInfo"></div>
                        <div class="pager2-btns" id="sPagerBtns"></div>
                        <select class="pager2-size" id="sPageSize" onchange="renderStaffPage()">
                            <option value="8">8개씩 보기</option>
                            <option value="20">20개씩 보기</option>
                            <option value="50">50개씩 보기</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div class="side-panel2">
                        <div class="side-panel2-head">직무별 현황</div>
                        <div class="donut-wrap2">
                            <div class="donut-canvas-wrap2"><canvas id="chartJob"></canvas><div class="donut-center2"><b id="jobCenterNum">-</b><span>전체 직원</span></div></div>
                            <ul class="donut-legend2" id="jobLegend"></ul>
                        </div>
                    </div>
                    <div class="side-panel2">
                        <div class="side-panel2-head">근무상태 현황</div>
                        <div id="statusBars"></div>
                    </div>
                    <div class="side-panel2">
                        <div class="side-panel2-head">최근 등록 직원</div>
                        <div id="recentStaff"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="staffModal" class="st-modal" hidden>
        <div class="st-modal-box">
            <div class="st-modal-head"><h3 id="staffModalTitle"></h3><button class="st-modal-x" onclick="closeStaffModal()" aria-label="닫기">×</button></div>
            <div id="staffModalBody"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id || user.role !== 'center_manager') {
                alert('센터장 권한이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();
            document.getElementById('headerDate').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
            renderSidebar();
            groupSidebar();

            return true;
        }

        // 대시보드·이용자관리·보호자관리와 동일한 사이드바 그룹 라벨 (menu.js는 그대로 두고 이 페이지에서만 DOM 보정)
        const SIDE_GROUPS = [
            ['매인', ['대시보드']],
            ['대상자 및 인력 관리', ['이용자관리', '보호자 관리', '직원관리', '센터 정보']],
            ['방문 서비스 운영', ['음성 기록', '방문계획 승인', '보호자 소통']],
            ['청구 및 경영 관리', ['청부관리', '본인부담금', '평가 준비 자료', '월별정산', '수익분석', '급여 확정']],
        ];
        function groupSidebar() {
            const nav = document.getElementById('navContent');
            const items = Array.from(nav.querySelectorAll(':scope > a.side-item'));
            if (!items.length) return;
            const byLabel = {};
            items.forEach(item => { byLabel[item.querySelector('span:last-child')?.textContent.trim()] = item; });
            const frag = document.createDocumentFragment();
            SIDE_GROUPS.forEach(([groupLabel, labels]) => {
                const found = labels.map(l => byLabel[l]).filter(Boolean);
                if (!found.length) return;
                const h = document.createElement('div');
                h.className = 'side-group-label';
                h.textContent = groupLabel;
                frag.appendChild(h);
                found.forEach(el => frag.appendChild(el));
            });
            items.forEach(el => { if (!frag.contains(el)) frag.appendChild(el); });
            nav.innerHTML = '';
            nav.appendChild(frag);
        }


        let staffList = [];
        let charts2 = {};

        function updateStaffStats(staff) {
            const now = new Date();
            document.getElementById('staffTotal').textContent = staff.length;

            const caregivers = staff.filter(s => s.role === 'caregiver');
            document.getElementById('staffCaregiver').textContent = caregivers.length;
            const newCaregiversThisMonth = caregivers.filter(s => {
                if (!s.hire_date) return false;
                const d = new Date(s.hire_date);
                return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
            }).length;
            document.getElementById('staffCaregiverNote').innerHTML = newCaregiversThisMonth
                ? `방문 서비스 담당 · <span style="color:#15803D;font-weight:700;">이번 달 +${newCaregiversThisMonth}</span>`
                : '방문 서비스 담당';

            const newThisMonth = staff.filter(s => {
                if (!s.hire_date) return false;
                const d = new Date(s.hire_date);
                return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
            }).length;
            document.getElementById('staffNewCount').textContent = newThisMonth;

            const certCount = staff.filter(s => (certMap[s.id] || []).length > 0).length;
            document.getElementById('staffCertCount').textContent = certCount;
            document.getElementById('staffCertNote').textContent = staff.length
                ? `등록된 자격증 보유자 (${Math.round(certCount / staff.length * 100)}%)`
                : '등록된 자격증 보유자';

            // 직무별 현황 (실제 jobOf() 분류: 요양사/간호(조무)사/관리직)
            const jobCounts = {};
            staff.forEach(s => { const j = jobOf(s); jobCounts[j] = (jobCounts[j] || 0) + 1; });
            const jobColors = ['#0F8B80', '#1D4ED8', '#B45309', '#6D28D9', '#DC2626'];
            const jobData = Object.entries(jobCounts).map(([label, value]) => ({ label, value }));
            donutChart2('chartJob', 'jobCenterNum', 'jobLegend', jobData, jobColors);

            // 근무상태 현황
            const statusCounts = { active: 0, leave: 0, inactive: 0 };
            staff.forEach(s => { statusCounts[statusOf(s)] = (statusCounts[statusOf(s)] || 0) + 1; });
            const statusColors = { active: '#15803D', leave: '#B45309', inactive: '#DC2626' };
            const total = staff.length || 1;
            document.getElementById('statusBars').innerHTML = Object.entries(STATUS_LABEL).map(([k, label]) => {
                const count = statusCounts[k] || 0;
                const pct = Math.round(count / total * 100);
                return `<div class="status-bar-row">
                    <div class="sb-top"><span>${label}</span><span>${count}명 · ${pct}%</span></div>
                    <div class="sb-track"><div class="sb-fill" style="width:${pct}%;background:${statusColors[k]};"></div></div>
                </div>`;
            }).join('');

            // 최근 등록 직원 (입사일 기준)
            const recent = [...staff].filter(s => s.hire_date).sort((a, b) => new Date(b.hire_date) - new Date(a.hire_date)).slice(0, 4);
            const recentEl = document.getElementById('recentStaff');
            recentEl.innerHTML = recent.length
                ? recent.map(s => `
                    <div class="recent-row2">
                        <span class="st-initial">${(s.full_name || s.email).charAt(0)}</span>
                        <div style="flex:1;"><div class="rn2">${escapeAttr(s.full_name || s.email)} (${jobOf(s)})</div><div class="rd2">${s.hire_date} 입사</div></div>
                    </div>`).join('')
                : '<div style="font-size:13px;color:#94A3B8;padding:6px 0;">입사일이 등록된 직원이 없습니다</div>';
        }

        function donutChart2(canvasId, centerEl, legendEl, data, colors) {
            const ctx = document.getElementById(canvasId);
            if (charts2[canvasId]) charts2[canvasId].destroy();
            const total = data.reduce((s, d) => s + d.value, 0);
            document.getElementById(centerEl).textContent = total ? `${total}명` : '-';
            if (!total) {
                document.getElementById(legendEl).innerHTML = '<li style="color:#94A3B8;">데이터 없음</li>';
                charts2[canvasId] = new Chart(ctx, { type: 'doughnut', data: { labels: ['없음'], datasets: [{ data: [1], backgroundColor: ['#EEF2F6'] }] }, options: { cutout: '72%', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } } } });
                return;
            }
            charts2[canvasId] = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: data.map(d => d.label), datasets: [{ data: data.map(d => d.value), backgroundColor: colors, borderWidth: 0 }] },
                options: { cutout: '72%', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
            document.getElementById(legendEl).innerHTML = data.map((d, i) => `
                <li><span class="dot2" style="background:${colors[i]};"></span><span class="lbl2">${escapeAttr(d.label)}</span><span class="pct2">${d.value}명 (${Math.round(d.value / total * 100)}%)</span></li>`).join('');
        }

        // 직종(직급)과 근무 상태: 저장된 값이 없으면 기존 역할과 활성 여부로 보여 준다
        const JOB_OPTIONS = ['요양사', '간호(조무)사', '관리직'];
        const STATUS_LABEL = { active: '근무 중', leave: '휴직', inactive: '비활성' };
        let editingId = null;

        function jobOf(s) {
            if (s.position) return s.position;
            return s.role === 'caregiver' ? '요양사' : '관리직';
        }

        function statusOf(s) {
            if (s.employment_status) return s.employment_status;
            return s.is_active === false ? 'inactive' : 'active';
        }

        const escapeAttr = v => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

        function openEditModal(id) {
            const s = staffList.find(x => x.id === id);
            if (!s) return;
            editingId = id;
            document.getElementById('staffModalTitle').textContent = '직원 정보 수정';
            document.getElementById('staffModalBody').innerHTML = `
                <div class="st-form">
                    <label>이름<input id="eName" value="${escapeAttr(s.full_name)}"></label>
                    <label>이메일<input id="eEmail" type="email" value="${escapeAttr(s.email)}"></label>
                    <label>연락처<input id="ePhone" value="${escapeAttr(s.phone)}"></label>
                    <label>입사일<input id="eHire" type="date" value="${escapeAttr(s.hire_date)}"></label>
                    <label>직종<select id="eJob">${JOB_OPTIONS.map(j => `<option ${jobOf(s) === j ? 'selected' : ''}>${j}</option>`).join('')}</select></label>
                    <label>근무 상태<select id="eStatus">${Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}" ${statusOf(s) === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
                    <div class="st-form-actions">
                        <button class="st-act" onclick="closeStaffModal()">취소</button>
                        <button class="st-add-btn" onclick="saveStaffEdit()">저장</button>
                    </div>
                </div>`;
            document.getElementById('staffModal').hidden = false;
        }

        async function saveStaffEdit() {
            const body = {
                full_name: document.getElementById('eName').value.trim(),
                email: document.getElementById('eEmail').value.trim(),
                phone: document.getElementById('ePhone').value.trim(),
                hire_date: document.getElementById('eHire').value || null,
                position: document.getElementById('eJob').value,
                employment_status: document.getElementById('eStatus').value
            };
            try {
                const r = await fetch(`${API_URL}/users/${editingId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!r.ok) {
                    const e = await r.json().catch(() => ({}));
                    throw new Error(e.detail || '저장 실패');
                }
                closeStaffModal();
                alert('직원 정보를 수정했습니다');
                loadStaffData();
            } catch (e) {
                alert('수정 중 오류가 발생했습니다: ' + e.message);
            }
        }

        function openDetailModal(id) {
            const s = staffList.find(x => x.id === id);
            if (!s) return;
            const rows = [
                ['이름', s.full_name || '-'],
                ['이메일', s.email || '-'],
                ['직종', jobOf(s)],
                ['연락처', s.phone || '-'],
                ['긴급 연락처', s.emergency_contact || '-'],
                ['입사일', s.hire_date || '-'],
                ['근무 상태', STATUS_LABEL[statusOf(s)] || statusOf(s)]
            ];
            document.getElementById('staffModalTitle').textContent = '직원 상세';
            document.getElementById('staffModalBody').innerHTML = rows.map(([k, v]) => `<div class="st-detail-row"><span>${k}</span><span>${escapeAttr(v)}</span></div>`).join('')
                + certSectionHtml(s)
                + `<div class="st-form-actions"><button class="st-act" onclick="closeStaffModal()">닫기</button></div>`;
            document.getElementById('staffModal').hidden = false;
        }

        function closeStaffModal() {
            document.getElementById('staffModal').hidden = true;
        }

        // 근무 일정: 센터장이 직원의 월별 방문 일정을 읽기만 한다 (수정·등록은 하지 않는다)
        const SCHED_LABELS = {
            meal_assist: '식사 보조', toilet_assist: '배설 보조', bath: '목욕·세면', dressing: '옷 갈아입기', mobility: '이동 보조',
            medicine: '투약 확인', vitals: '체온·혈압 측정', symptom: '이상 증상 관찰',
            emotional: '말벗·정서 지원', cognitive: '인지활동',
            cleaning: '청소·정돈', laundry: '세탁', shopping: '장보기·취사'
        };
        let scheduleStaffId = null;
        let scheduleYm = null;

        function ymOf(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        function openScheduleModal(id) {
            scheduleStaffId = id;
            scheduleYm = ymOf(new Date());
            loadSchedule();
        }

        function shiftSchedule(delta) {
            const [y, m] = scheduleYm.split('-').map(Number);
            scheduleYm = ymOf(new Date(y, m - 1 + delta, 1));
            loadSchedule();
        }

        async function loadSchedule() {
            const s = staffList.find(x => x.id === scheduleStaffId);
            if (!s) return;
            document.getElementById('staffModalTitle').textContent = `${s.full_name || s.email} · 근무 일정`;
            document.getElementById('staffModalBody').innerHTML = `
                <div class="st-sch-nav">
                    <button class="st-act" onclick="shiftSchedule(-1)">이전 달</button>
                    <strong>${scheduleYm}</strong>
                    <button class="st-act" onclick="shiftSchedule(1)">다음 달</button>
                </div>
                <div id="stSchList" class="st-muted">불러오는 중입니다...</div>
                <div class="st-form-actions"><button class="st-act" onclick="closeStaffModal()">닫기</button></div>`;
            document.getElementById('staffModal').hidden = false;

            try {
                const r = await fetch(`${API_URL}/schedule/caregiver-view?caregiver_id=${scheduleStaffId}&year_month=${scheduleYm}&user_id=${currentUser.id}&user_role=center_manager`);
                if (!r.ok) {
                    const e = await r.json().catch(() => ({}));
                    throw new Error(e.detail || '조회 실패');
                }
                const data = await r.json();
                const items = (data.items || []).slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
                const list = document.getElementById('stSchList');
                if (items.length === 0) {
                    list.textContent = '이 달에 등록된 일정이 없습니다';
                    return;
                }
                list.innerHTML = items.map(i => `
                    <div class="st-sch-row">
                        <div>
                            <strong>${escapeAttr(i.date)} ${escapeAttr(i.time)}</strong> · ${escapeAttr(i.resident_name || '이용자')}
                            <div class="st-muted">${i.duration_minutes || '-'}분 · ${(i.planned_items || []).map(c => SCHED_LABELS[c] || c).join(', ') || '계획 항목 없음'}</div>
                        </div>
                        <span class="st-work">${escapeAttr(i.state)}</span>
                    </div>`).join('');
            } catch (e) {
                document.getElementById('stSchList').textContent = '일정을 불러오지 못했습니다: ' + e.message;
            }
        }

        // 직원 규정준수 기록: 고충처리/건강검진/보수교육/연차·유급휴일/퇴직적립금
        const RECORD_TYPE_LABELS = {
            grievance: '고충처리', health_checkup: '건강검진', continuing_education: '보수교육',
            annual_leave: '연차·유급휴일', retirement_reserve: '퇴직적립금',
        };
        let recordsStaffId = null;
        let recordsCache = null;
        let currentRecordType = 'grievance';

        function openRecordsModal(id) {
            recordsStaffId = id;
            currentRecordType = 'grievance';
            loadRecords();
        }

        async function loadRecords() {
            const s = staffList.find(x => x.id === recordsStaffId);
            if (!s) return;
            document.getElementById('staffModalTitle').textContent = `${s.full_name || s.email} · 규정준수 기록`;
            document.getElementById('staffModalBody').innerHTML = `
                <div class="st-muted" style="margin-bottom:10px;">연차·퇴직금은 법정 기준(근로기준법 제60조·근로자퇴직급여보장법) 참고용 자동계산을 보여줍니다. 실제 사용·지급 기록은 아래에 직접 추가하세요.</div>
                <select id="recordTypeSelect" onchange="switchRecordType(this.value)" style="width:100%;margin-bottom:12px;">
                    ${Object.entries(RECORD_TYPE_LABELS).map(([code, label]) => `<option value="${code}">${label}</option>`).join('')}
                </select>
                <div id="recordCalcBox"></div>
                <div id="recordFormBox"></div>
                <div id="recordListBox" class="st-muted" style="margin-top:14px;">불러오는 중...</div>
                <div class="st-form-actions"><button class="st-act" onclick="closeStaffModal()">닫기</button></div>`;
            document.getElementById('staffModal').hidden = false;

            try {
                const r = await fetch(`${API_URL}/staff-records/staff/${recordsStaffId}`);
                if (!r.ok) throw new Error('조회 실패');
                recordsCache = (await r.json()).records;
            } catch (e) {
                recordsCache = null;
            }
            document.getElementById('recordTypeSelect').value = currentRecordType;
            renderRecordType();
            loadCalcBox();
        }

        function switchRecordType(code) {
            currentRecordType = code;
            document.getElementById('recordTypeSelect').value = code;
            renderRecordType();
            loadCalcBox();
        }

        // 연차/퇴직금 탭일 때만 법정 기준 참고 계산을 보여준다 (고충처리 등 나머지 종류는 해당 없음)
        async function loadCalcBox() {
            const box = document.getElementById('recordCalcBox');
            if (currentRecordType === 'annual_leave') {
                box.innerHTML = '<div class="st-muted">계산 중...</div>';
                try {
                    const r = await fetch(`${API_URL}/staff-records/staff/${recordsStaffId}/annual-leave`);
                    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || '계산 실패');
                    const d = await r.json();
                    box.innerHTML = `<div class="st-calc-box"><b>법정 연차 발생일수 (참고용)</b>: ${d.days}일 <span class="st-muted">· ${escapeAttr(d.basis)} · 근속 ${d.service_days}일</span></div>`;
                } catch (e) {
                    box.innerHTML = `<div class="st-muted">${escapeAttr(e.message)}</div>`;
                }
            } else if (currentRecordType === 'retirement_reserve') {
                box.innerHTML = '<div class="st-muted">계산 중...</div>';
                try {
                    const r = await fetch(`${API_URL}/staff-records/staff/${recordsStaffId}/retirement-estimate`);
                    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || '계산 실패');
                    const d = await r.json();
                    if (!d.eligible) {
                        box.innerHTML = `<div class="st-calc-box"><b>법정 퇴직금 추정액 (참고용)</b>: <span class="st-muted">${escapeAttr(d.reason)}</span></div>`;
                    } else if (d.estimated_amount == null) {
                        box.innerHTML = `<div class="st-calc-box"><b>법정 퇴직금 추정액 (참고용)</b>: <span class="st-muted">${escapeAttr(d.reason)}</span></div>`;
                    } else {
                        box.innerHTML = `<div class="st-calc-box"><b>법정 퇴직금 추정액 (참고용)</b>: ₩${d.estimated_amount.toLocaleString()} <span class="st-muted">· 평균임금(1일) ₩${d.average_daily_wage.toLocaleString()} · 근속 ${d.service_days}일 · 최근 확정급여 ${d.wage_months_used.join(', ')} 기준</span></div>`;
                    }
                } catch (e) {
                    box.innerHTML = `<div class="st-muted">${escapeAttr(e.message)}</div>`;
                }
            } else {
                box.innerHTML = '';
            }
        }

        function renderRecordType() {
            const type = currentRecordType;
            const statusField = type === 'grievance'
                ? `<label>처리 상태<select id="rStatus"><option value="open">접수</option><option value="resolved">해결됨</option></select></label>` : '';
            const amountLabel = { annual_leave: '일수', retirement_reserve: '금액(원)', continuing_education: '이수 시간' }[type] || '숫자값';

            document.getElementById('recordFormBox').innerHTML = `
                <div class="st-form">
                    <label>날짜<input id="rDate" type="date" value="${new Date().toISOString().slice(0, 10)}"></label>
                    <label>제목<input id="rTitle" placeholder="예: 2026년 상반기 보수교육"></label>
                    <label>${amountLabel} (선택)<input id="rAmount" type="number"></label>
                    ${statusField}
                    <label>내용<textarea id="rDetail" rows="2"></textarea></label>
                    <div class="st-form-actions"><button class="st-add-btn" onclick="submitRecord()">추가</button></div>
                </div>`;

            const listBox = document.getElementById('recordListBox');
            const group = recordsCache ? recordsCache[type] : null;
            if (!group || !group.items.length) { listBox.textContent = '등록된 기록이 없습니다'; return; }
            listBox.innerHTML = group.items.map(r => `
                <div class="st-detail-row" style="flex-direction:column;align-items:flex-start;gap:2px;">
                    <div style="display:flex;justify-content:space-between;width:100%;">
                        <strong>${escapeAttr(r.record_date)} ${escapeAttr(r.title || '')}</strong>
                        <button class="st-act" style="padding:2px 8px;font-size:11px;" onclick="deleteRecord(${r.id})">삭제</button>
                    </div>
                    <div class="st-muted">
                        ${r.status ? `상태: ${r.status === 'open' ? '접수' : '해결됨'} · ` : ''}
                        ${r.amount != null ? `${r.amount} · ` : ''}
                        작성: ${escapeAttr(r.recorded_by_name || '-')}
                    </div>
                    ${r.detail ? `<div>${escapeAttr(r.detail)}</div>` : ''}
                </div>`).join('');
        }

        async function submitRecord() {
            const body = {
                staff_id: recordsStaffId,
                record_type: currentRecordType,
                record_date: document.getElementById('rDate').value,
                title: document.getElementById('rTitle').value,
                detail: document.getElementById('rDetail').value,
                amount: document.getElementById('rAmount').value ? parseInt(document.getElementById('rAmount').value, 10) : null,
            };
            const statusEl = document.getElementById('rStatus');
            if (statusEl) body.status = statusEl.value;
            if (!body.record_date) { alert('날짜를 입력해주세요'); return; }

            try {
                const r = await fetch(`${API_URL}/staff-records/`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
                });
                if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || '저장 실패'); }
                await loadRecords();
            } catch (e) { alert('오류: ' + e.message); }
        }

        async function deleteRecord(id) {
            if (!confirm('이 기록을 삭제할까요?')) return;
            try {
                const r = await fetch(`${API_URL}/staff-records/${id}`, { method: 'DELETE' });
                if (!r.ok) throw new Error('삭제 실패');
                await loadRecords();
            } catch (e) { alert('오류: ' + e.message); }
        }

        // 자격증: 센터 전체 목록을 한 번 받아 직원별로 나눠 쓴다
        let certMap = {};

        async function loadCertificates() {
            try {
                const r = await fetch(`${API_URL}/certificates/?center_id=${currentUser?.center_id || 1}`);
                const data = r.ok ? await r.json() : { certificates: [] };
                certMap = {};
                (data.certificates || []).forEach(c => {
                    (certMap[c.user_id] = certMap[c.user_id] || []).push(c);
                });
            } catch (e) {
                certMap = {};
            }
        }

        function certSummary(s) {
            const list = certMap[s.id] || [];
            if (list.length === 0) return '-';
            const first = list[0];
            const label = first.grade ? `${first.name} ${first.grade}` : first.name;
            return list.length > 1 ? `${label} 외 ${list.length - 1}` : label;
        }

        function certSectionHtml(s) {
            const list = certMap[s.id] || [];
            const items = list.length
                ? list.map(c => `<div class="st-cert-row"><span>${escapeAttr(c.name)}${c.grade ? ' ' + escapeAttr(c.grade) : ''} · 만료 ${c.expires_on || '-'}</span><button class="st-act" onclick="deleteCert(${c.id}, ${s.id})">삭제</button></div>`).join('')
                : '<p class="st-muted">등록된 자격증이 없습니다</p>';
            return `<h4 class="st-cert-title">자격증</h4>${items}
                <div class="st-cert-form">
                    <input id="cName" placeholder="자격증 이름 (예: 요양보호사)">
                    <input id="cGrade" placeholder="등급 (예: 1급)">
                    <label>발급일<input id="cIssued" type="date"></label>
                    <label>만료일<input id="cExpires" type="date"></label>
                    <button class="st-add-btn" onclick="addCert(${s.id})">자격증 추가</button>
                </div>`;
        }

        async function addCert(userId) {
            const body = {
                user_id: userId,
                name: document.getElementById('cName').value.trim(),
                grade: document.getElementById('cGrade').value.trim() || null,
                issued_on: document.getElementById('cIssued').value || null,
                expires_on: document.getElementById('cExpires').value || null
            };
            try {
                const r = await fetch(`${API_URL}/certificates/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!r.ok) {
                    const e = await r.json().catch(() => ({}));
                    throw new Error(e.detail || '등록 실패');
                }
                await loadStaffData();
                openDetailModal(userId);
            } catch (e) {
                alert('자격증 등록 중 오류가 발생했습니다: ' + e.message);
            }
        }

        async function deleteCert(certId, userId) {
            if (!confirm('이 자격증을 삭제하시겠습니까?')) return;
            try {
                const r = await fetch(`${API_URL}/certificates/${certId}`, { method: 'DELETE' });
                if (!r.ok) throw new Error('삭제 실패');
                await loadStaffData();
                openDetailModal(userId);
            } catch (e) {
                alert('자격증 삭제 중 오류가 발생했습니다: ' + e.message);
            }
        }

        let filteredStaff = [];
        let staffCurrentPage = 1;

        function resetStaffFilters() {
            document.getElementById('staffSearch').value = '';
            document.getElementById('roleFilter').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('certFilter').value = '';
            filterStaff();
        }

        function filterStaff() {
            const q = document.getElementById('staffSearch').value.trim();
            const role = document.getElementById('roleFilter').value;
            const status = document.getElementById('statusFilter').value;
            const cert = document.getElementById('certFilter').value;
            filteredStaff = staffList.filter(s =>
                (!q || (s.full_name || '').includes(q) || (s.email || '').includes(q)) &&
                (!role || s.role === role) &&
                (!status || statusOf(s) === status) &&
                (!cert || (cert === 'has') === ((certMap[s.id] || []).length > 0)));
            staffCurrentPage = 1;
            renderStaffPage();
        }

        function renderStaffPage() {
            const size = parseInt(document.getElementById('sPageSize').value, 10) || 8;
            const totalPages = Math.max(1, Math.ceil(filteredStaff.length / size));
            staffCurrentPage = Math.min(staffCurrentPage, totalPages);
            const start = (staffCurrentPage - 1) * size;
            renderStaff(filteredStaff.slice(start, start + size), start);

            const pager = document.getElementById('sPager');
            if (!filteredStaff.length) { pager.style.display = 'none'; return; }
            pager.style.display = 'flex';
            document.getElementById('sPagerInfo').textContent = `총 ${filteredStaff.length}명 중 ${start + 1}-${Math.min(start + size, filteredStaff.length)}명 표시`;
            let btns = `<button ${staffCurrentPage === 1 ? 'disabled' : ''} onclick="staffCurrentPage=1;renderStaffPage()">«</button><button ${staffCurrentPage === 1 ? 'disabled' : ''} onclick="staffCurrentPage--;renderStaffPage()">‹</button>`;
            for (let p = Math.max(1, staffCurrentPage - 2); p <= Math.min(totalPages, staffCurrentPage + 2); p++) {
                btns += `<button class="${p === staffCurrentPage ? 'active' : ''}" onclick="staffCurrentPage=${p};renderStaffPage()">${p}</button>`;
            }
            btns += `<button ${staffCurrentPage === totalPages ? 'disabled' : ''} onclick="staffCurrentPage++;renderStaffPage()">›</button><button ${staffCurrentPage === totalPages ? 'disabled' : ''} onclick="staffCurrentPage=${totalPages};renderStaffPage()">»</button>`;
            document.getElementById('sPagerBtns').innerHTML = btns;
        }

        function renderStaff(list, offset = 0) {
            const tbody = document.getElementById('staffTableBody');
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 40px; color: #94A3B8;">${staffList.length ? '조건에 맞는 직원이 없습니다' : '등록된 직원이 없습니다'}</td></tr>`;
                return;
            }
            tbody.innerHTML = list.map((s, i) => {
                const name = s.full_name || s.email;
                const status = statusOf(s);
                return `
                    <tr>
                        <td><input type="checkbox" aria-label="${name} 선택"></td>
                        <td>${offset + i + 1}</td>
                        <td><div class="st-name"><span class="st-initial">${name.charAt(0)}</span>${name}</div></td>
                        <td><span class="job-pill">${jobOf(s)}</span></td>
                        <td>${s.phone || '-'}</td>
                        <td>${certSummary(s)}</td>
                        <td>${s.hire_date || '-'}</td>
                        <td><span class="p-badge2 badge-${status}">${STATUS_LABEL[status] || status}</span></td>
                        <td>
                            <button class="st-act" onclick="openEditModal(${s.id})">수정</button><button class="st-act" onclick="openDetailModal(${s.id})">상세보기</button><button class="st-cal" onclick="openScheduleModal(${s.id})" title="근무 일정 보기"><img src="assets/user_design/15_icon_calendar_action_full.png" alt="근무 일정"></button><button class="st-act" onclick="openRecordsModal(${s.id})">규정준수 기록</button>
                            <button class="st-pw-btn" onclick="resetPassword(${s.id}, '${name.replace(/'/g, '')}')">비밀번호 재설정</button>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function loadStaffData() {
            try {
                const tbody = document.getElementById('staffTableBody');
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px; color: var(--text-secondary);">데이터를 불러오는 중입니다...</td></tr>';

                const centerId = currentUser?.center_id || 1;
                const response = await fetch(`${API_URL}/users/?center_id=${centerId}`);

                if (!response.ok) throw new Error('직원 정보 조회 실패');

                const data = await response.json();
                const staff = data.users || [];

                staffList = staff;
                await loadCertificates();
                updateStaffStats(staff);
                filterStaff();

            } catch (error) {
                console.error('❌ 직원 정보 로드 실패:', error);
                document.getElementById('staffTableBody').innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px; color: var(--text-secondary);">직원 정보를 불러올 수 없습니다</td></tr>';
            }
        }

        // 직원 등록 입력 줄의 값을 모두 지운다 (아이디·비밀번호 포함)
        function resetAddStaffForm() {
            ['newStaffName', 'newStaffEmail', 'newStaffPassword'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('newStaffRole').value = 'caregiver';
        }

        async function addStaff() {
            const name = document.getElementById('newStaffName').value.trim();
            const email = document.getElementById('newStaffEmail').value.trim();
            const password = document.getElementById('newStaffPassword').value;
            const role = document.getElementById('newStaffRole').value;
            if (!name || !email || !password) {
                alert('이름, 이메일, 초기 비밀번호를 모두 입력해 주세요');
                return;
            }
            if (password.length < 8) {
                alert('비밀번호는 8자 이상이어야 합니다');
                return;
            }
            try {
                const response = await fetch(`${API_URL}/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, full_name: name, role })
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    const message = Array.isArray(err.detail) ? err.detail.map(d => d.msg).join(', ') : err.detail;
                    throw new Error(message || '직원 추가 실패');
                }
                alert(`${name}님의 계정을 만들었습니다. 이메일: ${email}`);
                ['newStaffName', 'newStaffEmail', 'newStaffPassword'].forEach(id => document.getElementById(id).value = '');
                loadStaffData();
            } catch (error) {
                alert('직원 추가 중 오류가 발생했습니다: ' + error.message);
            }
        }

        async function resetPassword(userId, name) {
            const newPassword = prompt(`${name}님의 새 비밀번호를 입력하세요 (8자 이상)`);
            if (newPassword === null) return;
            if (newPassword.length < 8) {
                alert('비밀번호는 8자 이상이어야 합니다');
                return;
            }
            try {
                const response = await fetch(`${API_URL}/users/${userId}/password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password: newPassword })
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || '재설정 실패');
                }
                alert(`${name}님의 비밀번호가 재설정되었습니다`);
            } catch (error) {
                alert('비밀번호 재설정 중 오류가 발생했습니다: ' + error.message);
            }
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                resetAddStaffForm();  // 새로고침 후에도 이전 아이디·비밀번호가 남지 않도록 비운다
                loadStaffData();
            }
        });
    </script>
    <script src="art.js"></script>
</body>
</html>
