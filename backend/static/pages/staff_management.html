<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👔 직원 관리 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: #f5f7fa;
            color: var(--text-primary);
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav { padding: 24px 0; }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { color: #10b981; border-left-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 { margin: 0; font-size: 24px; font-weight: 700; color: var(--text-primary); }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .table-wrapper {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        .table th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 13px;
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .table tbody tr:hover {
            background: #f9fafb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
        }
    </style>
    <script src="menu.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <!-- 공통 메뉴 -->
            <a class="nav-item" id="menu-dashboard" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>

            <!-- 역할별 메뉴: menu.js에서 필터링 -->
            <a class="nav-item hidden" id="menu-residents" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item hidden" id="menu-voice-records" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>

            <!-- 요양사 메뉴 -->
            <a class="nav-item hidden" id="menu-caregiver-billing" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item hidden" id="menu-my-salary" onclick="navigateTo('./my_salary.html')">
                <span>💰</span> 나의 급여
            </a>
            <a class="nav-item hidden" id="menu-my-schedule" onclick="navigateTo('./my_schedule.html')">
                <span>📅</span> 나의 일정
            </a>

            <!-- 센터장 메뉴 -->
            <a class="nav-item hidden" id="menu-billing-management" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item hidden active" id="menu-staff" onclick="navigateTo('./staff_management.html')">
                <span>👔</span> 직원 관리
            </a>
            <a class="nav-item hidden" id="menu-profit" onclick="navigateTo('./profit_analysis.html')">
                <span>📈</span> 수익 분석
            </a>
            <a class="nav-item hidden" id="menu-roadmap" onclick="navigateTo('./center-roadmap.html')">
                <span>🗺️</span> 성과 로드맵
            </a>

            <!-- 로그아웃 (공통) -->
            <a class="nav-item" id="menu-logout" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>직원 관리</h1></div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">센터장</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>역할</th>
                            <th>상태</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                                직원 정보를 불러오는 중입니다...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id || user.role !== 'center_manager') {
                alert('센터장 권한이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();
            filterMenuByRole();

            return true;
        }

        async function loadStaffData() {
            try {
                const tbody = document.getElementById('staffTableBody');
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">데이터를 불러오는 중입니다...</td></tr>';

                const centerId = currentUser?.center_id || 1;
                const response = await fetch(`${API_URL}/users/?center_id=${centerId}`);

                if (!response.ok) throw new Error('직원 정보 조회 실패');

                const data = await response.json();
                const staff = data.users || [];

                if (staff.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">등록된 직원이 없습니다</td></tr>';
                    return;
                }

                let html = '';
                staff.forEach(s => {
                    html += `
                        <tr>
                            <td>${s.full_name || s.email}</td>
                            <td>${s.role === 'caregiver' ? '요양사' : '센터장'}</td>
                            <td>활성</td>
                            <td>
                                <button style="padding: 6px 12px; background: #e5e7eb; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">수정</button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (error) {
                console.error('❌ 직원 정보 로드 실패:', error);
                document.getElementById('staffTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">직원 정보를 불러올 수 없습니다</td></tr>';
            }
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                loadStaffData();
            }
        });
    </script>
</body>
</html>
