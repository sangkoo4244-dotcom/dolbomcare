<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 음성 기록 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; line-height: 1; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav {
            padding: 24px 0;
        }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #10b981;
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: #1a202c; font-size: 13px; }
        .user-role { font-size: 12px; color: #6b7280; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .record-section {
            background: white;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .record-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1a202c;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
            background: white;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-record {
            padding: 12px 32px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
            width: 100%;
        }

        .btn-record:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }

        .stat-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #f97316;
        }

        .record-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .record-item {
            padding: 20px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .record-item:last-child { border-bottom: none; }

        .record-item:hover {
            background: #f9fafb;
        }

        .record-info {
            flex: 1;
        }

        .record-title {
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .record-meta {
            font-size: 13px;
            color: #6b7280;
        }

        .record-date {
            font-size: 12px;
            color: #9ca3af;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #6b7280;
        }

        .btn-sm:hover {
            border-color: #f97316;
            color: #f97316;
            background: #fffbf0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
            .topbar { padding: 16px; }
            .topbar-title h1 { font-size: 20px; }
            .form-row { grid-template-columns: 1fr; }
            .record-item { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
    <script src="menu.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" id="menu-dashboard" onclick="navigateTo('./dashboard.html')"><span>📊</span> 대시보드</a>
            <a class="nav-item" id="menu-residents" onclick="navigateTo('./resident_management.html')"><span>👥</span> 이용자 관리</a>
            <a class="nav-item active" id="menu-voice-records" onclick="navigateTo('./voice_record.html')"><span>🎤</span> 음성 기록</a>
            <a class="nav-item" id="menu-caregiver-billing" onclick="navigateTo('./caregiver_billing.html')"><span>💳</span> 나의 청부</a>
            <a class="nav-item" id="menu-my-salary" onclick="navigateTo('./my_salary.html')"><span>💰</span> 나의 급여</a>
            <a class="nav-item" id="menu-my-schedule" onclick="navigateTo('./my_schedule.html')"><span>📅</span> 나의 일정</a>
            <a class="nav-item" id="menu-billing-mgmt" onclick="navigateTo('./billing_management.html')"><span>📋</span> 청부 관리</a>
            <a class="nav-item" id="menu-salary-mgmt" onclick="navigateTo('./salary_management.html')"><span>💼</span> 급여 관리</a>
            <a class="nav-item" id="menu-logout" style="margin-top: 30px;" onclick="logout()"><span>🚪</span> 로그아웃</a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>음성 기록</h1></div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">요양사</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">오늘 기록</div>
                    <div class="stat-value" id="todayCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">전체 기록</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
            </div>

            <!-- Record Form -->
            <div class="record-section">
                <h2>음성 기록 추가</h2>
                <form id="recordForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="resident">이용자 선택</label>
                            <select id="resident" required>
                                <option value="">이용자를 선택하세요</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="serviceType">서비스 유형</label>
                            <select id="serviceType" required>
                                <option value="">유형을 선택하세요</option>
                                <option value="meal_service">식사 서빙</option>
                                <option value="medical_care">의료 관리</option>
                                <option value="mobility_assistance">이동 보조</option>
                                <option value="personal_care">개인 위생</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="notes">상세 내용</label>
                        <textarea id="notes" placeholder="음성 기록 내용을 입력하세요..." required></textarea>
                    </div>
                    <button type="submit" class="btn-record">🎤 기록 저장</button>
                </form>
            </div>

            <!-- Recent Records -->
            <div class="record-section">
                <h2>최근 기록</h2>
                <div id="recordList" class="record-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div>기록을 불러오는 중입니다...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let allRecords = [];
        let residents = [];

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();

            // 메뉴 필터링은 menu.js의 filterMenuByRole() 함수에서 처리
            filterMenuByRole();

            return true;
        }

        async function loadResidents() {
            try {
                const response = await fetch(`${API_URL}/residents/`);
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();
                residents = data.residents || [];

                const select = document.getElementById('resident');
                residents.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r.id;
                    option.textContent = r.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('이용자 로드 실패:', error);
            }
        }

        async function loadRecords() {
            try {
                // 요양사: 자신의 기록만, 센터장: 센터 전체 기록
                let url = `${API_URL}/records/`;
                if (currentUser.role === 'caregiver') {
                    url += `?user_id=${currentUser.id}`;
                } else if (currentUser.role === 'center_manager') {
                    url += `?center_id=${currentUser.center_id}`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();
                const records = data.records || [];
                allRecords = records;

                const today = new Date().toISOString().split('T')[0];
                const todayCount = records.filter(r => r.recorded_date?.startsWith(today)).length;

                document.getElementById('todayCount').textContent = todayCount;
                document.getElementById('totalCount').textContent = records.length;

                renderRecords(records.slice(0, 10));
            } catch (error) {
                console.error('기록 로드 실패:', error);
            }
        }

        function renderRecords(records) {
            const container = document.getElementById('recordList');

            if (records.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>기록이 없습니다</div></div>';
                return;
            }

            let html = '';
            records.forEach(r => {
                const date = new Date(r.recorded_date).toLocaleDateString('ko-KR');
                const residentName = residents.find(res => res.id === r.resident_id)?.name || '알 수 없음';
                html += `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-title">${residentName}</div>
                            <div class="record-meta">${r.service_type} • ₩${r.amount?.toLocaleString() || '0'}</div>
                            <div class="record-date">${date}</div>
                        </div>
                        <div class="action-buttons">
                            <button class="btn-sm" onclick="viewRecord(${r.id})">보기</button>
                            <button class="btn-sm" onclick="deleteRecord(${r.id})">삭제</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function viewRecord(id) {
            alert('상세 보기는 준비 중입니다');
        }

        function deleteRecord(id) {
            if (confirm('기록을 삭제하시겠습니까?')) {
                alert('삭제는 준비 중입니다');
            }
        }

        document.getElementById('recordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('음성 기록 저장은 준비 중입니다');
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) {
                loadResidents();
                loadRecords();
            }
        });
    </script>
</body>
</html>
