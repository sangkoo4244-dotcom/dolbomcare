<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 음성 기록 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo { font-size: 28px; line-height: 1; }
        .sidebar-title { font-size: 16px; font-weight: 700; }

        .sidebar-nav { padding: 24px 0; }

        .nav-item {
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { color: #10b981; border-left-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .nav-item.hidden { display: none; }

        .main-layout {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info { text-align: right; }
        .user-name { font-weight: 600; color: #1a202c; font-size: 13px; }
        .user-role { font-size: 12px; color: #6b7280; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #9ca3af;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #10b981;
            border-bottom-color: #10b981;
        }

        .stat-card {
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.08);
            border: 2px solid #d1fae5;
            margin-bottom: 32px;
        }

        .stat-label {
            font-size: 12px;
            color: #059669;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #10b981;
        }

        .record-section {
            background: white;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .record-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1a202c;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #374151;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .form-group select,
        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s;
            background: white;
        }

        .form-group select:focus,
        .form-group textarea:focus,
        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            background: #f0fdf4;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-group input[readonly] {
            background: #f9fafb;
            cursor: default;
            color: #374151;
            font-weight: 600;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn-record {
            padding: 16px 32px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-record:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-record:active {
            transform: translateY(0);
        }

        .btn-record:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4);
        }

        .record-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .record-item {
            padding: 20px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .record-item:last-child { border-bottom: 1px solid #f3f4f6; }
        .record-item:hover {
            background: white;
            border-color: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
            transform: translateY(-2px);
        }

        .record-info { flex: 1; }

        .record-title {
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .record-meta {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .record-date {
            font-size: 13px;
            color: #9ca3af;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 8px 14px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #6b7280;
        }

        .btn-sm:hover {
            border-color: #10b981;
            color: #10b981;
            background: #f0fdf4;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-layout { margin-left: 0; }
            .content { padding: 16px; }
            .topbar { padding: 16px; }
            .topbar-title h1 { font-size: 20px; }
            .form-row { grid-template-columns: 1fr; }
            .record-item { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
    <script src="menu.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">❤️</div>
            <div class="sidebar-title">돌봄케어</div>
        </div>
        <nav class="sidebar-nav">
            <!-- 공통 메뉴 -->
            <a class="nav-item" id="menu-dashboard" onclick="navigateTo('./dashboard.html')">
                <span>📊</span> 대시보드
            </a>

            <!-- 역할별 메뉴: menu.js에서 필터링 -->
            <a class="nav-item hidden" id="menu-residents" onclick="navigateTo('./resident_management.html')">
                <span>👥</span> 이용자 관리
            </a>
            <a class="nav-item hidden active" id="menu-voice-records" onclick="navigateTo('./voice_record.html')">
                <span>🎤</span> 음성 기록
            </a>

            <!-- 요양사 메뉴 -->
            <a class="nav-item hidden" id="menu-caregiver-billing" onclick="navigateTo('./caregiver_billing.html')">
                <span>💳</span> 나의 청부
            </a>
            <a class="nav-item hidden" id="menu-my-salary" onclick="navigateTo('./my_salary.html')">
                <span>💰</span> 나의 급여
            </a>
            <a class="nav-item hidden" id="menu-my-schedule" onclick="navigateTo('./my_schedule.html')">
                <span>📅</span> 나의 일정
            </a>

            <!-- 센터장 메뉴 -->
            <a class="nav-item hidden" id="menu-billing-management" onclick="navigateTo('./billing_management.html')">
                <span>📋</span> 청부 관리
            </a>
            <a class="nav-item hidden" id="menu-monthly-settlement" onclick="navigateTo('./monthly_settlement.html')">
                <span>📊</span> 월별 정산
            </a>
            <a class="nav-item hidden" id="menu-staff" onclick="navigateTo('./staff_management.html')">
                <span>👔</span> 직원 관리
            </a>
            <a class="nav-item hidden" id="menu-profit" onclick="navigateTo('./profit_analysis.html')">
                <span>📈</span> 수익 분석
            </a>
            <a class="nav-item hidden" id="menu-roadmap" onclick="navigateTo('./center-roadmap.html')">
                <span>🗺️</span> 성과 로드맵
            </a>

            <!-- 로그아웃 (공통) -->
            <a class="nav-item" id="menu-logout" style="margin-top: 30px;" onclick="logout()">
                <span>🚪</span> 로그아웃
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="topbar-title"><h1>음성 기록</h1></div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName">사용자</div>
                    <div class="user-role" id="userRole">요양사</div>
                </div>
                <div class="avatar" id="userAvatar">U</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">
                    📅 오늘 기록 (<span id="todayCount">0</span>)
                </button>
                <button class="tab-btn" id="tabAll" onclick="switchTab('all')">
                    📊 전체 기록 (<span id="totalCount">0</span>)
                </button>
            </div>

            <!-- Stats -->
            <div class="stat-card">
                <div class="stat-label" id="statLabel">오늘 청부액</div>
                <div class="stat-value" id="statAmount">₩0</div>
            </div>

            <!-- Record Form -->
            <div class="record-section">
                <h2>음성 기록 추가</h2>
                <form id="recordForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="resident">이용자 선택</label>
                            <select id="resident" required>
                                <option value="">이용자를 선택하세요</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="serviceType">서비스 유형</label>
                            <select id="serviceType" required>
                                <option value="">유형을 선택하세요</option>
                                <option value="basic_care">기본 돌봄</option>
                                <option value="meal_service">식사 서빙</option>
                                <option value="medical_care">의료 관리</option>
                                <option value="emergency">응급</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="notes">상세 내용</label>
                        <textarea id="notes" placeholder="음성 기록 내용을 입력하세요..." required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="estimatedAmount">예상 청부액</label>
                            <input id="estimatedAmount" type="text" readonly style="background: #f3f4f6; cursor: default;">
                        </div>
                        <div class="form-group">
                            <label for="patientPayment">본인부담금</label>
                            <input id="patientPayment" type="text" readonly style="background: #f3f4f6; cursor: default;">
                        </div>
                    </div>
                    <button type="submit" class="btn-record">🎤 기록 저장</button>
                </form>
            </div>

            <!-- Records List -->
            <div class="record-section">
                <h2>기록 목록</h2>
                <div id="recordList" class="record-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div>기록을 불러오는 중입니다...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1';
        let currentUser = null;
        let todayRecords = [];
        let allRecords = [];
        let residents = [];
        let currentTab = 'today';

        // NHIS 기준 등급별 월 인정급여액
        const CARE_GRADE_LIMITS = {
            1: 1577500, 2: 1399500, 3: 1193000, 4: 1082500, 5: 235000
        };

        // 본인부담율 (건강보험공단 기준)
        const PATIENT_PAY_RATE = {
            "재가급여": {
                "일반": 0.15, "차상위계층": 0.10, "기초생활보장": 0.00, "의료급여": 0.00
            },
            "시설급여": {
                "일반": 0.20, "차상위계층": 0.10, "기초생활보장": 0.00, "의료급여": 0.00
            }
        };

        // NHIS 기준액 (등급별 서비스 유형별 월 인정급여액)
        const SERVICE_TYPE_AMOUNTS = {
            "basic_care": { 1: 78875, 2: 67043, 3: 55211, 4: 55211, 5: 55211 },
            "meal_service": { 1: 39437, 2: 33521, 3: 27605, 4: 27605, 5: 27605 },
            "medical_care": { 1: 118312, 2: 100565, 3: 82818, 4: 82818, 5: 82818 },
            "emergency": { 1: 157750, 2: 134087, 3: 110425, 4: 110425, 5: 110425 }
        };

        // 기본 청부액 (등급 미지정 시)
        const BILLING_RATES = {
            "basic_care": 30000, "meal_service": 10000, "medical_care": 50000, "emergency": 100000
        };

        function navigateTo(url) { window.location.href = url; }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = './login.html';
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || !user.id) {
                alert('로그인이 필요합니다');
                window.location.href = './login.html';
                return false;
            }

            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '사용자';
            document.getElementById('userRole').textContent = user.role === 'caregiver' ? '요양사' : '센터장';
            document.getElementById('userAvatar').textContent = (user.full_name || '사용자').charAt(0).toUpperCase();

            filterMenuByRole();
            return true;
        }

        function calculateBillingAmount() {
            const residentId = document.getElementById('resident').value;
            const serviceType = document.getElementById('serviceType').value;

            if (!residentId || !serviceType) {
                document.getElementById('estimatedAmount').value = '';
                document.getElementById('patientPayment').value = '';
                return;
            }

            const resident = residents.find(r => r.id == residentId);
            if (!resident) {
                console.warn('Resident not found:', residentId);
                return;
            }

            const careGrade = resident.care_grade || 1;
            const clientType = resident.client_type || '일반';

            // NHIS 기준액 조회 (등급별)
            const serviceAmounts = SERVICE_TYPE_AMOUNTS[serviceType];
            if (!serviceAmounts) {
                console.warn('Service type not found:', serviceType);
                return;
            }

            const baseAmount = serviceAmounts[careGrade] || serviceAmounts[1];

            // 본인부담율 적용
            const patientRate = PATIENT_PAY_RATE["재가급여"][clientType] || 0.15;
            const patientPayment = Math.round(baseAmount * patientRate);
            const billingAmount = baseAmount - patientPayment;

            // 서비스 유형명
            const serviceTypeNames = {
                "basic_care": "기본 돌봄",
                "meal_service": "식사 서빙",
                "medical_care": "의료 관리",
                "emergency": "응급"
            };
            const serviceName = serviceTypeNames[serviceType] || serviceType;

            // 화면에 상세 정보 표시
            document.getElementById('estimatedAmount').value =
                `₩${billingAmount.toLocaleString()} (기준: ₩${baseAmount.toLocaleString()}, ${resident.name} ${careGrade}등급)`;
            document.getElementById('patientPayment').value =
                `₩${patientPayment.toLocaleString()} / 공단: ₩${billingAmount.toLocaleString()} (소득: ${clientType}, 부담율: ${Math.round(patientRate * 100)}%)`;
        }

        async function loadResidents() {
            try {
                const response = await fetch(`${API_URL}/residents/`);
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();
                residents = data.residents || [];

                const select = document.getElementById('resident');
                select.innerHTML = '<option value="">이용자를 선택하세요</option>';
                residents.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r.id;
                    // 이용자 이름 + 등급 + 소득분류 표시
                    option.textContent = `${r.name} (${r.care_grade}등급 · ${r.client_type})`;
                    select.appendChild(option);
                });

                // residents 로드 완료 후 이벤트 리스너 등록
                setupBillingCalculators();
            } catch (error) {
                console.error('이용자 로드 실패:', error);
            }
        }

        function setupBillingCalculators() {
            // 이용자 또는 서비스 유형 선택 시 청부액 자동 계산
            document.getElementById('resident').addEventListener('change', calculateBillingAmount);
            document.getElementById('serviceType').addEventListener('change', calculateBillingAmount);
        }

        async function loadRecords() {
            try {
                if (currentUser.role === 'caregiver') {
                    const todayResp = await fetch(`${API_URL}/records/today?caregiver_id=${currentUser.id}`);
                    const allResp = await fetch(`${API_URL}/records/all?caregiver_id=${currentUser.id}`);

                    if (todayResp.ok) {
                        const data = await todayResp.json();
                        todayRecords = data.records || [];
                    }

                    if (allResp.ok) {
                        const data = await allResp.json();
                        allRecords = data.records || [];
                    }
                } else if (currentUser.role === 'center_manager') {
                    const todayResp = await fetch(`${API_URL}/records/today/center?center_id=${currentUser.center_id}`);
                    const allResp = await fetch(`${API_URL}/records/all/center?center_id=${currentUser.center_id}`);

                    if (todayResp.ok) {
                        const data = await todayResp.json();
                        todayRecords = data.records || [];
                    }

                    if (allResp.ok) {
                        const data = await allResp.json();
                        allRecords = data.records || [];
                    }
                }

                document.getElementById('todayCount').textContent = todayRecords.length;
                document.getElementById('totalCount').textContent = allRecords.length;
                renderCurrentTab();
            } catch (error) {
                console.error('기록 로드 실패:', error);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabToday').classList.toggle('active', tab === 'today');
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            document.getElementById('statLabel').textContent = tab === 'today' ? '오늘 청부액' : '전체 청부액';
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const records = currentTab === 'today' ? todayRecords : allRecords;
            const totalAmount = records.reduce((sum, r) => sum + (r.billing_amount || 0), 0);

            document.getElementById('statAmount').textContent = `₩${totalAmount.toLocaleString()}`;
            renderRecords(records);
        }

        function renderRecords(records) {
            const container = document.getElementById('recordList');

            if (records.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>기록이 없습니다</div></div>';
                return;
            }

            let html = '';
            records.forEach(r => {
                const date = new Date(r.recorded_at).toLocaleDateString('ko-KR');
                const resident = residents.find(res => res.id === r.resident_id);
                const residentName = resident?.name || '알 수 없음';
                const careInfo = resident ? `${resident.care_grade}등급 · ${resident.client_type}` : '';
                html += `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-title">${residentName} (${careInfo})</div>
                            <div class="record-meta">${r.service_type} • ₩${(r.billing_amount || 0).toLocaleString()}</div>
                            <div class="record-date">${date}</div>
                        </div>
                        <div class="action-buttons">
                            <button class="btn-sm" onclick="viewRecord(${r.id})">보기</button>
                            <button class="btn-sm" onclick="editRecord(${r.id})">수정</button>
                            <button class="btn-sm" onclick="deleteRecord(${r.id})">삭제</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function viewRecord(id) {
            const allData = currentTab === 'today' ? todayRecords : allRecords;
            const record = allData.find(r => r.id === id);
            if (!record) return;
            const residentName = residents.find(r => r.id === record.resident_id)?.name || '알 수 없음';
            const date = new Date(record.recorded_at).toLocaleDateString('ko-KR');
            alert(`이용자: ${residentName}\n서비스: ${record.service_type}\n청부액: ₩${(record.billing_amount || 0).toLocaleString()}\n날짜: ${date}\n\n내용:\n${record.notes || '기록 없음'}`);
        }

        async function editRecord(id) {
            const allData = currentTab === 'today' ? todayRecords : allRecords;
            const record = allData.find(r => r.id === id);
            if (!record) return;

            const resident = residents.find(r => r.id === record.resident_id);
            const currentCareGrade = record.care_grade || (resident?.care_grade || 1);
            const currentClientType = record.client_type || (resident?.client_type || '일반');

            const editType = prompt(
                '수정 항목을 선택하세요:\n1. 내용\n2. 요양등급\n3. 소득분류\n4. 모두',
                '1'
            );
            if (editType === null) return;

            const updates = {};

            if (editType === '1' || editType === '4') {
                const newNotes = prompt('내용을 수정하세요:', record.notes || '');
                if (newNotes !== null) updates.notes = newNotes;
            }

            if (editType === '2' || editType === '4') {
                const newGrade = prompt(`현재 등급: ${currentCareGrade}등급\n새 등급을 입력하세요 (1-5):`, String(currentCareGrade));
                if (newGrade !== null && newGrade >= 1 && newGrade <= 5) {
                    updates.care_grade = parseInt(newGrade);
                }
            }

            if (editType === '3' || editType === '4') {
                const clientOptions = '일반\n차상위계층\n기초생활보장\n의료급여';
                const newClientType = prompt(`현재 소득분류: ${currentClientType}\n새 소득분류를 입력하세요:\n${clientOptions}`, currentClientType);
                if (newClientType !== null && ['일반', '차상위계층', '기초생활보장', '의료급여'].includes(newClientType)) {
                    updates.client_type = newClientType;
                }
            }

            if (Object.keys(updates).length === 0) return;

            try {
                const response = await fetch(`${API_URL}/records/daily/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                    },
                    body: JSON.stringify(updates)
                });

                if (response.ok) {
                    alert('수정되었습니다');
                    loadRecords();
                } else {
                    alert('수정 중 오류가 발생했습니다');
                }
            } catch (error) {
                console.error('수정 오류:', error);
                alert('수정 중 오류가 발생했습니다');
            }
        }

        async function deleteRecord(id) {
            if (!confirm('기록을 삭제하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/records/daily/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                });

                if (response.ok) {
                    alert('기록이 삭제되었습니다');
                    loadRecords();
                } else {
                    alert('삭제 중 오류가 발생했습니다');
                }
            } catch (error) {
                console.error('삭제 오류:', error);
                alert('삭제 중 오류가 발생했습니다');
            }
        }

        window.addEventListener('load', () => {
            if (checkAuth()) {
                loadResidents();
                loadRecords();

                // 음성 기록 저장
                document.getElementById('recordForm').addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const residentId = document.getElementById('resident').value;
                    const serviceType = document.getElementById('serviceType').value;
                    const notes = document.getElementById('notes').value;

                    if (!residentId || !serviceType || !notes) {
                        alert('모든 필드를 입력하세요');
                        return;
                    }

                    try {
                        const payload = {
                            caregiver_id: currentUser.id,
                            resident_id: parseInt(residentId),
                            service_type: serviceType,
                            notes: notes
                        };

                        const response = await fetch(`${API_URL}/records/create`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                            },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            alert('기록이 저장되었습니다');
                            document.getElementById('recordForm').reset();
                            calculateBillingAmount(); // 초기화
                            loadRecords();
                        } else {
                            const error = await response.json();
                            alert(`저장 실패: ${error.detail || '오류가 발생했습니다'}`);
                        }
                    } catch (error) {
                        console.error('저장 오류:', error);
                        alert('저장 중 오류가 발생했습니다');
                    }
                });
            }
        });
    </script>
</body>
</html>
