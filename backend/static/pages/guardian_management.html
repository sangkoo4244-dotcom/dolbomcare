<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돌봄케어 - 보호자 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-gray-800 to-gray-900 text-white fixed h-screen overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex items-center gap-3">
                <div class="text-3xl">❤️</div>
                <div><div class="text-lg font-bold">돌봄케어</div><div class="text-xs text-gray-400">Care Management</div></div>
            </div>
            <nav id="navContent" class="p-4"></nav>
        </aside>
        <main class="ml-72 w-full flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center shadow-sm sticky top-0 z-40">
                <h1 class="text-3xl font-bold text-gray-900">🤝 보호자 관리</h1>
                <div class="flex items-center gap-6">
                    <div class="text-right"><div class="text-sm font-semibold text-gray-900" id="userName">사용자</div><div class="text-xs text-gray-500">센터장</div></div>
                    <button onclick="logout()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold text-gray-600 hover:border-emerald-500 hover:text-emerald-600 hover:bg-emerald-50 transition">로그아웃</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8 space-y-8">
                <div id="message" class="hidden p-4 rounded-lg text-sm"></div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">🎫 초대 코드 발급</h2>
                    <p class="text-sm text-gray-500 mb-6">이용자를 고르고 코드를 발급해 보호자에게 전달합니다. 코드는 7일 동안 한 번만 쓸 수 있습니다.</p>
                    <div class="flex gap-3 items-center">
                        <select id="residentSelect" class="border border-gray-300 rounded-lg px-3 py-2 min-w-64"></select>
                        <button onclick="issueInvite()" class="px-5 py-2 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700">코드 발급</button>
                    </div>
                    <div id="codeBox" class="hidden mt-6 p-4 bg-emerald-50 rounded-lg">
                        <div class="text-sm text-emerald-800">발급된 코드</div>
                        <div id="codeValue" class="text-3xl font-bold tracking-widest text-emerald-900 mt-1"></div>
                        <div id="codeInfo" class="text-sm text-emerald-700 mt-2"></div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📋 가입 승인 대기</h2>
                    <ul id="requestList" class="divide-y divide-gray-100"></ul>
                </div>
            </div>
        </main>
    </div>
    <script src="menu.js"></script>
    <script>
        let currentUser = null;
        const API_URL = '/api/v1';

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !user.id) { window.location.href = './login.html'; return; }
            if (user.role !== 'center_manager') { window.location.href = './dashboard.html'; return; }
            currentUser = user;
            document.getElementById('userName').textContent = user.full_name || '센터장';
            renderSidebar();
            loadResidents();
            loadRequests();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function showMessage(text, ok) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = `p-4 rounded-lg text-sm ${ok ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-700'}`;
        }

        async function loadResidents() {
            const d = await (await fetch(`${API_URL}/residents/?center_id=${currentUser.center_id}`)).json();
            document.getElementById('residentSelect').innerHTML = (d.residents || [])
                .map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
        }

        async function issueInvite() {
            const residentId = parseInt(document.getElementById('residentSelect').value);
            if (!residentId) { showMessage('이용자를 선택해 주세요', false); return; }
            const r = await fetch(`${API_URL}/guardian/invites`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ resident_id: residentId }),
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) { showMessage(d.detail || '코드 발급에 실패했습니다', false); return; }
            document.getElementById('codeBox').classList.remove('hidden');
            document.getElementById('codeValue').textContent = d.code;
            document.getElementById('codeInfo').textContent = `${d.resident_name} · 만료 ${new Date(d.expires_at).toLocaleDateString('ko-KR')}`;
        }

        async function loadRequests() {
            const d = await (await fetch(`${API_URL}/guardian/requests`)).json();
            const list = document.getElementById('requestList');
            const items = d.requests || [];
            if (!items.length) { list.innerHTML = '<li class="py-8 text-center text-gray-400">승인을 기다리는 보호자가 없습니다</li>'; return; }
            list.innerHTML = items.map(q => `
                <li class="py-4 flex justify-between items-center">
                    <div>
                        <div class="font-semibold text-gray-900">${escapeHtml(q.guardian_name)} <span class="text-sm text-gray-500">(${escapeHtml(q.guardian_phone) || '연락처 없음'})</span></div>
                        <div class="text-sm text-gray-600">이용자: ${escapeHtml(q.resident_name)}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="decide(${q.id}, 'approve')" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-lg hover:bg-emerald-700">승인</button>
                        <button onclick="decide(${q.id}, 'reject')" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-bold rounded-lg hover:bg-gray-50">반려</button>
                    </div>
                </li>`).join('');
        }

        async function decide(id, action) {
            const r = await fetch(`${API_URL}/guardian/requests/${id}/${action}`, { method: 'POST' });
            const d = await r.json().catch(() => ({}));
            showMessage(r.ok ? d.message : (d.detail || '처리에 실패했습니다'), r.ok);
            loadRequests();
        }

        function logout() { localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html'; }
        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
