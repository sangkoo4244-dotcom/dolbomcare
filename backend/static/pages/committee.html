<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영위원회 회의록 - 돌봄케어</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body { margin: 0; padding: 0; }
        .sidebar { width: 288px; color: white; position: fixed; left: 0; top: 0; height: 100vh; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
        .sidebar-nav { padding: 20px 0; overflow: hidden; }
        .main-layout { margin-left: 288px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-title h1 { margin: 0; font-size: 24px; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 13px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 600; }
        .content { flex: 1; padding: 30px; }
        @media (max-width: 768px) { .main-layout { margin-left: 0; } .content { padding: 16px; } }
        :root { --navy: #14283F; --teal: #0F8B80; --bg: #F5F7FA; --charcoal: #243247; --line2: #E2E8F0; }
        html, body { background: var(--bg) !important; }
        body, .content { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif !important; color: var(--charcoal) !important; }
        .sidebar { background: linear-gradient(180deg, var(--navy) 0%, #0E1D30 100%) !important; }
        .sidebar .side-item.active { background: var(--teal) !important; color: #fff !important; }
        .breadcrumb { font-size: 13px; color: #94A3B8; margin-top: 2px; }
        .breadcrumb b { color: var(--charcoal); font-weight: 600; }
        .panel { background: #fff; border: 1px solid var(--line2); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .panel h2 { margin: 0 0 12px; font-size: 16px; }
        .field { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 2px solid var(--line2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; }
        .field:focus { border-color: var(--teal); outline: none; }
        .lbl { display: block; font-size: 12px; font-weight: 700; color: #64748B; margin: 10px 0 4px; }
        .btn-solid { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; background: var(--teal); color: #fff; cursor: pointer; font-family: inherit; }
        .btn-outline { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line2); background: #fff; color: var(--charcoal); cursor: pointer; font-family: inherit; }
        .row { display: grid; grid-template-columns: 130px 1fr 130px; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        .meta { font-size: 12px; color: #64748B; margin-top: 2px; }
        .empty-note { color: #94A3B8; font-size: 13px; padding: 14px 0; }
        .msg { font-size: 13px; margin-top: 10px; display: none; }
        .msg.err { color: #DC2626; display: block; }
        .msg.ok { color: #15803D; display: block; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 900px) { .grid2, .row { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="menu.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 18px; font-weight: 700;">돌봄케어</div>
            <div style="font-size: 12px; color: #9ca3af;">Care Management</div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <div class="main-layout">
        <div class="topbar">
            <div class="topbar-title">
                <h1>운영위원회 회의록</h1>
                <div class="breadcrumb">홈 › 직원·센터 › <b>운영위원회 회의록</b></div>
            </div>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role">센터장</div>
                </div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>
        <div class="content">
            <div class="panel">
                <h2 id="formTitle">새 회의록</h2>
                <div class="grid2">
                    <div><label class="lbl" for="mDate">회의 날짜</label><input type="date" id="mDate" class="field"></div>
                    <div><label class="lbl" for="mTitle">회의 제목</label><input id="mTitle" class="field" placeholder="예: 3분기 운영위원회"></div>
                </div>
                <label class="lbl" for="mAttendees">참석자</label>
                <input id="mAttendees" class="field" placeholder="쉼표로 구분 (예: 센터장, 사회복지사, 요양보호사 대표)">
                <label class="lbl" for="mAgenda">안건</label>
                <textarea id="mAgenda" class="field" rows="2"></textarea>
                <label class="lbl" for="mMinutes">논의 내용</label>
                <textarea id="mMinutes" class="field" rows="4"></textarea>
                <label class="lbl" for="mDecisions">의결 사항</label>
                <textarea id="mDecisions" class="field" rows="2"></textarea>
                <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
                    <button class="btn-outline" onclick="resetForm()">새로 쓰기</button>
                    <button class="btn-solid" onclick="saveMeeting()">저장</button>
                </div>
                <div class="msg" id="msg"></div>
            </div>
            <div class="panel">
                <h2>회의록 목록</h2>
                <div id="rows"><div class="empty-note">불러오는 중…</div></div>
            </div>
        </div>
    </div>
    <script>
        const esc = (t) => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
        const user = JSON.parse(localStorage.getItem('user') || 'null') || {};
        let editingId = null;
        let meetings = [];

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('access_token'); localStorage.removeItem('user'); window.location.href = './login.html';
            }
        }
        async function api(path, options = {}) {
            const r = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('access_token')}`, ...(options.headers || {}) } });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '처리하지 못했습니다');
            return d;
        }
        function setMsg(text, ok) { const m = document.getElementById('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

        function resetForm() {
            editingId = null;
            document.getElementById('formTitle').textContent = '새 회의록';
            ['mTitle', 'mAttendees', 'mAgenda', 'mMinutes', 'mDecisions'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('mDate').value = new Date().toISOString().slice(0, 10);
        }
        function editMeeting(id) {
            const m = meetings.find(x => x.id === id);
            editingId = id;
            document.getElementById('formTitle').textContent = '회의록 수정';
            document.getElementById('mDate').value = m.meeting_date;
            document.getElementById('mTitle').value = m.title;
            document.getElementById('mAttendees').value = m.attendees;
            document.getElementById('mAgenda').value = m.agenda;
            document.getElementById('mMinutes').value = m.minutes;
            document.getElementById('mDecisions').value = m.decisions;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        async function saveMeeting() {
            const body = {
                meeting_date: document.getElementById('mDate').value,
                title: document.getElementById('mTitle').value,
                attendees: document.getElementById('mAttendees').value,
                agenda: document.getElementById('mAgenda').value,
                minutes: document.getElementById('mMinutes').value,
                decisions: document.getElementById('mDecisions').value,
            };
            try {
                if (editingId) await api(`/api/v1/committee/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
                else await api('/api/v1/committee', { method: 'POST', body: JSON.stringify(body) });
                setMsg('저장했습니다.', true);
                resetForm();
                load();
            } catch (e) { setMsg(e.message, false); }
        }
        async function load() {
            const box = document.getElementById('rows');
            try {
                const d = await api('/api/v1/committee');
                meetings = d.data;
                box.innerHTML = meetings.length ? meetings.map(m => `<div class="row">
                    <div><b>${esc(m.meeting_date)}</b><div class="meta">${esc(m.author_name)}</div></div>
                    <div><b>${esc(m.title)}</b><div class="meta">${esc(m.attendees)}</div>
                        ${m.decisions ? `<div style="margin-top:4px;">의결: ${esc(m.decisions)}</div>` : ''}</div>
                    <div style="text-align:right;"><button class="btn-outline" onclick="editMeeting(${m.id})">열기·수정</button></div>
                </div>`).join('') : '<div class="empty-note">등록된 회의록이 없습니다.</div>';
            } catch (e) { box.innerHTML = `<div class="empty-note">${esc(e.message)}</div>`; }
        }

        (function init() {
            if (typeof renderSidebar === 'function') renderSidebar();
            document.getElementById('userName').textContent = user.full_name || '';
            resetForm();
            load();
        })();
    </script>
</body>
</html>
